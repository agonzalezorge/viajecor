  // recibía tal cual, y como `iniciar(document)` no lo pasa, llegaba
  // `undefined` y la app le avisaba a TODO el mundo que no estaba guardando
  // nada. Lo encontró el recorrido en el navegador, no los tests, porque los
  // tests siempre le pasaban un almacén.
  //
  // Es la peor forma de fallar para este aviso en particular: gritar en falso
  // enseña a ignorarlo, y el día que sea cierto nadie lo va a leer.
  //
  // No se usa `almacenPorDefecto()`, que **tira** cuando no hay `localStorage`:
  // tirar en la función cuya única tarea es detectar que no hay dónde guardar
  // sería dejar la app en blanco justo cuando tiene algo importante que decir.
  const elAlmacen = almacen === undefined ? almacenPorDefecto() : almacen;
  // Primero lo más terminante: que no haya almacén en absoluto (navegación
  // privada en algunos navegadores, o almacenamiento bloqueado por el usuario).
  if (!puedeEscribir(elAlmacen)) {
    return {
      motivo: SIN_ALMACENAMIENTO,
      titulo: 'Este navegador no está guardando nada',
      explicacion:
        'Todo lo que cargues va a desaparecer al cerrar la pestaña. Puede ser una ventana ' +
        'de incógnito, o que el navegador tenga bloqueado el almacenamiento de sitios.',
      queHacer:
        'Abrí la app en una ventana normal, o permitile a este sitio guardar datos. ' +
        'Mientras tanto, no cargues nada que no quieras volver a escribir.',
    };
  }

  if (!ESQUEMAS_CON_IDENTIDAD.includes(protocolo)) {
    return {
      motivo: SIN_IDENTIDAD,
      titulo: 'Así abierta, la app va a perder tus datos al cerrar',
      explicacion:
        'Abriste el archivo desde el explorador de archivos, y tu teléfono se lo pasó al ' +
        'navegador sin decirle de dónde salió. El navegador guarda los datos por sitio, y ' +
        'así no hay ningún sitio al que asociarlos: podés cargar gastos y los vas a ver, ' +
        'pero desaparecen al cerrar el navegador.',
      queHacer:
        'Abrí la app escribiendo su dirección a mano en el navegador, empezando con ' +
        '"file:///" y la ruta del archivo — por ejemplo file:///sdcard/Download/viajecor.html — ' +
        'y guardala como marcador para entrar siempre por ahí.',
    };
  }

  return null;
}

/** Prueba de verdad si se puede escribir, sin dejar rastro. */
function puedeEscribir(almacen) {
  if (!almacen || typeof almacen.setItem !== 'function') return false;
  const clave = `${PREFIJO_RESCATE}prueba`;
  try {
    almacen.setItem(clave, '1');
    const volvio = almacen.getItem(clave) === '1';
    almacen.removeItem(clave);
    return volvio;
  } catch {
    return false;
  }
}


/**
 * Lee el catálogo de rubros guardado — T-048.
 *
 * **Nunca deja al usuario sin rubros.** Un catálogo vacío o roto haría que no se
 * pueda cargar ni leer un solo movimiento: ahí se vuelve al de fábrica y se
 * dice, que es mucho mejor que una app que no deja hacer nada.
 *
 * Los rubros se guardan normalizados y sin repetidos, por lo mismo que todo lo
 * que agrupa (RN-03): dos entradas que solo se diferencian en una mayúscula
 * partirían los totales de ese rubro en dos.
 */
function leerCatalogoDeRubros(guardado, incidencias = []) {
  const inicial = rubrosIniciales();
  if (guardado === undefined || guardado === null) return inicial;

  if (typeof guardado !== 'object' || Array.isArray(guardado)) {
    incidencias.push('La lista de rubros guardada no se entendió; se usaron los de siempre.');
    return inicial;
  }

  const limpiar = (lista, deFabrica, cual) => {
    if (!Array.isArray(lista)) return [...deFabrica];

    const vistos = [];
    for (const rubro of lista) {
      if (typeof rubro !== 'string') continue;
      const clave = normalizarClave(rubro);
      if (clave !== '' && !vistos.includes(clave)) vistos.push(clave);
    }

    if (vistos.length === 0) {
      incidencias.push(`No quedaba ningún rubro de ${cual}; se usaron los de siempre.`);
      return [...deFabrica];
    }
    return vistos;
  };

  return {
    gasto: limpiar(guardado.gasto, inicial.gasto, 'gasto'),
    ingreso: limpiar(guardado.ingreso, inicial.ingreso, 'ingreso'),
  };
}

// ── src/datos/exportar.js ───────────────────────────────────────
// Exportar los datos — CU-07.
//
// Esta no es una función más de la app: **es la única copia de seguridad que el
// usuario va a tener**. Los datos viven en un solo navegador, sin servidor y sin
// papelera; "limpiar datos de navegación" en el celular se lleva meses de
// registro y no hay de dónde recuperarlos (ARQUITECTURA §6).
//
// De eso salen las tres decisiones de este archivo:
//
//   1. **Se exporta TODO**, no lo que se está mirando. Un respaldo que solo
//      guarda el mes en pantalla es un respaldo que descubrís incompleto el día
//      que lo necesitás.
//   2. **El archivo se puede leer sin la app.** Es JSON con nombres en
//      castellano, con saltos de línea y sangría. Si dentro de cinco años esta
//      app no abre, el respaldo se sigue entendiendo con cualquier editor de
//      texto — que es media garantía de que los datos son del usuario.
//   3. **El archivo dice de dónde salió y cuándo.** Un `viajecor-2026-08-25.json`
//      encontrado dentro de tres años tiene que poder explicarse solo.
//
// Este archivo no toca el navegador: arma el contenido y el nombre, y quien lo
// descarga es la pantalla. Así se puede testear el respaldo sin un navegador.


const TIPO_JSON = 'application/json';

/**
 * El nombre del archivo: `viajecor-2026-08-25.json`.
 *
 * Con la fecha al principio en formato AAAA-MM-DD para que varios respaldos en
 * una carpeta queden ordenados por fecha al ordenarlos por nombre, que es como
 * los va a ordenar el celular.
 */
function nombreDelRespaldo(fecha = hoy(), extension = 'json') {
  return `viajecor-${fecha}.${extension}`;
}

/**
 * El contenido del respaldo.
 *
 * Lleva **más cosas de las que la app necesita** para reimportarlo: la versión
 * que lo escribió y el día en que se exportó. Ninguna de las dos se usa al
 * importar; están para que el archivo se explique solo dentro de tres años.
 *
 * Con sangría de dos espacios, a propósito. Ocupa alrededor de un tercio más de
 * lugar y a cambio el archivo se puede abrir y leer: para un respaldo de unos
 * cientos de kilobytes, es un intercambio que conviene siempre.
 */
function contenidoDelRespaldo(estado, { fecha = hoy() } = {}) {
  const respaldo = {
    // Estos tres campos son para quien LEA el archivo, no para la app.
    aplicacion: 'Viajecor',
    exportado: fecha,
    version_app: estado.version_app ?? 'desconocida',

    esquema: ESQUEMA_ACTUAL,
    movimientos: estado.movimientos ?? [],
    tipos_cambio: estado.tipos_cambio ?? [],
    monedas: estado.monedas ?? [],
    // Las fechas de cada viaje (T-941). **Faltaban acá hasta la 0.2.1**, y era
    // pérdida de datos silenciosa: son lo único del estado que NO se puede
    // deducir de los movimientos —un viaje empieza antes del primer gasto—, así
    // que al restaurar un respaldo se perdían para siempre y la app volvía a
    // decir "¿Cuándo fue?" sin que nada avisara. Ver L-031.
    fechas_de_viaje: estado.fechas_de_viaje ?? [],
    // Los ahorros conjuntos (CU-14). Entran al respaldo **en el mismo commit en
    // que nacen**, que es la lección que dejó haberlos olvidado con las fechas
    // de viaje (L-031).
    ahorros: estado.ahorros ?? [],
    // El catálogo de rubros (T-048). Sin esto, restaurar un respaldo en otro
    // dispositivo descartaría todos los movimientos de los rubros que el
    // usuario creó — no se puede recalcular mirando los movimientos, así que
    // entra al respaldo el mismo día que nace (L-031).
    rubros: estado.rubros ?? undefined,
    preferencias: estado.preferencias ?? {},
  };

  return `${JSON.stringify(respaldo, null, 2)}\n`;
}

/**
 * Un respaldo listo para descargar: nombre, contenido y tipo.
 *
 * Devuelve también `cuantos`, porque la pantalla tiene que poder decir qué se
 * llevó el archivo. "Se exportó" no informa nada; "se exportaron 312
 * movimientos" permite darse cuenta de que faltan.
 */
function prepararRespaldo(estado, { fecha = hoy() } = {}) {
  const contenido = contenidoDelRespaldo(estado, { fecha });
  return {
    nombre: nombreDelRespaldo(fecha),
    contenido,
    tipo: TIPO_JSON,
    cuantos: (estado.movimientos ?? []).length,
    bytes: new TextEncoder().encode(contenido).length,
  };
}

/**
 * Deja anotado en los datos el día del último respaldo.
 *
 * Sin este dato no hay forma de avisar "hace tres semanas que no respaldás"
 * (T-903), que es la contramedida al riesgo más grave de toda la arquitectura.
 * Se anota **después** de que la descarga se haya pedido, nunca antes: decir que
 * se respaldó algo que no se respaldó es peor que no anotar nada.
 */
function anotarRespaldo(estado, { fecha = hoy() } = {}) {
  return {
    ...estado,
    preferencias: { ...estado.preferencias, ultimo_respaldo: fecha },
  };
}

/**
 * Cuántos días pasaron desde el último respaldo. `null` si nunca se hizo uno.
 *
 * Cuenta días de calendario, no horas: la app no guarda horas (ADR-021).
 */
function diasSinRespaldar(estado, { fecha = hoy() } = {}) {
  const ultimo = estado.preferencias?.ultimo_respaldo;
  if (typeof ultimo !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(ultimo)) return null;

  return Math.max(0, diasEntre(ultimo, fecha));
}

// ── src/datos/importar.js ───────────────────────────────────────
// Volver a cargar un respaldo — CU-08.
//
// Es la otra mitad de la garantía de que los datos son del usuario: exportar sin
// poder volver a importar produce un archivo, no un respaldo. Y es el camino que
// se usa al cambiar de teléfono, que es cuando más caro sale que salga mal.
//
// ── Por qué esto es delicado ─────────────────────────────────────────────────
//
// Importar es la única operación de la app que puede **destruir datos que el
// usuario no está mirando**. Borrar un movimiento se ve; importar reemplazando
// todo se lleva meses de registro de un toque, y quien lo hace suele estar
// convencido de que está recuperando datos, no perdiéndolos.
//
// De ahí las tres reglas de este archivo:
//
//   1. **Primero se lee, después se decide.** Nunca se toca el estado sin haber
//      podido mostrar antes qué va a pasar, con números concretos.
//   2. **El usuario elige entre reemplazar y agregar**, y la app no elige por
//      él. Son dos cosas muy distintas y solo él sabe cuál quiere.
//   3. **Agregar no duplica.** Un movimiento que ya está —mismo identificador—
//      no entra dos veces. Importar dos veces el mismo respaldo tiene que dejar
//      lo mismo que importarlo una.



/**
 * Lee el texto de un respaldo. **Nunca tira**: devuelve el resultado o el
 * motivo, porque el usuario tiene que poder entender qué pasó y volver a
 * intentar con otro archivo.
 */
function leerRespaldo(texto) {
  if (typeof texto !== 'string' || texto.trim() === '') {
    return { error: 'El archivo está vacío.' };
  }

  let leido;
  try {
    leido = JSON.parse(texto);
  } catch {
    return {
      error: 'Este archivo no es un respaldo de Viajecor: no se pudo leer como JSON. ' +
        '¿Puede ser que sea un CSV, o que se haya copiado a medias?',
    };
  }

  if (leido === null || typeof leido !== 'object' || Array.isArray(leido)) {
    return { error: 'Este archivo no tiene la forma de un respaldo de Viajecor.' };
  }

  if (!Array.isArray(leido.movimientos)) {
    return {
      error: 'Este archivo no tiene una lista de movimientos, así que no parece un respaldo de Viajecor. ' +
        'Los respaldos se llaman viajecor-AAAA-MM-DD.json.',
    };
  }

  // Se pasa por la misma puerta que los datos guardados: un respaldo editado a
  // mano no puede meter nada que el almacenamiento no aceptaría (ADR-017).
  const incidencias = [];
  const estado = migrarEstado(leido, incidencias);

  return {
    estado,
    incidencias,
    // Datos del archivo, para que la pantalla pueda decir de cuándo es.
    exportado: typeof leido.exportado === 'string' ? leido.exportado : null,
    version_app: typeof leido.version_app === 'string' ? leido.version_app : null,
  };
}

/**
 * Qué pasaría si se importara. **No cambia nada**: es lo que se le muestra al
 * usuario antes de que decida.
 *
 * `yaEstan` son los movimientos del respaldo que ya existen en la app, contados
 * por identificador. Es el número que explica por qué "agregar" a veces suma
 * menos de lo que trae el archivo — sin él, alguien creería que se perdieron.
 */
function previsualizar(estadoActual, leido) {
  const actuales = new Set((estadoActual.movimientos ?? []).map((m) => m.id));
  const delRespaldo = leido.estado.movimientos ?? [];

  const yaEstan = delRespaldo.filter((m) => actuales.has(m.id)).length;

  return {
    trae: delRespaldo.length,
    yaEstan,
    nuevos: delRespaldo.length - yaEstan,
    tenes: actuales.size,
    // Cuántos quedarían con cada camino. Son los dos números que hacen la
    // diferencia entre las dos opciones entendible sin explicarla.
    siReemplazo: delRespaldo.length,
    siAgrego: actuales.size + (delRespaldo.length - yaEstan),
    // Cuántos se PERDERÍAN al reemplazar: los que hay ahora y no están en el
    // archivo. Es el número que nadie mira y el que más duele.
    sePierden: (estadoActual.movimientos ?? []).filter(
      (m) => !delRespaldo.some((r) => r.id === m.id)
    ).length,
    incidencias: leido.incidencias ?? [],
  };
}

const MODO_REEMPLAZAR = 'reemplazar';
const MODO_AGREGAR = 'agregar';

/**
 * Aplica la importación. Devuelve un estado nuevo; no modifica el que recibe.
 *
 * **Agregar no duplica:** un movimiento cuyo identificador ya está se saltea.
 * Importar dos veces el mismo respaldo deja lo mismo que importarlo una vez, que
 * es lo que cualquiera espera y lo que evita el desastre silencioso de tener
 * cada gasto contado dos veces en todos los totales.
 */
function aplicarImportacion(estadoActual, leido, modo) {
  if (modo !== MODO_REEMPLAZAR && modo !== MODO_AGREGAR) {
    throw new Error(`Modo de importación desconocido: ${JSON.stringify(modo)}.`);
  }

  const importado = leido.estado;
  const ultimo_respaldo = ultimoRespaldoDespuesDe(estadoActual, leido);

  if (modo === MODO_REEMPLAZAR) {
    // Se conserva una sola cosa de lo que había: la fecha del último respaldo.
    // Es un dato sobre el dispositivo, no sobre los gastos, y perderlo haría
    // que la app dijera "nunca respaldaste" justo después de haber importado un
    // respaldo, que es lo contrario de la verdad.
    return {
      ...importado,
      preferencias: { ...importado.preferencias, ultimo_respaldo },
    };
  }

  const yaEstan = new Set((estadoActual.movimientos ?? []).map((m) => m.id));
  const nuevos = (importado.movimientos ?? []).filter((m) => !yaEstan.has(m.id));

  return {
    ...estadoActual,
    movimientos: [...(estadoActual.movimientos ?? []), ...nuevos],
    // Los tipos de cambio y las monedas del respaldo se suman a los que hay: si
    // el archivo trae el cambio del colón de marzo y la app no lo tiene, sin él
    // esos movimientos entrarían sin poder convertirse a euros.
    tipos_cambio: unirPorClave(
      estadoActual.tipos_cambio ?? [],
      importado.tipos_cambio ?? [],
      (c) => `${c.moneda}|${c.mes}`
    ),
    monedas: unirPorClave(estadoActual.monedas ?? [], importado.monedas ?? [], (m) => m.codigo),
    // Las fechas de viaje también se suman, y **las que ya están mandan**: al
    // agregar un respaldo a lo que hay, lo de este dispositivo es lo más nuevo
    // que se sabe. Sin esta línea, un viaje del respaldo llegaba sin sus fechas
    // y la app volvía a preguntar "¿Cuándo fue?" por algo ya contestado (L-031).
    // El catálogo de rubros del respaldo se UNE al de acá: si el archivo trae
    // "mascotas" y este dispositivo no lo tiene, sin esto entrarían movimientos
    // de un rubro inexistente y se caerían en la próxima lectura.
    rubros: unirCatalogos(estadoActual.rubros, importado.rubros),

    // Los ahorros del respaldo se suman por id, igual que los movimientos: dos
    // importaciones del mismo archivo no pueden duplicar la plata ahorrada.
    ahorros: unirPorClave(
      estadoActual.ahorros ?? [],
      importado.ahorros ?? [],
      (a) => a.id
    ),
    fechas_de_viaje: unirPorClave(
      estadoActual.fechas_de_viaje ?? [],
      importado.fechas_de_viaje ?? [],
      (v) => normalizarClave(String(v?.clave ?? ''))
    ),
    preferencias: { ...estadoActual.preferencias, ultimo_respaldo },
  };
}

/**
 * La fecha del último respaldo después de importar: la más reciente entre la
 * que tenía el dispositivo y la que dice el archivo.
 *
 * El archivo **es** la prueba de que ese día hubo un respaldo. Sin esto, un
 * teléfono nuevo que acaba de importar un archivo de hoy diría "nunca
 * respaldaste", que es falso y empuja a respaldar de nuevo lo que ya está
 * respaldado. Si la del dispositivo es más nueva, gana esa: el archivo puede
 * ser viejo, y decir que el último respaldo es más antiguo de lo que fue
 * también sería mentir.
 */
function ultimoRespaldoDespuesDe(estadoActual, leido) {
  const propio = estadoActual.preferencias?.ultimo_respaldo ?? null;
  // `validarFecha` tira: el archivo lo pudo escribir cualquiera, y una fecha
  // rota ahí no puede impedir recuperar los gastos.
  let delArchivo = null;
  try {
    delArchivo = validarFecha(leido.exportado);
  } catch {
    delArchivo = null;
  }

  if (propio === null) return delArchivo ?? undefined;
  if (delArchivo === null) return propio;
  // Las fechas son AAAA-MM-DD: comparar como texto es comparar como calendario.
  return delArchivo > propio ? delArchivo : propio;
}

/**
 * Une dos listas sin repetir, **dando prioridad a lo que ya tenía el usuario**.
 *
 * Si el respaldo trae un tipo de cambio para un mes que la app ya tiene, gana el
 * de la app: el usuario pudo haberlo corregido después de exportar, y pisarlo
 * con el viejo cambiaría totales que él ya dio por buenos sin decírselo.
 */
function unirPorClave(propios, ajenos, clave) {
  const vistos = new Set(propios.map(clave));
  return [...propios, ...ajenos.filter((a) => !vistos.has(clave(a)))];
}


/**
 * Une dos catálogos de rubros, respetando el tope de la paleta — T-048.
 *
 * Lo de este dispositivo va primero (conserva los colores) y del respaldo entra
 * lo que falte. **Se corta en el tope**: nueve rubros no tendrían nueve colores
 * distinguibles (ADR-029), y lo que no entra no se pierde —sus movimientos
 * siguen ahí— sino que queda como rubro huérfano, que Ajustes muestra y deja
 * unir con otro.
 */
function unirCatalogos(propio, ajeno) {
  const unir = (a = [], b = []) => {
    const juntos = [...a];
    for (const rubro of b) {
      if (typeof rubro !== 'string') continue;
      const clave = normalizarClave(rubro);
      if (clave !== '' && !juntos.includes(clave)) juntos.push(clave);
    }
    return juntos.slice(0, TOPE_DE_RUBROS);
  };

  const base = { gasto: rubrosDe(TIPO_GASTO, propio), ingreso: rubrosDe(TIPO_INGRESO, propio) };
  if (!ajeno || typeof ajeno !== 'object') return base;

  return { gasto: unir(base.gasto, ajeno.gasto), ingreso: unir(base.ingreso, ajeno.ingreso) };
}

// ── src/datos/recordatorio.js ───────────────────────────────────
// El recordatorio de respaldo — T-903.
//
// Es la contramedida al riesgo más grave de toda la arquitectura: los datos
// viven en un solo navegador, y "limpiar datos de navegación" en el celular se
// los lleva todos. No hay servidor ni papelera. El respaldo es la única red, y
// una red que hay que acordarse de tender no se tiende.
//
// ── Por qué el aviso vive acá y no solo en la pantalla de Datos ──────────────
//
// La pantalla de Datos ya dice cuánto hace que no respaldás (T-016), pero ahí
// solo entra quien ya se acordó. El aviso tiene que encontrar al usuario en la
// pantalla donde está, que es la del mes.
//
// ── Por qué cuenta movimientos y no solo días ────────────────────────────────
//
// "Hace 9 días que no respaldás" es un reproche. "Tenés 23 movimientos que
// existen en un solo lugar" es lo que efectivamente se pierde, y es el número
// que hace que valga la pena tocar el botón. Se dicen los dos, pero el que
// manda es el de los movimientos: si hace tres semanas que no respaldás y no
// cargaste nada, no hay nada que hacer y el aviso no aparece.
//
// ── Por qué se puede posponer, pero solo por hoy ─────────────────────────────
//
// Un aviso que no se puede sacar de la pantalla se vuelve parte del decorado y
// deja de leerse. Uno que se apaga para siempre no sirve para nada. Se pospone
// por el día: mañana vuelve.


/** Decidido por el usuario el 2026-08-19: una semana. */
const DIAS_PARA_RECORDAR = 7;

/**
 * Los movimientos que todavía no entraron en ningún respaldo.
 *
 * Se comparan por el día en que se cargaron (`creado`), no por la fecha del
 * gasto: cargar hoy un gasto de la semana pasada lo deja **sin respaldar**, por
 * más que su fecha sea vieja. Es lo que se pierde, no lo que dice el papel.
 *
 * Un movimiento creado **el mismo día** del último respaldo se cuenta como sin
 * respaldar. La app no guarda horas (ADR-021), así que no hay forma de saber si
 * se cargó antes o después de haber exportado, y equivocarse hacia "ya está
 * respaldado" es equivocarse hacia perder datos.
 */
function sinRespaldar(estado) {
  const movimientos = estado.movimientos ?? [];
  const ultimo = estado.preferencias?.ultimo_respaldo;

  if (typeof ultimo !== 'string') return movimientos;
  return movimientos.filter((m) => typeof m.creado !== 'string' || m.creado >= ultimo);
}

/**
 * Qué hay que decirle al usuario sobre su respaldo. **No decide cómo se ve**:
 * devuelve los hechos y la pantalla los escribe (ADR-022).
 *
 * `desde` son los días que corren: desde el último respaldo, o —si nunca hubo
 * uno— desde que se cargó el movimiento sin respaldar más viejo. Contar desde
 * el primer movimiento y no desde siempre evita que la app le reclame un
 * respaldo a alguien que cargó su primer gasto hace diez minutos.
 */
function estadoDelRecordatorio(estado, { fecha = hoy(), dias = DIAS_PARA_RECORDAR } = {}) {
  const pendientes = sinRespaldar(estado);
  const desdeElRespaldo = diasSinRespaldar(estado, { fecha });
  const nunca = desdeElRespaldo === null;

  const desde = nunca ? diasDesdeElMasViejo(pendientes, fecha) : desdeElRespaldo;

  return {
    cuantos: pendientes.length,
    desde,
    nunca,
    // Hay algo que perder Y pasó el tiempo Y no se pospuso hoy. Las tres cosas:
    // sin movimientos nuevos no hay nada que respaldar por más que pase un mes.
    haceFalta:
      pendientes.length > 0 &&
      desde !== null &&
      desde >= dias &&
      estado.preferencias?.recordatorio_pospuesto !== fecha,
  };
}

/** Guarda que hoy el usuario dijo "ahora no". Mañana el aviso vuelve. */
function posponerRecordatorio(estado, { fecha = hoy() } = {}) {
  return {
    ...estado,
    preferencias: { ...estado.preferencias, recordatorio_pospuesto: validarFecha(fecha) },
  };
}

/** Cuántos días hace que se cargó el más viejo de estos movimientos. */
function diasDesdeElMasViejo(movimientos, fecha) {
  const fechas = movimientos.map((m) => m.creado).filter((c) => typeof c === 'string');
  if (fechas.length === 0) return null;

  const masViejo = fechas.reduce((a, b) => (a < b ? a : b));
  return Math.max(0, diasEntre(masViejo, fecha));
}

// ── src/datos/instalacion.js ────────────────────────────────────
// Lo que la app le pide al navegador para portarse como una app — T-950.
//
// Dos pedidos, los dos opcionales y los dos que pueden decir que no:
//
//   1. **Que guarde una copia de la página** (el trabajador de servicio), para
//      que abra sin conexión.
//   2. **Que no borre los datos para hacer lugar** (`storage.persist()`).
//
// ── Por qué está acá y no en `ui/` ───────────────────────────────────────────
//
// Es acceso al navegador, como `almacenamiento.js`: no dibuja nada. Y recibe el
// `navigator` en vez de tomarlo del ámbito, que es lo que permite probarlo con
// un doble en `node --test` en vez de solo mirándolo en un teléfono.
//
// ── Ninguno de los dos puede romper la app ───────────────────────────────────
//
// Un navegador viejo no tiene estas cosas; un navegador en ventana privada las
// niega; `file://` no admite trabajadores de servicio. Las tres son respuestas
// legítimas y frecuentes, así que **nada de esto tira**: devuelve qué pasó, y
// la app sigue andando exactamente igual que antes. Lo único que se pierde es
// abrir sin conexión.

/** Dónde vive el trabajador de servicio, servido desde la raíz del sitio. */
const RUTA_DEL_SERVICIO = '/sw.js';

/**
 * Registra el trabajador de servicio, si este navegador puede.
 *
 * **Solo con `http:` o `https:`.** Desde `file://` el navegador no los admite —y
 * ahí no hace falta: el archivo ya está en el disco—. Preguntarlo antes evita
 * un error en la consola en el caso que MÁS se usa hoy, que es el archivo.
 */
function registrarServicio(navegador, protocolo) {
  if (protocolo !== 'http:' && protocolo !== 'https:') return { pedido: false, motivo: 'archivo' };
  if (!navegador?.serviceWorker?.register) return { pedido: false, motivo: 'no lo tiene' };

  try {
    const promesa = navegador.serviceWorker.register(RUTA_DEL_SERVICIO);
    // Si falla, no hay nada que hacer ni nada que decirle al usuario: la app
    // funciona igual, solo que necesitando red para abrir.
    promesa?.catch?.(() => {});
    return { pedido: true, motivo: null };
  } catch {
    return { pedido: false, motivo: 'falló' };
  }
}

/**
 * Le pide al navegador que no borre los datos para hacer lugar.
 *
 * Sin esto, un teléfono con poco espacio puede tirar lo guardado por este sitio
 * sin avisar. Chrome suele conceder el permiso a los sitios agregados a la
 * pantalla de inicio; Safari lo maneja distinto y puede decir que no.
 *
 * **La respuesta importa y por eso se devuelve**: la pantalla de Datos la
 * escribe, para que el usuario sepa si está protegido o si el respaldo es su
 * única red.
 */
async function pedirPersistencia(navegador) {
  const almacen = navegador?.storage;
  if (!almacen?.persist) return 'no se sabe';

  try {
    // Si ya está concedido, `persisted()` lo dice sin volver a pedir nada.
    if (almacen.persisted && await almacen.persisted()) return 'sí';
    return await almacen.persist() ? 'sí' : 'no';
  } catch {
    return 'no se sabe';
  }
}

// ── src/datos/zip.js ────────────────────────────────────────────
// Un ZIP escrito a mano — la mitad de abajo del `.xlsx` (T-906).
//
// Un `.xlsx` es un ZIP con archivos XML adentro. Para escribir uno hace falta
// armar el ZIP, y el navegador **no trae** ninguna función para eso: trae
// `DecompressionStream` para leer, pero armar el contenedor es cuenta propia.
//
// Son unas cien líneas y no cambian nunca: el formato ZIP está congelado desde
// 1989. Es menos código que la línea de `<script src>` que haría falta para
// traer una librería — y esa línea rompería la promesa de la app (RN-06).
//
// ── Por qué NO se comprime ───────────────────────────────────────────────────
//
// El ZIP permite guardar cada archivo tal cual ("stored", método 0) o
// comprimido. Acá se guarda tal cual, por tres razones:
//
//   1. Comprimir en el navegador es asíncrono (`CompressionStream`), y eso
//      convierte toda la exportación en asíncrona por una ganancia de tamaño
//      que no le importa a nadie.
//   2. Un ZIP sin comprimir es un ZIP válido. Excel, LibreOffice y Google
//      Sheets lo abren igual: no es un atajo ni un formato degradado.
//   3. Es una dependencia menos de una API del navegador que podría no estar.
//
// Lo que cuesta: el archivo pesa más. Para un año de gastos son unos cientos de
// kilobytes, que en 2026 no es un problema para nadie.

// ── Leer un ZIP — T-031 ──────────────────────────────────────────────────────
//
// Para importar la planilla del usuario hay que abrir su `.xlsx`, que es un ZIP.
// Leerlo es más trabajo que escribirlo: el archivo puede venir de cualquier
// programa y **cada entrada puede estar comprimida o no**.
//
// La descompresión la hace el navegador con `DecompressionStream('deflate-raw')`,
// que también está en Node — así que esto se puede probar sin abrir un
// navegador, que es la razón por la que se eligió por sobre cualquier otra vía.
//
// **Se lee de atrás para adelante**, que es como se lee un ZIP: al final del
// archivo hay un índice que dice dónde empieza cada entrada. Recorrerlo desde el
// principio también "funciona" y es lo que hace que un ZIP con un comentario
// adelante, o un archivo concatenado, se lea mal.

/** La firma del cierre: "PK\5\6". Marca el final del índice. */
const FIRMA_CIERRE = 0x06054b50;
const FIRMA_ENTRADA = 0x02014b50;

/**
 * Abre un ZIP y devuelve sus entradas como texto: `Map` de nombre a contenido.
 *
 * Es asíncrona porque descomprimir lo es. **Nunca tira por un archivo mal
 * formado**: devuelve `{ error }` con el motivo, porque quien la llama es alguien
 * eligiendo un archivo de su teléfono y puede haber elegido cualquier cosa.
 */
async function leerZip(bytes) {
  if (!(bytes instanceof Uint8Array) || bytes.length < 22) {
    return { error: 'El archivo está vacío o es demasiado chico para ser un .xlsx.' };
  }

  const vista = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const cierre = buscarCierre(vista, bytes.length);
  if (cierre === -1) {
    return {
      error: 'Este archivo no es un .xlsx: no tiene la estructura de un archivo comprimido. ' +
        '¿Puede ser que sea un .xls viejo, o un archivo de otro programa?',
    };
  }

  const cuantas = vista.getUint16(cierre + 10, true);
  const tamanoCentral = vista.getUint32(cierre + 12, true);
  const inicioCentral = vista.getUint32(cierre + 16, true);

  // Los desplazamientos que guarda un ZIP son desde el principio **del ZIP**, no
  // del archivo. Si hay algo pegado adelante —un ejecutable autoextraíble, o
  // basura—, todos quedan corridos por ese tanto. La diferencia entre dónde
  // debería empezar el índice y dónde empieza de verdad es exactamente ese
  // corrimiento, y se lo suma a todo.
  const corrimiento = (cierre - tamanoCentral) - inicioCentral;
  let donde = inicioCentral + corrimiento;
  const entradas = new Map();

  for (let i = 0; i < cuantas; i += 1) {
    if (donde + 46 > bytes.length || vista.getUint32(donde, true) !== FIRMA_ENTRADA) {
      return { error: 'El archivo está incompleto o dañado: su índice interno no cierra.' };
    }

    const metodo = vista.getUint16(donde + 10, true);
    const comprimido = vista.getUint32(donde + 20, true);
    const largoNombre = vista.getUint16(donde + 28, true);
    const largoExtra = vista.getUint16(donde + 30, true);
    const largoComentario = vista.getUint16(donde + 32, true);
    const local = vista.getUint32(donde + 42, true) + corrimiento;
    const nombre = new TextDecoder().decode(bytes.subarray(donde + 46, donde + 46 + largoNombre));

    // Los tamaños del encabezado local pueden mentir (hay programas que los
    // dejan en cero y los ponen después de los datos), así que los que valen son
    // los del índice. Del encabezado local solo se usa dónde empiezan los datos.
    const largoNombreLocal = vista.getUint16(local + 26, true);
    const largoExtraLocal = vista.getUint16(local + 28, true);
    const empiezan = local + 30 + largoNombreLocal + largoExtraLocal;
    const datos = bytes.subarray(empiezan, empiezan + comprimido);

    try {
      entradas.set(nombre, await descomprimir(datos, metodo));
    } catch (error) {
      return { error: `No se pudo leer "${nombre}" de adentro del archivo: ${error.message}` };
    }

    donde += 46 + largoNombre + largoExtra + largoComentario;
  }

  return { entradas };
}

/**
 * Busca el cierre desde el final.
 *
 * No se busca la firma desde el principio: un ZIP puede tener datos adelante
 * —hay instaladores que son un ejecutable con un ZIP pegado atrás— y la primera
 * coincidencia sería basura. Se retrocede hasta 64 kB, que es lo máximo que
 * puede ocupar el comentario final del formato.
 */
function buscarCierre(vista, largo) {
  const hasta = Math.max(0, largo - 22 - 0xffff);
  for (let i = largo - 22; i >= hasta; i -= 1) {
    if (vista.getUint32(i, true) === FIRMA_CIERRE) return i;
  }
  return -1;
}

/** Descomprime una entrada según su método. Solo los dos que existen de verdad. */
async function descomprimir(datos, metodo) {
  if (metodo === 0) return new TextDecoder().decode(datos);  // guardada tal cual
  if (metodo !== 8) throw new Error(`está comprimida de una forma que no se conoce (método ${metodo})`);

  const flujo = new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(flujo).text();
}

/**
 * La tabla de CRC-32 que el formato ZIP exige por cada entrada.
 *
 * Se calcula una sola vez: son 256 entradas y el cálculo es el mismo siempre.
 */
const TABLA_CRC = (() => {
  const tabla = new Int32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    tabla[i] = c;
  }
  return tabla;
})();

/** El CRC-32 de unos bytes. Es la suma de control que el ZIP guarda por entrada. */
function crc32(bytes) {
  let c = -1;
  for (let i = 0; i < bytes.length; i++) c = TABLA_CRC[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}

/**
 * Arma un ZIP con las entradas dadas. Devuelve los bytes.
 *
 * `entradas` es `[{ nombre, contenido }]`, donde el contenido es texto. Los
 * nombres llevan barras normales aunque sean carpetas: el ZIP no tiene
 * carpetas de verdad, solo nombres con barras adentro.
 */
function crearZip(entradas) {
  const codificador = new TextEncoder();
  const locales = [];
  const central = [];
  let desplazamiento = 0;

  for (const entrada of entradas) {
    const nombre = codificador.encode(entrada.nombre);
    const datos = codificador.encode(entrada.contenido);
    const suma = crc32(datos);

    // Encabezado local: va pegado a los datos de cada archivo.
    const encabezado = nuevoBuffer(30 + nombre.length);
    encabezado.escribir32(0, 0x04034b50);   // firma
    encabezado.escribir16(4, 20);           // versión mínima para extraer
    encabezado.escribir16(6, 0);            // sin banderas
    encabezado.escribir16(8, 0);            // método 0: guardado sin comprimir
    encabezado.escribir16(10, 0);           // hora: 0. La app no guarda horas
    encabezado.escribir16(12, 0x2821);      // fecha: 2000-01-01, fija a propósito
    encabezado.escribir32(14, suma);
    encabezado.escribir32(18, datos.length); // tamaño comprimido = tamaño real
    encabezado.escribir32(22, datos.length);
    encabezado.escribir16(26, nombre.length);
    encabezado.escribir16(28, 0);           // sin campos extra
    encabezado.copiar(30, nombre);

    locales.push(encabezado.bytes, datos);

    // Entrada del directorio central: el índice que va al final del archivo.
    const indice = nuevoBuffer(46 + nombre.length);
    indice.escribir32(0, 0x02014b50);
    indice.escribir16(4, 20);               // versión con la que se creó
    indice.escribir16(6, 20);
    indice.escribir16(8, 0);
    indice.escribir16(10, 0);
    indice.escribir16(12, 0);
    indice.escribir16(14, 0x2821);
    indice.escribir32(16, suma);
    indice.escribir32(20, datos.length);
    indice.escribir32(24, datos.length);
    indice.escribir16(28, nombre.length);
    indice.escribir16(30, 0);
    indice.escribir16(32, 0);               // sin comentario
    indice.escribir16(34, 0);               // disco 0
    indice.escribir16(36, 0);
    indice.escribir32(38, 0);
    indice.escribir32(42, desplazamiento);  // dónde empieza su encabezado local
    indice.copiar(46, nombre);

    central.push(indice.bytes);
    desplazamiento += encabezado.bytes.length + datos.length;
  }

  const tamanoCentral = central.reduce((total, b) => total + b.length, 0);

  // El cierre: le dice al lector dónde está el índice. Se lee de atrás hacia
  // adelante, que es por lo que un ZIP se puede leer sin recorrerlo entero.
  const cierre = nuevoBuffer(22);
  cierre.escribir32(0, 0x06054b50);
  cierre.escribir16(4, 0);
  cierre.escribir16(6, 0);
  cierre.escribir16(8, entradas.length);
  cierre.escribir16(10, entradas.length);
  cierre.escribir32(12, tamanoCentral);
  cierre.escribir32(16, desplazamiento);
  cierre.escribir16(20, 0);

  return unir([...locales, ...central, cierre.bytes]);
}

/** Un pedazo de memoria con las tres escrituras que el ZIP necesita. */
function nuevoBuffer(tamano) {
  const bytes = new Uint8Array(tamano);
  const vista = new DataView(bytes.buffer);
  return {
    bytes,
    // El ZIP guarda los números al revés (byte menos significativo primero).
    // Es una decisión de 1989 y hay que respetarla tal cual.
    escribir16: (donde, valor) => vista.setUint16(donde, valor, true),
    escribir32: (donde, valor) => vista.setUint32(donde, valor, true),
    copiar: (donde, otros) => bytes.set(otros, donde),
  };
}

function unir(partes) {
  const total = partes.reduce((suma, p) => suma + p.length, 0);
  const juntos = new Uint8Array(total);
  let donde = 0;
  for (const parte of partes) {
    juntos.set(parte, donde);
    donde += parte.length;
  }
  return juntos;
}

// ── src/datos/xlsx.js ───────────────────────────────────────────
// Exportar a `.xlsx` con la forma de la planilla — T-906, CU-07.
//
// El usuario viene de un Excel que usó durante meses y lo conoce de memoria.
// Este archivo produce una planilla con **la misma forma**: bloques mensuales,
// los mismos encabezados, las mismas columnas, el mismo bloque de totales a la
// derecha. La diferencia está en una sola cosa, y es la razón de ser de la app:
//
//   **Los totales son números calculados, no fórmulas con rangos escritos a
//   mano.** El Excel original suma `$G$8:$G$1027`; la fila 1028 existe y no se
//   suma, y nadie se entera nunca. Ese es L-001, y es por lo que este proyecto
//   existe. Acá el total lo calcula la app recorriendo todo, sin ningún tope.
//
// ── Decisiones de producto que tomó el usuario (2026-08-27) ──────────────────
//
//   - La columna «G/Acum./Mes» y el bloque «GASTOS POR TIPO» se rellenan con
//     los números ya calculados.
//   - La columna MONTO lleva **el equivalente en euros**, una sola moneda, para
//     que sumar la columna dé un número con sentido.
//
// Un movimiento en otra moneda al que le falta el tipo de cambio **no se puede
// convertir**. No se descarta ni se pone en cero: entra con el monto vacío y el
// motivo escrito en DETALLES. Una fila que desaparece en silencio es exactamente
// la falla que la app viene a eliminar.
//
// ── Sobre las direcciones que va a ver la guardia de privacidad ──────────────
//
// Las constantes `NS_*` de más abajo son **espacios de nombres de XML**:
// identificadores que el formato exige escribir tal cual, no direcciones. Nadie
// se conecta ahí, y Excel abre un .xlsx sin conexión. Están permitidas de forma
// explícita y acotada en `tools/privacidad.mjs`. Ver ADR-027.
//
// (Este comentario no las escribe: la guardia solo acepta las cadenas exactas
// de su lista, y un ejemplo suelto en un comentario es una dirección más. Frenó
// la construcción cuando estaban escritas acá, que es justo lo que se le pide.)






const NS_HOJA = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const NS_RELACIONES = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const NS_PAQUETE = 'http://schemas.openxmlformats.org/package/2006/relationships';
const NS_TIPOS = 'http://schemas.openxmlformats.org/package/2006/content-types';

const TIPO_XLSX =
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

/** El nombre del archivo: la fecha adelante, para que ordenen solos. */
function nombreDeLaPlanilla(fecha = hoy()) {
  return `viajecor-${fecha}.xlsx`;
}

// Escapa para XML, que no es lo mismo que escapar para HTML: acá hay que
// escapar también las comillas, porque en el XML de una hoja el texto puede
// caer dentro de un atributo. Se llama distinto que el `escapar()` de la
// interfaz a propósito.
const escaparXml = (texto) => String(texto)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

const LETRAS_DE_COLUMNA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const columnaDeExcel = (n) => (n < 26 ? LETRAS_DE_COLUMNA[n] : LETRAS_DE_COLUMNA[Math.floor(n / 26) - 1] + LETRAS_DE_COLUMNA[n % 26]);

// Estilos, por número, tal como los define `FORMATOS` más abajo.
const NORMAL = 0;
const TITULO = 1;
const ENCABEZADO = 2;
const EUROS = 3;
const MES_CORTO = 4;
const BANDA = 5;
const TIPO = 6;
const CELDA = 7;
const CENTRADA = 8;
const EUROS_TOTAL = 9;

// Los encabezados de rubro con su color empiezan acá; la celda del rubro en la
// lista de movimientos, ocho más adelante. Se suma la franja del rubro (1 a 8).
const RUBRO_ENCABEZADO_BASE = 9;
const RUBRO_CELDA_BASE = 17;

function celda(col, fila, valor, estilo = NORMAL) {
  const ref = `${columnaDeExcel(col)}${fila}`;
  const s = estilo ? ` s="${estilo}"` : '';

  // Sin valor: una celda que solo lleva formato. Es lo que da los bordes de una
  // fila y lo que sostiene las celdas de al lado de una banda combinada.
  if (valor === '' || valor === null || valor === undefined) {
    return estilo === NORMAL ? '' : `<c r="${ref}"${s}/>`;
  }

  if (typeof valor === 'number') return `<c r="${ref}"${s}><v>${valor}</v></c>`;
  return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${escaparXml(valor)}</t></is></c>`;
}

/**
 * Una fecha como el número de serie que usa Excel.
 *
 * Excel cuenta días desde el 1900-01-01 y **cree que 1900 fue bisiesto**, cosa
 * que no fue. El error está en el formato desde 1985, por compatibilidad con
 * Lotus 1-2-3, y no se puede arreglar sin romper todas las planillas del mundo:
 * el desplazamiento de 25569 días desde la época de Unix ya lo tiene en cuenta.
 */
function fechaDeExcel(iso) {
  const [anio, mes, dia] = iso.split('-').map(Number);
  return Math.round(Date.UTC(anio, mes - 1, dia) / 86400000) + 25569;
}

/** De céntimos a euros, que es como Excel espera un importe. */
const aEuros = (centimos) => centimos / 100;

/**
 * Dos decimales, que es lo que Excel va a mostrar.
 *
 * No es `redondear()` de `core/dinero.js`: aquella trabaja en unidades mínimas
 * enteras (ADR-005) y esta pasa a euros con coma para Excel, que es el único
 * lugar de la app donde el dinero deja de ser entero. Se llama distinto a
 * propósito, para que nadie use una creyendo que es la otra.
 */
function aDosDecimales(euros) {
  // Se rechaza lo que no es un número en vez de convertirlo. `Math.round('' *
  // 100)` da 0 sin decir nada, y una celda de dinero en 0 se lee exactamente
  // igual que un 0 de verdad: sería un importe inventado con aspecto de dato.
  // Lo destapó una mutación (2026-08-27) que parecía inofensiva justamente
  // porque esta conversión la tapaba.
  if (typeof euros !== 'number' || !Number.isFinite(euros)) {
    throw new Error(`Un importe de la planilla no es un número: ${JSON.stringify(euros)}.`);
  }
  return Math.round(euros * 100) / 100;
}

/**
 * Una rejilla de celdas, que después se convierte en el XML de la hoja.
 *
 * Existe porque los bloques de la derecha (`GASTOS POR TIPO`, `TOTALES`, `GASTO
 * POR DÍA`) ocupan las mismas filas que los movimientos de la izquierda, y en el
 * XML de una hoja **cada fila se escribe una sola vez, con sus celdas en orden**.
 * La primera versión escribía las filas y después les pegaba las celdas de la
 * derecha con un `replace` sobre el texto del XML: andaba, y era exactamente la
 * clase de código que funciona hasta que alguien agrega un bloque más.
 */
function nuevaRejilla() {
  const celdas = new Map();
  const combinadas = [];

  return {
    /**
     * Pone una celda. Sin valor pero con estilo, escribe una celda **vacía con
     * formato**: es lo que hace falta para los bordes de una fila y para las
     * celdas de al lado de una banda combinada.
     *
     * La primera versión ponía un espacio en esos casos. Andaba, pero dejaba la
     * planilla llena de celdas que *parecen* vacías y no lo son: filtrar,
     * ordenar o contar en Excel las trata como texto.
     */
    poner(fila, col, valor, estilo = NORMAL) {
      const vacia = valor === '' || valor === null || valor === undefined;
      if (vacia && estilo === NORMAL) return;
      celdas.set(`${fila}|${col}`, { fila, col, valor: vacia ? null : valor, estilo });
    },
    /**
     * Une varias celdas en una, para las bandas de título.
     *
     * En Excel una celda combinada **sigue siendo varias celdas**: la de arriba
     * a la izquierda lleva el valor y las otras tienen que existir igual, aunque
     * sea vacías, o el archivo queda inconsistente. Por eso quien llama a esto
     * escribe también las celdas de al lado con un espacio.
     */
    combinar(desdeFila, desdeCol, hastaFila, hastaCol) {
      combinadas.push(
        `${columnaDeExcel(desdeCol)}${desdeFila}:${columnaDeExcel(hastaCol)}${hastaFila}`
      );
    },
    combinadas: () => combinadas,
    aXml() {
      const porFila = new Map();
      for (const celda of celdas.values()) {
        if (!porFila.has(celda.fila)) porFila.set(celda.fila, []);
        porFila.get(celda.fila).push(celda);
      }

      return [...porFila.keys()].sort((a, b) => a - b).map((fila) => {
        const contenido = porFila.get(fila)
          .sort((a, b) => a.col - b.col)
          .map((c) => celda(c.col, c.fila, c.valor, c.estilo))
          .join('');
        return `<row r="${fila}">${contenido}</row>`;
      }).join('');
    },
  };
}

// La primera columna del bloque de la derecha. Los rubros se escriben a lo
// ancho desde acá, como en la planilla original.
const COL_RESUMEN = 9;

/**
 * Escribe el bloque de un mes en la rejilla y devuelve dónde sigue el siguiente.
 *
 * A la izquierda, los movimientos uno por fila con el acumulado del mes. A la
 * derecha, los resúmenes que en la planilla original son fórmulas: gastos por
 * rubro, ingresos por rubro, los totales y el gasto por día.
 *
 * Todo eso está **calculado sobre todas las filas**, sin ningún rango escrito a
 * mano. Es la única diferencia con la planilla original, y es la razón de ser de
 * la app (L-001).
 */
function escribirMes(rejilla, estado, mes, desde) {
  const movimientos = movimientosDelMes(estado.movimientos, mes)
    .slice()
    // Por fecha y, a igual fecha, por orden de carga: el mismo criterio con el
    // que se ven en la app, para que la planilla y la pantalla cuenten lo mismo.
    .sort((a, b) => a.fecha.localeCompare(b.fecha) || String(a.creado).localeCompare(String(b.creado)));

  let n = desde + 1;

  // La banda amarilla con el mes, cruzando el ancho, como en la original.
  const filaDelTitulo = n;
  for (let col = 0; col <= COL_RESUMEN + 8; col += 1) {
    rejilla.poner(n, col, col === 0 ? formatearMes(mes).toUpperCase().replace(' DE ', ' ') : null, TITULO);
  }
  rejilla.combinar(n, 0, n, COL_RESUMEN + 8);
  n += 2;

  // La banda rosa de "INGRESOS Y GASTOS" sobre las columnas de la izquierda.
  const ENCABEZADOS = ['G/Acum./Mes', 'Comentarios', 'DÍA', 'MES', 'DETALLES', 'RUBRO', 'MONTO', 'I/G'];
  for (let col = 0; col < ENCABEZADOS.length; col += 1) {
    rejilla.poner(n, col, col === 0 ? 'INGRESOS Y GASTOS' : null, BANDA);
  }
  rejilla.combinar(n, 0, n, ENCABEZADOS.length - 1);
  const filaDelResumen = n;
  n += 1;

  for (const [col, titulo] of ENCABEZADOS.entries()) rejilla.poner(n, col, titulo, ENCABEZADO);
  n += 1;

  // ── Los movimientos ────────────────────────────────────────────────────────
  let acumulado = 0;
  let sinConvertir = 0;

  for (const movimiento of movimientos) {
    const falta = faltaCambioPara(movimiento, estado.tipos_cambio);
    let euros = null;

    if (falta) {
      sinConvertir += 1;
    } else {
      euros = aEuros(movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas));
      if (movimiento.tipo === TIPO_GASTO) acumulado += euros;
    }

    // El detalle del usuario se conserva entero; el motivo se agrega al lado.
    const motivo = falta
      ? `falta el tipo de cambio de ${movimiento.moneda} para ${mesDe(movimiento.fecha)}`
      : '';

    rejilla.poner(n, 0, movimiento.tipo === TIPO_GASTO && !falta ? aDosDecimales(acumulado) : null, EUROS);
    rejilla.poner(n, 1, movimiento.comentario || null, CELDA);
    rejilla.poner(n, 2, Number(movimiento.fecha.slice(8, 10)), CENTRADA);
    rejilla.poner(n, 3, fechaDeExcel(`${mes}-01`), MES_CORTO);
    rejilla.poner(n, 4, [movimiento.detalle, motivo].filter(Boolean).join(' — ') || null, CELDA);
    // El rubro va con SU color, el mismo que tiene en la app (T-909, T-916).
    rejilla.poner(n, 5, formatearRubro(movimiento.rubro),
      RUBRO_CELDA_BASE + franjaDeRubro(movimiento.tipo, movimiento.rubro, estado?.rubros));
    rejilla.poner(n, 6, euros === null ? null : aDosDecimales(euros), EUROS);
    rejilla.poner(n, 7, movimiento.tipo, TIPO);
    n += 1;
  }

  const ultimaDeLaIzquierda = n;
  const ultimaDeLaDerecha = escribirResumen(rejilla, estado, mes, filaDelResumen);

  return {
    siguiente: Math.max(ultimaDeLaIzquierda, ultimaDeLaDerecha) + 1,
    sinConvertir,
    filaDelTitulo,
  };
}

/**
 * Todos los rubros de un tipo, con su total del mes — T-915.
 *
 * **Incluye los que no se usaron, en cero.** Es lo contrario de lo que hace la
 * app en pantalla, donde `porRubro()` devuelve solo los rubros con movimientos:
 * en un celular, ocho columnas en cero son ruido que tapa las tres que importan.
 *
 * En una planilla es al revés, y por eso el usuario lo pidió (2026-08-27): con
 * todos los rubros siempre presentes, cada uno cae **en el mismo lugar todos los
 * meses**, se pueden comparar meses de un vistazo y se pueden arrastrar
 * fórmulas. El mismo dato quiere formas distintas según dónde se lo mire.
 *
 * El orden es el de la lista de rubros, no el del tamaño: si fuera por tamaño,
 * cada mes tendría las columnas en otro lugar y se perdería justamente lo que
 * hace útil tenerlas todas.
 */
function todosLosRubros(estado, mes, tipo) {
  const conMovimientos = new Map(porRubro(estado, mes, tipo).map((r) => [r.rubro, r.total]));

  // El tercer elemento es el rubro sin formatear: lo necesita el color, que se
  // calcula con la clave y no con la etiqueta que se muestra.
  return rubrosDe(tipo, estado?.rubros).map((rubro) => [
    formatearRubro(rubro),
    aEuros(conMovimientos.get(rubro) ?? 0),
    rubro,
  ]);
}

/**
 * Los bloques de la derecha, con los rubros **a lo ancho** — T-916.
 *
 * Es la forma de la planilla original: una fila de encabezados con los ocho
 * rubros y una fila de valores debajo, con una columna `TOTAL` al final. Puestos
 * así, los doce meses del año quedan uno debajo del otro y se leen como una
 * tabla; puestos en filas, cada mes es una lista que hay que recorrer.
 *
 * Devuelve la última fila que ocupó.
 */
function escribirResumen(rejilla, estado, mes, desde) {
  let n = desde;

  const bloque = (titulo, columnas, tipo) => {
    // La banda rosa del título, cruzando el ancho del bloque.
    for (let i = 0; i <= columnas.length; i += 1) {
      rejilla.poner(n, COL_RESUMEN + i, i === 0 ? titulo : null, BANDA);
    }
    rejilla.combinar(n, COL_RESUMEN, n, COL_RESUMEN + columnas.length);
    n += 1;

    // Los encabezados, cada uno con el color de su rubro.
    for (const [i, [etiqueta]] of columnas.entries()) {
      const estilo = tipo === null
        ? ENCABEZADO
        : RUBRO_ENCABEZADO_BASE + franjaDeRubro(tipo, columnas[i][2] ?? etiqueta, estado?.rubros);
      rejilla.poner(n, COL_RESUMEN + i, etiqueta.toUpperCase(), estilo);
    }
    rejilla.poner(n, COL_RESUMEN + columnas.length, 'TOTAL', ENCABEZADO);
    n += 1;

    // Y la fila de valores, con su total al final.
    let total = 0;
    for (const [i, [, valor]] of columnas.entries()) {
      total += valor;
      rejilla.poner(n, COL_RESUMEN + i, aDosDecimales(valor), EUROS);
    }
    rejilla.poner(n, COL_RESUMEN + columnas.length, aDosDecimales(total), EUROS_TOTAL);
    n += 2;  // una fila de aire entre bloques
  };

  bloque('GASTOS POR TIPO', todosLosRubros(estado, mes, TIPO_GASTO), TIPO_GASTO);
  bloque('INGRESOS POR TIPO', todosLosRubros(estado, mes, TIPO_INGRESO), TIPO_INGRESO);

  const totales = totalesDelMes(estado, mes);
  // Los totales no llevan color de rubro: no son rubros. Y el saldo se llama
  // "SALDO MENSUAL", como en la planilla original.
  bloqueDeTotales(rejilla, n, totales);
  n += 4;  // tres filas del bloque más una de aire, como los demás

  // El gasto por día lleva TODOS los días del mes, también los de cero: es un
  // calendario, y a un calendario al que le faltan días no se lo puede leer.
  const dias = porDia(estado, mes);
  for (let i = 0; i <= dias.length; i += 1) {
    rejilla.poner(n, COL_RESUMEN + i, i === 0 ? 'GASTO POR DÍA' : null, BANDA);
  }
  rejilla.combinar(n, COL_RESUMEN, n, COL_RESUMEN + dias.length);
  n += 1;
  for (const [i, dia] of dias.entries()) {
    rejilla.poner(n, COL_RESUMEN + i, dia.dia, ENCABEZADO);
    rejilla.poner(n + 1, COL_RESUMEN + i, aDosDecimales(aEuros(dia.gasto)), EUROS);
  }
  n += 2;

  return n;
}

/** El bloque de totales: gastos, ingresos y saldo mensual. */
function bloqueDeTotales(rejilla, fila, totales) {
  for (let i = 0; i < 3; i += 1) {
    rejilla.poner(fila, COL_RESUMEN + i, i === 0 ? 'TOTALES' : null, BANDA);
  }
  rejilla.combinar(fila, COL_RESUMEN, fila, COL_RESUMEN + 2);

  for (const [i, etiqueta] of ['GASTOS', 'INGRESOS', 'SALDO MENSUAL'].entries()) {
    rejilla.poner(fila + 1, COL_RESUMEN + i, etiqueta, ENCABEZADO);
  }
  for (const [i, valor] of [totales.gastos, totales.ingresos, totales.saldo].entries()) {
    rejilla.poner(fila + 2, COL_RESUMEN + i, aDosDecimales(aEuros(valor)), EUROS_TOTAL);
  }
}

/**
 * La hoja entera: un bloque por mes, del más viejo al más nuevo, como la
 * planilla original.
 */
function hojaDeMovimientos(estado) {
  const meses = mesesConMovimientos(estado.movimientos ?? []).slice().sort();
  const rejilla = nuevaRejilla();
  let n = 1;
  let sinConvertir = 0;

  for (const mes of meses) {
    const bloque = escribirMes(rejilla, estado, mes, n);
    sinConvertir += bloque.sinConvertir;
    n = bloque.siguiente;
  }

  return {
    xml: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="${NS_HOJA}"><cols>
<col min="1" max="1" width="12"/><col min="2" max="2" width="18"/>
<col min="3" max="3" width="6"/><col min="4" max="4" width="16"/>
<col min="5" max="5" width="28"/><col min="6" max="6" width="16"/>
<col min="7" max="7" width="12"/><col min="8" max="8" width="5"/>
<col min="10" max="18" width="14"/>
</cols><sheetData>${rejilla.aXml()}</sheetData>${
  // Las celdas combinadas van DESPUÉS de sheetData: el esquema de una hoja fija
  // el orden de sus partes y Excel se niega a abrir el archivo si se altera.
  rejilla.combinadas().length > 0
    ? `<mergeCells count="${rejilla.combinadas().length}">${
        rejilla.combinadas().map((r) => `<mergeCell ref="${r}"/>`).join('')
      }</mergeCells>`
    : ''
}</worksheet>`,
    sinConvertir,
    meses: meses.length,
  };
}

/**
 * La hoja de análisis: la matriz mes × rubro — T-910. Es la hoja `Analisis1` de
 * la planilla original.
 *
 * **Cuenta exactamente lo mismo que la pantalla de evolución** (T-021): los
 * mismos meses, los mismos rubros siempre —los ocho de gasto y los cuatro de
 * ingreso—, el mismo criterio para el total y el promedio. No es una casualidad: las dos leen `matrizMesRubro()`. Dos
 * cálculos separados para la misma tabla terminan diciendo cosas distintas, y el
 * usuario no tendría forma de saber a cuál creerle.
 *
 * **La regla del promedio va escrita en la propia hoja**, debajo de la tabla.
 * Es toda la diferencia con `Analisis1`: ahí el total sumaba once meses y el
 * promedio promediaba diez, y no estaba dicho en ningún lado (L-006, ADR-031).
 * Una planilla que se abre dentro de un año tiene que poder explicarse sola.
 */
function hojaDeAnalisis(estado, mesActual = mesDe(hoy())) {
  const rejilla = nuevaRejilla();
  const matriz = matrizMesRubro(estado, mesActual);
  // Los rubros de gasto, los de ingreso, y gastos, ingresos y saldo.
  const ancho = matriz.rubros.length + matriz.rubrosIngreso.length + 3;
  const COL_GASTOS = 2 + matriz.rubros.length;
  const COL_ING_1 = COL_GASTOS + 1;
  const COL_INGRESOS = COL_ING_1 + matriz.rubrosIngreso.length;

  // La banda de título, como los bloques de la otra hoja.
  for (let i = 0; i <= ancho; i += 1) {
    rejilla.poner(1, 1 + i, i === 0 ? 'EVOLUCIÓN MES A MES' : null, BANDA);
  }
  rejilla.combinar(1, 1, 1, 1 + ancho);

  // Una fila de rótulos arriba de los encabezados, que dice de qué es cada
  // bloque. Hace falta porque `otros` está en los rubros de gasto y en los de
  // ingreso, y son cosas distintas (RN-02): dos columnas llamadas "OTROS" en la
  // misma hoja, sin nada que las separe, es un número leído en la columna
  // equivocada. La pantalla lleva la misma banda, por el mismo motivo.
  rejilla.poner(2, 2, 'RUBROS DE GASTO', ENCABEZADO);
  rejilla.combinar(2, 2, 2, 1 + matriz.rubros.length);
  rejilla.poner(2, COL_ING_1, 'RUBROS DE INGRESO', ENCABEZADO);
  rejilla.combinar(2, COL_ING_1, 2, COL_INGRESOS - 1);

  // Los encabezados: el mes, los rubros con su color, y las tres cuentas.
  rejilla.poner(3, 1, 'MES', ENCABEZADO);
  for (const [i, rubro] of matriz.rubros.entries()) {
    rejilla.poner(3, 2 + i, formatearRubro(rubro).toUpperCase(),
      RUBRO_ENCABEZADO_BASE + franjaDeRubro(TIPO_GASTO, rubro, estado?.rubros));
  }
  for (const [i, rubro] of matriz.rubrosIngreso.entries()) {
    rejilla.poner(3, COL_ING_1 + i, formatearRubro(rubro).toUpperCase(),
      RUBRO_ENCABEZADO_BASE + franjaDeRubro(TIPO_INGRESO, rubro, estado?.rubros));
  }
  rejilla.poner(3, COL_GASTOS, 'GASTOS', ENCABEZADO);
  rejilla.poner(3, COL_INGRESOS, 'INGRESOS', ENCABEZADO);
  rejilla.poner(3, COL_INGRESOS + 1, 'SALDO', ENCABEZADO);

  // Una fila por mes, del más viejo al más nuevo — como `Analisis1`. En la
  // pantalla van al revés porque ahí lo primero que se mira es el mes pasado;
  // en una planilla se lee de arriba abajo como una línea de tiempo.
  let n = 4;
  const filaDeValores = (etiqueta, valores, estilo) => {
    rejilla.poner(n, 1, etiqueta, MES_CORTO);
    for (const [i, valor] of valores.rubros.entries()) {
      rejilla.poner(n, 2 + i, aDosDecimales(aEuros(valor)), estilo);
    }
    for (const [i, valor] of valores.rubrosIngreso.entries()) {
      rejilla.poner(n, COL_ING_1 + i, aDosDecimales(aEuros(valor)), estilo);
    }
    rejilla.poner(n, COL_GASTOS, aDosDecimales(aEuros(valores.gastos)), EUROS_TOTAL);
    rejilla.poner(n, COL_INGRESOS, aDosDecimales(aEuros(valores.ingresos)), EUROS_TOTAL);
    rejilla.poner(n, COL_INGRESOS + 1, aDosDecimales(aEuros(valores.saldo)), EUROS_TOTAL);
    n += 1;
  };

  for (const fila of matriz.filas) {
    filaDeValores(formatearMesCorto(fila.mes), fila, EUROS);
  }

  if (matriz.total !== null) {
    filaDeValores('TOTAL', matriz.total, EUROS_TOTAL);
    filaDeValores('PROMEDIO', matriz.promedio, EUROS_TOTAL);

    const meses = matriz.mesesDelPromedio === 1 ? '1 mes' : `${matriz.mesesDelPromedio} meses`;
    rejilla.poner(n + 1, 1, matriz.dejaAfuera === null
      ? `El promedio es sobre ${meses}.`
      : `El promedio es sobre los ${meses} terminados: deja afuera ${formatearMesCorto(matriz.dejaAfuera)}, que todavía va por la mitad. El total sí lo incluye.`);
  }

  return {
    xml: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="${NS_HOJA}"><cols>
<col min="1" max="1" width="12"/><col min="2" max="${1 + ancho}" width="14"/>
</cols><sheetData>${rejilla.aXml()}</sheetData>${
  rejilla.combinadas().length > 0
    ? `<mergeCells count="${rejilla.combinadas().length}">${
        rejilla.combinadas().map((r) => `<mergeCell ref="${r}"/>`).join('')
      }</mergeCells>`
    : ''
}</worksheet>`,
    filas: matriz.filas.length,
  };
}

/**
 * Los estilos de la planilla.
 *
 * Excel necesita este archivo aunque no se use ninguno: sin él, no abre. Y su
 * orden interno es rígido —`numFmts`, `fonts`, `fills`, `borders`,
 * `cellStyleXfs`, `cellXfs`— y no perdona.
 *
 * Se genera en vez de escribirse a mano porque hay un relleno por rubro: doce
 * colores escritos uno por uno serían doce oportunidades de equivocarse en un
 * índice, y un índice equivocado no da error, **pinta la celda de otro color**.
 */
function estilos() {
  // Los rellenos: los dos que Excel exige primero, después los de las bandas, y
  // al final los ocho de los rubros. El orden fija los números de más abajo.
  const rellenos = [
    '<fill><patternFill patternType="none"/></fill>',
    '<fill><patternFill patternType="gray125"/></fill>',
    relleno('FFFF00'),   // 2 · la banda del mes, amarilla como la original
    relleno('F2D9E6'),   // 3 · las bandas de título de bloque, rosas
    relleno('E8E8E8'),   // 4 · los encabezados de columna
    ...FONDOS_RUBRO.map((color) => relleno(color.slice(1).toUpperCase())),  // 5..12
  ];

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="${NS_HOJA}">
<numFmts count="2">
<numFmt numFmtId="164" formatCode="#,##0.00\\ &quot;€&quot;"/>
<numFmt numFmtId="165" formatCode="mm/yy"/>
</numFmts>
<fonts count="5">
<font><sz val="11"/><name val="Calibri"/></font>
<font><b/><sz val="14"/><name val="Calibri"/></font>
<font><b/><sz val="11"/><name val="Calibri"/></font>
<font><sz val="11"/><color rgb="FFC00000"/><name val="Calibri"/></font>
<font><b/><sz val="11"/><color rgb="FF444444"/><name val="Calibri"/></font>
</fonts>
<fills count="${rellenos.length}">${rellenos.join('')}</fills>
<borders count="2">
<border><left/><right/><top/><bottom/><diagonal/></border>
<border>
<left style="thin"><color rgb="FF808080"/></left><right style="thin"><color rgb="FF808080"/></right>
<top style="thin"><color rgb="FF808080"/></top><bottom style="thin"><color rgb="FF808080"/></bottom>
<diagonal/></border>
</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${FORMATOS.length}">${FORMATOS.join('')}</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
}

const relleno = (rgb) => `<fill><patternFill patternType="solid"><fgColor rgb="FF${rgb}"/><bgColor indexed="64"/></patternFill></fill>`;

/**
 * Un formato de celda. Los nombres dicen para qué es cada uno, porque en el XML
 * son números y un número equivocado no da error: cambia cómo se ve el dato.
 */
const formato = ({ numero = 0, fuente = 0, relleno: fill = 0, borde = 0, centrado = false } = {}) =>
  `<xf numFmtId="${numero}" fontId="${fuente}" fillId="${fill}" borderId="${borde}" xfId="0"` +
  ` applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"` +
  `${centrado ? ' applyAlignment="1"><alignment horizontal="center"/></xf>' : '/>'}`;

// El orden de esta lista fija los números que usa la hoja. Agregar uno al final
// es seguro; meterlo en el medio corre todos los de abajo.
const FORMATOS = [
  formato(),                                                        // 0 NORMAL
  formato({ fuente: 1, relleno: 2, centrado: true, borde: 1 }),      // 1 TITULO (banda del mes)
  formato({ fuente: 2, relleno: 4, borde: 1, centrado: true }),      // 2 ENCABEZADO
  formato({ numero: 164, borde: 1 }),                                // 3 EUROS
  formato({ numero: 165, borde: 1, centrado: true }),                // 4 MES_CORTO
  formato({ fuente: 2, relleno: 3, borde: 1, centrado: true }),      // 5 BANDA (título de bloque)
  formato({ fuente: 3, borde: 1, centrado: true }),                  // 6 TIPO (la I/G, en rojo)
  formato({ borde: 1 }),                                             // 7 CELDA (texto con borde)
  formato({ borde: 1, centrado: true }),                             // 8 CENTRADA
  formato({ numero: 164, fuente: 2, relleno: 4, borde: 1 }),         // 9 EUROS_TOTAL
  // 10..17 · un encabezado por rubro, con su color. Tienen que quedar al final:
  // la hoja los busca sumando la franja del rubro a RUBRO_BASE.
  ...FONDOS_RUBRO.map((_, i) => formato({ fuente: 2, relleno: 5 + i, borde: 1, centrado: true })),
  // 18..25 · la celda del rubro en la lista de movimientos, con el mismo color.
  ...FONDOS_RUBRO.map((_, i) => formato({ relleno: 5 + i, borde: 1, centrado: true })),
];

/**
 * La planilla entera, lista para guardar. Devuelve `{ nombre, bytes, tipo,
 * sinConvertir, meses }`.
 */
function crearPlanilla(estado, { fecha = hoy() } = {}) {
  const hoja = hojaDeMovimientos(estado);
  const analisis = hojaDeAnalisis(estado);

  const partes = [
    {
      nombre: '[Content_Types].xml',
      contenido: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`,
    },
    {
      nombre: '_rels/.rels',

<Relationships xmlns="${NS_PAQUETE}">

</Relationships>`,
    },
    {
      nombre: 'xl/workbook.xml',
      contenido: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="${NS_HOJA}" xmlns:r="${NS_RELACIONES}">
<sheets><sheet name="Ingresos y gastos" sheetId="1" r:id="rId1"/><sheet name="Evolución" sheetId="2" r:id="rId3"/></sheets>
</workbook>`,
    },
    {
      nombre: 'xl/_rels/workbook.xml.rels',
      contenido: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="${NS_PAQUETE}">
<Relationship Id="rId1" Type="${NS_RELACIONES}/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="${NS_RELACIONES}/styles" Target="styles.xml"/>

</Relationships>`,
    },
    { nombre: 'xl/styles.xml', contenido: estilos() },

  return {

    bytes: crearZip(partes),

    cuantos: (estado.movimientos ?? []).length,
