// ── src/datos/csv.js ────────────────────────────────────────────
// Exportar a CSV — T-018, CU-07.
//
// El `.xlsx` (T-906) es para mirar: tiene la forma de la planilla de siempre,
// con sus colores y sus bloques. El CSV es para **procesar**: una fila por
// movimiento, todas las columnas, sin adornos. Son dos cosas distintas y por eso
// existen las dos.
//
// ── Las tres decisiones que hacen que un CSV se abra bien o mal ──────────────
//
// Un CSV mal exportado no falla: se abre y muestra cosas equivocadas. Es la
// forma de fallar más cara que hay, y depende de tres detalles que nadie mira.
//
//   1. **El separador es `;`, no `,`.** En español la coma es el separador
//      decimal: `12,50` con separador coma se parte en dos columnas, `12` y
//      `50`. Excel en español espera `;` y es lo que produce cuando exporta.
//   2. **El archivo lleva BOM.** Sin esos tres bytes al principio, Excel abre el
//      archivo como si fuera de los años 90 y `Ñandú` se convierte en `Ã‘andÃº`.
//      Todos los demás programas lo ignoran sin quejarse.
//   3. **Los decimales van con coma**, `12,50`, porque el separador ya es `;` y
//      porque es lo que el usuario ve en la app y en su planilla.
//
// ── Qué lleva, y por qué más que el `.xlsx` ─────────────────────────────────
//
// La planilla lleva **solo euros**, porque el usuario la mira y sumar una
// columna con monedas mezcladas daría un número sin sentido. El CSV lleva las
// dos cosas —el monto original con su moneda, el cambio que se aplicó y el
// importe en euros—, porque es el formato para hacer cuentas en otro lado, y ahí
// perder el dato original sí duele. Un CSV que redondea es un CSV que miente.





const TIPO_CSV = 'text/csv;charset=utf-8';

/**
 * Los tres bytes que le dicen a Excel que el archivo está en UTF-8.
 *
 * Sin ellos, Excel en Windows lo abre con la codificación del sistema y los
 * acentos se rompen. No es un detalle estético: `Coruña` y `CoruÃ±a` son dos
 * comentarios distintos, así que un archivo sin BOM **parte los grupos en dos**
 * apenas se lo vuelve a leer.
 */
const MARCA_UTF8 = '﻿';

/** El separador. Ver arriba: con `,` los importes se parten en dos columnas. */
const SEPARADOR = ';';

const COLUMNAS = Object.freeze([
  'fecha', 'dia', 'mes', 'tipo', 'rubro', 'comentario', 'detalle',
  'moneda', 'monto', 'unidades_por_euro', 'euros',
]);

/** El nombre del archivo: la fecha adelante, para que ordenen solos. */
function nombreDelCsv(fecha = hoy()) {
  return `viajecor-${fecha}.csv`;
}

/**
 * Un valor, listo para meter en el archivo.
 *
 * Se entrecomilla lo que lo necesita —lo que lleva el separador, comillas o un
 * salto de línea— y las comillas de adentro se duplican, que es como manda el
 * formato. Sin esto, un comentario con un `;` corre todas las columnas de esa
 * fila una posición, y el archivo se abre igual: mal, y sin avisar.
 */
function comoCampo(valor) {
  const texto = String(valor ?? '');
  if (!/[";\n\r]/.test(texto)) return texto;
  return `"${texto.replace(/"/g, '""')}"`;
}

/** Un importe en unidades mínimas, con coma decimal y sin separador de miles. */
function comoImporte(minimas, decimales) {
  const signo = minimas < 0 ? '-' : '';
  const enteras = Math.abs(minimas);

  if (decimales === 0) return `${signo}${enteras}`;

  const divisor = 10 ** decimales;
  const parteEntera = Math.floor(enteras / divisor);
  const resto = String(enteras % divisor).padStart(decimales, '0');

  // Coma, no punto: es el separador decimal del castellano, y el separador de
  // columnas ya es `;` justamente para poder usarla.
  return `${signo}${parteEntera},${resto}`;
}

/**
 * Una fila por movimiento, con todo lo que hace falta para rehacer la cuenta.
 *
 * `unidades_por_euro` es el tipo de cambio que se aplicó, no el que hay hoy: un
 * gasto de marzo se convirtió con el cambio de marzo, y sin ese dato el importe
 * en euros es un número que no se puede volver a comprobar.
 */
function filasDelCsv(estado) {
  const meses = mesesConMovimientos(estado.movimientos ?? []).slice().sort();
  const filas = [];

  for (const mes of meses) {
    const movimientos = movimientosDelMes(estado.movimientos, mes)
      .slice()
      .sort((a, b) => a.fecha.localeCompare(b.fecha) || String(a.creado).localeCompare(String(b.creado)));

    for (const movimiento of movimientos) {
      const decimales = decimalesDe(estado.monedas, movimiento.moneda);
      const falta = faltaCambioPara(movimiento, estado.tipos_cambio);
      const cambio = falta ? null : buscarCambio(estado.tipos_cambio, movimiento.moneda, mesDe(movimiento.fecha));

      filas.push({
        fecha: movimiento.fecha,
        dia: String(Number(movimiento.fecha.slice(8, 10))),
        mes: `${movimiento.fecha.slice(5, 7)}/${movimiento.fecha.slice(2, 4)}`,
        tipo: movimiento.tipo,
        rubro: formatearRubro(movimiento.rubro),
        comentario: movimiento.comentario ?? '',
        detalle: movimiento.detalle ?? '',
        moneda: movimiento.moneda,
        monto: comoImporte(movimiento.monto, decimales),
        // El euro no tiene "unidades por euro" que decir: es 1 y decirlo sería
        // ruido en el 90 % de las filas.
        unidades_por_euro: cambio === null || movimiento.moneda === 'EUR'
          ? ''
          : comoImporte(Math.round(aUnidadesPorEuro(cambio) * 100), 2),
        euros: falta
          ? ''
          : comoImporte(movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas), 2),
      });
    }
  }

  return filas;
}

/**
 * El archivo entero, como texto.
 *
 * Los saltos de línea son `\r\n` y no `\n`: es lo que dice el formato y lo que
 * Excel en Windows espera. Con solo `\n` hay versiones que meten todo en una
 * sola fila.
 */
function contenidoDelCsv(estado) {
  const filas = filasDelCsv(estado);
  const lineas = [
    COLUMNAS.join(SEPARADOR),
    ...filas.map((fila) => COLUMNAS.map((columna) => comoCampo(fila[columna])).join(SEPARADOR)),
  ];

  return MARCA_UTF8 + lineas.join('\r\n') + '\r\n';
}

/** El CSV listo para guardar: `{ nombre, contenido, tipo, cuantos, sinConvertir }`. */
function prepararCsv(estado, { fecha = hoy() } = {}) {
  const filas = filasDelCsv(estado);

  return {
    nombre: nombreDelCsv(fecha),
    contenido: contenidoDelCsv(estado),
    tipo: TIPO_CSV,
    cuantos: filas.length,
    sinConvertir: filas.filter((f) => f.euros === '').length,
  };
}

// ── src/datos/xml.js ────────────────────────────────────────────
// Un lector de XML mínimo — T-031.
//
// ── Por qué no se usa el del navegador ───────────────────────────────────────
//
// ADR-010 decía que el `.xlsx` se iba a parsear con `DOMParser`, que trae el
// navegador. Al ir a escribirlo aparecieron dos problemas con esa decisión:
//
//   1. **`DOMParser` es del navegador.** `datos/` no puede tocarlo (ver
//      ARQUITECTURA y la regla 2 de CLAUDE.md). No es formalismo: significa que
//      el importador **no se podría probar con `node --test`**, y el importador
//      es lo que va a tocar once meses de datos que no están en ningún otro
//      lado. Un módulo que solo se puede probar abriendo un navegador se prueba
//      menos.
//   2. Un `.xlsx` de Excel trae megabytes de XML con cosas que no interesan.
//      Construir un árbol entero para leer las celdas de una hoja es trabajo y
//      memoria por nada, en un teléfono.
//
// Así que se lee a mano. **No es un parser de XML de propósito general** y no
// pretende serlo: entiende exactamente lo que un `.xlsx` usa —etiquetas,
// atributos, texto y las cinco entidades del formato— y nada más. No hay
// espacios de nombres, ni DTD, ni CDATA, ni entidades definidas por el
// documento, porque un `.xlsx` no los tiene.
//
// Ver ADR-028.

/** Las cinco entidades que XML define, y las numéricas. */
function desescapar(texto) {
  if (!texto.includes('&')) return texto;

  return texto.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g, (entera, cuerpo) => {
    if (cuerpo === 'amp') return '&';
    if (cuerpo === 'lt') return '<';
    if (cuerpo === 'gt') return '>';
    if (cuerpo === 'quot') return '"';
    if (cuerpo === 'apos') return "'";
    if (cuerpo.startsWith('#x') || cuerpo.startsWith('#X')) {
      return String.fromCodePoint(parseInt(cuerpo.slice(2), 16));
    }
    if (cuerpo.startsWith('#')) return String.fromCodePoint(parseInt(cuerpo.slice(1), 10));
    return entera;
  });
}

/**
 * Recorre el XML y avisa de cada etiqueta y de cada texto.
 *
 * Es un recorrido y no un árbol: una hoja de Excel con 30 000 celdas no tiene
 * por qué entrar entera en memoria para leer sus filas. Quien llama arma lo que
 * necesita a medida que pasa.
 *
 * `alAbrir(nombre, atributos, vacia)`, `alCerrar(nombre)` y `alTexto(texto)`.
 */
function recorrerXml(xml, { alAbrir, alCerrar, alTexto } = {}) {
  let i = 0;
  const largo = xml.length;

  while (i < largo) {
    const abre = xml.indexOf('<', i);

    if (abre === -1) {
      if (alTexto && i < largo) alTexto(desescapar(xml.slice(i)));
      return;
    }

    if (abre > i && alTexto) alTexto(desescapar(xml.slice(i, abre)));

    // Comentarios, declaraciones y CDATA: se saltean enteros. No aparecen en las
    // hojas, pero un archivo de otro programa puede traerlos y no son un error.
    if (xml.startsWith('<!--', abre)) { i = saltar(xml, abre, '-->'); continue; }
    if (xml.startsWith('<![CDATA[', abre)) {
      const fin = xml.indexOf(']]>', abre);
      if (alTexto) alTexto(xml.slice(abre + 9, fin === -1 ? largo : fin));
      i = fin === -1 ? largo : fin + 3;
      continue;
    }
    if (xml.startsWith('<?', abre)) { i = saltar(xml, abre, '?>'); continue; }
    if (xml.startsWith('<!', abre)) { i = saltar(xml, abre, '>'); continue; }

    const cierra = buscarFinDeEtiqueta(xml, abre);
    if (cierra === -1) return;  // etiqueta sin cerrar: se termina, no se adivina

    const cuerpo = xml.slice(abre + 1, cierra);
    i = cierra + 1;

    if (cuerpo.startsWith('/')) {
      if (alCerrar) alCerrar(cuerpo.slice(1).trim());
      continue;
    }

    const vacia = cuerpo.endsWith('/');
    const sinBarra = vacia ? cuerpo.slice(0, -1) : cuerpo;
    const espacio = sinBarra.search(/[\s]/);
    const nombre = espacio === -1 ? sinBarra : sinBarra.slice(0, espacio);

    if (alAbrir) {
      alAbrir(nombre, espacio === -1 ? {} : leerAtributos(sinBarra.slice(espacio)), vacia);
    }
    if (vacia && alCerrar) alCerrar(nombre);
  }
}

function saltar(xml, desde, hasta) {
  const fin = xml.indexOf(hasta, desde);
  return fin === -1 ? xml.length : fin + hasta.length;
}

/**
 * Busca el `>` que cierra la etiqueta, **sin contar los que están dentro de un
 * valor entre comillas**.
 *
 * Un atributo puede contener `>`: `<c r="A1" t="x>y">`. Buscar el primer `>` a
 * secas parte la etiqueta al medio y todo lo que sigue se lee corrido.
 */
function buscarFinDeEtiqueta(xml, desde) {
  let comilla = '';
  for (let i = desde + 1; i < xml.length; i += 1) {
    const c = xml[i];
    if (comilla) {
      if (c === comilla) comilla = '';
    } else if (c === '"' || c === "'") {
      comilla = c;
    } else if (c === '>') {
      return i;
    }
  }
  return -1;
}

function leerAtributos(texto) {
  const atributos = {};
  const patron = /([\w:.-]+)\s*=\s*("([^"]*)"|'([^']*)')/g;
  let coincidencia;

  while ((coincidencia = patron.exec(texto)) !== null) {
    atributos[coincidencia[1]] = desescapar(coincidencia[3] ?? coincidencia[4] ?? '');
  }
  return atributos;
}

// ── src/datos/planilla.js ───────────────────────────────────────
// Leer una planilla `.xlsx` — T-031, CU-13.
//
// Devuelve las celdas de la primera hoja, con su fila, su columna y su valor ya
// interpretado. No sabe nada de gastos: eso lo decide el mapeo (T-032 y
// `docs/MAPEO-EXCEL.md`). Acá termina el formato y empieza el significado.
//
// ── Las tres cosas que un .xlsx esconde ─────────────────────────────────────
//
//   1. **El texto no está en la hoja.** Excel guarda cada texto una sola vez en
//      `xl/sharedStrings.xml` y en la celda pone un número que es su posición en
//      esa lista. Una celda con `t="s"` y `<v>4</v>` no dice «4»: dice «el
//      cuarto texto». Sin resolver eso, todos los rubros de la planilla se leen
//      como números.
//   2. **Las fechas son números.** `46082` es el 1 de marzo de 2026. Lo único
//      que lo distingue de un importe de 46 082 € es **el formato de la celda**,
//      que vive en `xl/styles.xml`, en otra parte del archivo.
//   3. **Las celdas vacías no existen.** Si la fila 7 no tiene nada en la
//      columna B, no hay ninguna celda B7: hay un hueco. Recorrer las celdas que
//      hay y asumir que están todas corre las columnas.



/** Los formatos de fecha que Excel trae de fábrica. */
const FORMATOS_DE_FECHA = new Set([14, 15, 16, 17, 18, 19, 20, 21, 22, 27, 30, 36, 45, 46, 47, 50, 57]);

/**
 * Abre una planilla y devuelve sus celdas.
 *
 * **Nunca tira**: devuelve `{ filas }` o `{ error }` con un motivo en castellano.
 * Quien la llama es alguien que eligió un archivo en su teléfono y pudo haber
 * elegido cualquier cosa.
 *
 * `filas` es un `Map` de número de fila a `Map` de letra de columna a
 * `{ valor, esFecha }`.
 */
async function leerPlanilla(bytes, { hoja: buscada } = {}) {
  const zip = await leerZip(bytes);
  if (zip.error) return { error: zip.error };

  const hoja = buscarHoja(zip.entradas, buscada);
  if (!hoja) {
    if (buscada !== undefined && buscada !== null) {
      const nombres = hojasDelLibro(zip.entradas).map((h) => h.nombre);
      return {
        error: `Este archivo no tiene ninguna hoja llamada "${buscada}". ` +
          (nombres.length > 0
            ? `Las que tiene son: ${nombres.join(', ')}.`
            : 'No se pudo leer la lista de hojas.'),
      };
    }
    return {
      error: 'Este archivo no tiene ninguna hoja de cálculo adentro. ' +
        '¿Puede ser que sea un documento de Word, o un .xlsx dañado?',
    };
  }

  const textos = leerTextosCompartidos(zip.entradas.get('xl/sharedStrings.xml'));
  const formatos = leerFormatos(zip.entradas.get('xl/styles.xml'));

  return { filas: leerCeldas(hoja, textos, formatos) };
}

/**
 * Las hojas del libro, con su nombre y dónde está cada una.
 *
 * **Ahora sí siguiendo las relaciones del libro**, que es lo correcto. La
 * versión anterior agarraba `sheet1.xml` por su nombre de archivo y lo decía:
 * "si algún día hace falta la segunda hoja, hay que hacerlo bien". Hizo falta
 * —los ahorros conjuntos son la TERCERA hoja (T-042)— y el atajo no alcanzaba:
 * el orden de los archivos `sheetN.xml` no tiene por qué ser el de las pestañas,
 * y el nombre visible ("Ahorros conjuntos") solo está en `workbook.xml`.
 *
 * Son dos archivos y hay que cruzarlos: `workbook.xml` dice nombre → `r:id`, y
 * `workbook.xml.rels` dice `r:id` → archivo.
 */
function hojasDelLibro(entradas) {
  const libro = entradas.get('xl/workbook.xml');
  const relaciones = entradas.get('xl/_rels/workbook.xml.rels');
  if (!libro) return [];

  const porId = new Map();
  if (relaciones) {
    recorrerXml(relaciones, {
      alAbrir(nombre, atributos) {
        if (nombre !== 'Relationship') return;
        const destino = String(atributos.Target ?? '');
        if (destino === '') return;
        // El destino puede venir relativo (`worksheets/sheet1.xml`) o absoluto
        // (`/xl/worksheets/sheet1.xml`): las dos formas son válidas y las
        // escriben programas distintos.
        const ruta = destino.startsWith('/')
          ? destino.slice(1)
          : `xl/${destino.replace(/^\.?\//, '')}`;
        porId.set(atributos.Id, ruta);
      },
    });
  }

  const hojas = [];
  recorrerXml(libro, {
    alAbrir(nombre, atributos) {
      if (nombre !== 'sheet') return;
      const ruta = porId.get(atributos['r:id'] ?? atributos.id);
      if (ruta) hojas.push({ nombre: String(atributos.name ?? ''), ruta });
    },
  });
  return hojas;
}

/**
 * La hoja pedida por nombre, o la primera si no se pide ninguna.
 *
 * El nombre se compara **normalizado** (RN-03): la pestaña puede llamarse
 * "Ahorros conjuntos", "AHORROS CONJUNTOS" o traer un espacio de más, y las
 * tres son la misma pestaña para quien la mira.
 */
function buscarHoja(entradas, buscada) {
  const hojas = hojasDelLibro(entradas);

  if (buscada !== undefined && buscada !== null) {
    const clave = normalizarClave(String(buscada));
    const encontrada = hojas.find((h) => normalizarClave(h.nombre) === clave);
    return encontrada ? entradas.get(encontrada.ruta) ?? null : null;
  }

  if (hojas.length > 0 && entradas.has(hojas[0].ruta)) return entradas.get(hojas[0].ruta);

  // Sin `workbook.xml` legible, el atajo de siempre: es mejor leer algo que
  // negarse a abrir un archivo que quizá está bien.
  if (entradas.has('xl/worksheets/sheet1.xml')) return entradas.get('xl/worksheets/sheet1.xml');
  const alguna = [...entradas.keys()].filter((n) => n.startsWith('xl/worksheets/') && n.endsWith('.xml')).sort();
  return alguna.length > 0 ? entradas.get(alguna[0]) : null;
}

/** La lista de textos compartidos, en orden. Ver el punto 1 de arriba. */
function leerTextosCompartidos(xml) {
  const textos = [];
  if (!xml) return textos;

  let dentroDeUno = false;
  let juntando = '';

  recorrerXml(xml, {
    alAbrir(nombre) {
      if (nombre === 'si') { dentroDeUno = true; juntando = ''; }
    },
    alTexto(texto) {
      // Se acumula: un mismo texto puede venir partido en varios `<t>` cuando
      // tiene partes con formatos distintos —una palabra en negrita—, y quedarse
      // con el último trozo perdería el resto de la palabra.
      if (dentroDeUno) juntando += texto;
    },
    alCerrar(nombre) {
      if (nombre === 'si') { textos.push(juntando); dentroDeUno = false; }
    },
  });

  return textos;
}

/**
 * Qué estilos son de fecha. Devuelve un `Set` de números de estilo.
 *
 * Hay que cruzar dos cosas: los formatos propios del archivo (`numFmts`, que
 * dicen su código, como `dd/mm/yyyy`) y la lista de estilos (`cellXfs`, que dice
 * qué formato usa cada uno). Una celda dice `s="4"`, el estilo 4 dice
 * `numFmtId="165"`, y el formato 165 dice `mm/yy`.
 */
function leerFormatos(xml) {
  const deFecha = new Set();
  if (!xml) return deFecha;

  const propios = new Map();
  let enEstilos = false;
  let estilo = 0;

  recorrerXml(xml, {
    alAbrir(nombre, at) {
      if (nombre === 'numFmt') {
        // Un formato es de fecha si su código nombra días, meses o años. Se
        // sacan primero las comillas: un formato de moneda puede llevar el texto
        // "MXN" adentro, y esa "m" no es un mes.
        const codigo = String(at.formatCode ?? '').replace(/"[^"]*"/g, '').replace(/\[[^\]]*\]/g, '');
        propios.set(Number(at.numFmtId), /[ymd]/i.test(codigo));
        return;
      }
      if (nombre === 'cellXfs') { enEstilos = true; estilo = 0; return; }
      if (nombre === 'xf' && enEstilos) {
        const formato = Number(at.numFmtId ?? 0);
        if (FORMATOS_DE_FECHA.has(formato) || propios.get(formato) === true) deFecha.add(estilo);
        estilo += 1;
      }
    },
    alCerrar(nombre) {
      if (nombre === 'cellXfs') enEstilos = false;
    },
  });

  return deFecha;
}

/** La letra de columna de una referencia: `AN17` → `AN`. */
function columnaDe(referencia) {
  const letras = /^([A-Z]+)/.exec(referencia);
  return letras ? letras[1] : '';
}

/** El número de fila de una referencia: `AN17` → `17`. */
function filaDe(referencia) {
  const numero = /(\d+)$/.exec(referencia);
  return numero ? Number(numero[1]) : 0;
}

/** Recorre las celdas de la hoja y las agrupa por fila. */
function leerCeldas(xml, textos, estilosDeFecha) {
  const filas = new Map();

  let referencia = '';
  let tipo = '';
  let estilo = 0;
  let juntando = '';
  let dentroDeValor = false;

  recorrerXml(xml, {
    alAbrir(nombre, at) {
      if (nombre === 'c') {
        referencia = at.r ?? '';
        tipo = at.t ?? 'n';
        estilo = Number(at.s ?? 0);
        juntando = '';
        // Una celda vacía con formato (`<c r="B2" s="1"/>`) no aporta nada:
        // existe para llevar un borde o un color. No hace falta descartarla acá
        // —al cerrar ya se descarta lo que no tiene valor— y tener las dos cosas
        // haría creer que una de ellas hace algo. Se deja la de abajo, que
        // cubre también la celda que abre y cierra sin nada adentro.
        return;
      }
      if (nombre === 'v' || nombre === 't') { dentroDeValor = true; juntando = juntando || ''; }
    },
    alTexto(texto) {
      if (dentroDeValor) juntando += texto;
    },
    alCerrar(nombre) {
      if (nombre === 'v' || nombre === 't') { dentroDeValor = false; return; }
      if (nombre !== 'c' || referencia === '' || juntando === '') return;

      const celda = interpretar(juntando, tipo, estilo, textos, estilosDeFecha);
      if (celda === null) return;

      const fila = filaDe(referencia);
      if (!filas.has(fila)) filas.set(fila, new Map());
      filas.get(fila).set(columnaDe(referencia), celda);
    },
  });

  return filas;
}

/**
 * Qué es lo que hay adentro de una celda.
 *
 * `t="s"` es un índice a la lista de textos compartidos; `t="inlineStr"` y
 * `t="str"` son texto tal cual; `t="b"` es un booleano escrito como 0 o 1; sin
 * `t`, es un número — y si su estilo es de fecha, es una fecha.
 */
function interpretar(crudo, tipo, estilo, textos, estilosDeFecha) {
  if (tipo === 's') {
    const cual = Number(crudo);
    return { valor: textos[cual] ?? '', esFecha: false };
  }
  if (tipo === 'inlineStr' || tipo === 'str') return { valor: crudo, esFecha: false };
  if (tipo === 'b') return { valor: crudo === '1', esFecha: false };
  // `t="e"` es un error de fórmula (#¡DIV/0!). No es un dato: se descarta acá y
  // la celda queda como si estuviera vacía, que es lo que efectivamente es.
  if (tipo === 'e') return null;

  const numero = Number(crudo);
  if (!Number.isFinite(numero)) return { valor: crudo, esFecha: false };
  return { valor: numero, esFecha: estilosDeFecha.has(estilo) };
}

/**
 * Un número de serie de Excel como fecha `AAAA-MM-DD`.
 *
 * Excel cuenta días desde el 1900-01-01 y **cree que 1900 fue bisiesto**, cosa
 * que no fue: el error está en el formato desde 1985, por compatibilidad con
 * Lotus 1-2-3, y no se puede arreglar sin romper todas las planillas del mundo.
 * El desplazamiento de 25569 días desde la época de Unix ya lo tiene en cuenta.
 *
 * Devuelve `null` si el número no cae en un rango de fechas creíble, en vez de
 * inventar una: un importe leído como fecha daría el año 3 000 y entraría igual.
 */
function fechaDeSerie(serie) {
  if (!Number.isFinite(serie) || serie < 1 || serie > 2958465) return null;

  const dias = Math.floor(serie);
  const fecha = new Date((dias - 25569) * 86400000);
  if (Number.isNaN(fecha.getTime())) return null;

  const anio = fecha.getUTCFullYear();
  const mes = String(fecha.getUTCMonth() + 1).padStart(2, '0');
  const dia = String(fecha.getUTCDate()).padStart(2, '0');
  return `${anio}-${mes}-${dia}`;
}

// ── src/datos/importar-ahorros.js ───────────────────────────────
// Importar la hoja `Ahorros conjuntos` de la planilla del usuario — T-042, CU-14.
//
// ── Cómo es la hoja, mirada de verdad ────────────────────────────────────────
//
// El usuario la pasó el 2026-08-31 y se abrió con `openpyxl` antes de escribir
// una línea de esto. Encabezados en la **fila 3**, datos desde la **4**:
//
//   A Comentarios · B DÍA · C DETALLES · D MONEDA · E MONTO · F ALE/IRE · G I/G
//
// A la derecha, en I..K, tres cuadros de totales que la app **no lee**: son
// resultados, no datos, y se recalculan solos. Sí se usan para comprobar, igual
// que el acumulado de la hoja de gastos.
//
// ── Lo que la hoja hace mal, y por qué conviene saberlo ──────────────────────
//
// Sus tres cuadros suman **tres rangos distintos** de la misma tabla:
// `$E4:$E89` el total por moneda, `$E4:$E93` el de ALE, `$E4:$E97` el de IRE.
// Hoy hay once filas y no muerde; pasadas las 89, el total general va a dejar de
// contar filas que los de cada persona sí cuentan y **los cuadros van a dejar de
// cerrar entre sí sin decir nada**. Es L-001 otra vez, en la hoja que estamos
// reemplazando, y es la razón por la que este importador no tiene ningún límite
// de filas escrito a mano.
//
// ── La regla de siempre: nada entra ni se pierde en silencio ─────────────────
//
// Cada fila que no entra sale en el informe con **su número de fila**, lo que
// decía y por qué. Se importa una sola vez, sobre datos que no están en ningún
// otro lado (RN-05).




/** El nombre de la pestaña, tal como está en la planilla del usuario. */
const HOJA_DE_AHORROS = 'Ahorros conjuntos';

const AHO_COMENTARIO = 'A';
const AHO_DIA = 'B';
const AHO_DETALLE = 'C';
const AHO_MONEDA = 'D';
const AHO_MONTO = 'E';
const AHO_PERSONA = 'F';
const AHO_TIPO = 'G';

const textoDe = (celda) => normalizarTextoVisible(String(celda?.valor ?? ''));

/**
 * ¿Esta fila es un movimiento de ahorro?
 *
 * Se decide por el **contenido**, no por el número de fila: el encabezado, las
 * filas en blanco que separan bloques y los cuadros de totales de la derecha
 * quedan afuera solos. Hace falta al menos una fecha y una persona; sin eso no
 * hay nada que interpretar.
 */
function esFilaDeAhorro(celdas) {
  if (!celdas) return false;

  // **La fecha tiene que ser una fecha**, no cualquier texto. Es lo que deja
  // afuera al encabezado, que en esa misma columna dice "DÍA" — la primera
  // versión lo dejaba pasar y lo reportaba como una fila con la moneda mal.
  const dia = celdas.get(AHO_DIA)?.valor;
  const esFecha = typeof dia === 'number'
    ? Number.isFinite(dia) && dia > 0
    : typeof dia === 'string' && /^\d{4}-\d{2}-\d{2}/.test(dia.trim());
  if (!esFecha) return false;

  return textoDe(celdas.get(AHO_PERSONA)) !== '' || textoDe(celdas.get(AHO_MONEDA)) !== '';
}

/**
 * Traduce una fila. Devuelve `{ ahorro }` o `{ problema }`.
 *
 * **Nunca tira**: una fila rota tiene que producir una línea del informe, no
 * interrumpir la importación de las otras.
 */
function interpretarFilaDeAhorro(numero, celdas, monedas) {
  const crudo = {
    comentario: textoDe(celdas.get(AHO_COMENTARIO)),
    detalle: textoDe(celdas.get(AHO_DETALLE)),
    moneda: textoDe(celdas.get(AHO_MONEDA)),
    persona: textoDe(celdas.get(AHO_PERSONA)),
    tipo: textoDe(celdas.get(AHO_TIPO)),
  };
  // `decia` es lo que la pantalla escribe al lado del número de fila. Sin esto,
  // el informe decía "Decía: ." y no servía para nada: el usuario tiene que
  // poder reconocer la fila SIN abrir la planilla.
  const decir = (motivo) => ({
    problema: {
      fila: numero,
      motivo,
      crudo,
      decia: [crudo.comentario, crudo.persona, crudo.moneda,
        String(celdas.get(AHO_MONTO)?.valor ?? '').trim(), crudo.tipo]
        .filter((t) => t !== '').join(' · '),
    },
  });

  const dia = celdas.get(AHO_DIA)?.valor;
  let fecha;
  try {
    fecha = typeof dia === 'number' ? fechaDeSerie(dia) : String(dia ?? '').slice(0, 10);
  } catch {
    return decir('la fecha no se pudo leer');
  }

  const moneda = monedaDeLaPlanilla(crudo.moneda);
  if (moneda === null) {
    return decir(`no se reconoce la moneda "${crudo.moneda}"`);
  }
  if (personaDeLaPlanilla(crudo.persona) === null) {
    return decir(`no dice de quién es: "${crudo.persona}"`);
  }
  if (tipoDeLaPlanilla(crudo.tipo) === null) {
    return decir(`la columna I/G dice "${crudo.tipo}", que no es ni I ni G`);
  }

  const monto = celdas.get(AHO_MONTO)?.valor;
  if (monto === undefined || monto === null || String(monto).trim() === '') {
    // Le pasó a la copia que mandó el usuario: la hoja tenía las filas y la
    // columna de montos vacía. Decirlo con el número de fila es la diferencia
    // entre "no importó nada" y "no importó ESTAS, mirá la planilla".
    return decir('la fila no tiene monto');
  }

  // ── El signo, que en esta hoja viene DOS VECES ─────────────────────────────
  //
  // En la planilla del usuario las salidas del ahorro llevan la `G` en su
  // columna **y además el monto en negativo**. Las dos cosas dicen lo mismo, y
  // por eso acá se toma el valor absoluto: el signo del número es redundante,
  // no un dato aparte.
  //
  // **Salvo que se contradigan.** Un monto negativo en una fila marcada `I`
  // dice dos cosas opuestas, y ahí no se adivina: se informa la fila con lo que
  // decía. Es la misma regla que en la hoja de gastos (MAPEO §6) — lo que
  // cambia es que allá no hay nada con qué comparar el signo y acá sí.
  const negativo = typeof monto === 'number'
    ? monto < 0
    : String(monto).trim().startsWith('-');

  if (negativo && tipoDeLaPlanilla(crudo.tipo) === AHORRO_ENTRA) {
    return decir('el monto es negativo pero la fila dice "I": el número y la columna I/G se contradicen');
  }

  const sinSigno = typeof monto === 'number' ? Math.abs(monto) : String(monto).trim().replace(/^-/, '');

  try {
    const ahorro = crearAhorro(
      { ...crudo, moneda, monto: sinSigno, fecha },
      { decimales: decimalesDe(monedas, moneda), id: idDeFilaDeAhorro(numero, crudo, sinSigno, fecha) }
    );
    return { ahorro };
  } catch (error) {
    return decir(error.message);
  }
}

/**
 * Un identificador estable, sacado de la fila.
 *
 * Deducido del contenido y **del número de fila**: dos filas iguales —el mismo
 * día, la misma persona, el mismo importe— son dos movimientos reales
 * distintos, y sin el número la segunda se descartaría como repetida. Así,
 * además, importar dos veces la misma planilla no puede duplicar la plata.
 */
function idDeFilaDeAhorro(numero, crudo, monto, fecha) {
  const semilla = `${numero}|${fecha}|${crudo.persona}|${crudo.moneda}|${monto}|${crudo.comentario}`;
  let hash = 0x811c9dc5 >>> 0;
  for (let i = 0; i < semilla.length; i += 1) {
    hash ^= semilla.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193) >>> 0;
  }
  return `aho_${hash.toString(16).padStart(8, '0')}${semilla.length.toString(16)}`;
}

/**
 * Interpreta la hoja entera.
 *
 * Devuelve los ahorros, los problemas fila por fila y **una comprobación por
 * moneda**: lo que suma la app contra lo que decía el cuadro de la planilla.
 * Es la única oportunidad de contrastar el resultado con un número calculado
 * por otra herramienta — después la planilla se archiva.
 */
function interpretarAhorros(filas, monedas) {
  const ahorros = [];
  const problemas = [];

  for (const numero of [...filas.keys()].sort((a, b) => a - b)) {
    const celdas = filas.get(numero);
    if (!esFilaDeAhorro(celdas)) continue;

    const resultado = interpretarFilaDeAhorro(numero, celdas, monedas);
    if (resultado.problema) problemas.push(resultado.problema);
    else ahorros.push(resultado.ahorro);
  }

  return { ahorros, problemas, comprobaciones: compararConLaPlanilla(ahorros, filas) };
}

/**
 * Compara el total de cada moneda contra el cuadro de la planilla (I3:K4).
 *
 * Una diferencia no significa necesariamente que la app se equivocó: puede ser
 * el rango corto de la propia hoja (`$E4:$E89`). Pero significa que **alguno de
 * los dos está mal**, y eso hay que mirarlo antes de archivar la planilla.
 */
function compararConLaPlanilla(ahorros, filas) {
  const encabezado = filas.get(3);
  const valores = filas.get(4);
  if (!encabezado || !valores) return [];

  const comprobaciones = [];
  for (const columna of ['I', 'J', 'K']) {
    const moneda = monedaDeLaPlanilla(textoDe(encabezado.get(columna)));
    const esperado = valores.get(columna)?.valor;
    if (moneda === null || typeof esperado !== 'number') continue;

    const nuestro = ahorros
      .filter((a) => a.moneda === moneda)
      .reduce((total, a) => total + (a.tipo === AHORRO_SALE ? -a.monto : a.monto), 0);

    comprobaciones.push({
      moneda,
      nuestro,
      planilla: Math.round(esperado * 100),
      cuadra: nuestro === Math.round(esperado * 100),
    });
  }
  return comprobaciones;
}

// Importar la planilla del usuario — T-032, CU-13.
//
// Junta las dos mitades: el lector de `.xlsx` (T-031), que dice qué hay en cada
// celda, y el mapeo (`docs/MAPEO-EXCEL.md`, T-030), que dice qué significa. Acá
// se aplica el mapeo, se arman los movimientos y —sobre todo— **se explica fila
// por fila lo que no entró**.
//
// ── Por qué el informe es la mitad del trabajo, y no un adorno ───────────────
//
// Esto se corre **una sola vez**, sobre once meses que no están en ningún otro
// lado. Si se equivoca, se equivoca en silencio sobre todo el historial: los
// totales quedan mal y no hay con qué compararlos, porque el único lugar donde
// estaban bien es la planilla que se acaba de reemplazar.
//
// Un importador que dice «se importaron 1043 filas» y se calla las 14 que
// descartó empieza el reemplazo repitiendo el error que la app vino a arreglar:
// el Excel original miente sin avisar (L-001). Por eso cada fila que no entra
// sale con **su número de fila**, lo que decía y por qué — para poder abrir la
// planilla y mirarla.



/** El catálogo más los rubros que esta importación decidió agregar. */
function conLosNuevos(catalogo, nuevos) {
  const juntar = (tipo) => [
    ...rubrosDe(tipo, catalogo),
    ...nuevos.filter((n) => n.tipo === tipo).map((n) => n.rubro),
  ];
  return { gasto: juntar(TIPO_GASTO), ingreso: juntar(TIPO_INGRESO) };
}

// Las columnas, según `docs/MAPEO-EXCEL.md` §3. Con prefijo porque en el archivo
// construido todos los módulos comparten ámbito: `TIPO` a secas ya lo usa el
// generador de planillas para un estilo de celda, y el constructor lo rechaza —
// que es exactamente para lo que existe esa comprobación.
const COL_ACUMULADO = 'A';
const COL_COMENTARIO = 'B';
const COL_DIA = 'C';
const COL_MES = 'D';
const COL_DETALLE = 'E';
const COL_RUBRO = 'F';
const COL_MONTO = 'G';
const COL_TIPO = 'H';

/**
 * ¿Esta fila es un dato? — §2 del mapeo.
 *
 * **Se pregunta qué sí es un dato, no qué hay que saltear.** Reconocer los
 * títulos por su texto obliga a acertar la lista completa de lo que se ignora, y
 * basta con que un mes esté escrito distinto para que un encabezado entre como
 * un gasto. Es una lista blanca que hay que mantener, y este proyecto ya se
 * quemó dos veces con eso (L-015, L-017).
 */
function esFilaDeDatos(celdas) {
  const dia = celdas.get(COL_DIA)?.valor;
  const rubro = celdas.get(COL_RUBRO)?.valor;

  return Number.isInteger(dia) && dia >= 1 && dia <= 31
    && typeof rubro === 'string' && rubro.trim() !== '';
}

/**
 * Un identificador derivado de la propia fila — §8 del mapeo.
 *
 * La misma fila de la misma planilla da siempre el mismo identificador, así que
 * **importar dos veces no duplica**: el mecanismo que ya tiene la app —no
 * agregar un movimiento cuyo identificador ya está (T-017)— alcanza sin código
 * nuevo que lo vigile.
 *
 * **Incluye el número de fila**, y eso no es un detalle: dos filas idénticas
 * —mismo día, mismo rubro, mismo importe, sin comentario— son dos gastos reales
 * distintos, y sin el número de fila la segunda se descartaría como repetida.
 * Comer un café dos veces el mismo día es lo más normal del mundo.
 */
function idDeFila(numero, contenido) {
  // Dos pasadas con semillas distintas, para llegar a 64 bits. Con una sola de
  // 32 bits, mil filas ya tienen una posibilidad entre cuatro mil de chocar — y
  // una colisión acá no da error: hace desaparecer un gasto.
  const semilla = `${numero}|${contenido}`;
  return `${fnv1a(semilla, 0x811c9dc5)}${fnv1a(semilla, 0x01000193)}`;
}

function fnv1a(texto, inicial) {
  let hash = inicial >>> 0;
  for (let i = 0; i < texto.length; i += 1) {
    hash ^= texto.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193) >>> 0;
  }
  return hash.toString(16).padStart(8, '0');
}

/**
 * Traduce una fila. Devuelve `{ movimiento }` o `{ problema }`.
 *
 * Nunca tira: una fila rota tiene que producir una línea del informe, no
 * interrumpir la importación de las otras mil.
 */
function interpretarFila(numero, celdas, catalogo, nuevos = []) {
  const crudo = {
    comentario: texto(celdas.get(COL_COMENTARIO)),
    detalle: texto(celdas.get(COL_DETALLE)),
    rubro: texto(celdas.get(COL_RUBRO)),
    dia: celdas.get(COL_DIA)?.valor,
    monto: celdas.get(COL_MONTO)?.valor,
    tipo: texto(celdas.get(COL_TIPO)),
  };

  const problema = (motivo) => ({ problema: { fila: numero, motivo, decia: describir(crudo) } });

  // ── El tipo, primero: sin él no se puede juzgar el rubro (§5, §7) ──────────
  const letra = crudo.tipo.trim().toUpperCase();
  if (letra !== 'G' && letra !== 'I') {
    return problema(crudo.tipo.trim() === ''
      ? 'la columna I/G está vacía, así que no se sabe si es un gasto o un ingreso'
      : `la columna I/G dice "${crudo.tipo}", y tiene que decir G o I`);
  }
  const tipo = letra === 'G' ? TIPO_GASTO : TIPO_INGRESO;

  // ── El rubro (§5) ──────────────────────────────────────────────────────────
  //
  // **Un rubro que no está en la app no tira la fila: se agrega** — T-049.
  //
  // Antes se descartaba, y era razonable cuando los rubros venían fijos en el
  // código. Desde T-048 los decide el usuario, y el caso que lo rompió es el
  // real: la planilla de otra persona, con rubros que ella inventó. Descartar
  // esas filas le dejaría afuera la mitad de su historial, con un informe
  // larguísimo diciendo lo mismo cien veces.
  //
  // Lo que sí se respeta es el tope: si ya no entran más rubros, la fila no
  // entra y se explica, porque meterla en un rubro que no es el suyo sería
  // cambiarle los datos.
  const rubro = normalizarClave(crudo.rubro);
  if (rubro === '') return problema('la fila no dice de qué rubro es');

  if (!rubrosDe(tipo, catalogo).includes(rubro)) {
    const cual = tipo === TIPO_GASTO ? 'gasto' : 'ingreso';
    if (rubrosDe(tipo, catalogo).length >= TOPE_DE_RUBROS) {
      return problema(
        `el rubro "${crudo.rubro}" no está en la app y ya no entran más rubros de ${cual} ` +
        `(el máximo son ${TOPE_DE_RUBROS}). Uní dos en Ajustes y volvé a importar`
      );
    }
    // Una sola vez, aunque venga en doscientas filas: si no, la previa diría
    // "se van a agregar 200 rubros" para uno solo, y el catálogo terminaría con
    // el mismo nombre repetido hasta llenarse.
    if (!nuevos.some((n) => n.tipo === tipo && n.rubro === rubro)) nuevos.push({ tipo, rubro });
  }

  // ── La fecha: día y mes son dos columnas y hay que casarlas (§4) ───────────
  const serie = celdas.get(COL_MES)?.valor;
  const primeroDelMes = typeof serie === 'number' ? fechaDeSerie(serie) : null;
  if (primeroDelMes === null) {
    return problema('no se pudo leer el mes de la columna MES');
  }

  const fecha = `${primeroDelMes.slice(0, 8)}${String(crudo.dia).padStart(2, '0')}`;
  try {
    validarFecha(fecha);
  } catch {
    // No se ajusta al último día del mes ni se pasa al siguiente: inventar una
    // fecha que el usuario no escribió es peor que no importar la fila.
    return problema(`el día ${crudo.dia} no existe en ${primeroDelMes.slice(0, 7)}`);
  }

  // ── El monto (§6) ──────────────────────────────────────────────────────────
  //
  // **El número de una celda se pasa como número, nunca como texto.** La primera
  // versión hacía `String(monto)`, y eso le daba a `aMinimas()` —que está hecho
  // para lo que escribe una PERSONA, donde el punto es separador de miles— un
  // texto como "80.13149784261351". Leído con reglas humanas, eso está mal
  // escrito, y lo rechazaba con razón.
  //
  // El resultado: **127 filas de la planilla real del usuario rechazadas por un
  // error de traducción**, todas con montos perfectamente válidos. El número ya
  // estaba; convertirlo a texto para volver a interpretarlo fue meter un
  // traductor entre dos que ya se entendían.
  //
  // Los decimales largos son conversiones de moneda hechas con fórmulas en la
  // planilla: `2.245250431778929` son 2,25 €. `aMinimas()` los redondea al
  // céntimo, que es la unidad en la que la app guarda el dinero (ADR-005).
  const monto = crudo.monto;
  if (monto === undefined || monto === null || monto === '') {
    return problema('el monto está vacío');
  }
  if (typeof monto === 'number' && !Number.isFinite(monto)) {
    return problema('el monto de la celda no es un número que se pueda usar');
  }
  if (typeof monto === 'number' && monto < 0) {
    // Podría ser una devolución o un dedazo, y no hay forma de saber cuál.
    return problema(`el monto es negativo (${monto})`);
  }
  if (monto === 0) {
    // El modelo no guarda movimientos de cero desde T-003 —«si no hubo dinero de
    // por medio, no hay nada que registrar»— y esa decisión manda. Se detecta
    // acá igual, en vez de dejar que lo rechace el modelo, para poder decirlo
    // con el número de fila y distinguirlo de la celda vacía: un 0 escrito a
    // mano casi siempre es una fila a medio cargar que el usuario va a querer
    // mirar.
    return problema('el monto es 0, así que no hay nada que registrar');
  }

  const contenido = `${fecha}|${tipo}|${rubro}|${monto}|${crudo.comentario}|${crudo.detalle}`;

  try {
    return {
      movimiento: crearMovimiento(
        {
          tipo,
          rubro,
          // Todos los importes de la planilla están en euros, convertidos a mano
          // por el usuario (decidido con él, 2026-08-28).
          moneda: 'EUR',
          // Tal cual: si la celda trae un número, va el número; si trae texto
          // —hay celdas escritas a mano en la planilla—, va el texto y lo
          // interpreta `aMinimas()` con las reglas de escritura de siempre.
          monto,
          fecha,
          comentario: crudo.comentario,
          detalle: crudo.detalle,
        },
        {
          decimales: 2,
          id: idDeFila(numero, contenido),
          creado: fecha,
          // El catálogo, ampliado con lo que esta misma importación va a
          // agregar: si no, el modelo rechazaría el rubro que acabamos de
          // decidir aceptar.
          catalogo: conLosNuevos(catalogo, nuevos),
        }
      ),
    };
  } catch (error) {
    // La última red: si el modelo rechaza algo que el mapeo dio por bueno, se
    // informa en vez de romper la importación entera.
    return problema(error.message);
  }
}

/**
 * Traduce la planilla entera.
 *
 * Devuelve los movimientos, los problemas fila por fila, y **las comprobaciones
 * de cada mes** (ver abajo).
 */
function interpretarPlanilla(filas, catalogo) {
  const movimientos = [];
  const problemas = [];
  // Los rubros que la planilla trae y la app todavía no tiene — T-049. Se
  // juntan acá y los agrega quien importa, en un solo paso: agregarlos fila por
  // fila haría veinte cambios de estado para una sola importación.
  const rubrosNuevos = [];
  const acumulados = new Map();
  const sumas = new Map();
  const cuantos = new Map();

  const numeros = [...filas.keys()].sort((a, b) => a - b);

  for (const numero of numeros) {
    const celdas = filas.get(numero);
    if (!esFilaDeDatos(celdas)) continue;

    const resultado = interpretarFila(numero, celdas, catalogo, rubrosNuevos);
    if (resultado.problema) {
      problemas.push(resultado.problema);
      continue;
    }

    const movimiento = resultado.movimiento;
    movimientos.push(movimiento);

    // Para la comprobación: la suma de gastos de cada mes, y el último valor de
    // la columna de acumulado que traía la planilla.
    const mes = movimiento.fecha.slice(0, 7);
    if (movimiento.tipo === TIPO_GASTO) {
      sumas.set(mes, (sumas.get(mes) ?? 0) + movimiento.monto);
      cuantos.set(mes, (cuantos.get(mes) ?? 0) + 1);
      const acumulado = celdas.get(COL_ACUMULADO)?.valor;
      if (typeof acumulado === 'number') acumulados.set(mes, Math.round(acumulado * 100));
    }
  }

  return { movimientos, problemas, rubrosNuevos, comprobaciones: comprobar(sumas, acumulados, cuantos) };
}

/**
 * Compara lo importado contra el acumulado que traía la planilla — §6 del mapeo.
 *
 * Es la única oportunidad de contrastar el resultado con un número que **calculó
 * otra herramienta**. Después de importar, la planilla se archiva y no queda con
 * qué comparar: si acá no se mira, no se mira nunca.
 *
 * Una diferencia no significa necesariamente que la app se equivocó —puede ser
 * que la planilla tuviera una fórmula con un rango corto, que es justamente
 * L-001—, pero significa que **alguno de los dos está mal** y hay que mirarlo.
 */
function comprobar(sumas, acumulados, cuantos = new Map()) {
  const comprobaciones = [];

  for (const mes of [...sumas.keys()].sort()) {
    const importado = sumas.get(mes);
    const enLaPlanilla = acumulados.get(mes);
    if (enLaPlanilla === undefined) continue;

    // **La tolerancia crece con la cantidad de filas, y tiene que ser así.**
    // Muchos montos de la planilla son el resultado de una fórmula de
    // conversión de moneda y traen decimales largos: `2.245250431778929`. La
    // app guarda céntimos enteros (ADR-005), así que cada uno se redondea, y
    // cada redondeo mueve hasta medio céntimo. Con cien filas, medio euro de
    // diferencia es aritmética, no un dato perdido.
    //
    // Una tolerancia fija de un céntimo marcaría como sospechosos meses que
    // están perfectos, y un aviso que salta cuando todo está bien es un aviso
    // que se aprende a ignorar — que es lo último que puede pasar con el único
    // control que existe sobre una importación de once meses.
    const filas = cuantos.get(mes) ?? 1;
    const tolerancia = Math.max(1, Math.ceil(filas / 2));
    const diferencia = importado - enLaPlanilla;

    comprobaciones.push({
      mes, importado, enLaPlanilla, diferencia,
      coincide: Math.abs(diferencia) <= tolerancia,
    });
  }

  return comprobaciones;
}

/** El texto de una celda, normalizado, o cadena vacía. */
function texto(celda) {
  return celda === undefined ? '' : normalizarTextoVisible(String(celda.valor ?? ''));
}

/** Lo que decía la fila, para poder reconocerla en la planilla. */
function describir({ dia, rubro, monto, comentario, detalle }) {
  const partes = [
    dia !== undefined ? `día ${dia}` : null,
    rubro ? `rubro "${rubro}"` : null,
    monto !== undefined && monto !== null && monto !== '' ? `monto ${monto}` : null,
    comentario ? `comentario "${comentario}"` : null,
    detalle ? `detalle "${detalle}"` : null,
  ].filter(Boolean);

  return partes.length > 0 ? partes.join(', ') : 'la fila estaba casi vacía';
}

// ── src/ui/colores.js ───────────────────────────────────────────
// Un color propio para cada rubro, el mismo en todas las pantallas.
//
// Para qué sirve: cuando `supermercado` es siempre del mismo color, la barra más
// larga del mes se reconoce sin leer su nombre, y el formulario confirma de un
// vistazo qué rubro quedó elegido. El color deja de ser decoración y pasa a ser
// una segunda forma de leer el mismo dato.
//
// ── La regla que no se rompe ─────────────────────────────────────────────────
//
// **El color se asigna por la POSICIÓN del rubro en su lista, nunca por su
// tamaño.** Si dependiera del tamaño, cargar un gasto nuevo repintaría media
// pantalla, y el color dejaría de significar "supermercado" para pasar a
// significar "el más grande de este mes" — que ya lo dice el tamaño de su porción.
// Un color que cambia de significado no se puede aprender.
//
// ── La paleta ────────────────────────────────────────────────────────────────
//
// Los ocho tonos salen de la **planilla del usuario**, que es la que viene
// mirando desde octubre de 2025: se conservó el matiz de cada uno de sus colores
// y se corrigieron la luz y el croma hasta que el conjunto pasara el validador
// de la guía de visualización contra las dos superficies reales de la app. Seis
// de los ocho se movieron 23° o menos: son el mismo color con otro nombre
// técnico. Los otros dos son los que estaban rotos. El detalle está en ADR-029.
//
// Con fondo oscuro pasan las seis comprobaciones. Con fondo claro pasan las
// cuatro duras, con dos advertencias —un par a ΔE 7,2 bajo daltonismo y un tono
// corto de contraste— que la guía permite **cuando hay rótulo directo**. Lo hay:
// cada rubro lleva su nombre y su importe escritos al lado. Si alguna pantalla
// futura mostrara estos colores sin texto, esa advertencia volvería a contar y
// habría que resolverla ahí.
//
// **Ocho es el techo**, por dos motivos distintos. No se agregan más tonos: un
// noveno color generado sería indistinguible de alguno de estos bajo daltonismo,
// y si algún día hay más de ocho rubros de un tipo la salida es agrupar. Y
// además ninguna paleta de ocho pasa el validador comparando todos contra
// todos; sí pasan los pares que quedan **pegados**, si son siempre los mismos.
// Por eso la torta del resumen dibuja los rubros en el orden de esta lista y no
// por tamaño.

// Se reexportan para no obligar a media app a cambiar sus imports: lo que se
// movió es dónde vive el cálculo, no quién lo usa.

function claseDeRubro(tipo, rubro, catalogo) {
  return `rubro-${franjaDeRubro(tipo, rubro, catalogo)}`;
}

// ── src/ui/compartir.js ─────────────────────────────────────────
// Entregarle el respaldo al teléfono — T-905.
//
// El respaldo ya se puede descargar (T-016), pero en un celular "descargar" deja
// el archivo en una carpeta que después hay que ir a buscar con un explorador de
// archivos para subirlo a OneDrive. Son cuatro pasos, y el respaldo que exige
// cuatro pasos cada semana es el que no se hace.
//
// El botón de compartir del sistema lo resuelve en uno: la app le entrega el
// archivo al teléfono y el teléfono muestra OneDrive, Drive, el correo, lo que
// haya instalado.
//
// ── Por qué esto NO rompe RN-06 ──────────────────────────────────────────────
//
// La app no hace ninguna petición de red. Le pasa un archivo al sistema
// operativo y termina ahí su participación; quien lo sube es OneDrive, con la
// sesión del usuario, fuera de la app. Es exactamente lo mismo que descargar el
// archivo y arrastrarlo a una carpeta sincronizada, pero sin los tres pasos del
// medio. La guardia de privacidad de `tools/build.mjs` lo confirma: no aparece
// ninguna URL ni ninguna llamada de red en este archivo.
//
// Lo que sí hay que decirle al usuario, y la pantalla se lo dice: **un respaldo
// guardado en la nube deja de ser privado.** La app garantiza la privacidad
// hasta que el archivo sale; de ahí en adelante la garantiza el usuario.

/**
 * El respaldo como archivo, para poder entregarlo.
 *
 * Recibe `File` en vez de tomarlo del entorno para poder probarlo con
 * `node --test`, donde no hay navegador (ADR-022).
 */
function archivoDelRespaldo(respaldo, ConstructorArchivo) {
  return new ConstructorArchivo([respaldo.contenido], respaldo.nombre, { type: respaldo.tipo });
}

/**
 * ¿Este navegador puede compartir **archivos**?
 *
 * Se exige `canShare` y no alcanza con que exista `share`: hay navegadores que
 * comparten texto y direcciones pero no archivos, y ahí `share({files})` falla
 * **después** de que el usuario apretó el botón. Un botón que falla al apretarlo
 * es peor que un botón que no está (L-016): en esta pantalla, encima, el usuario
 * se quedaría creyendo que respaldó.
 *
 * `canShare` puede tirar con datos que no le gustan, así que se pregunta dentro
 * de un `try`: la respuesta a "¿se puede?" no puede ser una excepción.
 */
function sePuedeCompartir(navegador, archivo) {
  try {
    return (
      typeof navegador?.share === 'function' &&
      typeof navegador?.canShare === 'function' &&
      navegador.canShare({ files: [archivo] })
    );
  } catch {
    return false;
  }
}

/**
 * Comparte el respaldo. **Nunca tira**: devuelve qué pasó.
 *
 * Tres resultados y no dos, porque **cancelar no es fallar**. Si el usuario abre
 * el menú de compartir y se arrepiente, el navegador rechaza la promesa con
 * `AbortError`. Mostrarle un error rojo por haber cambiado de idea le enseñaría
 * que la app se rompe sola.
 */
async function compartirRespaldo(navegador, respaldo, ConstructorArchivo) {
  let archivo;
  try {
    archivo = archivoDelRespaldo(respaldo, ConstructorArchivo);
  } catch (error) {
    return { error: `No se pudo preparar el archivo (${error.message}).` };
  }

  if (!sePuedeCompartir(navegador, archivo)) {
    return {
      error: 'Este navegador no puede compartir archivos. Usá el botón de descargar.',
      noVaAFuncionar: true,
    };
  }

  try {
    await navegador.share({
      files: [archivo],
      // Sin `text` ni `url`: hay destinos que, si viene texto, mandan el texto y
      // se olvidan del archivo. Acá lo único que importa es el archivo.
      title: respaldo.nombre,
    });
    return { compartido: true };
  } catch (error) {
    if (error?.name === 'AbortError') return { cancelado: true };
    return { error: explicarFallo(error), noVaAFuncionar: true };
  }
}

/**
 * El fallo, en castellano — T-914.
 *
 * En el Android del usuario, con la app abierta desde el disco, compartir falla
 * con `Permission denied`. Eso no le dice nada a nadie, y menos a alguien que
 * está tratando de poner sus datos a salvo. El mensaje tiene que decir **qué
 * pasó, por qué, y qué hacer en su lugar**.
 *
 * `canShare({files})` había dicho que sí. Es un caso donde el navegador promete
 * y después no cumple, así que la promesa no se puede tomar como garantía: por
 * eso el resultado marca `noVaAFuncionar`, para que la pantalla deje de ofrecer
 * un botón que ya se sabe que falla (L-016).
 */
function explicarFallo(error) {
  const detalle = String(error?.message ?? '');
  const esPermiso = error?.name === 'NotAllowedError' || /permission denied/i.test(detalle);

  return esPermiso
    ? 'Tu navegador no deja compartir archivos cuando la app está abierta desde el disco. ' +
      'No es un problema de tus datos: usá el botón de descargar y subí el archivo desde ' +
      'la carpeta de descargas, que funciona igual.'
    : `No se pudo compartir el archivo (${detalle}). Usá el botón de descargar, que hace lo mismo en dos pasos.`;
}

// ── src/ui/pantallas/cambio.js ──────────────────────────────────
// Pedir y corregir tipos de cambio — CU-03.
//
// Dos cosas que parecen la misma y no lo son:
//
//   1. **Pedirlo al vuelo.** Estás en Costa Rica, cargás el primer gasto en
//      colones de marzo, y la app no puede convertirlo a euros. Ahí interrumpe,
//      lo pide, y sigue. Es un momento de fricción inevitable y hay que hacerlo
//      lo más corto posible: un solo campo, con el gasto que estabas cargando a
//      la vista para que se entienda por qué se interrumpió.
//
//   2. **Corregir uno ya usado.** Volviste del viaje y el tipo de cambio estaba
//      mal. Corregirlo arregla el mes entero (RN-05), pero también **cambia
//      totales que ya viste**. Eso no puede pasar en silencio: la app dice
//      cuántos movimientos toca antes de aplicarlo.
//
// El campo se escribe en el sentido en que la gente conoce el dato —"un euro son
// 630 colones"— y la app lo invierte para guardarlo. Escribirlo al revés es el
// error más fácil de cometer acá, y no da ningún error: da totales absurdos.






/**
 * Interpreta lo que el usuario escribió como tipo de cambio.
 *
 * Acepta coma o punto decimal, porque el teclado del celular mete punto y la
 * cabeza escribe coma. No usa `dinero.js`: esto no es un monto en unidades
 * mínimas sino un factor, y puede tener muchos decimales (`0,0000062`).
 */
function leerTipoDeCambio(entrada) {
  if (typeof entrada === 'number') {
    if (!Number.isFinite(entrada) || entrada <= 0) {
      throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
    }
    return entrada;
  }
  if (typeof entrada !== 'string') {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }

  const limpio = entrada.trim().replace(/\s/g, '').replace(',', '.');

  // Un negativo SÍ es un número, solo que no sirve acá. Decirle "no es un
  // número" a alguien que escribió -630 lo manda a buscar un error de tipeo que
  // no existe, en vez de explicarle la regla.
  if (/^-/.test(limpio)) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }
  if (limpio === '' || !/^\d*\.?\d+$/.test(limpio)) {
    throw new Error(`"${entrada}" no es un número. Escribí solo cifras, con coma o punto para los decimales.`);
  }

  const numero = Number(limpio);
  if (!Number.isFinite(numero) || numero <= 0) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }
  return numero;
}

/**
 * Guarda un tipo de cambio escrito **en unidades por euro**, que es como la
 * gente lo conoce. La app lo invierte antes de guardarlo (ADR de `core/cambio.js`).
 *
 * Nunca tira: devuelve `{ estado, error }`, como el resto de las pantallas.
 */
function intentarGuardarCambio(estado, { moneda, mes, unidadesPorEuro }) {
  // Contra la base elegida, no contra el euro (T-050): con base en pesos, el
  // euro es una moneda más y **sí** lleva tipo de cambio. Comparar contra EUR
  // acá dejaba al usuario sin poder cargar el único tipo que le faltaba.
  const base = monedaBaseDe(estado);
  let codigo;
  try {
    codigo = normalizarMoneda(moneda);
  } catch (error) {
    return { estado, error: error.message };
  }

  if (codigo === base) {
    return {
      estado,
      error: `${codigo} no lleva tipo de cambio: es la moneda en la que se expresan todos los totales.`,
    };
  }

  let valor;
  try {
    valor = leerTipoDeCambio(unidadesPorEuro);
  } catch (error) {
    return { estado, error: error.message };
  }

  let cambio;
  try {
    cambio = crearCambio({ moneda: codigo, mes, euros_por_unidad: desdeUnidadesPorEuro(valor) }, { base });
  } catch (error) {
    return { estado, error: error.message };
  }

  return { estado: { ...estado, tipos_cambio: guardarCambio(estado.tipos_cambio, cambio) } };
}

/**
 * Cuántos movimientos cambiarían de importe si se corrigiera este tipo de
 * cambio, y en cuánto cambiaría el total de ese mes.
 *
 * Existe por RN-05, que es una decisión incómoda a propósito: el importe en
 * euros se deriva, así que corregir una vez arregla el mes entero — y también
 * cambia números que el usuario ya dio por buenos. La app tiene que mostrar esa
 * consecuencia **antes**, no después.
 */
function efectoDeCorregir(estado, moneda, mes, nuevasUnidadesPorEuro) {
  const codigo = normalizarMoneda(moneda);
  const afectados = movimientosAfectadosPor(estado.movimientos, codigo, mes);
  if (afectados === 0) return { afectados: 0 };

  let nuevoValor;
  try {
    nuevoValor = desdeUnidadesPorEuro(leerTipoDeCambio(nuevasUnidadesPorEuro));
  } catch {
    return { afectados };
  }

  const viejoValor = buscarCambio(estado.tipos_cambio, codigo, mes);
  if (viejoValor === null) return { afectados };

  const decimales = decimalesDe(estado.monedas, codigo);
  const delMes = estado.movimientos.filter(
    (m) => normalizarMoneda(m.moneda) === codigo && m.fecha.slice(0, 7) === mes
  );

  const antes = delMes.reduce((t, m) => t + convertirAEuros(m.monto, decimales, viejoValor), 0);
  const despues = delMes.reduce((t, m) => t + convertirAEuros(m.monto, decimales, nuevoValor), 0);

  return { afectados, antes, despues, diferencia: despues - antes };
}

// ── Dibujo ───────────────────────────────────────────────────────────────────

/**
 * La interrupción: el gasto que se estaba cargando necesita un tipo de cambio.
 *
 * Muestra el movimiento a la vista, porque el usuario no pidió esta pantalla —
 * lo interrumpimos nosotros— y tiene que entender en un vistazo por qué.
 */
function dibujarPedido(vista) {
  const base = monedaBaseDe(vista.estado);
  const falta = vista.faltaCambio;
  if (!falta) return '';

  const moneda = buscarMoneda(vista.estado.monedas, falta.moneda);
  const nombre = moneda ? moneda.nombre : falta.moneda;

  // ¿Es la primera vez, o se está corrigiendo uno que ya se usó? No es lo
  // mismo: lo segundo cambia totales que el usuario ya vio (RN-05).
  const actual = buscarCambio(vista.estado.tipos_cambio, falta.moneda, falta.mes, base);
  const corrigiendo = actual !== null;
  const efecto = corrigiendo
    ? efectoDeCorregir(vista.estado, falta.moneda, falta.mes, vista.borradorCambio)
    : null;

  const explicacion = corrigiendo
    ? `Ahora está cargado como <strong>${escapar(formatearTipoDeCambio(actual, falta.moneda, base))}</strong>.
       Corregirlo vuelve a calcular todos los movimientos de ${escapar(formatearMes(falta.mes))} en esa moneda.`
    : `Es el primer movimiento en ${escapar(falta.moneda)} de
       ${escapar(formatearMes(falta.mes))}, y sin el tipo de cambio no se puede
       expresar en ${escapar(base)}. Vale para todos los movimientos de ese mes,
       y después se puede corregir.`;

  return `
    <form class="tarjeta formulario" data-formulario="cambio" novalidate>
      <h2>${corrigiendo ? 'Corregir el tipo de cambio' : `¿Cuánto vale el ${escapar(nombre.toLowerCase())}?`}</h2>

      <p class="suave">${explicacion}</p>

      ${vista.error ? `<p class="error-carga" role="alert">${escapar(vista.error)}</p>` : ''}
      <div data-aviso-correccion>${dibujarAvisoCorreccion(efecto, falta.moneda, base)}</div>

      <label class="campo">
        <span>1 ${escapar(base)} son…</span>
        <div class="monto-fila">
          <input name="unidadesPorEuro" class="importe" type="text" inputmode="decimal"
                 autocomplete="off" enterkeyhint="done" placeholder="630"
                 value="${escapar(vista.borradorCambio ?? '')}">
          <span class="sufijo">${escapar(falta.moneda)}</span>
        </div>
      </label>

      <input type="hidden" name="moneda" value="${escapar(falta.moneda)}">
      <input type="hidden" name="mes" value="${escapar(falta.mes)}">

      <button type="submit" class="principal" data-accion="guardar-cambio">
        ${corrigiendo ? 'Aplicar la corrección' : 'Guardar y seguir'}
      </button>
      <button type="button" class="secundario" data-accion="cancelar-cambio">
        Ahora no
      </button>
    </form>
  `;
}

/**
 * La pantalla de tipos de cambio: ver los que hay y corregirlos.
 *
 * Cada fila dice cuántos movimientos usan ese tipo de cambio. Es la información
 * que convierte "corregir un número" en "cambiar el total de once gastos", que
 * es lo que en realidad está pasando.
 */
function dibujarCambios(vista) {
  const estado = vista.estado;
  const base = monedaBaseDe(estado);
  const cambios = [...estado.tipos_cambio].sort(
    (a, b) => b.mes.localeCompare(a.mes) || a.moneda.localeCompare(b.moneda)
  );

  // Los que faltan van primero y con un botón: es la única forma de cargarlos
  // hacia atrás. La app los pide sola cuando el movimiento es nuevo, pero
  // cuando lo que cambió fue la moneda base (T-050) los movimientos ya están
  // guardados y nadie los va a volver a cargar — sin esta lista, el usuario
  // queda mirando un total incompleto sin ninguna puerta para arreglarlo.
  const faltantes = cambiosQueFaltan(estado.movimientos ?? [], estado.tipos_cambio, base)
    .sort((a, b) => b.mes.localeCompare(a.mes) || a.moneda.localeCompare(b.moneda));

  const pendientes = faltantes.length === 0 ? '' : `
    <section class="aviso importante" role="alert">
      <h2>${faltantes.length === 1 ? 'Falta un tipo de cambio' : `Faltan ${faltantes.length} tipos de cambio`}</h2>
      <p>Sin ${faltantes.length === 1 ? 'él' : 'ellos'}, los movimientos de
      ${faltantes.length === 1 ? 'ese mes' : 'esos meses'} no entran en ningún
      total. Cargalos acá, uno por uno.</p>
      <ul class="lineas">${faltantes.map((f) => `
        <li class="linea-cambio">
          <div>
            <span class="mes-cambio">${escapar(formatearMes(f.mes))}</span>
            <span class="suave">${escapar(f.moneda)}</span>
          </div>
          <button type="button" class="secundario chico" data-accion="corregir-cambio"
                  data-moneda="${escapar(f.moneda)}" data-mes="${escapar(f.mes)}">Cargar</button>
        </li>`).join('')}</ul>
    </section>`;

  if (cambios.length === 0) {
    return `
      ${pendientes}
      <section class="tarjeta">
        <h2>Tipos de cambio</h2>
        <p class="suave">Todavía no hay ninguno cargado. La app te lo va a pedir
        sola la primera vez que cargues un gasto en otra moneda.</p>
      </section>
    `;
  }

  const filas = cambios
    .map((c) => {
      const usados = movimientosAfectadosPor(estado.movimientos, c.moneda, c.mes);
      const cuantos =
        usados === 0
          ? 'sin movimientos todavía'
          : usados === 1
            ? '1 movimiento lo usa'
            : `${usados} movimientos lo usan`;

      return `
        <li class="linea-cambio">
          <div>
            <span class="mes-cambio">${escapar(formatearMes(c.mes))}</span>
            <span class="suave">${escapar(cuantos)}</span>
          </div>
          <div class="valor-cambio">
            <span class="importe">${escapar(formatearTipoDeCambio(c.euros_por_unidad, c.moneda, base))}</span>
            <button type="button" class="secundario chico"
                    data-accion="corregir-cambio"
                    data-moneda="${escapar(c.moneda)}" data-mes="${escapar(c.mes)}">Corregir</button>
          </div>
        </li>`;
    })
    .join('');

  return `
    ${pendientes}
    <section class="tarjeta">
      <h2>Tipos de cambio</h2>
      <p class="suave">Cada uno dice cuánto vale esa moneda en ${escapar(base)} y
      vale para todos los movimientos de su mes (RN-04). Corregir uno cambia los
      totales de ese mes.</p>
      <ul class="lineas">${filas}</ul>
    </section>
  `;
}

/**
 * El aviso antes de aplicar una corrección: cuántos movimientos cambian y en
 * cuánto queda el total del mes. Sin esto, un número cambiaría solo.
 */
function dibujarAvisoCorreccion(efecto, moneda, base) {
  if (!efecto || efecto.afectados === 0) return '';
  if (efecto.diferencia === undefined) {
    return `<p class="confirmacion">Este tipo de cambio lo usan ${efecto.afectados} movimientos.</p>`;
  }

  const signo = efecto.diferencia > 0 ? 'sube' : efecto.diferencia < 0 ? 'baja' : 'no cambia';
  const cuantos = efecto.afectados === 1 ? '1 movimiento' : `${efecto.afectados} movimientos`;

  return `
    <p class="confirmacion" role="status">
      Afecta a ${cuantos} en ${escapar(normalizarMoneda(moneda))}.
      El total de ese mes ${signo} de <strong>${escapar(formatearEuros(efecto.antes, base))}</strong>
      a <strong>${escapar(formatearEuros(efecto.despues, base))}</strong>.
    </p>
  `;
}

/** El movimiento que quedó esperando, para mostrarlo mientras se pide el dato. */
function dibujarMovimientoEnEspera(estado, borrador) {
  if (!borrador?.monto) return '';
  let importe = `${borrador.monto} ${borrador.moneda}`;
  try {
    const decimales = decimalesDe(estado.monedas, borrador.moneda);
    importe = formatearMonto(aMinimas(borrador.monto, decimales), decimales, borrador.moneda);
  } catch {
    // Si no se puede formatear, se muestra tal como lo escribió: es preferible
    // a no mostrar nada, que dejaría al usuario sin saber qué quedó pendiente.
  }

  return `
    <p class="en-espera">
      Esperando para guardar: <strong>${escapar(importe)}</strong>
      ${borrador.rubro ? `· ${escapar(formatearRubro(borrador.rubro))}` : ''}
    </p>
  `;
}

// ── src/ui/pantallas/series.js ──────────────────────────────────
// Una serie temporal que se puede recorrer — T-942.
//
// Los dos gráficos del historial —el de ingresos, gastos y saldo mes a mes, y el
// del acumulado día por día— eran dibujos fijos: se veía la forma y no se podía
// leer ningún valor. El usuario pidió tres cosas: **zoom, más marcas en el eje
// de las x, y poder tocar un punto y ver qué pasaba ahí**.
//
// ── Por qué esto es un archivo aparte y no más código en graficos.js ────────
//
// Porque el dibujo sigue siendo **puro** (ADR-022) y la interacción no puede
// serlo. La solución es que el dibujo reciba **qué parte de la serie mostrar**:
//
//     interiorDeSerie(serie, ventana) → el SVG de adentro, para esa ventana
//
// El zoom y el desplazamiento no son más que cambiar la ventana y volver a
// llamar a esa función. Así lo que decide qué se ve se puede probar con
// `node --test`, y lo único que toca el navegador es traducir un gesto en una
// ventana nueva (`ui/series-interaccion.js`).
//
// ── La ventana ──────────────────────────────────────────────────────────────
//
// Es un par de **índices** dentro de los puntos, no un par de fechas. Los datos
// ya vienen ordenados y sin huecos —`acumuladoHistorico()` devuelve todos los
// días, también los vacíos—, así que el índice ES el tiempo, y trabajar con
// índices hace que el zoom no dependa de que los puntos estén parejos.


const ANCHO = 300;
const ALTO = 150;

/** Nunca menos de dos puntos: con uno no hay línea, hay un punto. */
const MINIMO_VISIBLE = 2;

/** Cuántas etiquetas del eje entran sin pisarse en la pantalla de un teléfono. */
const MAXIMO_ETIQUETAS = 5;

/** Cuántas marcas se apunta a poner en el eje de los importes. */
const MARCAS_DE_IMPORTE = 5;

/**
 * Los pasos que dan números redondos, en céntimos: 1, 2, 5, 10, 20, 50, 100…
 *
 * Un eje que dice `1.842,33 €` es peor que no decir nada: el número es exacto y
 * no significa nada. Lo que sirve es que diga `1.000 €`, `2.000 €`. Por eso los
 * pasos salen de esta serie y no de dividir el alto entre cinco.
 */
function pasosRedondos() {
  const pasos = [];
  for (let potencia = 0; potencia <= 9; potencia += 1) {
    for (const base of [1, 2, 5]) pasos.push(base * 10 ** potencia);
  }
  return pasos;
}

/**
 * Cada cuánto poner una marca de importe, en céntimos.
 *
 * Elige el paso redondo más chico que no pase de `MARCAS_DE_IMPORTE` marcas: con
 * un rango de 0 a 2.300 € da 500 €, con uno de 0 a 45 € da 10 €. Es lo que hace
 * que las etiquetas sean números que uno diría en voz alta.
 */
function pasoDeImporte(piso, techo, maximo = MARCAS_DE_IMPORTE) {
  const rango = techo - piso;
  if (!(rango > 0)) return null;

  for (const paso of pasosRedondos()) {
    if (Math.floor(techo / paso) - Math.ceil(piso / paso) + 1 <= maximo) return paso;
  }
  return null;
}

/**
 * Los importes que llevan marca: los múltiplos del paso que caen adentro.
 *
 * **El cero sale gratis**: si el rango lo cruza, es múltiplo de cualquier paso,
 * así que siempre entra. La primera versión lo agregaba a mano por las dudas y
 * una mutación demostró que esa línea era inalcanzable — borrarla no ponía
 * ningún test en rojo porque no hacía nada.
 */
function marcasDeImporte(piso, techo, maximo = MARCAS_DE_IMPORTE) {
  const paso = pasoDeImporte(piso, techo, maximo);
  if (paso === null) return [];

  const marcas = [];
  // El `+ 0` no es adorno: `Math.ceil(-0.4) * 100000` da **−0**, que se formatea
  // como "-0" y se lee como un error de la app.
  for (let valor = Math.ceil(piso / paso) * paso + 0; valor <= techo; valor += paso) {
    marcas.push(valor);
  }
  return marcas;
}

/**
 * El importe como se escribe en el eje: **sin decimales** cuando el paso es de
 * un euro o más.
 *
 * `2.100,00 €` en el margen de un gráfico de teléfono ocupa el doble que
 * `2.100 €` y no dice nada más. Los céntimos se ven al tocar el punto, que es
 * donde importan.
 */
function etiquetaDeImporte(centimos, paso) {
  const enEuros = centimos / 100;
  const decimales = paso !== null && paso >= 100 && Number.isInteger(enEuros) ? 0 : 2;
  return formatearNumero(centimos, 2, decimales);
}

const cortoEnSerie = (n) => Math.round(n * 100) / 100;

/**
 * Acomoda una ventana para que siempre sea válida: dentro de la serie, con al
 * menos dos puntos, y sin dar vuelta las puntas.
 *
 * Todo lo que mueve la ventana pasa por acá. Repartir esta comprobación entre
 * el zoom, el desplazamiento y el dibujo serían tres reglas que se separan, y la
 * primera que se olvida deja un gráfico vacío sin explicación.
 */
function acomodarVentana(ventana, cuantos) {
  if (cuantos < MINIMO_VISIBLE) return { desde: 0, hasta: Math.max(0, cuantos - 1) };

  let desde = Math.round(ventana?.desde ?? 0);
  let hasta = Math.round(ventana?.hasta ?? cuantos - 1);
  if (!Number.isFinite(desde)) desde = 0;
  if (!Number.isFinite(hasta)) hasta = cuantos - 1;
  if (hasta < desde) [desde, hasta] = [hasta, desde];

  // Primero el ancho mínimo, después el encaje: al revés, una ventana de un
  // punto pegada al final se estiraría hacia afuera de la serie.
  if (hasta - desde + 1 < MINIMO_VISIBLE) hasta = desde + MINIMO_VISIBLE - 1;
  if (hasta > cuantos - 1) {
    hasta = cuantos - 1;
    desde = Math.min(desde, hasta - MINIMO_VISIBLE + 1);
  }
  if (desde < 0) {
    desde = 0;
    hasta = Math.max(hasta, MINIMO_VISIBLE - 1);
  }
  return { desde, hasta };
}

/**
 * Acerca o aleja alrededor de un punto de anclaje, en índices.
 *
 * **Acercar tiene que angostar la ventana al menos un punto**, o el botón deja
 * de hacer nada antes de llegar al mínimo y no hay forma de saber por qué: con
 * tres puntos, el 60 % de uno y medio vuelve a redondear a uno y medio, y el
 * gráfico se queda ahí para siempre. Lo encontró un test que esperaba llegar al
 * mínimo de dos.
 */
function acercar(ventana, cuantos, factor, ancla) {
  const { desde, hasta } = acomodarVentana(ventana, cuantos);
  const ancho = hasta - desde;
  const centro = ancla ?? (desde + hasta) / 2;

  let nuevoAncho = ancho * factor;
  if (factor < 1) nuevoAncho = Math.min(nuevoAncho, ancho - 1);
  if (factor > 1) nuevoAncho = Math.max(nuevoAncho, ancho + 1);

  const mitad = nuevoAncho / 2;
  return acomodarVentana({ desde: centro - mitad, hasta: centro + mitad }, cuantos);
}

/** Corre la ventana sin cambiar su ancho. Choca contra las puntas y se queda. */
function correr(ventana, cuantos, pasos) {
  const { desde, hasta } = acomodarVentana(ventana, cuantos);
  const ancho = hasta - desde;
  let nuevoDesde = Math.round(desde + pasos);
  nuevoDesde = Math.max(0, Math.min(nuevoDesde, cuantos - 1 - ancho));
  return { desde: nuevoDesde, hasta: nuevoDesde + ancho };
}

/**
 * Qué índices llevan etiqueta escrita en el eje.
 *
 * **Siempre la primera y la última**, para que se sepa entre qué momentos se
 * está mirando, y hasta tres en el medio, repartidas parejo. Con menos puntos
 * que eso, van todas.
 *
 * Es lo que pidió el usuario —"más coordenadas en el eje de las x"— resuelto sin
 * amontonarlas: once fechas en 300 px se pisan y no se lee ninguna.
 */
function indicesConEtiqueta(desde, hasta, maximo = MAXIMO_ETIQUETAS) {
  const cuantos = hasta - desde + 1;
  if (cuantos <= maximo) {
    return Array.from({ length: cuantos }, (_, i) => desde + i);
  }
  const paso = (cuantos - 1) / (maximo - 1);
  const indices = Array.from({ length: maximo }, (_, i) => desde + Math.round(i * paso));
  return [...new Set(indices)];
}

/**
 * El interior del gráfico para una ventana: ejes, marcas, líneas y la guía del
 * punto elegido.
 *
 * La escala vertical **se calcula sobre lo que se ve, no sobre todo**. Es lo que
 * hace que el zoom sirva de algo: acercarse a tres meses de un año y seguir
 * viendo la escala del año dejaría las tres líneas pegadas y planas.
 */
function interiorDeSerie(serie, ventana = {}, seleccion = null) {
  const { puntos, series } = serie;
  const { desde, hasta } = acomodarVentana(ventana, puntos.length);
  const visibles = puntos.slice(desde, hasta + 1);
  if (visibles.length < MINIMO_VISIBLE) return '';

  const valores = visibles.flatMap((p) => p.valores);
  const techo = Math.max(...valores, 0);
  const piso = Math.min(...valores, 0);
  const alto = techo === piso ? 1 : techo - piso;

  const x = (i) => cortoEnSerie(((i - desde) / (hasta - desde)) * ANCHO);
  const y = (valor) => cortoEnSerie(ALTO - ((valor - piso) / alto) * ALTO);

  const lineas = series.map((s, n) => {
    const trazo = visibles.map((p, i) => `${x(desde + i)},${y(p.valores[n])}`).join(' ');
    return `<polyline class="traza ${escapar(s.clase)}" points="${trazo}" />`;
  }).join('');

  // Una marca por punto visible mientras entren; si no, solo las etiquetadas.
  const conEtiqueta = indicesConEtiqueta(desde, hasta);
  const marcas = (hasta - desde + 1 <= 32 ? visibles.map((_, i) => desde + i) : conEtiqueta)
    .map((i) => `<line class="marca" x1="${x(i)}" y1="${ALTO}" x2="${x(i)}" y2="${ALTO + 4}" />`)
    .join('');

  const etiquetas = conEtiqueta.map((i, n) => {
    // La primera pegada a la izquierda y la última a la derecha: centradas se
    // salen del dibujo por la mitad de su ancho.
    const donde = n === 0 ? 'inicio' : n === conEtiqueta.length - 1 ? 'fin' : 'medio';
    return `<text class="marca-eje ${donde}" x="${x(i)}" y="${ALTO + 16}">${escapar(puntos[i].etiqueta)}</text>`;
  }).join('');

  // Las marcas de importe: una línea fina que cruza el dibujo y su número a la
  // izquierda. La del cero se dibuja distinta —cruzarla significa algo— y por
  // eso no se repite como una raya más.
  const paso = pasoDeImporte(piso, techo);
  const marcasDeY = marcasDeImporte(piso, techo).map((valor) => `
    <line class="${valor === 0 && piso < 0 ? 'cero' : 'guia-importe'}"
          x1="0" y1="${y(valor)}" x2="${ANCHO}" y2="${y(valor)}" />
    <text class="marca-eje importe" x="-6" y="${y(valor) + 4}">${escapar(etiquetaDeImporte(valor, paso))}</text>`)
    .join('');

  // La guía del punto elegido: una línea vertical y un punto por serie. El
  // número no va acá sino en el texto de abajo — en un teléfono, un cartel
  // flotante queda debajo del dedo que lo pidió.
  const elegido = seleccion === null || seleccion < desde || seleccion > hasta ? '' : `
    <line class="guia" x1="${x(seleccion)}" y1="0" x2="${x(seleccion)}" y2="${ALTO}" />
    ${series.map((s, n) => `<circle class="punto ${escapar(s.clase)}" cx="${x(seleccion)}"
        cy="${y(puntos[seleccion].valores[n])}" r="4" />`).join('')}`;

  return `
    ${marcasDeY}
    <line class="eje" x1="0" y1="${ALTO}" x2="${ANCHO}" y2="${ALTO}" />
    ${marcas}
    ${lineas}
    ${elegido}
    ${etiquetas}
  `;
}

/**
 * Lo que se lee abajo del gráfico cuando se toca un punto: **cuándo es y cuánto
 * valía cada línea ahí**. Es el pedido central del usuario.
 *
 * Sin punto elegido no queda en blanco: dice qué hacer. Un espacio vacío debajo
 * de un gráfico se lee como que algo no cargó.
 */
function dibujarLectura(serie, seleccion, base) {
  if (seleccion === null || seleccion === undefined || !serie.puntos[seleccion]) {
    return '<span class="suave">Tocá el gráfico para ver los valores de ese momento.</span>';
  }

  const punto = serie.puntos[seleccion];
  const valores = serie.series.map((s, n) => `
    <span class="valor-serie">
      <span class="marca-serie ${escapar(s.clase)}" aria-hidden="true"></span>
      ${escapar(s.nombre)}: <strong>${escapar(formatearEuros(punto.valores[n], base))}</strong>
    </span>`).join('');

  return `<strong class="cuando">${escapar(punto.cuando ?? punto.etiqueta)}</strong>${valores}`;
}

/**
 * El gráfico entero: título, controles, dibujo y lectura.
 *
 * Los controles son **botones y no solo gestos**. El pellizco para acercar está
 * (lo agrega `series-interaccion.js`), pero un gesto que el teléfono del usuario
 * no interprete deja el gráfico sin salida, y este proyecto ya pagó esa lección
 * con el `<datalist>` que su Android no dibujaba (L-021). Los botones siempre
 * están y se pueden probar.
 */
function dibujarSerie(serie) {
  if (serie.puntos.length < MINIMO_VISIBLE) return '';
  const valores = serie.puntos.flatMap((p) => p.valores);
  if (Math.max(...valores) === Math.min(...valores)) return '';

  const ventana = { desde: 0, hasta: serie.puntos.length - 1 };
  const leyenda = serie.series.map((s) => `
    <span class="valor-serie">
      <span class="marca-serie ${escapar(s.clase)}" aria-hidden="true"></span>${escapar(s.nombre)}
    </span>`).join('');

  return `
    <section class="tarjeta grafico" data-serie="${escapar(serie.id)}"
             data-puntos="${escapar(JSON.stringify(serie))}">
      <h2>${escapar(serie.titulo)}</h2>
      <p class="suave nota">${serie.nota}</p>
