    <section class="tarjeta">
      <h2>Ahorros conjuntos</h2>
      <p class="suave nota">Cuánto hay en cada moneda, y cuánto puso cada uno.
      <strong>No se suman entre sí</strong>: pasar pesos a euros al cambio de hoy
      daría un número que cambia solo todos los días y que no existe hasta que la
      plata se cambie de verdad.</p>
      <ul class="rubros">${porMoneda.map((b) => dibujarMonedaDeAhorro(b, monedas)).join('')}</ul>
      ${cargar}
    </section>

    ${dibujarDeshacerAhorro(vista)}

    <section class="tarjeta">
      <h2>Movimientos de los ahorros</h2>
      <p class="suave nota">${historial.length === 1 ? '1 movimiento' : `${historial.length} movimientos`},
      del más nuevo al más viejo. <strong>+</strong> es plata que entró al ahorro
      y <strong>−</strong> plata que salió.</p>
      <ul class="rubros">${historial.map((m) => dibujarMovimientoDeAhorro(m, monedas,
        { confirmando: vista.confirmandoAhorro === m.id })).join('')}</ul>
    </section>
  `;
}

// ── src/ui/pantallas/monedas.js ─────────────────────────────────
// La pantalla de monedas — CU-15, T-024.
//
// Para qué existe: poder anotar los gastos de un país nuevo sin esperar a que
// alguien publique una versión de la app. Es la diferencia entre registrar el
// viaje y perderlo.
//
// ── Lo delicado de esta pantalla son los DECIMALES ──────────────────────────
//
// Un monto se guarda en unidades mínimas: `1500` son 15,00 con dos decimales y
// 1.500 con cero. Cambiarle los decimales a una moneda **no reescribe ningún
// monto: los lee distinto**. Todos los gastos ya cargados en esa moneda pasan a
// valer cien veces más o cien veces menos, y nada en la pantalla parpadea.
//
// Por eso el cambio de decimales no es un `<select>` que se aplica al tocarlo,
// sino un paso aparte que **antes de aplicarse dice cuántos movimientos
// reinterpreta y muestra uno de ejemplo, con el antes y el después**. Es la
// misma regla que la corrección de un tipo de cambio (ADR-019): cuando un número
// puede cambiar el significado de datos que ya existen, el aviso es parte de la
// funcionalidad, no un adorno.
//
// Igual que el resto de la interfaz (ADR-022), casi todo son funciones puras que
// devuelven texto HTML; las que cambian el estado devuelven uno nuevo y no
// guardan nada.




/** Un ejemplo con el que se entiende qué son los decimales sin explicarlos. */
const MONTO_DE_EJEMPLO = 1500;

/** Cuántos movimientos hay en una moneda, en palabras. */
function cuantosMovimientos(cuantos) {
  if (cuantos === 0) return 'sin movimientos';
  return cuantos === 1 ? '1 movimiento' : `${cuantos} movimientos`;
}

/**
 * Qué pasaría si a una moneda le cambiaran los decimales.
 *
 * Devuelve cuántos movimientos se reinterpretan y **un ejemplo real**: el mismo
 * número guardado, leído con los decimales de antes y con los de después. Un
 * "cambiará el significado de 47 movimientos" es abstracto; ver que `15,00 €`
 * pasa a ser `1.500`, no.
 */
function efectoDeCambiarDecimales(estado, codigo, decimales) {
  const moneda = buscarMoneda(estado.monedas, codigo);
  if (moneda === null) return null;

  const afectados = contarMovimientosDe(estado.movimientos, moneda.codigo);
  const ejemplo = estado.movimientos.find(
    (m) => String(m.moneda).toUpperCase() === moneda.codigo,
  );
  const monto = ejemplo?.monto ?? MONTO_DE_EJEMPLO;

  return {
    afectados,
    cambia: decimales !== moneda.decimales,
    antes: formatearMonto(monto, moneda.decimales, moneda.codigo),
    despues: formatearMonto(monto, decimales, moneda.codigo),
  };
}

/** El aviso previo. Sin movimientos cargados no hay nada que reinterpretar. */
function dibujarAvisoDecimales(efecto) {
  if (efecto === null || !efecto.cambia) return '';
  if (efecto.afectados === 0) {
    return `<p class="confirmacion" role="status">Todavía no hay movimientos en esta
      moneda, así que el cambio no reinterpreta nada.</p>`;
  }

  const cuantos = cuantosMovimientos(efecto.afectados);
  return `
    <p class="confirmacion importante" role="status">
      Esto cambia el significado de ${escapar(cuantos)} ya cargado${efecto.afectados === 1 ? '' : 's'}.
      Uno que hoy se lee <strong>${escapar(efecto.antes)}</strong> pasaría a leerse
      <strong>${escapar(efecto.despues)}</strong>. No se reescribe ningún monto:
      se leen distinto.
    </p>
  `;
}

/** Una fila del catálogo. */
function dibujarFilaMoneda(moneda, cuantos) {
  const esBase = moneda.codigo === MONEDA_BASE;
  const ejemplo = formatearMonto(MONTO_DE_EJEMPLO, moneda.decimales, moneda.codigo);

  // Borrar solo se ofrece cuando de verdad se puede. Un botón que siempre
  // contesta "no" enseña a no tocarlo, y de paso esconde que existe "ocultar".
  const sePuedeBorrar = !esBase && cuantos === 0;

  const acciones = esBase ? '<span class="suave">Moneda base</span>' : `
    <button type="button" class="secundario chico" data-accion="decimales-moneda"
            data-moneda="${escapar(moneda.codigo)}">Decimales</button>
    <button type="button" class="secundario chico"
            data-accion="${moneda.oculta ? 'mostrar-moneda' : 'ocultar-moneda'}"
            data-moneda="${escapar(moneda.codigo)}">${moneda.oculta ? 'Mostrar' : 'Ocultar'}</button>
    ${sePuedeBorrar ? `
    <button type="button" class="secundario chico" data-accion="borrar-moneda"
            data-moneda="${escapar(moneda.codigo)}">Borrar</button>` : ''}`;

  // Los datos van en UNA sola línea separada por puntos medios. Estaban en tres
  // trozos pegados y se leían corridos: "Euro sin movimientos" parecía el nombre
  // de la moneda. Lo encontró la captura del recorrido, no un test: los tests
  // buscaban cada trozo por separado y los encontraban a los tres.
  const partes = [
    moneda.nombre,
    moneda.oculta ? 'oculta' : null,
    cuantosMovimientos(cuantos),
    `se escribe ${ejemplo}`,
  ].filter((p) => p !== null);

  return `
    <li class="linea-cambio${moneda.oculta ? ' apagada' : ''}">
      <div>
        <span class="mes-cambio">${escapar(moneda.codigo)}</span>
        <span class="suave">${escapar(partes.join(' · '))}</span>
      </div>
      <div class="valor-cambio">${acciones}</div>
    </li>
  `;
}

/** El formulario para agregar una moneda. */
function dibujarFormularioMoneda(borrador = {}) {
  return `
    <form class="tarjeta" data-formulario="moneda">
      <h2>Agregar una moneda</h2>

      <label class="campo">
        <span>Código <em class="suave">— tres letras</em></span>
        <input name="codigo" type="text" autocomplete="off" maxlength="3"
               placeholder="JPY" value="${escapar(borrador.codigo ?? '')}">
      </label>

      <label class="campo">
        <span>Nombre</span>
        <input name="nombre" type="text" autocomplete="off"
               placeholder="Yen japonés" value="${escapar(borrador.nombre ?? '')}">
      </label>

      <label class="campo">
        <span>Decimales</span>
        <!-- Se explica con un ejemplo y no con una definición: "cuántos dígitos
             van después de la coma" obliga a traducirlo mentalmente; "1.500,00 o
             1.500" se entiende sin traducir. -->
        <select name="decimales">
          ${[0, 1, 2, 3, 4].map((d) => `
            <option value="${d}"${Number(borrador.decimales ?? 2) === d ? ' selected' : ''}>
              ${d} — se escribe ${escapar(formatearMonto(MONTO_DE_EJEMPLO, d, MONEDA_BASE).replace('€', '').trim())}
            </option>`).join('')}
        </select>
      </label>

      <button type="submit" class="principal" data-accion="agregar-moneda">
        Agregar moneda
      </button>
    </form>
  `;
}

/** El paso aparte para cambiar los decimales de una moneda que ya existe. */
function dibujarCambioDeDecimales(vista) {
  const codigo = vista.monedaEditada;
  const moneda = buscarMoneda(vista.estado.monedas, codigo);
  if (moneda === null) return '';

  const elegidos = Number(vista.borradorDecimales ?? moneda.decimales);
  const efecto = efectoDeCambiarDecimales(vista.estado, moneda.codigo, elegidos);

  return `
    <form class="tarjeta" data-formulario="decimales">
      <h2>Decimales de ${escapar(moneda.nombre)}</h2>
      <p class="suave">Hoy usa ${moneda.decimales}.</p>

      <label class="campo">
        <span>Decimales</span>
        <select name="decimales" data-accion-cambio="decimales-elegidos">
          ${[0, 1, 2, 3, 4].map((d) => `
            <option value="${d}"${elegidos === d ? ' selected' : ''}>${d}</option>`).join('')}
        </select>
      </label>

      <div data-aviso-decimales>${dibujarAvisoDecimales(efecto)}</div>

      <input type="hidden" name="moneda" value="${escapar(moneda.codigo)}">
      <button type="submit" class="principal" data-accion="guardar-decimales">
        Aplicar
      </button>
      <button type="button" class="secundario" data-accion="cancelar-decimales">
        Ahora no
      </button>
    </form>
  `;
}

function dibujarMonedas(vista) {
  const estado = vista.estado;
  const filas = estado.monedas
    .map((m) => dibujarFilaMoneda(m, contarMovimientosDe(estado.movimientos, m.codigo)))
    .join('');

  const editando = vista.monedaEditada
    ? dibujarCambioDeDecimales(vista)
    : dibujarFormularioMoneda(vista.borradorMoneda);

  // El error va ARRIBA de la lista y no adentro del formulario: lo puede provocar
  // cualquiera de los botones de las filas —ocultar, borrar—, no solo el
  // formulario. Un error dibujado solo dentro del formulario dejaba a "borrar el
  // colón" fallando en silencio; lo encontró el recorrido en el navegador.
  const confirmacion = vista.avisoMoneda
    ? `<p class="confirmacion" role="status">${escapar(vista.avisoMoneda)}</p>`
    : '';

  return `
    <section class="tarjeta">
      <h2>Monedas</h2>
      <p class="suave">Las que están acá se pueden elegir al cargar un gasto.
      Ocultar una la saca de esa lista sin tocar sus movimientos.</p>
      ${dibujarError(vista.error)}
      ${confirmacion}
      <ul class="lineas">${filas}</ul>
    </section>
    ${editando}
  `;
}


// ── Los cambios de estado ────────────────────────────────────────────────────
//
// Todas devuelven `{ estado }` o `{ error }`. No guardan: guardar es de `app.js`,
// que es el único que sabe si el navegador puede.

/** Envuelve una operación del catálogo y convierte su error en texto. */
function intentar(hacer) {
  try {
    return { estado: hacer() };
  } catch (error) {
    return { error: error.message };
  }
}

function intentarAgregarMoneda(estado, entrada) {
  return intentar(() => ({ ...estado, monedas: agregarMoneda(estado.monedas, entrada) }));
}

function intentarOcultarMoneda(estado, codigo) {
  return intentar(() => ({ ...estado, monedas: ocultarMoneda(estado.monedas, codigo) }));
}

function intentarMostrarMoneda(estado, codigo) {
  return intentar(() => ({ ...estado, monedas: mostrarMoneda(estado.monedas, codigo) }));
}

function intentarBorrarMoneda(estado, codigo) {
  return intentar(() => ({
    ...estado,
    monedas: borrarMoneda(estado.monedas, codigo, estado.movimientos),
  }));
}

function intentarCambiarDecimales(estado, codigo, decimales) {
  return intentar(() => ({
    ...estado,
    monedas: cambiarDecimalesDe(estado.monedas, codigo, decimales),
  }));
}

// ── src/ui/pantallas/grupos.js ──────────────────────────────────
// Otros grupos de gastos — CU-18, T-946.
//
// La etiqueta sirve para agrupar cualquier cosa, no solo viajes y gastos fijos:
// una mudanza, unos regalos, el arreglo del auto. Hasta ahora esos grupos no
// aparecían en ninguna pantalla — existían en los datos y no se podían ver.
//
// **Qué llega acá lo decide `core/agrupamientos.js`**, en cascada: si todos sus
// gastos son del rubro `gastos fijos` su grupo vive en la pantalla de gastos
// fijos; si alguno es del rubro `viajes`, en la de viajes; si no, acá. Así cada
// etiqueta tiene **un** grupo propio, en **una** pantalla.
//
// Que una etiqueta de acá se nombre también en la tarjeta de gastos fijos no es
// una contradicción: allá se suma solo la parte del rubro `gastos fijos` y acá
// la etiqueta entera, y las dos pantallas lo dicen. Ver ADR-041.
//
// Igual que el resto de la interfaz (ADR-022), son funciones puras.




/** Cuántos gastos, en cuántos meses y entre qué fechas. */
function dibujarAlcance(grupo) {
  const cuantos = grupo.cuantos === 1 ? '1 gasto' : `${grupo.cuantos} gastos`;
  const cuando = grupo.desde === grupo.hasta
    ? formatearFecha(grupo.desde)
    : `${formatearFecha(grupo.desde)} → ${formatearFecha(grupo.hasta)}`;

  // En cuántos meses distintos aparece: es lo que separa una mudanza —una vez,
  // muchos gastos— de algo que se repite todos los meses sin ser del rubro
  // `gastos fijos`, como el gimnasio.
  const meses = grupo.meses === 1 ? 'en un mes' : `en ${grupo.meses} meses`;

  return `${cuantos} · ${cuando} · ${meses}`;
}

function dibujarGrupo(grupo, base) {
  return `
    <li class="fila-rubro">
      <button type="button" class="fila-toque" data-accion="ver-comentario"
              data-comentario="${escapar(grupo.etiqueta)}">
        <span class="rubro-cabeza">
          <span class="nombre">${escapar(grupo.etiqueta)}</span>
          <span class="importe">${escapar(formatearEuros(grupo.total, base))}</span>
        </span>
      </button>
      <div class="rubro-pie suave">
        <span>${escapar(dibujarAlcance(grupo))}</span>
      </div>
    </li>
  `;
}

function dibujarGrupos(vista) {
  const base = monedaBaseDe(vista.estado);
  const grupos = otrosGrupos(vista.estado);

  if (grupos.length === 0) {
    return `
      <section class="tarjeta">
        <h2>Otros grupos de gastos</h2>
        <p class="suave">Todavía no hay ninguno. Acá aparecen las etiquetas que
        no son ni un gasto fijo ni un viaje: una mudanza, unos regalos, el
        arreglo del auto. Poniéndole la misma etiqueta a varios gastos, se juntan
        solos.</p>
      </section>
    `;
  }

  return `
    <section class="tarjeta">
      <h2>Otros grupos de gastos</h2>
      <p class="suave nota">Las etiquetas que no son ni un gasto fijo ni un viaje.
      El total incluye <strong>todos</strong> los rubros de esa etiqueta, así que
      puede ser mayor que lo que la misma etiqueta suma en la tarjeta de gastos
      fijos, que mira un rubro solo. Tocá uno para ver sus gastos.</p>
      <ul class="rubros">${grupos.map((g) => dibujarGrupo(g, base)).join('')}</ul>
    </section>
  `;
}

// ── src/ui/pantallas/fijos.js ───────────────────────────────────
// El promedio de los gastos fijos — CU-12, T-022. Reemplaza el bloque
// `GASTOS FIJOS PROMEDIO` del Excel: responde "¿cuánto me sale la luz por mes?".
//
// ── Por qué mira todo el historial y no un mes ──────────────────────────────
//
// Un promedio sobre un mes es el gasto de ese mes con otro nombre. La pregunta
// que esto contesta solo existe con varios meses adentro, así que la pantalla no
// tiene selector de mes: dice entre qué meses miró.
//
// ── Por qué muestra cuántos pagos y entre qué meses ─────────────────────────
//
// El Excel muestra el promedio por pago. Solo, se lee como si fuera mensual, y
// no siempre lo es: ocho pagos en once meses no es una factura mensual. Con
// "8 pagos · oct 25 → ago 26" al lado, el número dice lo que de verdad dice.
//
// Igual que el resto de la interfaz (ADR-022), son funciones puras que devuelven
// texto HTML.




/** Cuántas veces se pagó y entre qué meses. */
function dibujarCadencia(grupo) {
  const pagos = grupo.cuantos === 1 ? '1 pago' : `${grupo.cuantos} pagos`;
  const meses = grupo.desde === grupo.hasta
    ? formatearMesCorto(grupo.desde)
    : `${formatearMesCorto(grupo.desde)} → ${formatearMesCorto(grupo.hasta)}`;

  return `${pagos} · ${meses}`;
}

/**
 * Un gasto fijo: el nombre y el promedio grandes, el total y la cadencia chicos.
 *
 * **El promedio es el número destacado, no el total.** La pregunta es "¿cuánto
 * me sale?", no "¿cuánto llevo gastado?". El total está al lado porque es lo que
 * permite comprobar el promedio a mano, pero no es lo que se viene a buscar.
 */
function dibujarGastoFijo(grupo, base) {
  return `
    <li class="fila-rubro">
      <!-- Lleva a los pagos que componen ese promedio, en TODOS los meses: esta
           tarjeta habla de todo el historial, así que mostrar solo el mes en
           curso sería una parte del número que se acaba de tocar (T-026). -->
      <button type="button" class="fila-toque" data-accion="ver-comentario"
              data-comentario="${escapar(grupo.comentario)}">
        <span class="rubro-cabeza">
          <span class="nombre">${escapar(grupo.comentario)}</span>
          <span class="importe">${escapar(formatearEuros(grupo.promedio, base))}</span>
        </span>
      </button>
      <div class="rubro-pie suave">
        <span>${escapar(dibujarCadencia(grupo))}</span>
        <span>${escapar(formatearEuros(grupo.total, base))} en total</span>
      </div>
      ${dibujarTambienEnOtrosGrupos(grupo)}
    </li>
  `;
}

/**
 * Los pagos de gastos fijos que no tienen comentario.
 *
 * Sin comentario no hay nada que promediar: no se sabe si son tres facturas de
 * luz o tres cosas distintas. Pero **callarlos haría que la lista no cerrara con
 * el total del rubro** y el usuario no tendría cómo darse cuenta. Se dicen, y se
 * dice qué hacer para que entren.
 */
function dibujarSinComentario(sinComentario, base) {
  if (sinComentario.cuantos === 0) return '';

  const cuantos = sinComentario.cuantos === 1
    ? 'Un pago de gastos fijos no está'
    : `${sinComentario.cuantos} pagos de gastos fijos no están`;

  return `
    <p class="suave nota">
      ${cuantos} en esta lista, por ${escapar(formatearEuros(sinComentario.total, base))}:
      no tienen etiqueta, y la etiqueta es lo que dice cuál gasto fijo son.
      Poniéndoles una —"Luz", "Gas"— entran solos.
    </p>
  `;
}

/**
 * El aviso de que esa etiqueta además tiene un grupo propio — T-946.
 *
 * **No cambia ningún total.** Está para que quien vea 60 € acá y 70 € en los
 * otros grupos sepa por qué son distintos: acá se suma **solo la parte del
 * rubro `gastos fijos`** de esa etiqueta, y allá la etiqueta entera, con todos
 * sus rubros adentro. Un mismo nombre con dos números y sin explicación es la
 * forma más rápida de que el usuario deje de creerle a los dos.
 */
function dibujarTambienEnOtrosGrupos(grupo) {
  if (!grupo.conGrupoPropio) return '';

  return `
    <p class="suave nota">
      Acá se suma solo lo que "${escapar(grupo.comentario)}" gastó en el rubro
      gastos fijos. Esa etiqueta junta también gastos de otros rubros: el total
      completo está en <strong>otros grupos de gastos</strong>.
    </p>
  `;
}

function dibujarGastosFijos(estado) {
  const base = monedaBaseDe(estado);
  const { grupos, sinComentario, total } = gastosFijos(estado);
  if (grupos.length === 0 && sinComentario.cuantos === 0) return '';

  const cuerpo = grupos.map((g) => dibujarGastoFijo(g, base)).join('');

  const vacio = grupos.length > 0 ? '' : `
    <p class="suave">Ninguno de tus gastos fijos tiene etiqueta todavía, así que
    no hay nada que agrupar.</p>`;

  return `
    <section class="tarjeta">
      <h2>Cuánto sale cada gasto fijo</h2>
      <p class="suave nota">El promedio por pago de cada uno. En total llevás
      ${escapar(formatearEuros(total, base))} en gastos fijos.</p>
      ${vacio}
      <ul class="rubros">${cuerpo}</ul>
      ${dibujarSinComentario(sinComentario, base)}
    </section>
  `;
}

// ── src/ui/pantallas/evolucion.js ───────────────────────────────
// La evolución mes a mes — CU-10, T-021. Reemplaza la hoja `Analisis1` del
// Excel: una fila por mes, una columna por rubro, y abajo el total y el
// promedio.
//
// Es la pantalla que solo tiene sentido con historial adentro. Con tres gastos
// de prueba no dice nada; con los once meses que se importaron en la etapa 3 es
// la razón por la que la app existe.
//
// ── Por qué una tabla y no un gráfico ────────────────────────────────────────
//
// Acá la pregunta no es "cómo se reparte" —eso lo contesta la torta del mes—
// sino "cuánto gasté en supermercado en enero, y en febrero". Eso es leer un
// valor exacto en el cruce de dos cosas, y para eso la tabla es la forma. Un
// gráfico de once meses por ocho rubros en la pantalla de un teléfono son 88
// marcas de dos milímetros.
//
// ── Lo que se cuidó, porque una tabla ancha en un celular se rompe fácil ─────
//
//   1. La tabla se desliza a lo ancho **dentro de su propia caja**; la página no.
//   2. La columna del mes **queda fija** al deslizar: una fila de once números
//      sin su etiqueta a la vista no se puede leer.
//   3. Los importes van con cifras de ancho fijo y alineados a la derecha, que
//      es lo que permite comparar una columna sin leer cada número.
//
// Igual que el resto de la interfaz (ADR-022), son funciones puras que
// devuelven texto HTML.











/**
 * Un importe de celda.
 *
 * **Sin el símbolo del euro**, y no por prolijidad: son noventa y nueve celdas
 * en la pantalla de un teléfono, y el símbolo repetido noventa y nueve veces se
 * come una columna entera de rubro. Toda la tabla está en euros y lo dice el pie
 * una vez. El cero se dibuja apagado: está —es una matriz, no puede faltar— pero
 * no compite con los números que sí dicen algo.
 */
function celdaDeImporte(importe, extra = '', toque = null) {
  const clase = importe === 0 ? 'importe vacio' : 'importe';
  const numero = escapar(formatearNumero(importe, DECIMALES_EURO));

  // Una celda con plata adentro lleva a los movimientos que la componen (T-026).
  // La de cero no: no hay nada que mostrar, y un botón que abre una lista vacía
  // es peor que una celda quieta.
  const contenido = toque === null || importe === 0
    ? numero
    : `<button type="button" class="celda-toque" data-accion="ver-celda"
               data-mes="${escapar(toque.mes)}" data-tipo="${escapar(toque.tipo ?? TIPO_GASTO)}"
               data-rubro="${escapar(toque.rubro)}">${numero}</button>`;

  return `<td class="${clase}${extra}">${contenido}</td>`;
}

/**
 * El encabezado de la tabla, en **dos niveles**: arriba de qué es cada bloque,
 * abajo la columna.
 *
 * El nivel de arriba no es decoración: `otros` está en los rubros de gasto y
 * también en los de ingreso, y son cosas distintas (RN-02). Dos columnas
 * llamadas "Otros" en la misma tabla, sin nada que las separe, son un número
 * que se lee en la columna equivocada. La banda dice cuál es cuál, y además la
 * paleta les da el mismo gris a los dos —viene de la planilla del usuario—, así
 * que el color no alcanzaba para distinguirlas.
 *
 * El punto de color es lo que ata esta pantalla al resumen del mes: la columna
 * que acá dice "Supermercado" es la porción ámbar de allá.
 */
function dibujarEncabezadoMatriz(rubros, rubrosIngreso = []) {
  const columna = (tipo, rubro) => `
    <th scope="col">
      <span class="punto-rubro ${claseDeRubro(tipo, rubro)}" aria-hidden="true"></span>
      ${escapar(formatearRubro(rubro))}
    </th>`;

  const deGasto = rubros.map((rubro) => columna(TIPO_GASTO, rubro)).join('');
  // El primer rubro de ingreso abre el bloque, así que lleva la línea que lo
  // separa de los gastos. Sin esa línea, "Otros" de gasto y "Otros" de ingreso
  // quedan pegados y son dos columnas grises con el mismo nombre.
  const deIngreso = rubrosIngreso
    .map((rubro, i) => columna(TIPO_INGRESO, rubro).replace('<th scope="col">',
      i === 0 ? '<th scope="col" class="separada">' : '<th scope="col">'))
    .join('');

  return `
    <tr class="bandas">
      <td class="columna-mes"></td>
      <th scope="colgroup" colspan="${rubros.length}" class="banda">Rubros de gasto</th>
      <td class="separada"></td>
      <th scope="colgroup" colspan="${rubrosIngreso.length}" class="banda separada">Rubros de ingreso</th>
      <td class="separada"></td>
      <td class="separada"></td>
    </tr>
    <tr>
      <th scope="col" class="columna-mes">Mes</th>
      ${deGasto}
      <th scope="col" class="separada">Gastos</th>
      ${deIngreso}
      <th scope="col" class="separada">Ingresos</th>
      <th scope="col" class="separada">Saldo</th>
    </tr>
  `;
}

/** Una fila de mes. */
function dibujarFilaMes(fila, rubros = [], rubrosIngreso = []) {
  const marca = fila.incompleto
    ? ' <abbr title="A este mes le falta un tipo de cambio: el total está incompleto">·</abbr>'
    : '';

  return `
    <tr>
      <th scope="row" class="columna-mes">
        <!-- El mes lleva a todos los movimientos de ese mes. -->
        <button type="button" class="celda-toque" data-accion="ver-mes"
                data-mes="${escapar(fila.mes)}">${escapar(formatearMesCorto(fila.mes))}</button>${marca}
      </th>
      ${fila.rubros.map((importe, i) => celdaDeImporte(importe, '',
        rubros[i] === undefined ? null : { mes: fila.mes, tipo: TIPO_GASTO, rubro: rubros[i] })).join('')}
      ${celdaDeImporte(fila.gastos, ' separada')}
      ${(fila.rubrosIngreso ?? []).map((importe, i) => celdaDeImporte(importe, '',
        rubrosIngreso[i] === undefined ? null : { mes: fila.mes, tipo: TIPO_INGRESO, rubro: rubrosIngreso[i] })).join('')}
      ${celdaDeImporte(fila.ingresos, ' separada')}
      <td class="importe separada ${fila.saldo < 0 ? 'gasto' : 'ingreso'}">${escapar(formatearNumero(fila.saldo, DECIMALES_EURO))}</td>
    </tr>
  `;
}

/** Las dos filas del pie: total y promedio. */
function dibujarPieMatriz(matriz) {
  const fila = (nombre, valores) => `
    <tr>
      <th scope="row" class="columna-mes">${escapar(nombre)}</th>
      ${valores.rubros.map((importe) => celdaDeImporte(importe)).join('')}
      ${celdaDeImporte(valores.gastos, ' separada')}
      ${(valores.rubrosIngreso ?? []).map((importe) => celdaDeImporte(importe)).join('')}
      ${celdaDeImporte(valores.ingresos, ' separada')}
      ${celdaDeImporte(valores.saldo, ' separada')}
    </tr>
  `;

  // Promedio arriba y total abajo, por pedido del usuario (2026-09-04). Estaba
  // al revés, copiando a `Analisis1`. El total es el número más grande de la
  // tabla y cierra mejor abajo de todo, pegado al borde: es donde el ojo lo
  // busca en cualquier planilla.
  return fila('Promedio', matriz.promedio) + fila('Total', matriz.total);
}

/**
 * La explicación del promedio.
 *
 * No es un adorno: en el Excel el total sumaba once meses y el promedio
 * promediaba diez, y no estaba escrito en ningún lado si era a propósito
 * (L-006). Una decisión sin explicación es indistinguible de un error, así que
 * acá la decisión se escribe abajo de la tabla, donde se lee el número.
 */
function dibujarNotaDelPromedio(matriz) {
  const meses = matriz.mesesDelPromedio === 1 ? '1 mes' : `${matriz.mesesDelPromedio} meses`;

  if (matriz.dejaAfuera === null) {
    return `<p class="suave nota">El promedio es sobre ${escapar(meses)}.</p>`;
  }

  return `
    <p class="suave nota">
      El promedio es sobre los ${escapar(meses)} terminados: deja afuera
      ${escapar(formatearMesCorto(matriz.dejaAfuera))}, que todavía va por la
      mitad y tiraría el promedio para abajo. El total sí lo incluye.
    </p>
  `;
}

/**
 * El selector de período — T-054.
 *
 * ── Dos decisiones que valen la pena explicar ───────────────────────────────
 *
 * **Son dos listas y no dos calendarios.** Un `type="month"` deja elegir agosto
 * de 2019, donde no hay nada, y la respuesta a eso es una pantalla vacía que no
 * explica nada. Las listas ofrecen **solo los meses que tienen movimientos**, así
 * que cualquier combinación devuelve algo.
 *
 * **El período no se guarda.** Vive mientras estás mirando y se pierde al salir,
 * igual que el zoom de los gráficos (T-942): es cómo estás mirando, no un dato
 * tuyo. Si se guardara, abrir la app en enero mostraría el recorte que elegiste
 * en septiembre y los totales parecerían haber encogido solos.
 */
function dibujarPeriodo(vista) {
  const meses = mesesElegibles(vista.estado);
  if (meses.length < 2) return '';   // con un mes solo no hay nada que recortar

  const periodo = normalizarPeriodo(vista.periodo);
  const desde = periodo?.desde ?? meses[0];
  const hasta = periodo?.hasta ?? meses[meses.length - 1];
  const comoOpcion = (m) => ({ valor: m, texto: formatearMes(m) });
  const fuera = movimientosFuera(vista.estado, periodo);

  return `
    <section class="tarjeta">
      <h2>Período</h2>
      <div class="periodo">
        <label class="campo">
          <span>Desde</span>
          <select name="periodo-desde" data-accion-cambio="periodo">${opciones(meses.map(comoOpcion), desde)}</select>
        </label>
        <label class="campo">
          <span>Hasta</span>
          <select name="periodo-hasta" data-accion-cambio="periodo">${opciones(meses.map(comoOpcion), hasta)}</select>
        </label>
      </div>
      ${periodo === null ? `
      <p class="suave nota">Estás viendo <strong>todo tu historial</strong>: los
      ${meses.length} meses con movimientos.</p>` : `
      <p class="nota">Todo lo de abajo —la tabla, el reparto por rubro, los
      gráficos y los gastos fijos— está calculado <strong>solo sobre
      ${escapar(formatearMes(periodo.desde ?? meses[0]))} a
      ${escapar(formatearMes(periodo.hasta ?? meses[meses.length - 1]))}</strong>.
      ${fuera === 1 ? 'Queda 1 movimiento afuera.' : `Quedan ${fuera} movimientos afuera.`}</p>
      <button type="button" class="secundario" data-accion="periodo-todo">Ver todo el historial</button>`}
    </section>
  `;
}

/**
 * El reparto por rubro de TODO el período que muestra la tabla — T-051.
 *
 * ── Por qué acá y por qué dos ───────────────────────────────────────────────
 *
 * La tabla de arriba contesta "cuánto, mes por mes". Contesta mal, en cambio,
 * "en qué se va lo mío": para saberlo hay que leer la fila Total de punta a
 * punta comparando números de cinco cifras, que es justo lo que una persona no
 * hace bien. La torta contesta eso de un vistazo.
 *
 * Van **dos tortas separadas, gastos e ingresos**, y no una sola con todo: son
 * dos repartos de dos totales distintos. Juntarlos daría porcentajes sobre la
 * suma de la plata que entró y la que salió, un número que no significa nada.
 *
 * **La torta nunca va sola.** Debajo va la lista con el nombre, el importe y el
 * porcentaje, que es donde se compara con precisión — y donde el rubro se
 * identifica por su nombre y no por su color, que con veinte rubros ya no
 * alcanza (ADR-049). Se toca la fila y no la porción: una porción del 1 % en un
 * teléfono son dos milímetros.
 */
function dibujarRepartoDe(matriz, tipo, base, incompletos) {
  const nombres = tipo === TIPO_GASTO ? matriz.rubros : matriz.rubrosIngreso;
  const importes = tipo === TIPO_GASTO ? matriz.total.rubros : matriz.total.rubrosIngreso;

  const filas = nombres
    .map((rubro, i) => ({ rubro, total: importes[i] }))
    .filter((f) => f.total > 0)
    .sort((a, b) => b.total - a.total);

  const total = filas.reduce((suma, f) => suma + f.total, 0);
  if (total <= 0) return '';

  const titulo = tipo === TIPO_GASTO
    ? 'En qué se fue, en todo el período'
    : 'De dónde vino, en todo el período';

  const cuerpo = filas.map((f) => `
    <li class="fila-rubro">
      <button type="button" class="fila-toque" data-accion="ver-rubro"
              data-tipo="${escapar(tipo)}" data-rubro="${escapar(f.rubro)}"
              data-todos-los-meses="si">
        <span class="rubro-cabeza">
          <span class="nombre">
            <span class="punto-rubro ${claseDeRubro(tipo, f.rubro)}" aria-hidden="true"></span>
            ${escapar(formatearRubro(f.rubro))}
          </span>
          <span class="importe">${escapar(formatearEuros(f.total, base))}</span>
        </span>
      </button>
      <div class="rubro-pie suave">
        <span>${Math.round((f.total / total) * 100)} %</span>
      </div>
    </li>`).join('');

  return `
    <section class="tarjeta">
      <h2>${titulo}</h2>
      <p class="suave nota">${matriz.filas.length === 1
        ? 'El único mes con movimientos'
        : `Los ${matriz.filas.length} meses de la tabla, sumados`}:
        ${escapar(formatearEuros(total, base))}.${incompletos > 0
        ? ' <strong>Falta plata acá</strong>: hay meses sin tipo de cambio y sus movimientos no están sumados.'
        : ''}</p>
      ${dibujarTorta(filas, tipo, base)}
      <ul class="rubros">${cuerpo}</ul>
    </section>
  `;
}

/** Lo que se ve cuando todavía no hay nada que comparar. */
function dibujarSinHistorial() {
  return `
    <section class="tarjeta">
      <h2>Evolución mes a mes</h2>
      <p class="suave">Todavía no cargaste ningún movimiento, así que no hay meses
      que comparar.</p>
      <button type="button" class="principal" data-accion="ir" data-pantalla="nuevo">
        Cargar un movimiento
      </button>
    </section>
  `;
}

/**
 * `mesActual` es **el mes en el que estamos**, no el que se está mirando: es el
 * que queda afuera del promedio por estar empezado. Se puede pasar aparte
 * porque si no, la única forma de probar esa regla sería esperar a que cambie
 * el mes.
 */
function dibujarEvolucion(vista, mesActual = mesDe(hoy())) {
  const base = monedaBaseDe(vista.estado);

  // Todo lo de esta pantalla sale de la misma lista de movimientos, así que el
  // período se aplica UNA vez, acá, recortando el historial (T-054). Abajo de
  // esta línea nada sabe que hay un período: las cuentas son las de siempre y no
  // pueden quedar desincronizadas entre sí.
  const recortado = estadoDelPeriodo(vista.estado, vista.periodo);
  const selector = dibujarPeriodo(vista);

  const matriz = matrizMesRubro(recortado, mesActual);
  if (matriz.filas.length === 0) return selector + dibujarSinHistorial();

  const incompletos = matriz.filas.filter((f) => f.incompleto).length;
  const aviso = incompletos === 0 ? '' : `
    <p class="suave nota">
      ${incompletos === 1 ? 'Un mes está marcado con un punto' : `${incompletos} meses están marcados con un punto`}
      porque les falta un tipo de cambio: su total está incompleto.
    </p>`;

  // Del más viejo al más nuevo, y abajo el total y el promedio: es el orden de
  // `Analisis1` y el que el usuario pidió explícitamente (2026-08-28).
  //
  // Estaba al revés, con este argumento: "lo primero que se mira es el mes
  // pasado". El argumento no era malo y estaba equivocado igual — esta tabla no
  // se lee para mirar un mes, se lee para seguir una línea de tiempo, y una
  // línea de tiempo va para adelante. Además así **la pantalla y la hoja del
  // .xlsx cuentan lo mismo en el mismo orden**, que es lo que tendría que haber
  // pesado desde el principio.
  const filas = matriz.filas.map((f) => dibujarFilaMes(f, matriz.rubros, matriz.rubrosIngreso)).join('');

  return `
    ${selector}
    <section class="tarjeta">
      <h2>Evolución mes a mes</h2>
      <div class="tabla-ancha" tabindex="0" role="region" aria-label="Gastos e ingresos por mes y por rubro">
        <table class="matriz">
          <thead>${dibujarEncabezadoMatriz(matriz.rubros, matriz.rubrosIngreso)}</thead>
          <tbody>${filas}</tbody>
          <tfoot>${dibujarPieMatriz(matriz)}</tfoot>
        </table>
      </div>
      <p class="suave nota deslizar">Deslizá la tabla para ver todos los rubros, los
      de gasto y los de ingreso. Los importes están en ${escapar(base)}, y tocando
      uno se ven los movimientos que lo componen.</p>
      ${dibujarNotaDelPromedio(matriz)}
      ${aviso}
    </section>
    ${dibujarRepartoDe(matriz, TIPO_GASTO, base, incompletos)}
    ${dibujarRepartoDe(matriz, TIPO_INGRESO, base, incompletos)}
    ${dibujarMesAMes(matriz.filas)}
    ${dibujarAcumuladoHistorico(acumuladoHistorico(recortado))}
    ${dibujarGastosFijos(recortado)}
  `;
}

// ── src/ui/pantallas/lista.js ───────────────────────────────────
// La lista del mes, corregir y borrar — CU-06.
//
// Un monto mal tipeado no puede quedar para siempre, así que esta pantalla es
// necesaria. Pero también es la única de la app que **destruye datos**, y no hay
// papelera ni historial detrás (ARQUITECTURA §11): lo que se borra acá se fue.
//
// De ahí las dos redes de contención, que son lo que más código ocupa en este
// archivo:
//
//   1. **Confirmar antes.** Un toque no borra: pregunta, mostrando qué
//      movimiento es. En un celular, el borrar y el editar quedan a milímetros.
//   2. **Deshacer después.** Confirmar no alcanza: la gente confirma en
//      automático. El deshacer es la red que atrapa al que ya dijo que sí.
//
// La segunda es la que de verdad sirve. La primera frena los accidentes; la
// segunda frena los arrepentimientos, que son más frecuentes.









/**
 * Saca un movimiento del estado y devuelve lo necesario para volver a ponerlo
 * donde estaba.
 *
 * Se guarda **la posición**, no solo el movimiento: restaurarlo al final de la
 * lista lo dejaría en otro lugar del que estaba, y el usuario que deshizo un
 * borrado espera encontrar todo exactamente como lo tenía.
 */
function borrarMovimiento(estado, id) {
  const posicion = estado.movimientos.findIndex((m) => m.id === id);
  if (posicion === -1) return { estado, borrado: null };

  return {
    estado: { ...estado, movimientos: estado.movimientos.filter((m) => m.id !== id) },
    borrado: { movimiento: estado.movimientos[posicion], posicion },
  };
}

/** Vuelve a poner un movimiento borrado en su lugar exacto. */
function restaurarMovimiento(estado, borrado) {
  if (!borrado) return estado;

  const movimientos = [...estado.movimientos];
  movimientos.splice(Math.min(borrado.posicion, movimientos.length), 0, borrado.movimiento);
  return { ...estado, movimientos };
}

function buscarMovimiento(estado, id) {
  return estado.movimientos.find((m) => m.id === id) ?? null;
}

// ── Dibujo ───────────────────────────────────────────────────────────────────

function importeDe(estado, movimiento) {
  try {
    const decimales = decimalesDe(estado.monedas, movimiento.moneda);
    const propio = formatearMonto(movimiento.monto, decimales, movimiento.moneda);
    if (movimiento.moneda === 'EUR') return { propio, enEuros: null };

    if (faltaCambioPara(movimiento, estado.tipos_cambio, monedaBaseDe(estado))) {
      return { propio, enEuros: null, sinCambio: true };
    }
    const base = monedaBaseDe(estado);
    return {
      propio,
      enEuros: formatearEuros(movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas, base), base),
    };
  } catch {
    // Un dato que no se puede formatear se muestra crudo antes que no mostrarse:
    // el usuario tiene que poder verlo para poder corregirlo o borrarlo.
    return { propio: `${movimiento.monto} ${movimiento.moneda}`, enEuros: null };
  }
}

/**
 * Los de un mismo día, del último cargado al primero — T-945.
 *
 * Los días ya van del más nuevo al más viejo, pero **adentro de cada día**
 * quedaban en el orden en que se habían cargado, así que lo último que anotaste
 * aparecía abajo de todo el día. Y esta pantalla se abre casi siempre por lo
 * mismo: arreglar el dedazo de hace dos minutos.
 *
 * ── Qué se usa para ordenar, y por qué NO es lo obvio ───────────────────────
 *
 * Lo obvio sería ordenar por `creado`. No alcanza: **`creado` es una fecha, no
 * un instante** —`2026-08-29`, sin hora—, así que todo lo cargado el mismo día
 * empata. Y el `id` tampoco sirve: es un número al azar, no uno que crece.
 *
 * Lo único que sabe el orden de carga es **la posición en la lista**, que es
 * donde se van agregando. Así que se da vuelta la lista y recién después se
 * ordena por `creado`, con un orden **estable**: los que empatan —los del mismo
 * día— se quedan como quedaron, o sea al revés de como se cargaron, que es lo
 * que se buscaba.
 *
 * Se probó primero con `creado` y con el `id`, y los tests lo desmintieron: los
 * tres movimientos de prueba salían en el orden original porque los tres
 * empataban en todo.
 */
function ultimoPrimero(movimientos) {
  return movimientos
    .slice()
    .reverse()
    .sort((a, b) => String(b.creado ?? '').localeCompare(String(a.creado ?? '')));
}

/**
 * El total de una lista de movimientos, en euros.
 *
 * **No cuenta como cero lo que no se puede convertir**: lo aparta, igual que
 * `totalesDelMes()`. Si contara los sin cambio como cero, el total de la lista
 * filtrada no cerraría con el número que el usuario acaba de tocar, y no habría
 * forma de saber cuál de los dos creer.
 */
function totalDe(estado, movimientos) {
  const { convertibles } = separarConvertibles(movimientos, estado.tipos_cambio);
  return sumar(convertibles.map((m) => movimientoEnEuros(m, estado.tipos_cambio, estado.monedas)));
}

function dibujarMovimiento(estado, movimiento, vista) {
  const importe = importeDe(estado, movimiento);
  const esGasto = movimiento.tipo === TIPO_GASTO;
  const confirmando = vista.borrando === movimiento.id;

  const detalle = [movimiento.comentario, movimiento.detalle].filter(Boolean).join(' · ');

  return `
    <li class="movimiento${confirmando ? ' confirmando' : ''}">
      <div class="movimiento-datos">
        <span class="nombre">
          <span class="punto-rubro ${claseDeRubro(movimiento.tipo, movimiento.rubro)}" aria-hidden="true"></span>
          ${escapar(formatearRubro(movimiento.rubro))}
        </span>
        <span class="importe ${esGasto ? 'gasto' : 'ingreso'}">${escapar(importe.propio)}</span>
      </div>

      ${detalle || importe.enEuros || importe.sinCambio ? `
      <div class="movimiento-pie suave">
        <span>${escapar(detalle)}</span>
        <span>${
          importe.sinCambio
            ? 'sin tipo de cambio'
            : importe.enEuros ? escapar(importe.enEuros) : ''
        }</span>
      </div>` : ''}

      ${confirmando ? `
      <div class="confirmar-borrado" role="alertdialog" aria-label="Confirmar borrado">
        <p>¿Borrar este movimiento?</p>
        <div class="botones">
          <button type="button" class="peligro" data-accion="borrar-si" data-id="${escapar(movimiento.id)}">Sí, borrar</button>
          <button type="button" class="secundario" data-accion="borrar-no">No</button>
        </div>
      </div>` : `
      <div class="movimiento-acciones">
        <button type="button" class="secundario chico" data-accion="editar" data-id="${escapar(movimiento.id)}">Corregir</button>
        <button type="button" class="secundario chico" data-accion="borrar" data-id="${escapar(movimiento.id)}">Borrar</button>
      </div>`}
    </li>
  `;
}

/**
 * El aviso de deshacer.
 *
 * No se cierra solo a los tres segundos, como suelen hacerse: en un celular, tres
 * segundos es el tiempo que tarda alguien en darse cuenta de lo que hizo. Se
 * queda hasta que se lo cierra o hasta que se cambia de pantalla.
 */
function dibujarDeshacer(vista) {
  if (!vista.borrado) return '';

  const { movimiento } = vista.borrado;
  return `
    <section class="deshacer" role="status">
      <p>Borraste <strong>${escapar(formatearRubro(movimiento.rubro))}</strong>
      del ${escapar(formatearFecha(movimiento.fecha))}.</p>
      <button type="button" class="secundario" data-accion="deshacer">Deshacer</button>
    </section>
  `;
}

/**
 * La lista del mes, agrupada por día y del más nuevo al más viejo.
 *
 * Del más nuevo al más viejo porque lo que se corrige casi siempre es lo último
 * que se cargó: tenerlo arriba evita desplazarse por un mes entero para arreglar
 * un dedazo de hace dos minutos.
 */
/**
 * El cartel de que la lista está filtrada — T-026.
 *
 * **Es obligatorio y no decorativo.** Una lista que muestra siete movimientos de
 * doscientos, sin decir por qué, no se lee como "filtrada": se lee como datos
 * perdidos. Así que dice **en qué está filtrada** y trae la salida al lado.
 */
function dibujarFiltro(vista) {
  const filtro = vista.filtro;
  if (!hayFiltro(filtro)) return '';

  const partes = [];
  // El rubro va con su tipo al lado, desde que la tabla mes a mes tiene también
  // los rubros de ingreso: `otros` está en las dos listas y son cosas distintas
  // (RN-02). "Mostrando solo Otros" no dice cuál de los dos se está mirando.
  if (filtro.rubro !== undefined) {
    const tipo = filtro.tipo === undefined
      ? ''
      : ` (${filtro.tipo === TIPO_GASTO ? 'gastos' : 'ingresos'})`;
    partes.push(`${formatearRubro(filtro.rubro)}${tipo}`);
  }
  if (filtro.comentario !== undefined) partes.push(filtro.comentario);
  if (filtro.rubro === undefined && filtro.comentario === undefined && filtro.tipo !== undefined) {
    partes.push(filtro.tipo === TIPO_GASTO ? 'gastos' : 'ingresos');
  }
  const cuando = filtro.todosLosMeses ? 'en todos los meses' : `en ${formatearMes(vista.mes)}`;

  return `
    <section class="tarjeta filtro" role="status">
      <p>Mostrando solo <strong>${escapar(partes.join(' · '))}</strong> ${escapar(cuando)}.</p>
      <button type="button" class="secundario" data-accion="quitar-filtro">Ver todo</button>
    </section>
  `;
}

/**
 * La lupa — T-943.
 *
 * Va **arriba de todo** en la pestaña de movimientos, que es donde uno la busca
 * cuando no se acuerda en qué mes fue algo.
 *
 * El campo es `type="search"`: en un teléfono el teclado trae la tecla "buscar"
 * en vez de "enter", y el navegador agrega solo la crucecita para vaciarlo.
 */
function dibujarBuscador(vista) {
  return `
    <section class="tarjeta buscador">
      <label class="campo con-lupa">
        <span class="lupa" aria-hidden="true">🔍</span>
        <input name="busqueda" type="search" autocomplete="off" enterkeyhint="search"
               data-accion-entrada="buscar" aria-label="Buscar en todos los movimientos"
               placeholder="Buscar en todos los movimientos"
               value="${escapar(vista.busqueda ?? '')}">
      </label>
    </section>
  `;
}

/**
 * Los resultados de la búsqueda.
 *
 * Se dibuja aparte del resto porque es lo único que se redibuja mientras se
 * escribe: tocar el formulario entero en cada tecla le sacaría el foco al campo
 * y movería el cursor (ADR-023).
 *
 * **Mira todo el historial**, así que cada resultado dice de qué día es: sin la
 * fecha, una lista de gastos de once meses distintos no se puede leer.
 */
function dibujarResultados(vista) {
  const palabras = palabrasDe(vista.busqueda);
  if (palabras.length === 0) return '';

  const encontrados = buscar(vista.estado, vista.busqueda);
  if (encontrados.length === 0) {
    return `
      <section class="tarjeta">
        <p class="suave">Ningún movimiento dice
        <strong>${escapar(String(vista.busqueda).trim())}</strong>.</p>
        <p class="suave">Se busca en la etiqueta, el detalle, el rubro, el importe,
        la moneda y la fecha, sin distinguir mayúsculas ni tildes. Con varias
        palabras, tienen que estar todas.</p>
      </section>
    `;
  }

  const cuantos = encontrados.length === 1 ? '1 movimiento' : `${encontrados.length} movimientos`;
  const total = totalDe(vista.estado, encontrados);

  const cuerpo = encontrados.map((m) => `
    <li class="resultado">
      <span class="cuando-resultado suave">${escapar(formatearFechaLarga(m.fecha))}</span>
      <ul class="movimientos">${dibujarMovimiento(vista.estado, m, vista)}</ul>
    </li>`).join('');

  return `
    <p class="cuantos suave">${cuantos} · <strong>${escapar(formatearEuros(total, monedaBaseDe(vista.estado)))}</strong>
    en total, en todos los meses.</p>
    <ul class="resultados">${cuerpo}</ul>
  `;
}

function dibujarLista(vista) {
  const { estado, mes } = vista;

  // Buscando, la lista del mes no se dibuja: serían dos listas de movimientos
  // una abajo de la otra, y la de abajo se leería como parte de los resultados.
  if (palabrasDe(vista.busqueda).length > 0) {
    return `
      ${dibujarDeshacer(vista)}
      ${dibujarBuscador(vista)}
      <div data-resultados>${dibujarResultados(vista)}</div>
    `;
  }

  const filtrada = hayFiltro(vista.filtro);
  const delMes = filtrada
    ? movimientosFiltrados(estado, mes, vista.filtro)
    : movimientosDelMes(estado.movimientos, mes);

  if (delMes.length === 0) {
    // Con un filtro puesto, "no hay movimientos en este mes" sería mentira: los
    // hay, pero ninguno entra en el filtro. Y el botón de cargar uno nuevo sería
    // el consejo equivocado: lo que hace falta es sacar el filtro.
    if (filtrada) {
      return `
        ${dibujarDeshacer(vista)}
        ${dibujarBuscador(vista)}
        <div data-resultados></div>
        ${dibujarFiltro(vista)}
        <section class="tarjeta">
          <p class="suave">Ningún movimiento entra en este filtro.</p>
        </section>
      `;
    }
    // La lupa se dibuja igual: que este mes esté vacío es justamente cuando más
    // falta hace buscar en los otros.
    return `
      ${dibujarDeshacer(vista)}
      ${dibujarBuscador(vista)}
      <div data-resultados></div>
      <section class="tarjeta">
        <h2>${escapar(formatearMes(mes))}</h2>
        <p class="suave">No hay movimientos en este mes.</p>
        <button type="button" class="principal" data-accion="ir" data-pantalla="nuevo">
          Cargar un movimiento
        </button>
      </section>
    `;
  }

  // Sin ningún tope de filas: se muestran todos los del mes (L-001).
  const porFecha = new Map();
  for (const movimiento of delMes) {
    if (!porFecha.has(movimiento.fecha)) porFecha.set(movimiento.fecha, []);
    porFecha.get(movimiento.fecha).push(movimiento);
  }

  const dias = [...porFecha.keys()].sort().reverse();
  const cuerpo = dias
    .map((fecha) => `
      <section class="tarjeta dia">
        <h2>${escapar(formatearFechaLarga(fecha))}</h2>
        <ul class="movimientos">
          ${ultimoPrimero(porFecha.get(fecha)).map((m) => dibujarMovimiento(estado, m, vista)).join('')}
        </ul>
      </section>`)
    .join('');

  const cuantos = delMes.length === 1 ? '1 movimiento' : `${delMes.length} movimientos`;
  const total = filtrada ? totalDe(estado, delMes) : null;

  // Con filtro se muestra el total de lo filtrado: es el número que se venía a
  // desarmar, y verlo repetido acá es la confirmación de que la lista de abajo
  // es de verdad lo que compone ese total.
  const encabezado = filtrada
    ? `<p class="cuantos suave">${cuantos} · <strong>${escapar(formatearEuros(total, monedaBaseDe(estado)))}</strong></p>`
    : `<p class="cuantos suave">${cuantos} en ${escapar(formatearMes(mes))}.</p>`;

  return `
    ${dibujarDeshacer(vista)}
    ${dibujarBuscador(vista)}
    <div data-resultados></div>
    ${dibujarFiltro(vista)}
    ${encabezado}
    ${cuerpo}
  `;
}

// ── src/ui/pantallas/datos.js ───────────────────────────────────
// La pantalla de Datos — CU-07: sacar los datos del dispositivo.
//
// Es la pantalla más importante de la app y la que menos se usa. Los gastos
// viven en un solo navegador: "limpiar datos de navegación" en el celular se los
// lleva todos, y no hay servidor ni papelera de donde recuperarlos. Este archivo
// es la única salida.
//
// Por eso hay **dos caminos** para el mismo respaldo y no uno:
//
//   1. **Descargar el archivo.** Es el camino normal.
//   2. **Ver el texto y copiarlo.** Es el camino para cuando el primero no
//      funciona — y puede no funcionar: la app se abre desde un archivo del
//      disco (`file://`), y ahí las descargas dependen del navegador y del
//      sistema. Un respaldo que solo funciona si el navegador coopera no es un
//      respaldo. El texto a la vista se puede copiar y pegar en cualquier lado.
//
// La segunda no es una curiosidad para programadores: es la red de contención de
// la única red de contención que tiene el usuario.










/** Un tamaño legible: 12 kB dice más que 12.283 bytes. */
function tamanoLegible(bytes) {
  if (bytes < 1024) return `${bytes} bytes`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1).replace('.', ',')} kB`;
  return `${(bytes / (1024 * 1024)).toFixed(1).replace('.', ',')} MB`;
}

/**
 * El aviso de cuánto hace que no se respalda.
 *
 * Se dice siempre, no solo cuando pasó mucho: saber que respaldaste ayer es
 * información útil, y un aviso que solo aparece cuando hay problema enseña a
 * ignorarlo cuando aparece.
 */
function dibujarEstadoRespaldo(estado, { fecha = hoy() } = {}) {
  const dias = diasSinRespaldar(estado, { fecha });
  const cuantos = (estado.movimientos ?? []).length;

  if (cuantos === 0) {
    return `<p class="suave">Todavía no cargaste nada, así que no hay nada que respaldar.</p>`;
  }

  if (dias === null) {
    return `
      <p class="aviso-respaldo pendiente-respaldo" role="status">
        <strong>Nunca respaldaste.</strong> Tus ${cuantos === 1 ? 'datos viven' : `${cuantos} movimientos viven`}
        solo en este navegador: si se borran los datos de navegación, se pierden.
      </p>`;
  }

  if (dias === 0) return `<p class="aviso-respaldo suave">Respaldaste hoy.</p>`;
  if (dias === 1) return `<p class="aviso-respaldo suave">Respaldaste ayer.</p>`;

  const hace = `Hace ${dias} días que no respaldás.`;
  return dias >= 7
    ? `<p class="aviso-respaldo pendiente-respaldo" role="status"><strong>${hace}</strong>
       Todo lo que cargaste desde entonces existe en un solo lugar.</p>`
    : `<p class="aviso-respaldo suave">${escapar(hace)}</p>`;
}

/**
 * ¿Se ofrece el botón de compartir? — T-914.
 *
 * Dos condiciones: que el navegador diga que puede, **y** que no haya fallado
 * antes en este teléfono. Lo segundo hace falta porque lo primero miente: en el
 * Android del usuario `canShare({files})` dice que sí y `share()` falla con
 * "Permission denied". Un botón que falla al apretarlo es peor que uno que no
 * está (L-016), y repetirlo cada semana enseña a desconfiar de la pantalla justo
 * donde el usuario tiene que confiar.
 */
function ofreceCompartir(vista) {
  return vista.puedeCompartir === true && !compartirFallo(vista);
}

/** Si ya se comprobó que compartir no funciona acá. */
function compartirFallo(vista) {
  return vista.estado?.preferencias?.compartir_no_funciona === true;
}

/**
 * Qué tan a salvo están los datos en ESTE navegador — T-950.
 *
 * No es un adorno: si el navegador **no** concedió el almacenamiento
 * permanente, puede borrar lo guardado para hacer lugar cuando el teléfono se
 * quede sin espacio, y entonces el respaldo deja de ser una recomendación. El
 * usuario tiene derecho a saber en cuál de los dos casos está.
 *
 * Cuando no se sabe —un navegador que no contesta, o que todavía no contestó—
 * **se dice que no se sabe**. Inventar un "estás protegido" es peor que no
 * decir nada: alguien dejaría de respaldar por eso.
 */
function dibujarPersistencia(persistencia) {
  if (persistencia === undefined) return '';

  const texto = {
    'sí': `Este navegador se comprometió a <strong>no borrar</strong> tus datos
      para hacer lugar. Igual conviene respaldar: eso no te cubre si borrás los
      datos de navegación ni si cambiás de teléfono.`,
    'no': `Este navegador <strong>no</strong> se comprometió a conservar tus
      datos: si el dispositivo se queda sin espacio, puede borrarlos para hacer
      lugar. Respaldá seguido.`,
    'no se sabe': `No se pudo averiguar si este navegador conserva los datos
      cuando falta espacio. Tratalo como si no: respaldá seguido.`,
  }[persistencia];

  return texto ? `<p class="suave nota">${texto}</p>` : '';
}

function dibujarDatos(vista) {
  const estado = vista.estado;
  const respaldo = prepararRespaldo(estado);
  const cuantos = (estado.movimientos ?? []).length;

  return `
    <section class="tarjeta">
      <h2>Respaldo</h2>

      ${dibujarEstadoRespaldo(estado)}
      ${dibujarPersistencia(vista.persistencia)}

      ${vista.error ? `<p class="error-carga" role="alert">${escapar(vista.error)}</p>` : ''}
      ${vista.avisoRespaldo ? `<p class="confirmacion" role="status">${escapar(vista.avisoRespaldo)}</p>` : ''}

      <p class="suave">El archivo lleva <strong>todo</strong>: los
      ${cuantos === 1 ? '1 movimiento' : `${cuantos} movimientos`}, los tipos de

      puede abrir con cualquier editor de texto, sin esta app.</p>

      ${ofreceCompartir(vista) ? `

      <button type="button" class="${ofreceCompartir(vista) ? 'secundario' : 'principal'}" data-accion="exportar"${cuantos === 0 ? ' disabled' : ''}>
        Descargar ${escapar(respaldo.nombre)}
      </button>

      <!-- El segundo camino. No es una curiosidad: la app se abre desde un
           archivo del disco, y ahí las descargas dependen del navegador. Un

      <button type="button" class="secundario" data-accion="ver-respaldo"${cuantos === 0 ? ' disabled' : ''}>
        ${vista.mostrarRespaldo ? 'Ocultar el texto' : 'Ver el texto para copiarlo'}
      </button>

      <!-- Cuando compartir no funciona en este teléfono no se explica nada: el

      ${compartirFallo(vista) ? `

      </p>` : ''}

      ${vista.mostrarRespaldo ? `

      <textarea class="respaldo-texto" readonly rows="12"
                aria-label="Contenido del respaldo">${escapar(respaldo.contenido)}</textarea>` : ''}
    </section>

    <section class="tarjeta">
      <h2>Dónde guardarlo</h2>
      <p class="suave">La app no sube nada a ningún lado y nunca lo va a hacer

      <p class="suave">Ojo con esto: un respaldo guardado en la nube deja de ser

    </section>

    ${dibujarPlanilla(vista)}

    ${dibujarImportar(vista)}

    ${dibujarPlanillaVieja(vista)}

    <!-- Las pantallas de historial también se ofrecen acá, y no solo desde el

    <section class="tarjeta">

 `;

/**

 * Es la única operación de la app que puede **destruir datos que el usuario no

 * Por eso la pantalla tiene tres pasos y no uno: elegir el archivo, **ver qué va

 */
function dibujarImportar(vista) {

  return `
    <section class="tarjeta">

        <span>Elegir el archivo</span>

/**

    <div class="opcion-importar peligrosa">

        ${datos.sePierden > 0
          ? `<strong class="perdida">${datos.sePierden === 1
              ? 'Se borraría 1 movimiento que tenés ahora y no está en el archivo'

      </p>
      <button type="button" class="peligro" data-accion="importar" data-modo="${MODO_REEMPLAZAR}">

      </button>
