<style>
/* Estilos base. Sin fuentes externas: usar una fuente de un CDN haría que ese
   CDN viera la IP y la hora de uso de la app, lo que rompe RN-06. */

:root {
  --fondo: #fbfaf8;
  --superficie: #ffffff;
  --borde: #e3ded6;
  --texto: #1c1a17;
  --texto-suave: #6b645b;
  --acento: #2f6f4e;
  --gasto: #a4342c;
  --ingreso: #2f6f4e;
  --radio: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #171614;
    --superficie: #211f1c;
    --borde: #38342f;
    --texto: #f0ece6;
    --texto-suave: #a49c91;
    --acento: #6fbb90;
    --gasto: #e08b83;
    --ingreso: #6fbb90;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.app {
  max-width: 40rem;
  margin: 0 auto;
  padding: 1.25rem 1rem 4rem;
}

.encabezado {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--borde);
  margin-bottom: 1.25rem;
}

.encabezado h1 {
  margin: 0;
  font-size: 1.5rem;
  letter-spacing: -0.02em;
}

.version {
  font-size: 0.8125rem;
  color: var(--texto-suave);
  font-variant-numeric: tabular-nums;
}

.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 1rem 1.125rem;
  margin-bottom: 1rem;
}

.tarjeta h2 {
  margin: 0 0 0.5rem;
  font-size: 1rem;
}

.tarjeta p { margin: 0 0 0.5rem; }
.tarjeta p:last-child { margin-bottom: 0; }

.suave { color: var(--texto-suave); font-size: 0.9375rem; }

.estado {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.875rem;
  color: var(--texto-suave);
}

.punto {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--acento);
}

.aviso {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 1rem;
}

ul.pasos { margin: 0.5rem 0 0; padding-left: 1.25rem; }
ul.pasos li { margin-bottom: 0.25rem; }

/* ── Armazón (T-010) ──────────────────────────────────────────────────────────
   Pensado para un celular sostenido con una mano. Dos reglas mandan:
   los controles se tocan con el pulgar, y los números se leen en columna. */

body {
  /* El teléfono con muesca: que la barra de abajo no quede debajo del borde. */
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.app {
  /* Sitio para la barra de navegación, que va fija abajo. */
  padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0));
}

/* El mes que se está mirando. Es la pregunta que la app viene a responder,
   así que está arriba de todo y se cambia sin buscar nada. */
.mes {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 1.25rem;
}

.mes-nombre {
  font-size: 1.125rem;
  font-weight: 600;
  text-align: center;
  flex: 1;
  /* Sin esto, el nombre del mes salta de lugar al pasar de mayo a septiembre. */
  min-width: 10rem;
}

.flecha {
  /* 2,75rem = 44px: el mínimo que una persona acierta con el pulgar sin mirar.
     Un botón de 24px obliga a apuntar, y apuntar en el subte es fallar. */
  width: 2.75rem;
  height: 2.75rem;
  flex: none;
  font-size: 1.5rem;
  line-height: 1;
  color: var(--texto);
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  cursor: pointer;
}

.flecha:active { background: var(--borde); }

/* Los avisos del almacenamiento: datos que no se pudieron leer, espacio
   agotado. Es la información que evita perder datos, así que se ve. */
.aviso.importante {
  border-color: var(--gasto);
  border-left-width: 4px;
  margin-bottom: 1.25rem;
}

.aviso.importante h2 { margin: 0 0 0.5rem; font-size: 1rem; color: var(--gasto); }
.aviso.importante ul { margin: 0; padding-left: 1.25rem; }
.aviso.importante li { margin-bottom: 0.375rem; }
.aviso.importante li:last-child { margin-bottom: 0; }

.pendiente { font-style: italic; }

/* La barra de navegación va ABAJO: en un celular sostenido con una mano, la
   parte de arriba de la pantalla es donde el pulgar no llega. */
.navegacion {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  background: var(--superficie);
  border-top: 1px solid var(--borde);
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.pestania {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.125rem;
  padding: 0.625rem 0.25rem;
  min-height: 3.5rem;
  font-size: 0.75rem;
  font-family: inherit;
  color: var(--texto-suave);
  background: none;
  border: none;
  cursor: pointer;
}

.pestania .icono { font-size: 1.25rem; line-height: 1; }
.pestania.activa { color: var(--acento); font-weight: 600; }
.pestania.nueva { color: var(--acento); }
.pestania:active { background: var(--fondo); }

/* Los importes se leen comparándolos entre sí, y para eso todas las cifras
   tienen que ocupar lo mismo. Sin esto, un 1 es más angosto que un 8 y las
   columnas de una lista de gastos quedan dentadas. */
.importe, .mes-nombre, td.numero { font-variant-numeric: tabular-nums; }

/* Nadie llega a un dato de dinero por accidente: el foco tiene que verse. */
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

@media (prefers-reduced-motion: no-preference) {
  .pestania, .flecha { transition: background-color 0.12s ease; }
}

/* ── Pantalla de carga (T-011) ───────────────────────────────────────────────
   El objetivo es anotar un gasto en quince segundos, parado en la calle. Todo
   lo de acá sale de eso: campos grandes, teclado correcto, y el botón de
   guardar donde cae el pulgar. */

.formulario { display: flex; flex-direction: column; gap: 0.875rem; }
.formulario h2 { margin: 0; }

.campo { display: flex; flex-direction: column; gap: 0.3rem; }
.campo > span { font-size: 0.875rem; color: var(--texto-suave); }
.campo em { font-style: normal; }

.formulario input,
.formulario select {
  /* 16px exactos: con menos, Safari en iPhone hace zoom al enfocar el campo y
     la pantalla queda corrida. Es un comportamiento del sistema, no un estilo. */
  font-size: 1rem;
  font-family: inherit;
  color: var(--texto);
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 0.75rem;
  min-height: 2.75rem;
  width: 100%;
}

.monto-fila { display: flex; gap: 0.5rem; }
.monto-fila input {
  /* El monto es lo único que la app no puede adivinar, así que es lo más
     grande de la pantalla. */
  font-size: 1.5rem;
  font-weight: 600;
  text-align: right;
}
.monto-fila select { width: 6rem; flex: none; text-align: center; }

.tipo { display: flex; gap: 0.5rem; }

.opcion-tipo {
  flex: 1;
  min-height: 2.75rem;
  font-size: 1rem;
  font-family: inherit;
  color: var(--texto-suave);
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  cursor: pointer;
}

.opcion-tipo.activa {
  color: var(--superficie);
  background: var(--acento);
  border-color: var(--acento);
  font-weight: 600;
}

.principal {
  min-height: 3rem;
  font-size: 1rem;
  font-weight: 600;
  font-family: inherit;
  color: var(--superficie);
  background: var(--acento);
  border: none;
  border-radius: var(--radio);
  cursor: pointer;
}

.principal:active { filter: brightness(0.92); }

/* El error se lee ANTES del formulario, no después: si estuviera abajo, en un
   celular habría que desplazarse para enterarse de por qué no se guardó. */
.error-carga {
  margin: 0;
  padding: 0.75rem;
  border-radius: var(--radio);
  border: 1px solid var(--gasto);
  border-left-width: 4px;
  color: var(--gasto);
  font-size: 0.9375rem;
}

.confirmacion {
  margin: 0;
  padding: 0.75rem;
  border-radius: var(--radio);
  border: 1px solid var(--ingreso);
  border-left-width: 4px;
  font-size: 0.9375rem;
}

/* Las últimas líneas cargadas, solo para confirmar que entraron. */
.lineas { list-style: none; margin: 0; padding: 0; }

.linea {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 0.5rem;
  align-items: baseline;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--borde);
  font-size: 0.9375rem;
}

.linea:last-child { border-bottom: none; }
.linea .fecha { color: var(--texto-suave); font-variant-numeric: tabular-nums; }
.linea .rubro { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linea .importe { font-variant-numeric: tabular-nums; font-weight: 600; }
.linea.gasto .importe { color: var(--gasto); }
.linea.ingreso .importe { color: var(--ingreso); }

/* La fecha en palabras, debajo del calendario del sistema. El formato de ese
   control lo elige el navegador según su idioma —puede mostrar 08/25/2026— y no
   hay forma de decidirlo desde la app. Esto lo vuelve irrelevante. Ver L-013. */
/* La fila de la fecha: el calendario ocupa lo que puede y el botón "Hoy"
   —que solo está cuando la fecha no es la de hoy (T-052)— va a su lado sin
   estirarse. */
/* Los dos selectores del período (T-054), lado a lado: son una sola pregunta
   —"entre cuándo y cuándo"— y separados en dos filas se leen como dos. */
.periodo { display: flex; gap: 0.75rem; }
.periodo .campo { flex: 1; min-width: 0; }
.periodo select { width: 100%; }

.fecha-fila { display: flex; gap: 0.5rem; align-items: center; }
.fecha-fila input { flex: 1; min-width: 0; }
.fecha-fila button { flex: none; }

.fecha-legible {
  font-size: 0.875rem;
  color: var(--texto-suave);
  min-height: 1.25rem;
}

/* ── Tipos de cambio (T-012) ─────────────────────────────────────────────── */

.secundario {
  min-height: 2.75rem;
  font-size: 0.9375rem;
  font-family: inherit;
  color: var(--acento);
  background: none;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 0 1rem;
  cursor: pointer;
}

.secundario.chico { min-height: 2.25rem; font-size: 0.875rem; padding: 0 0.75rem; }
.secundario:active { background: var(--fondo); }

/* El sufijo de la moneda al lado del número: "1 EUR son [630] CRC". Escribir
   el tipo de cambio al revés es el error más fácil acá, y tenerlo escrito en
   la misma línea es lo que lo hace difícil de cometer. */
.sufijo {
  display: flex;
  align-items: center;
  padding: 0 0.75rem;
  font-weight: 600;
  color: var(--texto-suave);
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
}

/* El gasto que quedó esperando mientras se pide el tipo de cambio. Sin esto,
   la interrupción parece que salió de la nada. */
.en-espera {
  margin: 0 0 1rem;
  padding: 0.75rem;
  border-radius: var(--radio);
  border: 1px dashed var(--borde);
  color: var(--texto-suave);
  font-size: 0.9375rem;
}

.linea-cambio {
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--borde);
}

.linea-cambio:last-child { border-bottom: none; }
.mes-cambio { font-weight: 600; margin-right: 0.5rem; }

/* Una moneda oculta se ve apagada. La clase estaba puesta en el HTML y no tenía
   ninguna regla acá: la fila decía "oculta" y se veía igual que las demás. Lo
   encontró la captura del recorrido (T-024). No se usa solo el color: la
   palabra "oculta" está escrita en la fila. */
.linea-cambio.apagada { opacity: 0.6; }

.valor-cambio {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}

/* ── Resumen del mes (T-014) ─────────────────────────────────────────────────
   Los tres números de arriba y el desglose por rubro. Las decisiones de forma
   y su porqué están en src/ui/pantallas/resumen.js. */

.totales {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem 1.25rem;
}

.total { display: flex; flex-direction: column; gap: 0.125rem; }
.total.saldo { grid-column: 1 / -1; padding-top: 0.875rem; border-top: 1px solid var(--borde); }

.etiqueta { font-size: 0.8125rem; color: var(--texto-suave); }

/* Deliberadamente SIN cifras de ancho fijo: en un número grande, el ancho fijo
   abre huecos entre los dígitos y se lee peor. El ancho fijo es para las
   columnas de la tabla de abajo, donde sirve para comparar. */
.cifra {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.total.saldo .cifra { font-size: 1.875rem; }
.cifra.gasto { color: var(--gasto); }
.cifra.ingreso { color: var(--ingreso); }

.promedio { margin: -0.5rem 0 1rem; padding: 0 0.125rem; }

/* El desglose. Filas separadas por aire, no por líneas: una lista de ocho
   rubros con ocho divisorias se lee como una reja. */
.rubros { list-style: none; margin: 0; padding: 0; }
.fila-rubro { margin-bottom: 1rem; }
.fila-rubro:last-child { margin-bottom: 0; }

.rubro-cabeza,
.rubro-pie {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.75rem;
}

.rubro-cabeza .nombre { font-weight: 500; }
.rubro-cabeza .importe { font-variant-numeric: tabular-nums; font-weight: 600; }
.rubro-pie { font-size: 0.8125rem; margin-top: 0.25rem; }

/* ── La torta del mes (T-918) ────────────────────────────────────────────────
   Reemplazó a las barras de proporción por pedido del usuario: es la forma que
   tiene en su planilla. Debajo queda la lista con los números, que es donde se
   compara con precisión. */
.torta {
  display: block;
  width: 100%;
  max-width: 15rem;
  margin: 0 auto 1rem;
}

.porcion {
  /* El hueco entre porciones no se dibuja: se pinta el borde del color de la
     tarjeta. Sin él, dos rubros vecinos se leen como una sola mancha. */
  stroke: var(--superficie);
  stroke-width: 2;
  stroke-linejoin: round;
}

/* El único texto de la app que NO usa un color de texto: va encima de un color
   de rubro, así que el color se elige contra ESE fondo y no contra la tarjeta.
   Con ocho tonos alcanzaba el negro; entre los veinte hay oscuros —la ciruela,
   el violeta— donde el negro no se lee y el blanco sí, así que la tinta se
   elige por franja. Cuáles llevan blanco lo calcula `tintaSobreRubro()` en
   core/paleta.js, y un test comprueba que lo de acá abajo coincida: dos listas
   escritas a mano se separan el día que se toca un color (T-049). */
.rotulo-porcion {
  fill: #000000;
  font-size: 15px;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

/* Fondo claro: las franjas donde el blanco contrasta más que el negro. */
.rotulo-porcion.rubro-4,
.rotulo-porcion.rubro-5,
.rotulo-porcion.rubro-9,
.rotulo-porcion.rubro-11,
.rotulo-porcion.rubro-12,
.rotulo-porcion.rubro-13,
.rotulo-porcion.rubro-17,
.rotulo-porcion.rubro-19,
.rotulo-porcion.rubro-20 { fill: #ffffff; }

@media (prefers-color-scheme: dark) {
  /* Los tonos del fondo oscuro son otros, así que la lista también. */
  .rotulo-porcion.rubro-3,
  .rotulo-porcion.rubro-4,
  .rotulo-porcion.rubro-5,
  .rotulo-porcion.rubro-9,
  .rotulo-porcion.rubro-11,
  .rotulo-porcion.rubro-17,
  .rotulo-porcion.rubro-20 { fill: #ffffff; }

  .rotulo-porcion.rubro-12,
  .rotulo-porcion.rubro-13,
  .rotulo-porcion.rubro-19 { fill: #000000; }
}

/* ── La línea del acumulado (T-918) ──────────────────────────────────────── */
.linea-acumulado {
  display: block;
  width: 100%;
  overflow: visible;
}

.linea-acumulado .eje {
  stroke: var(--borde);
  stroke-width: 1;
}

.linea-acumulado .traza {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  /* El SVG se estira a lo ancho del teléfono: sin esto el trazo se estiraría
     con él y las dos líneas tendrían grosores distintos. */
  vector-effect: non-scaling-stroke;
}

.linea-acumulado .traza.gasto { stroke: var(--gasto); }
.linea-acumulado .traza.ingreso { stroke: var(--ingreso); }

/* El saldo va en color de texto y no en un tercer color de serie: es un
   resultado de los otros dos, no una cosa más. Y así la única forma de
   confundirlo con un gasto o un ingreso sería no leer su rótulo, que está
   escrito donde la línea termina. */
.linea-acumulado .traza.saldo { stroke: var(--texto); stroke-dasharray: 5 3; }
.linea-acumulado .rotulo-traza.saldo { fill: var(--texto); }

/* ── La lupa y los resultados (T-943) ─────────────────────────────────────── */

.tarjeta.buscador { padding: 0.75rem 1rem; }

/* La lupa va ADENTRO del campo, a la izquierda del texto: es lo que hace que se
   lea como una búsqueda antes de tocarla. El relleno del input le deja lugar. */
.campo.con-lupa { position: relative; }

.campo.con-lupa .lupa {
  position: absolute;
  left: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
  pointer-events: none;
}

.campo.con-lupa input { padding-left: 2.5rem; }

.resultados { list-style: none; margin: 0; padding: 0; }

.resultado + .resultado { margin-top: 0.75rem; }

/* Cada resultado dice de qué día es: la búsqueda cruza once meses, y una lista
   de gastos sin fecha no se puede leer. */
.cuando-resultado {
  display: block;
  font-size: 0.8125rem;
  margin-bottom: 0.25rem;
}

.resultado .movimientos { list-style: none; margin: 0; padding: 0; }

/* ── Los gráficos que se pueden recorrer (T-942) ─────────────────────────── */

.grafico .linea-acumulado {
  /* Sin esto, arrastrar el dedo dentro del gráfico desplaza la PÁGINA y el
     gesto nunca llega al gráfico. Es la línea que hace que el zoom exista. */
  touch-action: none;
  cursor: grab;
  margin-top: 0.5rem;
}

.controles-grafico {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.75rem;
}

.controles-grafico button { min-width: 3rem; }

/* La leyenda y la lectura comparten forma: un cuadradito del color y el nombre.
   Así lo que se lee abajo se ata a la línea de arriba sin depender del color
   solo, que es lo que pide la guía de visualización. */
.leyenda,
.lectura {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1rem;
  margin: 0.5rem 0 0;
  font-size: 0.875rem;
}

.lectura { margin-top: 0.75rem; }
.lectura .cuando { flex-basis: 100%; }

.valor-serie { display: flex; align-items: center; gap: 0.375rem; }

.marca-serie {
  width: 0.75rem;
  height: 0.1875rem;
  border-radius: 0.125rem;
  background: var(--texto-suave);
}

.marca-serie.gasto { background: var(--gasto); }
.marca-serie.ingreso { background: var(--ingreso); }
.marca-serie.saldo { background: var(--texto); }

/* Las marcas del eje: finitas, una por punto mientras entren. */
.linea-acumulado .marca { stroke: var(--borde); stroke-width: 1; }

/* Las líneas de importe cruzan el dibujo enteras y van MUY apagadas: son una
   referencia para leer una altura, no un dato. Si compitieran con las series,
   el gráfico pasaría a ser una grilla con líneas encima. */
.linea-acumulado .guia-importe { stroke: var(--borde); stroke-width: 1; }
.linea-acumulado .marca-eje.importe { text-anchor: end; }

.linea-acumulado .marca-eje.inicio { text-anchor: start; }
.linea-acumulado .marca-eje.medio { text-anchor: middle; }
.linea-acumulado .marca-eje.fin { text-anchor: end; }

/* La guía del punto elegido y sus puntos. */
.linea-acumulado .guia {
  stroke: var(--texto-suave);
  stroke-width: 1;
  stroke-dasharray: 2 2;
}

.linea-acumulado .punto {
  stroke: var(--superficie);
  stroke-width: 2;
}

.linea-acumulado .punto.gasto { fill: var(--gasto); }
.linea-acumulado .punto.ingreso { fill: var(--ingreso); }
.linea-acumulado .punto.saldo { fill: var(--texto); }

/* La línea del cero: más marcada que el eje, porque cruzarla significa algo. */
.linea-acumulado .cero {
  stroke: var(--texto-suave);
  stroke-width: 1;
  stroke-dasharray: 3 3;
}

/* Rótulo al final de cada línea: qué línea es no se pregunta a una referencia
   que está en otro lado, se lee donde termina. */
.linea-acumulado .rotulo-traza {
  font-size: 12px;
  font-weight: 600;
}

.linea-acumulado .rotulo-traza.gasto { fill: var(--gasto); }
.linea-acumulado .rotulo-traza.ingreso { fill: var(--ingreso); }

.linea-acumulado .marca-eje {
  fill: var(--texto-suave);
  font-size: 11px;
}

.linea-acumulado .marca-eje.fin { text-anchor: end; }

/* ── Tocar un total y ver qué contiene (T-026) ───────────────────────────────
   La fila entera es un botón, pero no tiene que PARECER un botón: es la misma
   fila de siempre y lo único que cambia es que se puede tocar. Un botón con
   borde y fondo por cada rubro convertiría el desglose en una botonera. */
.fila-toque {
  display: block;
  width: 100%;
  padding: 0;
  border: none;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  /* El área de toque llega al borde de la tarjeta, no solo al texto. */
  margin: 0;
}

.fila-toque > .rubro-cabeza { display: flex; }
.fila-toque:active { opacity: 0.6; }

/* La celda de la matriz: el número es el botón, y ocupa toda la celda para que
   se pueda acertar con el pulgar. */
.celda-toque {
  padding: 0;
  border: none;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
  text-decoration-color: var(--borde);
}

.celda-toque:active { opacity: 0.6; }

/* El cartel de que la lista está filtrada. Va arriba de todo y con el botón de
   salida al lado: una lista filtrada sin salida visible es una trampa. */
.tarjeta.filtro {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  border-left: 4px solid var(--acento, var(--ingreso));
}

.tarjeta.filtro p { margin: 0; }

/* ── La matriz mes × rubro (T-021) ───────────────────────────────────────────
   Once meses por ocho rubros no entran a lo ancho de un teléfono. La tabla se
   desliza DENTRO de su caja —la página no se mueve— y la columna del mes queda
   fija: una fila de once números sin su etiqueta a la vista no se puede leer. */
.tabla-ancha {
  overflow-x: auto;
  /* Que se pueda enfocar con el teclado, para poder deslizarla sin mouse. */
  scrollbar-width: thin;
  margin: 0 -1rem;
  /* El aire de los costados va como BORDE y no como padding, y es la diferencia
     entre que se vea bien o no: `overflow` recorta en el borde interno de la
     caja, así que con padding las columnas que ya pasaron se siguen viendo en
     ese centímetro, asomando por detrás de la columna del mes. Con borde, se
     recortan donde tienen que recortarse. */
  border-left: 1rem solid transparent;
  border-right: 1rem solid transparent;
}

.matriz {
  border-collapse: collapse;
  font-size: 0.75rem;
  white-space: nowrap;
}

.matriz th,
.matriz td {
  padding: 0.375rem 0.4375rem;
  text-align: right;
}

.matriz thead th {
  font-weight: 600;
  color: var(--texto-suave);
  border-bottom: 1px solid var(--borde);
  vertical-align: bottom;
}

.matriz .columna-mes {
  position: sticky;
  left: 0;
  z-index: 1;
  text-align: left;
  font-weight: 600;
  /* Fondo opaco: sin esto las cifras pasan POR DEBAJO del mes al deslizar y se
     lee un número encima del otro. La sombra plana tapa además el sangrado de
     la caja —`.tabla-ancha` tiene 1rem de padding—, donde si no se ven asomar
     los restos de las columnas que ya pasaron. */
  background: var(--superficie);
  padding-left: 0;
}

.matriz .importe {
  /* Cifras de ancho fijo: es lo que permite comparar una columna de un vistazo
     sin leer número por número. */
  font-variant-numeric: tabular-nums;
}

/* El cero está —es una matriz, no puede faltar una celda— pero no compite con
   los números que sí dicen algo. */
.matriz .vacio { color: var(--texto-suave); opacity: 0.55; }

.matriz .separada { border-left: 1px solid var(--borde); }

/* La banda de arriba dice de qué es cada bloque de columnas. Hace falta porque
   `otros` está en los rubros de gasto y en los de ingreso, y son cosas
   distintas: dos columnas grises llamadas "Otros" pegadas una a la otra es un
   número leído en la columna equivocada. Va centrada sobre su bloque, en
   minúscula versalita, para que se lea como un rótulo y no como una fila más. */
.matriz .bandas td { border-bottom: none; }
.matriz thead .banda {
  /* A la izquierda, no centrada sobre su bloque: centrada, el rótulo de ocho
     columnas cae en el medio de un bloque que no entra en la pantalla y no se
     ve nunca. Alineado al inicio, aparece justo cuando el bloque empieza. */
  text-align: left;
  font-size: 0.6875rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 700;
  border-bottom: none;
  padding-bottom: 0.125rem;
}
.matriz .gasto { color: var(--gasto); }
.matriz .ingreso { color: var(--ingreso); }

.matriz tfoot th,
.matriz tfoot td {
  border-top: 1px solid var(--borde);
  font-weight: 600;
}

.matriz .columna-mes abbr {
  color: var(--gasto);
  text-decoration: none;
  font-weight: 700;
}

.nota { margin-top: 0.75rem; font-size: 0.8125rem; }
.nota.deslizar { margin-top: 0.5rem; }

/* Una nota pegada al final de una lista se lee como la última fila. Con una
   línea arriba queda claro que habla de la lista entera y no de ese renglón. */
.rubros + .nota {
  margin-top: 1rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--borde);
}

/* ── Un color por rubro (T-909, T-922) ───────────────────────────────────────
   Los ocho tonos salen de la PLANILLA DEL USUARIO: se conservó el matiz de
   cada color suyo y se corrigieron la luz y el croma hasta que el conjunto
   pasara el validador de la guía de visualización contra las dos superficies
   de esta app. Seis de los ocho se movieron 23° o menos. Ver ADR-029.

   Con fondo oscuro pasan las seis comprobaciones. Con fondo claro pasan las
   cuatro duras, con dos advertencias —un par a ΔE 7,2 bajo daltonismo y un
   tono corto de contraste— que la guía permite cuando hay rótulo directo, y lo
   hay: cada rubro lleva su nombre y su importe escritos al lado, y las
   porciones grandes de la torta llevan su porcentaje adentro. El color nunca
   es la única forma de saber qué es. Una pantalla que los muestre SIN texto
   tiene que resolverlo de nuevo.

   Ocho es el techo. Un noveno tono generado sería indistinguible de alguno de
   estos bajo daltonismo: si hiciera falta, se agrupa, no se inventa un color.
   El porqué de la asignación está en src/ui/colores.js. */

:root {
  /* Salen de la planilla del usuario: se conservó el matiz de cada uno y se
     movió solo la luz y el croma hasta que el conjunto pasara el validador.
     La fuente es src/core/paleta.js y un test comprueba que no se separen. */
  --rubro-1: #e87ba4;   /* rosa       — gastos fijos    */
  --rubro-2: #eda100;   /* ámbar      — supermercado    */
  --rubro-3: #e34948;   /* rojo       — comida hecha    */
  --rubro-4: #008300;   /* verde      — viajes          */
  --rubro-5: #a552b7;   /* violeta    — entretenimiento */
  --rubro-6: #2a78d6;   /* azul       — transporte      */
  --rubro-7: #1baf7a;   /* aguamarina — salud           */
  --rubro-8: #7a7a7a;   /* gris       — otros           */

  /* ── Del 9 al 20: los que quedan libres para los rubros que crees vos ──────
     Se eligieron con el validador de la guía de visualización, uno por uno:
     cada uno es el color que MÁS LEJOS estaba de todos los anteriores, mirando
     también cómo se ven con daltonismo. Por eso los primeros son los más
     distintos: si creás un rubro, el 9 se va a diferenciar mejor que el 20.
     Ver ADR-049. */
  --rubro-9: #74396d;   /* ciruela    — libre */
  --rubro-10: #39b5ff;   /* celeste    — libre */
  --rubro-11: #720caf;   /* violeta    — libre */
  --rubro-12: #813934;   /* ladrillo   — libre */
  --rubro-13: #1d40e7;   /* azul       — libre */
  --rubro-14: #3295f6;   /* azul claro — libre */
  --rubro-15: #27d271;   /* verde menta— libre */
  --rubro-16: #31b0c6;   /* cian       — libre */
  --rubro-17: #904c87;   /* malva      — libre */
  --rubro-18: #db8833;   /* naranja    — libre */
  --rubro-19: #1464fe;   /* azul vivo  — libre */
  --rubro-20: #96455a;   /* bordó      — libre */
}

@media (prefers-color-scheme: dark) {
  :root {
    /* No es el mismo color aclarado: son los pasos elegidos para el fondo
       oscuro, validados contra él por separado. */
    --rubro-1: #d55181;
    --rubro-2: #c08000;
    --rubro-3: #d33a3c;
    --rubro-4: #008300;
    --rubro-5: #a552b7;
    --rubro-6: #3987e5;
    --rubro-7: #199e70;
    --rubro-8: #a8a8a8;
    --rubro-9: #91417d;
    --rubro-10: #56b2fd;
    --rubro-11: #7e1cd8;
    --rubro-12: #ff9b4e;
    --rubro-13: #6c96c2;
    --rubro-14: #71c5df;
    --rubro-15: #9bc58d;
    --rubro-16: #008d89;
    --rubro-17: #8e32a7;
    --rubro-18: #cf6b58;
    --rubro-19: #226cff;
    --rubro-20: #b60356;
  }
}

.punto-rubro.rubro-1 { background: var(--rubro-1); }
.porcion.rubro-1 { fill: var(--rubro-1); }
.punto-rubro.rubro-2 { background: var(--rubro-2); }
.porcion.rubro-2 { fill: var(--rubro-2); }
.punto-rubro.rubro-3 { background: var(--rubro-3); }
.porcion.rubro-3 { fill: var(--rubro-3); }
.punto-rubro.rubro-4 { background: var(--rubro-4); }
.porcion.rubro-4 { fill: var(--rubro-4); }
.punto-rubro.rubro-5 { background: var(--rubro-5); }
.porcion.rubro-5 { fill: var(--rubro-5); }
.punto-rubro.rubro-6 { background: var(--rubro-6); }
.porcion.rubro-6 { fill: var(--rubro-6); }
.punto-rubro.rubro-7 { background: var(--rubro-7); }
.porcion.rubro-7 { fill: var(--rubro-7); }
.punto-rubro.rubro-8 { background: var(--rubro-8); }
.porcion.rubro-8 { fill: var(--rubro-8); }
.punto-rubro.rubro-9 { background: var(--rubro-9); }
.porcion.rubro-9 { fill: var(--rubro-9); }
.punto-rubro.rubro-10 { background: var(--rubro-10); }
.porcion.rubro-10 { fill: var(--rubro-10); }
.punto-rubro.rubro-11 { background: var(--rubro-11); }
.porcion.rubro-11 { fill: var(--rubro-11); }
.punto-rubro.rubro-12 { background: var(--rubro-12); }
.porcion.rubro-12 { fill: var(--rubro-12); }
.punto-rubro.rubro-13 { background: var(--rubro-13); }
.porcion.rubro-13 { fill: var(--rubro-13); }
.punto-rubro.rubro-14 { background: var(--rubro-14); }
.porcion.rubro-14 { fill: var(--rubro-14); }
.punto-rubro.rubro-15 { background: var(--rubro-15); }
.porcion.rubro-15 { fill: var(--rubro-15); }
.punto-rubro.rubro-16 { background: var(--rubro-16); }
.porcion.rubro-16 { fill: var(--rubro-16); }
.punto-rubro.rubro-17 { background: var(--rubro-17); }
.porcion.rubro-17 { fill: var(--rubro-17); }
.punto-rubro.rubro-18 { background: var(--rubro-18); }
.porcion.rubro-18 { fill: var(--rubro-18); }
.punto-rubro.rubro-19 { background: var(--rubro-19); }
.porcion.rubro-19 { fill: var(--rubro-19); }
.punto-rubro.rubro-20 { background: var(--rubro-20); }
.porcion.rubro-20 { fill: var(--rubro-20); }

/* El punto que acompaña al nombre en las listas. Es chico a propósito: el
   nombre escrito es lo que manda, el color solo ayuda a encontrarlo. */
.punto-rubro {
  display: inline-block;
  width: 0.625rem;
  height: 0.625rem;
  border-radius: 50%;
  margin-right: 0.375rem;
  vertical-align: baseline;
  background: var(--texto-suave);
}

/* El campo del formulario se pinta del color del rubro elegido: es la
   confirmación de que quedó puesto el que se quería, sin volver a leerlo. */
.campo-rubro {
  border-left: 4px solid var(--borde);
  border-radius: var(--radio);
  transition: border-color 0.12s ease;
}

.campo-rubro.rubro-1 { border-left-color: var(--rubro-1); }
.campo-rubro.rubro-2 { border-left-color: var(--rubro-2); }
.campo-rubro.rubro-3 { border-left-color: var(--rubro-3); }
.campo-rubro.rubro-4 { border-left-color: var(--rubro-4); }
.campo-rubro.rubro-5 { border-left-color: var(--rubro-5); }
.campo-rubro.rubro-6 { border-left-color: var(--rubro-6); }
.campo-rubro.rubro-7 { border-left-color: var(--rubro-7); }
.campo-rubro.rubro-8 { border-left-color: var(--rubro-8); }

/* ── Lista de movimientos (T-015) ────────────────────────────────────────────
   Es la única pantalla que destruye datos, y detrás no hay papelera. De ahí que
   el borrar tenga dos redes: confirmar antes y deshacer después. */

.cuantos { margin: 0 0.125rem 0.75rem; }
.tarjeta.dia h2 { font-size: 0.9375rem; color: var(--texto-suave); font-weight: 500; }

.movimientos { list-style: none; margin: 0; padding: 0; }

.movimiento {
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--borde);
}

.movimiento:last-child { border-bottom: none; }
.movimiento.confirmando { background: var(--fondo); border-radius: var(--radio); padding: 0.75rem; }

.movimiento-datos,
.movimiento-pie {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.75rem;
}

.movimiento-datos .nombre { font-weight: 500; }
.movimiento-datos .importe { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.movimiento-datos .importe.gasto { color: var(--gasto); }
.movimiento-datos .importe.ingreso { color: var(--ingreso); }
.movimiento-pie { font-size: 0.8125rem; margin-top: 0.125rem; }
.movimiento-pie span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.movimiento-acciones { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

.confirmar-borrado { margin-top: 0.625rem; }
.confirmar-borrado p { margin: 0 0 0.5rem; font-weight: 500; }
.confirmar-borrado .botones { display: flex; gap: 0.5rem; }

/* El botón que destruye se ve distinto de todos los demás: es el único de la
   app que hace algo que no se puede rehacer desde otro lado. */
.peligro {
  min-height: 2.75rem;
  padding: 0 1rem;
  font-size: 0.9375rem;
  font-family: inherit;
  font-weight: 600;
  color: var(--superficie);
  background: var(--gasto);
  border: none;
  border-radius: var(--radio);
  cursor: pointer;
}

/* El deshacer NO se cierra solo: en un celular, los tres segundos que suelen
   durar estos avisos son el tiempo que tarda alguien en darse cuenta. */
.deshacer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 1rem;
  padding: 0.75rem 1rem;
  background: var(--superficie);
  border: 1px solid var(--acento);
  border-left-width: 4px;
  border-radius: var(--radio);
}

.deshacer p { margin: 0; font-size: 0.9375rem; }

/* ── Datos y respaldo (T-016) ────────────────────────────────────────────── */

.formulario .principal + .secundario,
.tarjeta .principal + .secundario { margin-top: 0.5rem; }
.tarjeta .principal,
.tarjeta > .secundario { width: 100%; margin-top: 0.75rem; }
.tarjeta .principal[disabled],
.tarjeta .secundario[disabled] { opacity: 0.45; cursor: not-allowed; }

.aviso-respaldo { margin: 0 0 0.75rem; }

/* Cuando hace falta respaldar se ve distinto de cuando no. Un aviso que está
   siempre igual enseña a no mirarlo. */
.pendiente-respaldo {
  padding: 0.75rem;
  border-radius: var(--radio);
  border: 1px solid var(--gasto);

<script>
(function () {
'use strict';

globalThis.__VIAJECOR_VERSION__ = "0.11.0";

// ── src/core/dinero.js ──────────────────────────────────────────
// Aritmética de dinero.
//
// La regla que gobierna todo este archivo: el dinero se guarda como número
// ENTERO en la unidad mínima de su moneda. 12,50 € es 1250. Ver ADR-005.
//
// Por qué: en JavaScript 0.1 + 0.2 da 0.30000000000000004. Sumar cientos de
// gastos con decimales acumula error, y un total que no cierra por un céntimo
// destruye la confianza en todos los demás números. Con enteros, la suma es
// exacta y punto.
//
// Los decimales de cada moneda entran por parámetro: la lista de monedas la
// maneja el usuario (RN-04b, ADR-011), así que este módulo no puede tener una
// tabla propia que se desactualice.
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.

// Más allá de este valor JavaScript deja de contar enteros de a uno y empieza a
// saltearse números, que es justo lo que veníamos a evitar. Son unos 90 billones
// de euros en céntimos: si un monto lo supera, es un error de carga, no un gasto.
const MAXIMO = Number.MAX_SAFE_INTEGER;

const DECIMALES_EURO = 2;

/**
 * Cuántas unidades mínimas entran en una unidad de la moneda.
 * 2 decimales → 100 (céntimos por euro). 0 decimales → 1 (el yen no tiene).
 */
function unidadMinima(decimales) {
  validarDecimales(decimales);
  return 10 ** decimales;
}

function validarDecimales(decimales) {
  if (!Number.isInteger(decimales) || decimales < 0 || decimales > 4) {
    throw new Error(
      `Los decimales de una moneda tienen que ser un número entero de 0 a 4, y llegó ${JSON.stringify(decimales)}.`
    );
  }
}

/**
 * Redondea al entero más cercano, con el medio siempre hacia arriba en valor
 * absoluto: 2,5 → 3 y -2,5 → -3.
 *
 * Por qué no alcanza Math.round: Math.round(-2.5) da -2, porque redondea hacia
 * el infinito positivo. Eso rompe la simetría — el mismo importe redondearía
 * distinto según su signo. Acá casi todos los montos son positivos, pero un
 * saldo mensual sí puede ser negativo, y una regla que depende del signo es una
 * trampa esperando.
 */
function redondear(numero) {
  if (!Number.isFinite(numero)) {
    throw new Error(`No se puede redondear ${JSON.stringify(numero)}.`);
  }
  return numero < 0 ? -Math.round(-numero) : Math.round(numero);
}

/**
 * Comprueba que un valor sirva como monto guardado: entero, no negativo y
 * dentro del rango en que JavaScript cuenta bien.
 */
function validarMonto(minimas) {
  if (!Number.isInteger(minimas)) {
    throw new Error(
      `Un monto se guarda como número entero de unidades mínimas, y llegó ${JSON.stringify(minimas)}.`
    );
  }
  if (minimas < 0) {
    throw new Error(
      'Un monto no puede ser negativo. Si es un gasto, se registra como gasto; el signo lo da el tipo del movimiento, no el número.'
    );
  }
  if (minimas > MAXIMO) {
    throw new Error('El monto es demasiado grande: seguro es un error de carga.');
  }
  return minimas;
}

/**
 * Interpreta lo que el usuario escribió y lo convierte a unidades mínimas.
 *
 * El separador decimal es AMBIGUO en la práctica: en español la coma separa
 * decimales ("12,50") pero los teclados de celular meten punto, y al copiar de
 * un banco pueden venir miles ("1.234,56" o "1,234.56"). Las reglas:
 *
 *   1. El ÚLTIMO punto o coma es el separador decimal si lo siguen 1 o 2
 *      dígitos. Así "12,50", "12.50", "1.234,56" y "1,234.56" dan lo esperado.
 *   2. Los demás separadores son de miles, y tienen que agrupar de a tres.
 *   3. Un único separador seguido de EXACTAMENTE tres dígitos —"1.234",
 *      "12,345"— es genuinamente ambiguo y se RECHAZA pidiendo aclaración.
 *
 * La regla 3 es la importante. "1.234" puede ser mil doscientos treinta y
 * cuatro; "12,345" es casi seguro alguien que quiso escribir 12,34 y se le
 * escapó un dígito. Tienen la misma forma y no hay forma de distinguirlos.
 * Elegir cualquiera de las dos lecturas en silencio significa equivocarse por
 * un factor de mil en el monto de alguien, sin avisarle. Preguntar es molesto
 * una vez; equivocarse acá corrompe un total para siempre. Ver ADR-012.
 */
function aMinimas(entrada, decimales) {
  validarDecimales(decimales);

  if (typeof entrada === 'number') {
    if (!Number.isFinite(entrada)) {
      throw new Error(`"${entrada}" no es un monto.`);
    }
    return validarMonto(redondear(entrada * unidadMinima(decimales)));
  }

  if (typeof entrada !== 'string') {
    throw new Error(`No se puede leer ${JSON.stringify(entrada)} como un monto.`);
  }

  const limpio = entrada.trim().replace(/\s/g, '');
  if (limpio === '') throw new Error('Falta el monto.');
  if (!/^-?[\d.,]+$/.test(limpio)) {
    throw new Error(`"${entrada}" no es un monto: solo se aceptan números, punto y coma.`);
  }

  const negativo = limpio.startsWith('-');
  const sinSigno = negativo ? limpio.slice(1) : limpio;

  const separadores = sinSigno.match(/[.,]/g) || [];
  const ultimoSeparador = Math.max(sinSigno.lastIndexOf('.'), sinSigno.lastIndexOf(','));
  const digitosDespues = ultimoSeparador === -1 ? -1 : sinSigno.length - ultimoSeparador - 1;
  const hayParteDecimal = digitosDespues === 1 || digitosDespues === 2;

  // Regla 3: un solo separador con tres dígitos detrás no se puede leer.
  if (!hayParteDecimal && separadores.length === 1 && digitosDespues === 3) {
    throw new Error(
      `"${entrada}" se puede leer de dos formas y no quiero adivinar con tu dinero: ` +
      `¿son ${sinSigno.replace(/[.,]/, '')} enteros, o querías escribir dos decimales? ` +
      `Escribilo sin separador de miles, o con dos decimales.`
    );
  }

  const entera = hayParteDecimal ? sinSigno.slice(0, ultimoSeparador) : sinSigno;
  const decimal = hayParteDecimal ? sinSigno.slice(ultimoSeparador + 1) : '';

  // Los separadores que quedan en la parte entera son de miles: tienen que
  // agrupar de a tres exactos. Si no, el número está mal escrito y decirlo es
  // mejor que inventar una lectura.
  if (/[.,]/.test(entera)) {
    const grupos = entera.split(/[.,]/);
    const primeroValido = /^\d{1,3}$/.test(grupos[0]);
    const restoValido = grupos.slice(1).every((g) => /^\d{3}$/.test(g));
    if (!primeroValido || !restoValido) {
      throw new Error(
        `"${entrada}" no es un monto: los separadores de miles tienen que agrupar de a tres dígitos.`
      );
    }
  }

  const soloDigitosEnteros = entera.replace(/[.,]/g, '');
  if (soloDigitosEnteros === '' && decimal === '') {
    throw new Error(`"${entrada}" no es un monto.`);
  }

  // Una moneda sin decimales con céntimos escritos es un error del usuario, no
  // algo que se pueda redondear en silencio: redondear le cambiaría el importe
  // sin decirle nada.
  if (decimal !== '' && decimales === 0) {
    throw new Error('Esta moneda no usa decimales, así que el monto tiene que ser un número entero.');
  }
  if (decimal.length > decimales) {
    const plural = decimales === 1 ? 'decimal' : 'decimales';
    throw new Error(
      `Esta moneda usa ${decimales} ${plural}, y "${entrada}" tiene ${decimal.length}.`
    );
  }

  // Se arma el entero pegando dígitos, sin pasar nunca por un número con coma
  // flotante: así "0,10" + "0,20" no puede dar 0.30000000000000004.
  const relleno = decimal.padEnd(decimales, '0');
  const minimas = Number(`${soloDigitosEnteros || '0'}${relleno}`);

  return validarMonto(negativo ? -minimas : minimas);
}

/**
 * De unidades mínimas al número con decimales. Solo para mostrar y para
 * exportar: nunca para seguir calculando encima.
 */
function aNumero(minimas, decimales) {
  validarDecimales(decimales);
  if (!Number.isInteger(minimas)) {
    throw new Error(`Se esperaba un entero de unidades mínimas y llegó ${JSON.stringify(minimas)}.`);
  }
  return minimas / unidadMinima(decimales);

/**
 * Suma exacta. Recibe la lista completa: no hay ningún límite de cuántos
 * elementos acepta, porque así es como el Excel original empezó a mentir (L-001).
 */
function sumar(minimas) {
  if (!Array.isArray(minimas)) {
    throw new Error('sumar() espera una lista de montos.');
  }
  let total = 0;
  for (const m of minimas) {
    if (!Number.isInteger(m)) {
      throw new Error(`La lista tiene un valor que no es entero: ${JSON.stringify(m)}.`);
    }
    total += m;
    if (!Number.isSafeInteger(total)) {
      throw new Error('La suma se pasó del rango en que JavaScript cuenta bien.');
    }
  }
  return total;
}

/**
 * Convierte un monto a céntimos de euro usando el tipo de cambio del mes
 * (RN-04): cuántos euros vale UNA unidad de esa moneda.
 *
 * El redondeo ocurre UNA SOLA VEZ, acá al final. Si se redondeara antes —por
 * ejemplo pasando primero a euros con decimales y después sumando— el error se
 * acumularía movimiento a movimiento.
 */
function convertirAEuros(minimas, decimales, eurosPorUnidad) {
  validarDecimales(decimales);
  if (!Number.isInteger(minimas)) {
    throw new Error(`Se esperaba un entero de unidades mínimas y llegó ${JSON.stringify(minimas)}.`);
  }
  if (!Number.isFinite(eurosPorUnidad) || eurosPorUnidad <= 0) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }

  const enEuros = (minimas / unidadMinima(decimales)) * eurosPorUnidad;
  const centimos = redondear(enEuros * unidadMinima(DECIMALES_EURO));

  if (!Number.isSafeInteger(centimos)) {
    throw new Error('La conversión se pasó del rango en que JavaScript cuenta bien.');
  }
  return centimos;
}

/**
 * Invierte un tipo de cambio expresado al revés. El usuario suele conocerlo como
 * "cuántos colones es un euro" (CU-03), pero se guarda como euros por colón.
 */
function invertirCambio(unidadesPorEuro) {
  if (!Number.isFinite(unidadesPorEuro) || unidadesPorEuro <= 0) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }
  return 1 / unidadesPorEuro;
}

/**
 * Promedio de una lista de montos, redondeado una sola vez al final.
 * Una lista vacía da 0: no hay nada que promediar, y devolver 0 evita que la
 * app tenga que manejar un "no hay dato" en cada pantalla que muestre promedios.
 */
function promediar(minimas) {
  if (!Array.isArray(minimas)) {
    throw new Error('promediar() espera una lista de montos.');
  }
  if (minimas.length === 0) return 0;
  return redondear(sumar(minimas) / minimas.length);
}

// ── src/core/modelo.js ──────────────────────────────────────────
// Forma y validación de un movimiento: la única puerta por la que un gasto o un
// ingreso entra a los datos de la app.
//
// Por qué existe un módulo entero para esto: un movimiento mal formado no
// explota, se guarda. Y una vez guardado contamina el total del mes, el del año
// y el del viaje, sin que nada lo delate. Las reglas que impiden eso —RN-01,
// RN-02, RN-03— tienen que estar en UN solo lugar, con tests, y no repartidas
// por cada pantalla que cargue datos.
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.

// ── Vocabulario del dominio (PRODUCTO §4) ────────────────────────────────────
//
// Los nombres son los del Excel, tal cual (ADR-008): el usuario ya piensa en
// esos términos y renombrarlos lo obligaría a traducir mentalmente cada vez.

const TIPO_GASTO = 'G';
const TIPO_INGRESO = 'I';

const RUBROS_GASTO = Object.freeze([
  'gastos fijos',
  'supermercado',
  'comida hecha',
  'viajes',
  'entretenimiento',
  'transporte',
  'salud',
  'otros',
]);

const RUBROS_INGRESO = Object.freeze([
  'trabajo',
  'inversiones',
  'regalos',
  'otros',
]);

/**
 * Los rubros que acepta un tipo. `otros` aparece en las dos listas y son cosas
 * distintas: "otros gastos" y "otros ingresos" no se mezclan nunca en un total,
 * y lo que los mantiene separados es el campo `tipo`, no el nombre del rubro.
 *
 * ── El catálogo es del usuario, no de la app (T-048) ────────────────────────
 *
 * Las dos listas de arriba dejaron de ser la verdad y pasaron a ser **el punto
 * de partida**: quien manda es `estado.rubros`, que el usuario edita desde
 * Ajustes. `catalogo` es ese objeto `{ gasto: [...], ingreso: [...] }`.
 *
 * Sin catálogo se devuelven las listas de fábrica, y eso **no es un atajo**: es
 * lo que hace que todo el código viejo —y los tests que no hablan de rubros—

 * catálogo de fábrica, así que las dos ramas dicen lo mismo.
 */
function rubrosDe(tipo, catalogo) {

  const propios = normalizado === TIPO_GASTO ? catalogo?.gasto : catalogo?.ingreso;

  if (Array.isArray(propios) && propios.length > 0) return propios;
  return normalizado === TIPO_GASTO ? RUBROS_GASTO : RUBROS_INGRESO;
}

/** Los rubros de fábrica, para arrancar un catálogo nuevo. */
function rubrosIniciales() {
  return { gasto: [...RUBROS_GASTO], ingreso: [...RUBROS_INGRESO] };

/**
 * Deja un texto listo para MOSTRARSE: sin espacios al principio ni al final, y
 * sin espacios repetidos en el medio. Conserva las mayúsculas.
 *

 * dos maneras: con una única "é" (U+00E9) o con una "e" seguida de una tilde
