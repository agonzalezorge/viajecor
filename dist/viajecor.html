    partes.push(String(movimiento.monto));
  }

  return normalizarBusqueda(partes.filter(Boolean).join(' '));
}

/** Las palabras de lo buscado. Vacío si no se escribió nada que buscar. */
function palabrasDe(texto) {
  const limpio = normalizarBusqueda(texto);
  return limpio === '' ? [] : limpio.split(' ');
}

/**
 * Los movimientos que tienen **todas** las palabras buscadas, del más nuevo al
 * más viejo.
 *
 * Mira **todo el historial**, no el mes que se está viendo: el usuario que
 * busca "psicóloga" no sabe en qué mes fue —si lo supiera no buscaría—, y
 * limitarlo al mes en curso daría "no hay nada" sobre datos que sí están.
 *
 * Sin ningún tope de filas (L-001).
 */
function buscar(estado, texto) {
  const palabras = palabrasDe(texto);
  if (palabras.length === 0) return [];

  return (estado.movimientos ?? [])
    .filter((movimiento) => {
      const donde = textoDeMovimiento(estado, movimiento);
      return palabras.every((palabra) => donde.includes(palabra));
    })
    .slice()
    .sort((a, b) => b.fecha.localeCompare(a.fecha)
      || String(b.creado).localeCompare(String(a.creado)));
}

// ── src/core/base.js ────────────────────────────────────────────
// Cambiar la moneda base — T-050, CU-20.
//
// ── Qué es la moneda base y por qué cambiarla no es un ajuste más ────────────
//
// Es la moneda en la que se expresan **todos los totales**, la que vale 1 y la
// única que no lleva tipo de cambio. Los movimientos guardan su propia moneda y
// no se tocan nunca; lo que cambia es en qué se suman.
//
// Y ahí está el problema: **los tipos de cambio guardados están expresados en la
// base vieja**. "0,0016" para el colón significa "0,0016 euros por colón", y si
// la base pasa a ser el peso uruguayo ese número deja de querer decir nada.
//
// ── Cómo se reexpresan ───────────────────────────────────────────────────────
//
// Si para un mes existe el tipo de la moneda que va a ser la base nueva, todo lo
// de ese mes se puede reexpresar dividiendo por él:
//
//     nuevo(moneda) = viejo(moneda) / viejo(baseNueva)
//
// Y la base vieja pasa a ser una moneda más, con su propio tipo:
//
//     nuevo(baseVieja) = 1 / viejo(baseNueva)
//
// **En los meses donde no existe el tipo de la base nueva no se puede.** Ahí los
// tipos de ese mes se pierden —y hay que volver a cargarlos—, porque inventar
// una cotización que el usuario no dio es exactamente lo que esta app no hace.
//
// ── Por qué el efecto se mide sobre los movimientos, no sobre los tipos ──────
//
// El caso que duele es justamente el que **no tiene ningún tipo cargado**: un
// historial entero en euros, con base en euros, no necesita ninguna cotización.
// Si mañana la base pasa a ser el peso, cada uno de esos movimientos pasa a
// necesitar el tipo del euro **retroactivamente, en todos los meses en que hay
// datos**, y contar los tipos guardados diría "no se pierde nada" mientras el
// total de todos los meses se queda sin poder calcularse.
//
// Por eso `efectoDeCambiarBase()` simula el cambio y después pregunta, movimiento
// por movimiento, cuáles quedarían sin poder convertirse — y descuenta los que ya
// hoy no se pueden, para no culpar al cambio de base de un faltante anterior.
//
// Este archivo no toca el navegador: es lógica pura.



/** El tipo de la moneda que va a ser la base nueva, para un mes. */
function cotizacionDe(cambios, moneda, mes) {
  const encontrado = (cambios ?? []).find(
    (c) => c && normalizarMoneda(c.moneda) === moneda && c.mes === mes,
  );
  return encontrado ? encontrado.euros_por_unidad : null;
}

/**
 * Los tipos de cambio de `cambios`, expresados en `destino` en vez de en
 * `actual`. Los meses sin cotización de `destino` quedan afuera: no se pueden.
 */
function reexpresar(cambios, actual, destino) {
  const salida = [];

  for (const mes of [...new Set(cambios.map((c) => c.mes))]) {
    const cotizacion = cotizacionDe(cambios, destino, mes);
    if (cotizacion === null) continue;   // ese mes no se puede: se pierde

    for (const cambio of cambios.filter((c) => c.mes === mes)) {
      if (normalizarMoneda(cambio.moneda) === destino) continue;  // la nueva base no lleva tipo
      salida.push({ ...cambio, euros_por_unidad: cambio.euros_por_unidad / cotizacion });
    }

    // La base vieja pasa a ser una moneda más y necesita su cotización.
    salida.push({
      moneda: actual,
      mes,
      euros_por_unidad: 1 / cotizacion,
      creado: cambios.find((c) => c.mes === mes)?.creado ?? mes + '-01',
    });
  }

  return salida;
}

/** Qué movimientos no se pueden convertir con estos tipos y esta base. */
function sinConvertir(movimientos, cambios, base) {
  const porMes = new Map();

  for (const movimiento of movimientos) {
    if (!movimiento || !movimiento.fecha) continue;
    if (faltaCambioPara(movimiento, cambios, base) === null) continue;

    const mes = mesDe(movimiento.fecha);
    const monedas = porMes.get(mes) ?? new Set();
    monedas.add(normalizarMoneda(movimiento.moneda));
    porMes.set(mes, monedas);
  }

  return porMes;
}

/**
 * Qué va a pasar si se cambia la base. **No cambia nada**: solo lo cuenta.
 *
 * Devuelve cuántos tipos de cambio se reexpresan, cuáles se pierden, y —lo que
 * de verdad importa— en qué meses van a quedar movimientos sin poder convertirse
 * porque falta la cotización de la moneda nueva.
 */
function efectoDeCambiarBase(estado, nueva) {
  const destino = normalizarMoneda(nueva);
  const actual = monedaBaseDe(estado);
  const cambios = estado?.tipos_cambio ?? [];
  const movimientos = estado?.movimientos ?? [];

  if (destino === actual) {
    return {
      actual, destino, sinCambios: true, reexpresados: 0, perdidos: [], meses: [],
      faltantes: [], movimientosSinConvertir: 0, movimientosSinConvertirAhora: 0,
    };
  }

  const nuevos = reexpresar(cambios, actual, destino);
  const mesesQueSobreviven = new Set(nuevos.map((c) => c.mes));

  // Los tipos guardados que no se pueden reexpresar: hay que volver a cargarlos.
  const perdidos = cambios
    .filter((c) => !mesesQueSobreviven.has(c.mes))
    .map((c) => ({ moneda: normalizarMoneda(c.moneda), mes: c.mes }));

  // Lo que ya hoy no se puede convertir no lo causa este cambio: se descuenta.
  const rotoAhora = sinConvertir(movimientos, cambios, actual);
  const rotoDespues = sinConvertir(movimientos, nuevos, destino);

  const faltantes = [...rotoDespues.entries()]
    .map(([mes, monedas]) => ({
      mes,
      monedas: [...monedas].sort(),
      nuevo: !rotoAhora.has(mes),
    }))
    .sort((a, b) => a.mes.localeCompare(b.mes));

  const cuantos = (mapa) => movimientos.filter(
    (m) => m && m.fecha && mapa.has(mesDe(m.fecha))
      && mapa.get(mesDe(m.fecha)).has(normalizarMoneda(m.moneda)),
  ).length;

  return {
    actual,
    destino,
    sinCambios: false,
    reexpresados: nuevos.length,
    perdidos,
    meses: [...mesesQueSobreviven].sort(),
    // Los meses en los que va a faltar la cotización de la moneda nueva, con las
    // monedas que quedan colgadas en cada uno.
    faltantes,
    movimientosSinConvertir: cuantos(rotoDespues),
    movimientosSinConvertirAhora: cuantos(rotoAhora),
  };
}

/**
 * Cambia la base y reexpresa los tipos de cambio que se puedan.
 *
 * Los movimientos **no se tocan**: cada uno sigue guardado en su moneda y con su
 * monto. Lo único que cambia es en qué moneda se suman.
 */
function cambiarMonedaBase(estado, nueva) {
  const destino = normalizarMoneda(nueva);
  const actual = monedaBaseDe(estado);
  if (destino === actual) return estado;

  return {
    ...estado,
    tipos_cambio: reexpresar(estado?.tipos_cambio ?? [], actual, destino),
    preferencias: { ...estado?.preferencias, moneda_base: destino },
  };
}

// ── src/core/rubros.js ──────────────────────────────────────────
// Editar los rubros — T-048, CU-19.
//
// ── Por qué esto es delicado y no una lista más ──────────────────────────────
//
// El rubro está escrito adentro de **cada movimiento**. Cambiar el catálogo sin
// tocar los movimientos deja gastos apuntando a un rubro que ya no existe: no
// dan error, simplemente **desaparecen de todos los totales** que recorren la
// lista de rubros. Es la peor forma de fallar de esta app —plata que se esfuma
// sin un mensaje— y es la razón de las tres reglas de abajo.
//
// ── Las tres reglas ──────────────────────────────────────────────────────────
//
// 1. **Todo lo que toca el catálogo mueve también los movimientos.** Renombrar
//    reescribe el rubro de los que lo usaban; unir los pasa al que queda.
//
// 2. **Un rubro con movimientos no se puede borrar a secas: hay que decir a
//    dónde van.** Borrarlo y dejar los gastos huérfanos sería perderlos; y
//    borrar los gastos con él sería borrar plata anotada, que no es lo que
//    nadie quiere decir con "sacar un rubro de la lista".
//
// 3. **Como mucho veinte por tipo**, que es hasta donde llega la paleta. No es
//    una limitación técnica sino de colores: hay veinte tonos definidos a mano
//    —elegidos con el validador de la guía, el más distinto primero— y el
//    veintiuno tendría que repetir alguno. Ver ADR-049.
//
//    **Los primeros se distinguen mejor que los últimos**, y eso está medido:
//    el rubro 9 está a ΔE 14,6 de todos los anteriores y el 20 a 6,7. De ahí que
//    la app escriba SIEMPRE el nombre al lado del color, que es la compensación
//    que la guía pide cuando la separación baja de 8.
//
// Este archivo no toca el navegador: es lógica pura y se testea con node --test.

/** Cuántos rubros admite cada tipo. Ver la regla 3. */
const TOPE_DE_RUBROS = 20;

/** La clave del tipo dentro del catálogo. */
function ladoDe(tipo) {
  return normalizarTipo(tipo) === TIPO_GASTO ? 'gasto' : 'ingreso';
}

/** El catálogo de un estado, siempre completo aunque el estado no lo traiga. */
function catalogoDe(estado) {
  return {
    gasto: rubrosDe(TIPO_GASTO, estado?.rubros),
    ingreso: rubrosDe(TIPO_INGRESO, estado?.rubros),
  };
}

/**
 * Cuántos movimientos usa cada rubro de ese tipo.
 *
 * Es lo que la pantalla necesita para poder decir "esto va a mover 43 gastos"
 * **antes** de tocar nada. Un cambio que mueve plata sin decir cuánta es un
 * cambio que se acepta sin entender.
 */
function usoDeRubros(estado, tipo) {
  const buscado = normalizarTipo(tipo);
  const cuenta = new Map(catalogoDe(estado)[ladoDe(tipo)].map((r) => [r, 0]));

  for (const movimiento of estado?.movimientos ?? []) {
    if (normalizarTipo(movimiento.tipo) !== buscado) continue;
    const clave = normalizarClave(String(movimiento.rubro ?? ''));
    cuenta.set(clave, (cuenta.get(clave) ?? 0) + 1);
  }
  return cuenta;
}

/** Los rubros que están en los movimientos pero ya no en el catálogo. */
function rubrosHuerfanos(estado, tipo) {
  const catalogo = catalogoDe(estado)[ladoDe(tipo)];
  return [...usoDeRubros(estado, tipo).entries()]
    .filter(([rubro, cuantos]) => cuantos > 0 && !catalogo.includes(rubro))
    .map(([rubro, cuantos]) => ({ rubro, cuantos }));
}

/** Reemplaza el catálogo de un tipo, dejando el otro como estaba. */
function conCatalogo(estado, tipo, lista) {
  const catalogo = catalogoDe(estado);
  return { ...estado, rubros: { ...catalogo, [ladoDe(tipo)]: lista } };
}

/** Cambia el rubro de los movimientos que usaban `desde`. */
function moverMovimientos(estado, tipo, desde, hasta) {
  const buscado = normalizarTipo(tipo);
  return (estado?.movimientos ?? []).map((m) => (
    normalizarTipo(m.tipo) === buscado && normalizarClave(String(m.rubro ?? '')) === desde
      ? { ...m, rubro: hasta }
      : m
  ));
}

/**
 * Agrega un rubro nuevo.
 *
 * Va **al final** y no ordenado alfabéticamente: la posición decide el color
 * (ADR-029), así que insertarlo en el medio repintaría media app y "el ámbar"
 * dejaría de ser supermercado.
 */
function crearRubro(estado, tipo, nombre) {
  const clave = normalizarClave(String(nombre ?? ''));
  if (clave === '') throw new Error('El rubro necesita un nombre.');

  const lista = catalogoDe(estado)[ladoDe(tipo)];
  if (lista.includes(clave)) throw new Error(`"${clave}" ya está en la lista.`);

  if (lista.length >= TOPE_DE_RUBROS) {
    throw new Error(
      `Ya hay ${TOPE_DE_RUBROS} rubros de ese tipo, que es hasta donde llegan los ` +
      `colores: el siguiente tendría que repetir uno y dos rubros del mismo color ` +
      `no se pueden leer en una torta. Para agregar este, uní dos de los que ya están.`
    );
  }

  return conCatalogo(estado, tipo, [...lista, clave]);
}

/**
 * Le cambia el nombre a un rubro, **y se lo cambia también a sus movimientos**.
 *
 * Conserva la posición, o sea el color: renombrar "salidas" a "entretenimiento"
 * no tiene por qué cambiar de qué color es en la torta.
 *
 * Si el nombre nuevo es el de otro rubro que ya existe, **es una unión** y se
 * hace como tal: es lo mismo que pide el usuario cuando escribe encima, y
 * negarse le dejaría el trabajo a medio hacer.
 */
function renombrarRubro(estado, tipo, viejo, nuevo) {
  const desde = normalizarClave(String(viejo ?? ''));
  const hasta = normalizarClave(String(nuevo ?? ''));
  if (hasta === '') throw new Error('El rubro necesita un nombre.');

  const lista = catalogoDe(estado)[ladoDe(tipo)];
  if (!lista.includes(desde)) throw new Error(`"${viejo}" no está en la lista.`);
  if (desde === hasta) return estado;

  if (lista.includes(hasta)) return unirRubros(estado, tipo, desde, hasta);

  return {
    ...conCatalogo(estado, tipo, lista.map((r) => (r === desde ? hasta : r))),
    movimientos: moverMovimientos(estado, tipo, desde, hasta),
  };
}

/**
 * Une dos rubros: los movimientos de `desde` pasan a `hasta`, y `desde` se va.
 *
 * Es la operación que hace posible todo lo demás. Sin ella, "sacar un rubro"
 * solo se podría hacer con los que nunca se usaron.
 */
function unirRubros(estado, tipo, desde, hasta) {
  const origen = normalizarClave(String(desde ?? ''));
  const destino = normalizarClave(String(hasta ?? ''));

  const lista = catalogoDe(estado)[ladoDe(tipo)];
  if (!lista.includes(origen)) throw new Error(`"${desde}" no está en la lista.`);
  if (!lista.includes(destino)) throw new Error(`"${hasta}" no está en la lista.`);
  if (origen === destino) throw new Error('Hay que elegir dos rubros distintos.');

  return {
    ...conCatalogo(estado, tipo, lista.filter((r) => r !== origen)),
    movimientos: moverMovimientos(estado, tipo, origen, destino),
  };
}

/**
 * Saca un rubro de la lista. **Solo si no lo usa ningún movimiento.**
 *
 * Con movimientos adentro hay que unirlo a otro: es la regla 2. El mensaje dice
 * cuántos son y qué hacer, porque "no se puede" sin decir por qué es la forma
 * más rápida de que alguien busque la manera de forzarlo.
 */
function borrarRubro(estado, tipo, nombre) {
  const clave = normalizarClave(String(nombre ?? ''));
  const lista = catalogoDe(estado)[ladoDe(tipo)];
  if (!lista.includes(clave)) throw new Error(`"${nombre}" no está en la lista.`);

  if (lista.length === 1) {
    throw new Error('Tiene que quedar al menos un rubro: sin ninguno no se podría cargar nada.');
  }

  const cuantos = usoDeRubros(estado, tipo).get(clave) ?? 0;
  if (cuantos > 0) {
    throw new Error(
      `"${clave}" lo usan ${cuantos === 1 ? '1 movimiento' : `${cuantos} movimientos`}. ` +
      `Sacarlo los dejaría fuera de todos los totales, así que primero hay que ` +
      `unirlo con otro rubro: sus movimientos se mudan y el rubro desaparece.`
    );
  }

  return conCatalogo(estado, tipo, lista.filter((r) => r !== clave));
}

// ── src/core/ahorros.js ─────────────────────────────────────────
// Los ahorros conjuntos — CU-14, T-040. Reemplaza la hoja `Ahorros conjuntos`.
//
// ── Por qué es un registro APARTE y no un rubro más ──────────────────────────
//
// Un ahorro no es un gasto ni un ingreso del mes: no entra en el saldo, no va en
// la evolución, no se reparte por rubro. Meterlo en la lista de movimientos
// ensuciaría todos los totales que ya funcionan, y para separarlo después
// habría que acordarse de excluirlo en cada cuenta — o sea, no separarlo nunca.
//
// ── La regla que hace distinto a este módulo: NO SE CONVIERTE A EUROS ────────
//
// Un plazo fijo en pesos uruguayos es un plazo fijo en pesos uruguayos. Pasarlo
// a euros al cambio de hoy inventa un número que no existe hasta que la plata
// se cambie de verdad, y ese número cambiaría solo, todos los días, sin que el
// usuario haya tocado nada.
//
// Por eso **no hay ningún total general**. Hay un total por moneda, y ninguno
// que los junte. Que ese número no exista es el resultado correcto, no algo que
// falte por hacer.
//
// ── Cómo está armada la hoja del usuario ─────────────────────────────────────
//
// `Comentarios | DÍA | DETALLES | MONEDA | MONTO | ALE / IRE | I/G`, con los
// encabezados en la fila 3 y los datos desde la 4. La columna `I/G` es lo que
// hace que esto sea un historial y no una foto: `I` es plata que entró al
// ahorro y `G` plata que salió — "Vuelos Roma / G" es haber sacado del ahorro
// para pagar los vuelos.
//
// ── Lo que la planilla hace mal, y acá no se copia ───────────────────────────
//
// Sus tres cuadros de totales usan **tres rangos distintos** sobre la misma
// tabla: `$E4:$E89` el total por moneda, `$E4:$E93` el de ALE y `$E4:$E97` el de
// IRE. Hoy hay once filas y no muerde; el día que pase de 89, el total general
// va a dejar de contar filas que los de cada persona sí cuentan, y los cuadros
// van a dejar de cerrar entre sí **sin decir nada**. Es exactamente L-001, y es
// la razón por la que acá no hay ningún límite de filas escrito a mano.
//
// Este archivo no toca el navegador: es lógica pura y se testea con node --test.



/** Plata que entra al ahorro. */
const AHORRO_ENTRA = 'I';
/** Plata que sale del ahorro. */
const AHORRO_SALE = 'G';

/**
 * Las dos personas, tal como están escritas en la planilla.
 *
 * Es una lista cerrada a pedido del usuario (2026-08-31): son dos, con nombre
 * propio, y no van a cambiar. Una lista editable sería una pantalla más para
 * mantener algo que nadie va a querer tocar.
 */
const PERSONAS = Object.freeze(['ALE', 'IRE']);

/**
 * Las monedas escritas como las escribe la planilla.
 *
 * La hoja dice `DÓLARES`, `EUROS`, `PESOS UY`; la app trabaja con códigos ISO
 * porque es lo que ya usa para todo lo demás y lo que permite compartir el
 * catálogo de decimales (ADR-011). La traducción vive acá, en un solo lugar.
 */
const MONEDAS_DE_LA_PLANILLA = Object.freeze({
  'dolares': 'USD',
  'dolares estadounidenses': 'USD',
  'usd': 'USD',
  'euros': 'EUR',
  'eur': 'EUR',
  'pesos uy': 'UYU',
  'pesos uruguayos': 'UYU',
  'uyu': 'UYU',
});

/**
 * De cómo lo escribe la planilla al código de moneda. Devuelve `null` si no se
 * reconoce, para que quien llame decida: el importador lo cuenta como fila que
 * no entró (RN-05), en vez de meter plata en la moneda equivocada.
 */
function monedaDeLaPlanilla(texto) {
  // **Sin tildes**: la hoja dice `DÓLARES` y el mapa de arriba `dolares`, y son
  // la misma palabra. Se reutiliza la normalización de la búsqueda (T-943), que
  // además cuida la ñ. Escribir las dos formas en el mapa sería llevar dos
  // listas que un día dejan de estar de acuerdo.
  const clave = normalizarBusqueda(String(texto ?? ''));
  return MONEDAS_DE_LA_PLANILLA[clave] ?? null;
}

/**
 * De cómo la escribe la planilla al nombre de la persona.
 *
 * Compara normalizado —`ale`, `ALE`, `Ale` son la misma— por la misma razón que
 * todo lo demás que agrupa (RN-03, L-002): una escritura distinta partiría los
 * totales de una persona en dos sin avisar.
 */
function personaDeLaPlanilla(texto) {
  const clave = normalizarClave(String(texto ?? ''));
  return PERSONAS.find((p) => normalizarClave(p) === clave) ?? null;
}

/** Lo mismo para la columna `I/G`. Cualquier otra cosa no es un movimiento. */
function tipoDeLaPlanilla(texto) {
  const clave = normalizarClave(String(texto ?? ''));
  if (clave === 'i') return AHORRO_ENTRA;
  if (clave === 'g') return AHORRO_SALE;
  return null;
}

/**
 * Arma un movimiento de ahorro válido, o tira explicando qué falta.
 *
 * `decimales` viene del catálogo de monedas del usuario, igual que en los
 * gastos: **el monto se guarda en unidades mínimas** (ADR-005) y sin saber
 * cuántos decimales tiene la moneda, el número quedaría cien veces más grande o
 * más chico.
 */
function crearAhorro(entrada, { decimales, id, creado } = {}) {
  if (!Number.isInteger(decimales)) {
    throw new Error(
      'Falta saber cuántos decimales usa la moneda: sin ese dato el monto se guardaría cien veces más grande o más chico (RN-04b).'
    );
  }

  const persona = personaDeLaPlanilla(entrada.persona);
  if (persona === null) {
    throw new Error(`"${entrada.persona}" no es una de las dos personas (${PERSONAS.join(', ')}).`);
  }

  const tipo = tipoDeLaPlanilla(entrada.tipo);
  if (tipo === null) {
    throw new Error(`"${entrada.tipo}" no dice si la plata entró (I) o salió (G) del ahorro.`);
  }

  const monto = aMinimas(entrada.monto, decimales);
  if (monto === 0) {
    throw new Error('Un movimiento de cero no se guarda: si no hubo dinero de por medio, no hay nada que registrar.');
  }

  return {
    id: id ?? nuevoId('aho'),
    fecha: validarFecha(entrada.fecha),
    persona,
    tipo,
    monto,
    moneda: normalizarMoneda(entrada.moneda),
    // El comentario y el detalle se guardan TAL COMO SE ESCRIBIERON, igual que
    // en los gastos (ADR-013). El detalle es texto libre y nada más: el usuario
    // fue explícito en que "plazo fijo" es información suya para leer, no una
    // categoría que la app tenga que agrupar (2026-08-31).
    comentario: normalizarTextoVisible(entrada.comentario ?? ''),
    detalle: normalizarTextoVisible(entrada.detalle ?? ''),
    creado: creado ?? validarFecha(entrada.fecha),
  };
}

/** Lo que suma un movimiento: lo que entra suma, lo que sale resta. */
function aporteDe(movimiento) {
  return movimiento.tipo === AHORRO_SALE ? -movimiento.monto : movimiento.monto;
}

/**
 * Cuánto hay en cada moneda, de la que más tiene a la que menos.
 *
 * **No hay ningún total general y no es un olvido**: sumar monedas distintas
 * exigiría convertirlas, y este módulo existe justamente para no hacer eso.
 *
 * Se listan **todas las monedas que aparecen**, incluso las que quedaron en
 * cero: que un ahorro se haya gastado entero es información, y una moneda que
 * desaparece de la lista se lee como que nunca existió.
 */
function totalPorMoneda(estado) {
  const porMoneda = new Map();

  for (const movimiento of estado?.ahorros ?? []) {
    const anterior = porMoneda.get(movimiento.moneda) ?? { moneda: movimiento.moneda, total: 0, cuantos: 0 };
    porMoneda.set(movimiento.moneda, {
      ...anterior,
      total: anterior.total + aporteDe(movimiento),
      cuantos: anterior.cuantos + 1,
    });
  }

  return [...porMoneda.values()]
    .sort((a, b) => b.total - a.total || a.moneda.localeCompare(b.moneda));
}

/**
 * Cuánto tiene cada persona en cada moneda.
 *
 * Es para lo que existe la hoja: los ahorros son de dos, y saber cuánto puso
 * cada uno es la mitad del asunto. Van **las dos personas siempre**, aunque una
 * no tenga nada en esa moneda: un cero dice "no tiene", y una fila que falta no
 * dice nada.
 */
function totalPorPersona(estado) {
  return totalPorMoneda(estado).map(({ moneda, total }) => ({
    moneda,
    total,
    personas: PERSONAS.map((persona) => ({
      persona,
      total: sumar((estado?.ahorros ?? [])
        .filter((m) => m.moneda === moneda && m.persona === persona)
        .map(aporteDe)),
    })),
  }));
}

/**
 * Los movimientos de ahorro, del más nuevo al más viejo.
 *
 * Se ordena por fecha y, entre las de un mismo día, por el orden de carga dado
 * vuelta — la misma regla que la lista de gastos (T-945), por el mismo motivo:
 * lo último que anotaste es lo que vas a querer corregir.
 */
function ahorrosOrdenados(estado) {
  return [...(estado?.ahorros ?? [])].reverse()
    .sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0));
}

// ── src/core/calculos.js ────────────────────────────────────────
// Los cálculos del mes — CU-04, CU-05 y CU-10.
//
// Este archivo reemplaza los bloques `GASTOS POR TIPO`, `INGRESOS POR TIPO`,
// `TOTALES` y `GASTO POR DÍA` del Excel original, y existe sobre todo para no
// repetir su error más grave:
//
//   **Ninguna función de acá recibe un rango.** Todas reciben la lista completa
//   de movimientos y filtran adentro. En la planilla, cada fórmula suma hasta
//   una fila escrita a mano ($G$8:$G$1027) y el día que el registro pase esa
//   fila los totales van a dar de menos, sin ningún aviso (L-001). No fallan:
//   mienten. Si alguna vez aparece un número máximo de filas en este archivo,
//   es un error, no una optimización.
//
// Todo se devuelve en **céntimos de euro** (RN-04). Formatearlo es de
// `core/formato.js`; decidir qué se muestra, de la pantalla.
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.





/** Los movimientos de un mes. Recorre la lista entera, sin ningún tope (L-001). */
function movimientosDelMes(movimientos, mes) {
  if (!Array.isArray(movimientos)) return [];
  return movimientos.filter((m) => mesDe(m.fecha) === mes);
}

/** Los meses que tienen al menos un movimiento, del más nuevo al más viejo. */
function mesesConMovimientos(movimientos) {
  if (!Array.isArray(movimientos)) return [];
  return [...new Set(movimientos.map((m) => mesDe(m.fecha)))].sort().reverse();
}

/** Cuántos días tiene un mes. Se calcula: febrero de 2028 tiene 29. */
function diasDelMes(mes) {
  const anio = Number(mes.slice(0, 4));
  const numero = Number(mes.slice(5));
  return new Date(Date.UTC(anio, numero, 0)).getUTCDate();
}

/**
 * Separa los movimientos que se pueden convertir a euros de los que no.
 *
 * Un movimiento sin tipo de cambio **no se cuenta como cero** y **no se
 * descarta en silencio**: sale aparte, para que la pantalla pueda decir que el
 * total está incompleto. Un total al que le falta un gasto y que no lo dice es
 * peor que no mostrar ningún total: parece completo.
 *
 * Cargar un movimiento así no debería ser posible (RN-04, T-012), pero puede
 * llegar desde un respaldo importado o desde datos editados a mano.
 */
function separarConvertibles(movimientos, cambios, base) {
  const convertibles = [];
  const sinConvertir = [];
  for (const movimiento of movimientos) {
    if (faltaCambioPara(movimiento, cambios, base)) sinConvertir.push(movimiento);
    else convertibles.push(movimiento);
  }
  return { convertibles, sinConvertir };
}

/**
 * Los importes de una lista, en la moneda base — T-050.
 *
 * Se sigue llamando "en euros" en muchos lados por historia; lo que devuelve es
 * la moneda base que el usuario haya elegido, que de fábrica es el euro.
 */
function enEuros(movimientos, cambios, monedas, base) {
  return movimientos.map((m) => movimientoEnEuros(m, cambios, monedas, base));
}

/**
 * Los tres números del mes: gastos, ingresos y saldo. Reemplaza el bloque
 * `TOTALES` del Excel.
 *
 * `saldo` es ingresos − gastos y **puede ser negativo**, que es justamente el
 * caso en que mirarlo importa.
 */
function totalesDelMes(estado, mes) {
  const delMes = movimientosDelMes(estado.movimientos, mes);
  const { convertibles, sinConvertir } = separarConvertibles(delMes, estado.tipos_cambio, monedaBaseDe(estado));

  const gastos = sumar(
    enEuros(convertibles.filter((m) => m.tipo === TIPO_GASTO), estado.tipos_cambio, estado.monedas, monedaBaseDe(estado))
  );
  const ingresos = sumar(
    enEuros(convertibles.filter((m) => m.tipo === TIPO_INGRESO), estado.tipos_cambio, estado.monedas, monedaBaseDe(estado))
  );

  return {
    gastos,
    ingresos,
    saldo: ingresos - gastos,
    cuantos: delMes.length,
    sinConvertir,
  };
}

/**
 * El desglose por rubro, de mayor a menor. Reemplaza `GASTOS POR TIPO` e
 * `INGRESOS POR TIPO`.
 *
 * Devuelve **solo los rubros con movimientos**: una fila en cero por cada rubro
 * que no usaste llena la pantalla de nada. El porcentaje es sobre el total de
 * ese tipo en ese mes.
 */
function porRubro(estado, mes, tipo) {
  const delMes = movimientosDelMes(estado.movimientos, mes);
  const { convertibles } = separarConvertibles(delMes, estado.tipos_cambio, monedaBaseDe(estado));
  const delTipo = convertibles.filter((m) => m.tipo === tipo);

  const acumulado = new Map();
  for (const movimiento of delTipo) {
    const euros = movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas, monedaBaseDe(estado));
    const anterior = acumulado.get(movimiento.rubro) ?? { rubro: movimiento.rubro, total: 0, cuantos: 0 };
    acumulado.set(movimiento.rubro, {
      rubro: movimiento.rubro,
      total: anterior.total + euros,
      cuantos: anterior.cuantos + 1,
    });
  }

  const total = sumar([...acumulado.values()].map((r) => r.total));

  return [...acumulado.values()]
    .map((r) => ({ ...r, porcentaje: total === 0 ? 0 : (r.total / total) * 100 }))
    // De mayor a menor, y con el nombre como desempate para que el orden no
    // dependa de en qué orden se cargaron dos rubros que suman lo mismo.
    .sort((a, b) => b.total - a.total || a.rubro.localeCompare(b.rubro));
}

/** Los rubros de un tipo que el usuario NO usó este mes. Para el detalle. */
function rubrosSinUsar(estado, mes, tipo) {
  const usados = new Set(porRubro(estado, mes, tipo).map((r) => normalizarClave(r.rubro)));
  return rubrosDe(tipo, estado?.rubros).filter((r) => !usados.has(r));
}

/**
 * Día por día del mes — CU-05. Reemplaza el bloque `GASTO POR DÍA`.
 *
 * Devuelve **todos** los días del mes, incluidos los que no tienen nada: el
 * acumulado tiene que poder leerse como una línea continua, y un día faltante
 * en el medio se lee como si ese día no hubiera existido.
 */
function porDia(estado, mes) {
  const delMes = movimientosDelMes(estado.movimientos, mes);
  const { convertibles } = separarConvertibles(delMes, estado.tipos_cambio, monedaBaseDe(estado));

  const gastoPorDia = new Map();
  const ingresoPorDia = new Map();
  for (const movimiento of convertibles) {
    const dia = Number(movimiento.fecha.slice(8));
    const euros = movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas, monedaBaseDe(estado));
    const donde = movimiento.tipo === TIPO_GASTO ? gastoPorDia : ingresoPorDia;
    donde.set(dia, (donde.get(dia) ?? 0) + euros);
  }

  const dias = [];
  let gastoAcumulado = 0;
  let ingresoAcumulado = 0;

  for (let dia = 1; dia <= diasDelMes(mes); dia += 1) {
    const gasto = gastoPorDia.get(dia) ?? 0;
    const ingreso = ingresoPorDia.get(dia) ?? 0;
    gastoAcumulado += gasto;
    ingresoAcumulado += ingreso;
    dias.push({
      dia,
      fecha: `${mes}-${String(dia).padStart(2, '0')}`,
      gasto,
      ingreso,
      gastoAcumulado,
      ingresoAcumulado,
    });
  }
  return dias;
}

/**
 * Los meses que van del más viejo al más nuevo, **sin huecos**.
 *
 * Un mes sin movimientos en el medio se muestra igual, en cero. Saltearlo haría
 * que dos filas pegadas fueran enero y marzo, y la comparación —que es para lo
 * único que sirve esta matriz— pasaría a depender de leer la etiqueta de cada
 * fila en vez de mirar la columna.
 */
function mesesSeguidos(desde, hasta) {
  const meses = [];
  let anio = Number(desde.slice(0, 4));
  let mes = Number(desde.slice(5));
  const finAnio = Number(hasta.slice(0, 4));
  const finMes = Number(hasta.slice(5));

  while (anio < finAnio || (anio === finAnio && mes <= finMes)) {
    meses.push(`${anio}-${String(mes).padStart(2, '0')}`);
    mes += 1;
    if (mes > 12) { mes = 1; anio += 1; }
  }
  return meses;
}

/**
 * La matriz mes × rubro — CU-10. Reemplaza la hoja `Analisis1` del Excel.
 *
 * Una fila por mes con el gasto de cada rubro, el total de gastos, el de
 * ingresos y el saldo; más una fila de **total** y una de **promedio**.
 *
 * ── Tres decisiones, escritas porque en el Excel no lo estaban ──────────────
 *
 * 1. **Están todos los rubros siempre** —los ocho de gasto y los cuatro de
 *    ingreso—, aunque un mes no tenga ninguno. Es una matriz: una columna que
 *    aparece y desaparece según el mes deja de ser una columna. (Es lo mismo que
 *    el usuario pidió para la planilla exportada.)
 *
 *    Los rubros de ingreso se agregaron el 2026-08-29 a pedido del usuario. Van
 *    en una lista aparte, `rubrosIngreso`, y **no se mezclan con los de gasto**:
 *    `otros` está en las dos listas y son cosas distintas (RN-02). Lo que los
 *    separa es el `tipo`, nunca el nombre.
 *
 * 2. **El promedio deja afuera el mes en curso; el total lo incluye.** Un mes
 *    empezado tiene menos días que los demás y arrastra el promedio para abajo,
 *    pero sacarlo del total escondería plata gastada de verdad.
 *
 *    En el Excel esto pasaba —la fila de total suma `D4:D14` y la de promedio
 *    promedia `D4:D13`— pero **no estaba escrito en ningún lado** (L-006), así
 *    que era imposible saber si era a propósito o un descuido. Acá es a
 *    propósito, y `mesesDelPromedio` dice sobre cuántos meses se calculó para
 *    que la pantalla lo pueda escribir.
 *
 * 3. **Un mes con movimientos sin tipo de cambio se marca**, no se corrige ni se
 *    esconde: su fila sale con `incompleto: true` y la pantalla lo dice. Un
 *    número al que le falta un gasto y que no avisa es peor que ningún número.
 */
function matrizMesRubro(estado, mesActual) {
  const conMovimientos = mesesConMovimientos(estado.movimientos);
  const rubros = rubrosDe(TIPO_GASTO, estado?.rubros);
  const rubrosIngreso = rubrosDe(TIPO_INGRESO, estado?.rubros);
  if (conMovimientos.length === 0) {
    return { meses: [], rubros, rubrosIngreso, filas: [], total: null, promedio: null, mesesDelPromedio: 0 };
  }

  const meses = mesesSeguidos(conMovimientos[conMovimientos.length - 1], conMovimientos[0]);

  const filas = meses.map((mes) => {
    const totales = totalesDelMes(estado, mes);
    const desglose = new Map(porRubro(estado, mes, TIPO_GASTO).map((f) => [normalizarClave(f.rubro), f.total]));
    const desgloseIngreso = new Map(porRubro(estado, mes, TIPO_INGRESO).map((f) => [normalizarClave(f.rubro), f.total]));

    return {
      mes,
      rubros: rubros.map((rubro) => desglose.get(rubro) ?? 0),
      rubrosIngreso: rubrosIngreso.map((rubro) => desgloseIngreso.get(rubro) ?? 0),
      gastos: totales.gastos,
      ingresos: totales.ingresos,
      saldo: totales.saldo,
      incompleto: totales.sinConvertir.length > 0,
    };
  });

  const sumarFilas = (deLasQue) => ({
    rubros: rubros.map((_, i) => sumar(deLasQue.map((f) => f.rubros[i]))),
    rubrosIngreso: rubrosIngreso.map((_, i) => sumar(deLasQue.map((f) => f.rubrosIngreso[i]))),
    gastos: sumar(deLasQue.map((f) => f.gastos)),
    ingresos: sumar(deLasQue.map((f) => f.ingresos)),
    saldo: sumar(deLasQue.map((f) => f.saldo)),
  });

  const total = sumarFilas(filas);

  // El mes en curso sale del promedio solo si de verdad está en la matriz.
  const enCurso = filas.filter((f) => f.mes === mesActual);
  const terminados = filas.filter((f) => f.mes !== mesActual);
  const paraPromediar = terminados.length > 0 ? terminados : filas;

  const sumas = sumarFilas(paraPromediar);
  const dividir = (valor) => redondear(valor / paraPromediar.length);
  const promedio = {
    rubros: sumas.rubros.map(dividir),
    rubrosIngreso: sumas.rubrosIngreso.map(dividir),
    gastos: dividir(sumas.gastos),
    ingresos: dividir(sumas.ingresos),
    saldo: dividir(sumas.saldo),
  };

  return {
    meses,
    rubros,
    rubrosIngreso,
    filas,
    total,
    promedio,
    mesesDelPromedio: paraPromediar.length,
    dejaAfuera: enCurso.length > 0 && terminados.length > 0 ? mesActual : null,
  };
}

/**
 * Los movimientos que entran en un filtro — T-026.
 *
 * Existe para que tocar un agrupamiento lleve a **los movimientos que lo
 * componen**. Hasta ahora cada total era un callejón sin salida: el resumen
 * decía "Supermercado 410,00 €" y para saber de qué se componía había que ir a
 * la lista y leer el mes entero.
 *
 * El filtro es un objeto con las claves que se quieran combinar:
 *
 *   - `tipo` y `rubro` — el desglose del mes y las celdas de la matriz.
 *   - `comentario` — un gasto fijo o un viaje.
 *   - `todosLosMeses` — mira todo el historial en vez de un mes. Lo necesita el
 *     comentario: la tarjeta de gastos fijos habla de todos los meses, así que
 *     tocarla y ver solo el mes en curso mostraría una parte del número que se
 *     acaba de tocar, que es peor que no mostrar nada.
 *
 * Compara por la **clave normalizada** (RN-03): tocar `Luz` tiene que traer
 * también los que se escribieron `luz`, porque son los mismos que se sumaron.
 */
function movimientosFiltrados(estado, mes, filtro = {}) {
  const todos = estado.movimientos ?? [];
  const base = filtro.todosLosMeses ? todos : movimientosDelMes(todos, mes);

  const igual = (a, b) => normalizarClave(String(a ?? '')) === normalizarClave(String(b ?? ''));

  return base.filter((m) => {
    if (filtro.tipo !== undefined && m.tipo !== filtro.tipo) return false;
    if (filtro.rubro !== undefined && !igual(m.rubro, filtro.rubro)) return false;
    if (filtro.comentario !== undefined && !igual(m.comentario, filtro.comentario)) return false;
    return true;
  });
}

/** Si un filtro no filtra nada, no es un filtro: es un objeto vacío. */
function hayFiltro(filtro) {
  return filtro !== null && filtro !== undefined
    && (filtro.tipo !== undefined || filtro.rubro !== undefined || filtro.comentario !== undefined);
}

/**
 * El acumulado día por día de **todo el historial** — T-940.
 *
 * Es el gráfico que el usuario tiene en `Analisis1`: cuánto lleva entrado y
 * cuánto lleva salido desde que empezó a registrar, no desde que empezó el mes.
 * Contesta una pregunta que ninguna otra pantalla contesta: *¿la distancia entre
 * las dos líneas se está abriendo o cerrando?*
 *
 * **Devuelve todos los días entre el primer movimiento y el último**, incluidos
 * los vacíos: es una línea de tiempo, y un día que falta en el medio la corre.
 * Y **no tiene ningún tope**: recorre lo que haya (L-001).
 */
function acumuladoHistorico(estado) {
  const movimientos = estado?.movimientos ?? [];
  const { convertibles } = separarConvertibles(movimientos, estado?.tipos_cambio, monedaBaseDe(estado));
  if (convertibles.length === 0) return [];

  const gastoPorFecha = new Map();
  const ingresoPorFecha = new Map();
  for (const movimiento of convertibles) {
    const euros = movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas, monedaBaseDe(estado));
    const donde = movimiento.tipo === TIPO_GASTO ? gastoPorFecha : ingresoPorFecha;
    donde.set(movimiento.fecha, (donde.get(movimiento.fecha) ?? 0) + euros);
  }

  const fechas = convertibles.map((m) => m.fecha).sort();
  const primera = fechas[0];
  const ultima = fechas[fechas.length - 1];

  const dias = [];
  let gastoAcumulado = 0;
  let ingresoAcumulado = 0;
  let n = 0;

  // Se avanza día por día con la aritmética de Date en UTC, que es la única que
  // no se corre en marzo y en octubre por el horario de verano.
  const fin = Date.parse(`${ultima}T12:00:00Z`);
  for (let t = Date.parse(`${primera}T12:00:00Z`); t <= fin; t += 86400000) {
    const fecha = new Date(t).toISOString().slice(0, 10);
    n += 1;
    gastoAcumulado += gastoPorFecha.get(fecha) ?? 0;
    ingresoAcumulado += ingresoPorFecha.get(fecha) ?? 0;
    dias.push({ dia: n, fecha, mes: mesDe(fecha), gastoAcumulado, ingresoAcumulado });
  }
  return dias;
}

/**
 * El promedio de gasto por día del mes.
 *
 * **Divide por los días transcurridos, no por los del mes**, cuando el mes es el
 * que está en curso: a mitad de mes, dividir por 31 da un promedio artificalmente
 * bajo y hace creer que se está gastando menos de lo real. Para un mes ya
 * terminado los dos números coinciden.
 *
 * `hasta` es el día hasta el que contar; sin él, el mes entero.
 */
function promedioPorDia(estado, mes, hasta) {
  const { gastos } = totalesDelMes(estado, mes);
  const dias = Math.min(hasta ?? diasDelMes(mes), diasDelMes(mes));
  if (dias <= 0) return 0;
  return redondear(gastos / dias);
}

/**
 * Los gastos fijos agrupados — CU-12. Reemplaza el bloque `GASTOS FIJOS
 * PROMEDIO` del Excel. Responde "¿cuánto me sale la luz por mes?".
 *
 * Agrupa **todo el historial**, no un mes: un promedio sobre un mes es el gasto
 * de ese mes con otro nombre. Por eso no recibe un mes.
 *
 * ── Qué se cuenta ───────────────────────────────────────────────────────────
 *
 * Los movimientos de **gasto** del rubro `gastos fijos`, agrupados por la
 * **clave** del comentario (RN-03): `Luz` y `luz` son la misma factura, y el
 * comentario es lo que el usuario ya viene usando como etiqueta en su planilla
 * (MAPEO-EXCEL §3, columna B).
 *
 * ── Los que no entran en la lista salen aparte, no se tiran ────────────────
 *
 * Dos casos, y los dos se cuentan y se suman para que la pantalla los pueda
 * decir. **Descartarlos en silencio haría que la suma de la lista no cerrara
 * con el total del rubro**, y el usuario no tendría forma de saber por qué:
 *
 *  - **Sin etiqueta.** En la planilla del usuario hay filas de gastos fijos sin
 *    comentario. Sin etiqueta no hay nada que promediar: no se sabe si son tres
 *    facturas de luz o tres cosas distintas.
 *
 * ── Lo que se suma acá es SOLO el rubro, y por eso no depende de la etiqueta ─
 *
 * Cada fila suma **los gastos del rubro `gastos fijos` que llevan esa
 * etiqueta**, y nada más. Si "Casa" junta el alquiler (`gastos fijos`) y un
 * arreglo (`otros`), acá se ven los 60 € del alquiler; los 70 € completos se
 * ven en los otros grupos (T-946), que agrupan por etiqueta con todos los
 * rubros adentro. **Son dos preguntas distintas y cada pantalla dice cuál
 * contesta.**
 *
 * La primera versión de T-946 sacaba de esta lista las etiquetas mixtas para
 * que ningún nombre apareciera dos veces. El usuario lo objetó con razón: el
 * rubro y la etiqueta son independientes, y **cómo etiquetás no puede cambiar
 * lo que ves de un rubro**. Ver ADR-041.
 */
function gastosFijos(estado) {
  const { convertibles } = separarConvertibles(estado.movimientos ?? [], estado.tipos_cambio, monedaBaseDe(estado));
  const fijos = convertibles.filter(
    (m) => m.tipo === TIPO_GASTO && normalizarClave(m.rubro) === 'gastos fijos',
  );

  // Qué etiquetas, además de estar acá, tienen un grupo propio en los otros
  // grupos. No cambia ningún total: la fila lo dice para que quien vea 60 € acá
  // y 70 € allá sepa por qué son distintos.
  const conGrupoPropio = new Set();
  for (const [clave, gastos] of porEtiquetaDeGasto(estado)) {
    if (categoriaDeEtiqueta(gastos) === 'otro') conGrupoPropio.add(clave);
  }

  const acumulado = new Map();
  let sinComentario = { cuantos: 0, total: 0 };

  for (const movimiento of fijos) {
    const euros = movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas, monedaBaseDe(estado));
    if (!movimiento.comentario) {
      sinComentario = { cuantos: sinComentario.cuantos + 1, total: sinComentario.total + euros };
      continue;
    }

    const clave = normalizarClave(movimiento.comentario);
    const anterior = acumulado.get(clave);
    const mes = mesDe(movimiento.fecha);
    acumulado.set(clave, {
      clave,
      comentario: anterior?.comentario ?? movimiento.comentario,
      total: (anterior?.total ?? 0) + euros,
      cuantos: (anterior?.cuantos ?? 0) + 1,
      // Entre qué meses se pagó. Es lo que deja ver la cadencia: ocho pagos en
      // once meses no es lo mismo que ocho pagos en ocho meses, y el promedio
      // por pago solo, sin eso, se lee como si fuera mensual.
      desde: anterior === undefined || mes < anterior.desde ? mes : anterior.desde,
      hasta: anterior === undefined || mes > anterior.hasta ? mes : anterior.hasta,
    });
  }

  const grupos = [...acumulado.values()]
    .map((g) => ({
      ...g,
      promedio: redondear(g.total / g.cuantos),
      conGrupoPropio: conGrupoPropio.has(g.clave),
    }))
    .sort((a, b) => b.total - a.total || a.clave.localeCompare(b.clave));

  return {
    grupos,
    sinComentario,
    total: sumar([...grupos.map((g) => g.total), sinComentario.total]),
  };
}

/**
 * Los gastos con etiqueta, agrupados por clave. Lo usan `gastosFijos()` y
 * `core/agrupamientos.js`, que tienen que estar de acuerdo sobre qué etiqueta es
 * de qué tipo: dos versiones de esa cuenta serían dos pantallas peleándose por
 * la misma etiqueta.
 */
function porEtiquetaDeGasto(estado) {
  const { convertibles } = separarConvertibles(estado.movimientos ?? [], estado.tipos_cambio, monedaBaseDe(estado));
  const porClave = new Map();

  for (const movimiento of convertibles) {
    if (movimiento.tipo !== TIPO_GASTO) continue;
    const texto = String(movimiento.comentario ?? '');
    if (texto === '') continue;

    const clave = normalizarClave(texto);
    if (!porClave.has(clave)) porClave.set(clave, []);
    porClave.get(clave).push(movimiento);
  }
  return porClave;
}

/**
 * Los comentarios usados en un mes, con su total. Es la base de "cuánto costó un
 * viaje" (CU-11) y del promedio de gastos fijos (CU-12).
 *
 * Agrupa por la **clave** del comentario, no por el texto: `Roma` y `roma` son
 * el mismo viaje (RN-03, L-003). Se muestra la primera escritura que apareció.
 */
function porComentario(estado, mes) {
  const movimientos = mes ? movimientosDelMes(estado.movimientos, mes) : estado.movimientos;
  const { convertibles } = separarConvertibles(movimientos, estado.tipos_cambio, monedaBaseDe(estado));

  const acumulado = new Map();
  for (const movimiento of convertibles) {
    if (!movimiento.comentario) continue;
    const clave = normalizarClave(movimiento.comentario);
    const euros = movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas, monedaBaseDe(estado));
    const anterior = acumulado.get(clave);
    acumulado.set(clave, {
      clave,
      comentario: anterior?.comentario ?? movimiento.comentario,
      total: (anterior?.total ?? 0) + euros,
      cuantos: (anterior?.cuantos ?? 0) + 1,
    });
  }

  return [...acumulado.values()]
    .map((c) => ({ ...c, promedio: redondear(c.total / c.cuantos) }))
    .sort((a, b) => b.total - a.total || a.clave.localeCompare(b.clave));
}

/**
 * Los comentarios que el usuario ya usó, del más reciente al más viejo — T-912.
 *
 * Sirve para ofrecerlos mientras escribe. **No es una comodidad:** el comentario
 * es lo que agrupa los gastos de un viaje (RN-03), y `Barcelona26` y
 * `barcelona 26` son dos viajes distintos en los totales. Ofrecer lo que ya
 * existe es la forma más barata de que el usuario elija la escritura que ya
 * tiene en vez de inventar una nueva.
 *
 * Se devuelve **la primera escritura que apareció** de cada comentario, igual
 * que `porComentario()`: dos criterios distintos para elegir cómo se escribe un
 * grupo terminarían mostrando dos nombres para la misma cosa.
 *
 * El orden es por el movimiento más reciente que lo usó: el viaje en curso queda
 * arriba, que es el que se va a repetir.
 *
 * No recibe ningún límite: recorre la lista entera (L-001).
 */
function comentariosUsados(movimientos) {
  return textosUsados(movimientos, 'comentario');
}

/**
 * Los textos ya escritos en un campo, del más reciente al más viejo.
 *
 * Queda parametrizada por campo aunque hoy solo la use el comentario: el
 * detalle también sugería, y **el usuario pidió que no** (2026-08-28). El
 * comentario sugiere porque es lo que AGRUPA —dos escrituras distintas son dos
 * grupos distintos—; el detalle es una nota para uno mismo y no agrupa nada, así
 * que ahí la lista no ayuda, estorba. Si algún día vuelve a hacer falta, el
 * cambio es una línea; lo que no vuelve es una decisión sin escribir.
 */
function textosUsados(movimientos, campo) {
  if (!Array.isArray(movimientos)) return [];

  const porClave = new Map();

  for (const movimiento of movimientos) {
    const texto = normalizarTextoVisible(movimiento?.[campo] ?? '');
    if (texto === '') continue;

    const clave = claveDeComentario(texto);

      // escritura que se muestra sigue siendo la primera que apareció.
      visto.ultima = cuando;

 * antes que `Roma` sería contraintuitivo.

  const clave = normalizarClave(visible);

  const empiezan = [];
  const contienen = [];

  for (const texto of usados) {
    // Se saltea solo lo que ya está escrito **igual**, no lo que coincide en
    // clave: si escribió `roma` y existe `Roma`, hay que ofrecerlo. Ahí está
    // todo el sentido de esto — que elija la escritura que ya tiene en vez de
    // crear un segundo grupo con la misma palabra (RN-03).
    if (texto === visible) continue;

// ── src/core/periodo.js ─────────────────────────────────────────
// Mirar la evolución en un período recortado — T-054, CU-10.
//
// ── Por qué recortando el historial y no filtrando cada cuenta ──────────────
//
// La pantalla de evolución muestra seis cosas —la tabla mes × rubro, el total,
// el promedio, las dos tortas del reparto, los dos gráficos y los gastos
// fijos— y **todas se derivan de la misma lista de movimientos**. Agregarle un
// parámetro "desde/hasta" a cada una de esas cuentas sería seis oportunidades de
// que una se quede atrás y muestre el período entero al lado de las otras cinco
// recortadas: el peor resultado posible, porque los números se ven bien y no
// hablan del mismo tiempo.
//
// En vez de eso, acá se recorta **el historial** una sola vez y todo lo demás se
// calcula igual que siempre. Lo que la pantalla recibe es un estado que tiene
// esos movimientos y no otros; ninguna cuenta sabe que hay un período.
//
// ── Lo que el recorte NO toca ───────────────────────────────────────────────
//
// Los tipos de cambio, las monedas y los rubros quedan enteros: son el catálogo
// con el que se leen los movimientos, no movimientos. Sacar el tipo de cambio de
// un mes que quedó fuera del período no cambiaría ningún total, pero dejaría a
// los movimientos de ese mes sin poder convertirse si alguna cuenta los mirara.
//
// Este archivo no toca el navegador: es lógica pura.

/** Un texto `AAAA-MM` válido, o `null`. */

/**
 * Los meses que tienen movimientos, del más viejo al más nuevo.

 * no hay nada solo sirve para que la tabla salga vacía sin explicar por qué.

  return [...new Set(movimientos.map((m) => mesDe(m.fecha)))].sort();
}

/**
 * El período que hay que usar, a partir de lo que el usuario eligió.
 *
 * Devuelve `null` cuando hay que mostrar **todo**, que es el estado
 * predeterminado: sin nada elegido, la pantalla sigue siendo la de siempre.
 *
 * Un período al revés —desde marzo hasta enero— se da vuelta en vez de
 * rechazarse: es evidente qué quiso decir quien lo eligió, y una tabla vacía con
 * un cartel de error no le sirve a nadie.
 */

  const desde = mesValido(periodo?.desde);
  const hasta = mesValido(periodo?.hasta);

  // Con una sola punta elegida, la otra queda abierta: "desde marzo" es una
  // pregunta razonable y no hay por qué obligar a contestar las dos.
  if (desde !== null && hasta !== null && desde > hasta) return { desde: hasta, hasta: desde };

  if (periodo === null) return true;
  if (periodo.desde !== null && mes < periodo.desde) return false;
  if (periodo.hasta !== null && mes > periodo.hasta) return false;
  return true;

 * El mismo estado con **solo los movimientos del período**.

 * Sin período devuelve el estado tal cual —el mismo objeto—, para que el camino
 * de siempre no pague nada por esta función.

  const rango = normalizarPeriodo(periodo);
  if (rango === null) return estado;

  return {
    ...estado,
    movimientos: (estado?.movimientos ?? []).filter((m) => m && m.fecha && mesEnPeriodo(mesDe(m.fecha), rango)),

/**
 * Cuántos movimientos quedaron afuera. La pantalla lo dice: un total recortado
 * que no avisa que está recortado es la misma mentira que un total incompleto.
 */

  const rango = normalizarPeriodo(periodo);

  return (estado?.movimientos ?? []).length - estadoDelPeriodo(estado, rango).movimientos.length;

 * escribir. Son distintos en el eje de un gráfico: `2.100,00` ocupa el doble que

/**
 * El rótulo de un rubro, con la primera letra en mayúscula: `gastos fijos` se

// ── Fechas ───────────────────────────────────────────────────────────────────

const MESES = [

  'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',

 * al mostrarla el navegador la traduce a la zona horaria del dispositivo. En

 * app mostraría un día menos. Comprobado, no supuesto:

 *     Europe/Madrid       →  14/3/2026

 * fijo hace que se puedan comparar de un vistazo.

  return new Intl.DateTimeFormat(IDIOMA, {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    timeZone: 'UTC',

/** `2026-03-14` → `14 de marzo de 2026`. Para encabezados y confirmaciones. */
function formatearFechaLarga(iso) {
  const [anio, mes, dia] = validarFecha(iso).split('-').map(Number);

/** `2026-03-14` → `sábado`. Para el detalle del día. */
function formatearDiaSemana(iso) {

/**

 *
 * `marzo de 2026` completo haría que la única columna que no se puede achicar

  '#a552b7',  // 5 · violeta
  '#3987e5',  // 6 · azul
  '#199e70',  // 7 · aguamarina
  '#a8a8a8',  // 8 · gris

  '#91417d',  // 9 · ciruela
  '#56b2fd',  // 10 · celeste
  '#7e1cd8',  // 11 · violeta
  '#ff9b4e',  // 12 · ladrillo
  '#6c96c2',  // 13 · azul
  '#71c5df',  // 14 · azul claro
  '#9bc58d',  // 15 · verde menta
  '#008d89',  // 16 · cian
  '#8e32a7',  // 17 · malva
  '#cf6b58',  // 18 · naranja
  '#226cff',  // 19 · azul vivo
  '#b60356',  // 20 · bordó
]);

/**
 * Los fondos de celda de la planilla exportada.
 *
 * **Acá sí van los colores de su planilla tal cual**, incluido el gris de
 * `otros`: en una celda el color es el fondo de un texto negro que dice el
 * nombre del rubro, así que no tiene que identificar solo. Es exactamente la
 * situación de su Excel, y por eso funcionan ahí y no como barras.
 */
const FONDOS_RUBRO = Object.freeze([
  '#FF99CC',  // 1 · su rosa de gastos fijos
  '#FFCC99',  // 2 · su naranja de supermercado
  '#FFCCCC',  // 3 · su salmón de comida hecha
  '#CCFFCC',  // 4 · su verde de viajes
  '#CC99FF',  // 5 · su violeta de entretenimiento
  '#99CCFF',  // 6 · su celeste de transporte
  '#E5CCFF',  // 7 · su lila de salud
  '#D9D9D9',  // 8 · su gris de otros

  // Del 9 al 20: el mismo tono de cada color, muy aclarado, igual que los ocho
  // de arriba —que salieron de la planilla del usuario—. En Excel el número va
  // escrito ENCIMA, así que el fondo tiene que dejar leer texto negro.
  '#D8C8D6',  // 9 · ciruela
  '#C8EAFF',  // 10 · celeste
  '#D8BBE9',  // 11 · violeta
  '#DCC8C6',  // 12 · ladrillo
  '#C0CAF8',  // 13 · azul
  '#C6E1FC',  // 14 · azul claro
  '#C3F2D7',  // 15 · verde menta
  '#C5E9EF',  // 16 · cian
  '#E0CDDD',  // 17 · malva
  '#F5DEC6',  // 18 · naranja
  '#BDD4FF',  // 19 · azul vivo
  '#E2CBD1',  // 20 · bordó
]);

/**
 * En qué franja de color cae un rubro: un número de 1 a 8, estable para
 * siempre.
 *
 * Los rubros de gasto la sacan de su posición en la lista. Los de ingreso, de
 * un mapa propio, para que también hereden los colores de la planilla.
 */
function franjaDeRubro(tipo, rubro, catalogo) {
  const clave = normalizarClave(String(rubro ?? ''));

  if (tipo !== TIPO_GASTO) {
    // Los ingresos no siguen su posición en la lista sino un mapa propio, para
    // que también hereden los colores de la planilla: ahí el usuario tiene
    // trabajo en verde, inversiones en celeste, regalos en rosa y otros en gris.
    // Sin esto, `trabajo` sería rosa solo por ser el primero de su lista.
    const suyo = FRANJA_DE_INGRESO[clave];
    if (suyo !== undefined) return suyo;
    return COLORES;
  }

  // La posición en el catálogo **del usuario** (T-048), no en la lista de
  // fábrica: si él creó "mascotas", tiene que tener un color propio como
  // cualquier otro. El catálogo arranca igual al de fábrica, así que los
  // colores de siempre no se mueven.
  const posicion = rubrosDe(TIPO_GASTO, catalogo).indexOf(clave);

  // Un rubro que no está en la lista no debería existir (RN-02), pero si llega
  // de un dato viejo se le da la última franja en vez de romper la pantalla.
  return posicion === -1 ? COLORES : posicion + 1;
}

/**
 * Qué color le toca a cada rubro de ingreso.
 *
 * Sale de la planilla del usuario, no de la posición en la lista: ahí `trabajo`
 * es verde, `inversiones` celeste, `regalos` rosa y `otros` gris. Sigue
 * cumpliendo la regla de T-909 —el color depende del rubro y **nunca de su
 * tamaño**—, que es lo que importa: cargar un ingreso nuevo no repinta nada.
 *
 * Que `otros` de gasto y `otros` de ingreso caigan los dos en el gris es
 * correcto: en la planilla del usuario también es así. **Sí aparecen juntos en
 * la tabla mes a mes** desde T-947, y por eso esa tabla lleva un rótulo arriba
 * de cada bloque: el color no puede distinguirlos, y el nombre tampoco —los dos
 * se llaman "Otros"—, así que lo distingue el rótulo. Darles dos grises
 * distintos sería peor: rompería la correspondencia con el resto de la app, que
 * es para lo que existe esta paleta.
 */
const FRANJA_DE_INGRESO = Object.freeze({
  trabajo: 4,      // verde
  inversiones: 6,  // azul
  regalos: 1,      // rosa
  otros: 8,        // gris
});

/** La clase CSS que pinta un rubro. Los tonos viven en `src/estilos.css`. */
/** El fondo de una franja (1 a 8), en el formato que quiere Excel: sin `#`. */
function fondoDeFranja(franja) {
  const color = FONDOS_RUBRO[franja - 1] ?? FONDOS_RUBRO[FONDOS_RUBRO.length - 1];
  return color.slice(1).toUpperCase();
}


/**
 * Con qué color se escribe ENCIMA de un color de rubro — T-049.
 *
 * Es el único texto de la app que no usa un color de texto: va sobre el color
 * del rubro, así que se elige contra **ese** fondo. Hasta la paleta de ocho
 * alcanzaba con el negro; entre los veinte hay tonos oscuros —la ciruela, el
 * violeta— donde el negro no se lee y el blanco sí.
 *
 * La cuenta es la luminancia relativa de WCAG, la misma que usa el test que lo
 * comprueba: se elige el que más contraste da, y el resultado nunca baja de
 * 4,5:1 en ninguna de las dos paletas.
 */
function tintaSobreRubro(hex) {
  const canal = (c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
  const [r, g, b] = [1, 3, 5].map((i) => canal(parseInt(hex.slice(i, i + 2), 16) / 255));
  const luz = 0.2126 * r + 0.7152 * g + 0.0722 * b;

  const contraNegro = (luz + 0.05) / 0.05;
  const contraBlanco = 1.05 / (luz + 0.05);
  return contraBlanco > contraNegro ? '#ffffff' : '#000000';
}

/** Las franjas que necesitan tinta blanca, para poder escribirlo en el CSS. */
function franjasConTintaClara(paleta = COLORES_RUBRO) {
  return paleta
    .map((hex, i) => (tintaSobreRubro(hex) === '#ffffff' ? i + 1 : null))
    .filter((n) => n !== null);
}

// ── src/datos/almacenamiento.js ─────────────────────────────────
// La única puerta a los datos guardados. Todo lo que la app persiste pasa por
// acá, bajo una sola clave de localStorage (ARQUITECTURA §6).
//
// Este módulo carga con el riesgo más grave de toda la arquitectura: acá vive la
// única copia de los gastos del usuario. No hay servidor, no hay papelera, no hay
// historial. Un error de este archivo no da un número mal: borra meses de
// registro. Por eso hay una regla que gobierna todo lo de abajo:
//
//   ANTE LA DUDA, NO SE ESCRIBE.
//
// Si lo guardado no se entiende, este módulo devuelve un estado vacío para que la
// app abra igual, pero AVISA que lo hizo y GUARDA APARTE lo que no pudo leer. Lo
// que nunca hace es pisar en silencio un dato que no entendió: un dato ilegible
// todavía se puede rescatar a mano; uno sobrescrito, no.


const CLAVE_DATOS = 'viajecor:datos:v1';

// Sube solo si cambia la FORMA de los datos guardados (PRODUCTO §9). No sube
// porque se agregue una pantalla ni porque cambie un cálculo.
const ESQUEMA_ACTUAL = 1;

/** El prefijo bajo el que se preserva lo que no se pudo interpretar. */
const PREFIJO_RESCATE = 'viajecor:rescate:';

/**
 * El estado de un primer arranque: la app abierta por primera vez en un
 * dispositivo.
 *
 * `monedas` viene vacío a propósito. Las cuatro precargadas (RN-04b) las define
 * `core/monedas.js` (T-008), y tenerlas también acá serían dos listas que se
 * desincronizan: la trampa de L-005 aplicada al código. Quien arme el estado
 * inicial le pasa la lista.
 */
function estadoInicial({ monedas = [], versionApp } = {}) {
  return {
    esquema: ESQUEMA_ACTUAL,
    version_app: versionApp ?? globalThis.__VIAJECOR_VERSION__ ?? 'sin construir',
    movimientos: [],
    tipos_cambio: [],
    monedas: [...monedas],
    // Entre qué fechas fue cada viaje, por clave de etiqueta (T-023, T-941).
    // **No es un catálogo de viajes**: la lista de viajes sale de las etiquetas.
    // Es un dato suelto sobre uno de ellos, y el único que hay que guardar
    // porque no se puede deducir de los movimientos: un viaje puede empezar
    // antes del primer gasto anotado.
    fechas_de_viaje: [],
    // Los ahorros conjuntos (CU-14, T-040). Lista aparte de `movimientos` y no
    // un rubro más: un ahorro no entra en el saldo del mes ni se reparte por
    // rubro, y mezclarlo ensuciaría todos los totales que ya funcionan.
    ahorros: [],
    // El catálogo de rubros del usuario (T-048). Arranca con los de fábrica y
    // se edita desde Ajustes: crear, renombrar, unir. Vive en los datos y no en
    // el código por lo mismo que las monedas (T-008) — quien decide qué rubros
    // usa es quien anota los gastos, no quien escribió la app.
    rubros: rubrosIniciales(),
    preferencias: { moneda_predeterminada: 'EUR' },
  };
}

/**
 * El almacenamiento del navegador, o uno de mentira que dice la verdad.
 *
 * **Nunca tira al buscarlo**, y esa es toda la gracia. La primera versión hacía
 * `typeof localStorage === 'undefined'` y tiraba si no estaba. Parece defensivo
 * y no lo es: hay navegadores donde `localStorage` no falta sino que **tira con
 * solo nombrarlo** —una ventana privada con el almacenamiento bloqueado—, y ahí
 * `typeof` tira también. El error subía hasta `iniciar()` y la app quedaba **en
 * blanco**, sin una sola palabra.
 *
 * Lo encontró el recorrido en el navegador, bloqueando `localStorage` a
 * propósito. Era el escenario que el propio código decía manejar.
 *
 * Cuando no hay dónde guardar se devuelve un almacén que **se comporta como un
 * almacén vacío al leer y falla con un motivo entendible al escribir**. Así la
 * app abre, se puede usar, y `riesgoDeGuardado()` avisa que nada se está
 * guardando — en vez de una pantalla en blanco que no explica nada.
 */
function almacenPorDefecto() {
  try {
    if (typeof localStorage !== 'undefined' && localStorage) return localStorage;
  } catch {
    // Nombrarlo tiró: el navegador tiene el almacenamiento bloqueado.
  }
  return ALMACEN_DE_MENTIRA;
}

const ALMACEN_DE_MENTIRA = {
  length: 0,
  key: () => null,
  getItem: () => null,
  removeItem: () => {},
  setItem: () => {
    throw new Error(
      'No hay dónde guardar: este navegador no tiene almacenamiento disponible. ' +
      'Suele pasar en ventanas privadas o con el almacenamiento de sitios bloqueado.'
    );
  },
};

/**
 * Lee el estado guardado.
 *
 * **Nunca tira.** Que la app no abra porque un dato está raro es el peor
 * resultado posible: el usuario se queda sin ver ni siquiera lo que sí está
 * bien. Devuelve siempre algo usable, más un parte de qué pasó:
 *
 *   { estado, incidencias, primerArranque, rescate }
 *
 * `incidencias` es una lista de textos en castellano llano, pensados para
 * mostrarse. Si está vacía, lo guardado se leyó entero y sin pérdida.
 */
function leerEstado(almacen = almacenPorDefecto()) {
  const incidencias = [];
  let crudo = null;

  try {
    crudo = almacen.getItem(CLAVE_DATOS);
  } catch (error) {
    // Safari en modo privado puede tirar hasta al LEER. La app tiene que abrir.
    incidencias.push(`No se pudo acceder al almacenamiento del navegador: ${error.message}`);
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate: null, soloLectura: false };
  }

  if (crudo === null || crudo === '') {
    return { estado: estadoInicial(), incidencias, primerArranque: true, rescate: null, soloLectura: false };
  }

  let leido;
  try {
    leido = JSON.parse(crudo);
  } catch {
    // Lo guardado no es ni JSON. No se entiende nada, así que no se toca: se
    // aparta con su fecha y se sigue. Un dato ilegible todavía se puede rescatar
    // a mano; uno sobrescrito, no.
    const rescate = preservar(almacen, crudo, incidencias);
    incidencias.push(
      'Lo que había guardado no se pudo leer y se apartó sin tocarlo. La app arranca vacía, ' +
      'pero tus datos anteriores no se borraron: seguí desde un respaldo exportado si tenés uno.'
    );
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate, soloLectura: false };
  }

  if (leido === null || typeof leido !== 'object' || Array.isArray(leido)) {
    const rescate = preservar(almacen, crudo, incidencias);
    incidencias.push('Lo guardado no tiene la forma de un juego de datos de Viajecor y se apartó sin tocarlo.');
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate, soloLectura: false };
  }

  // Datos escritos por una versión MÁS NUEVA de la app. Este código no sabe qué
  // significan, y guardar encima los destruiría. Se abre en blanco y se avisa;
  // el usuario abrirá la versión nueva, donde sus datos siguen intactos.
  if (Number.isInteger(leido.esquema) && leido.esquema > ESQUEMA_ACTUAL) {
    incidencias.push(
      `Estos datos los escribió una versión más nueva de Viajecor (esquema ${leido.esquema}, ` +
      `esta app entiende hasta el ${ESQUEMA_ACTUAL}). No se tocaron. Abrilos con la versión nueva.`
    );
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate: null, soloLectura: true };
  }

  const estado = migrarEstado(leido, incidencias);
  return { estado, incidencias, primerArranque: false, rescate: null, soloLectura: false };
}

/**
 * Lleva un estado guardado a la forma actual, campo por campo.
 *
 * Cada campo se valida por separado y lo que no se entiende se descarta CON
 * AVISO. La alternativa —tirar todo el estado porque tres movimientos de
 * quinientos están rotos— pierde 497 movimientos buenos; la otra alternativa
 * —descartarlos en silencio— es peor todavía, porque el total del mes cambia y
 * nadie se entera. Es la misma regla que el importador (T-032): informar fila
 * por fila qué no se pudo leer.
 */
function migrarEstado(guardado, incidencias = []) {
  const estado = estadoInicial();

  if (!Number.isInteger(guardado.esquema)) {
    incidencias.push('Los datos no decían con qué versión del formato se guardaron; se leyeron como la actual.');
  }
  if (typeof guardado.version_app === 'string') {
    estado.version_app = guardado.version_app;
  }

  // ⚠️ El catálogo de rubros se lee **antes** que los movimientos, y no es un
  // detalle de orden: `validarMovimiento` comprueba que el rubro exista, así
  // que con el catálogo de fábrica **todo movimiento de un rubro creado por el
  // usuario se descartaría al recargar**. Plata anotada que desaparece en
  // silencio, que es exactamente lo que esta app no hace. Ver T-048.
  estado.rubros = leerCatalogoDeRubros(guardado.rubros, incidencias);

  estado.movimientos = leerLista(guardado.movimientos, 'movimientos', incidencias, (mov) =>
    validarMovimiento(mov, estado.rubros)
  );

  estado.tipos_cambio = leerLista(guardado.tipos_cambio, 'tipos de cambio', incidencias, (tc) => {
    if (tc === null || typeof tc !== 'object') throw new Error('no es un tipo de cambio');
    if (typeof tc.moneda !== 'string' || !/^[A-Za-z]{3}$/.test(tc.moneda.trim())) {
      throw new Error('la moneda no es un código de tres letras');
    }
    if (typeof tc.mes !== 'string' || !/^\d{4}-\d{2}$/.test(tc.mes)) {
      throw new Error('el mes no está escrito como AAAA-MM');
    }
    if (!Number.isFinite(tc.euros_por_unidad) || tc.euros_por_unidad <= 0) {
      throw new Error('el tipo de cambio no es un número mayor que cero');
    }
    return {
      moneda: tc.moneda.trim().toUpperCase(),
      mes: tc.mes,
      euros_por_unidad: tc.euros_por_unidad,
      creado: /^\d{4}-\d{2}-\d{2}$/.test(tc.creado) ? tc.creado : '1970-01-01',
    };
  });

  // Las monedas se guardan como vengan: quien manda sobre su forma es
  // core/monedas.js (T-008), y validarlas acá con una copia de sus reglas sería
  // tener dos jueces que tarde o temprano dicen cosas distintas.
  estado.monedas = Array.isArray(guardado.monedas) ? guardado.monedas : [];
  if (guardado.monedas !== undefined && !Array.isArray(guardado.monedas)) {
    incidencias.push('La lista de monedas guardada no era una lista y se ignoró.');
  }

  // ── Preferencias ───────────────────────────────────────────────────────────
  //
  // ⚠️ Cada preferencia se lee EXPLÍCITAMENTE, y la que no esté acá **se pierde
  // al recargar**, sin ningún error. Agregar una preferencia y olvidarse de esta
  // lista da el peor síntoma posible: funciona mientras la app está abierta y
  // desaparece al volver, que es justo cuando nadie está mirando. Pasó con
  // `ultimo_respaldo` en T-016. Ver L-015.
  //
  // Se leen una por una igual, en vez de copiar el objeto entero, porque un
  // respaldo editado a mano puede traer cualquier cosa ahí adentro.
  // Las fechas de cada viaje. Un registro roto se descarta solo, sin llevarse a
  // los demás: perder cuándo fue un viaje es molesto; perder los otros veinte
  // por culpa de ese, no.
  estado.fechas_de_viaje = leerLista(guardado.fechas_de_viaje, 'fechas de viaje', incidencias, (v) => {
    if (v === null || typeof v !== 'object') throw new Error('no es un viaje');
    if (typeof v.clave !== 'string' || v.clave.trim() === '') {
      throw new Error('no dice de qué viaje son las fechas');
    }
    // Con `validarFecha` y no con una expresión regular: un 31 de abril tiene la
    // forma correcta y no existe (L-005).
    const desde = validarFecha(v.desde);
    const hasta = validarFecha(v.hasta);
    if (hasta < desde) throw new Error('el viaje termina antes de empezar');
    return { clave: v.clave.trim().toLowerCase(), desde, hasta };
  });

  // Los ahorros conjuntos. Un registro roto se descarta solo, como las fechas
  // de viaje: perder un movimiento de ahorro es molesto; perder los otros
  // sesenta por culpa de ese, no.
  estado.ahorros = leerLista(guardado.ahorros, 'ahorros', incidencias, (a) => {
    if (a === null || typeof a !== 'object') throw new Error('no es un movimiento de ahorro');
    if (personaDeLaPlanilla(a.persona) === null) throw new Error('no dice de quién es');
    if (tipoDeLaPlanilla(a.tipo) === null) throw new Error('no dice si la plata entró o salió');
    if (!Number.isInteger(a.monto) || a.monto === 0) throw new Error('el monto no es un entero distinto de cero');
    if (typeof a.moneda !== 'string' || !/^[A-Za-z]{3}$/.test(a.moneda.trim())) {
      throw new Error('la moneda no es un código de tres letras');
    }
    const fecha = validarFecha(a.fecha);
    return {
      id: typeof a.id === 'string' && a.id !== '' ? a.id : nuevoId('aho'),
      fecha,
      persona: personaDeLaPlanilla(a.persona),
      tipo: tipoDeLaPlanilla(a.tipo),
      monto: a.monto,
      moneda: a.moneda.trim().toUpperCase(),
      comentario: typeof a.comentario === 'string' ? a.comentario : '',
      detalle: typeof a.detalle === 'string' ? a.detalle : '',
      creado: /^\d{4}-\d{2}-\d{2}$/.test(a.creado) ? a.creado : fecha,
    };
  });

  const preferencias = guardado.preferencias;
  if (preferencias !== null && typeof preferencias === 'object' && !Array.isArray(preferencias)) {
    const moneda = preferencias.moneda_predeterminada;
    if (typeof moneda === 'string' && /^[A-Za-z]{3}$/.test(moneda.trim())) {
      estado.preferencias.moneda_predeterminada = moneda.trim().toUpperCase();
    }

    // El día del último respaldo. Sin esto, la app no puede avisar "hace tres
    // semanas que no respaldás", que es la contramedida al riesgo más grave de
    // toda la arquitectura.
    // Se valida con validarFecha y no con una expresión regular: "2026-13-01"
    // tiene la forma correcta y no existe. Comprobar la forma no es comprobar la
    // fecha — es la misma trampa que RN-01 (L-005), acá aplicada a un ajuste.
    try {
      estado.preferencias.ultimo_respaldo = validarFecha(preferencias.ultimo_respaldo);
    } catch {
      // No había fecha de respaldo, o no era una fecha. Se sigue sin ella: la
      // app va a decir "nunca respaldaste", que es lo correcto si no se sabe.
    }

    // El día en que el usuario dijo "ahora no" al recordatorio de respaldo
    // (T-903). Sin esto, el aviso volvería a aparecer en cada recarga por más
    // que lo hubiera pospuesto, y un aviso que no se puede sacar deja de leerse.
    // Que compartir no funciona en este teléfono (T-914). Sin esto, el botón
    // que ya falló una vez volvería a ofrecerse en cada recarga y volvería a
    // fallar igual.
    // La moneda base elegida (T-050). Sin esto, los totales volverían a euros
    // en cada recarga y el usuario vería sus números multiplicados por cuarenta.
    const base = preferencias.moneda_base;
    if (typeof base === 'string' && /^[A-Za-z]{3}$/.test(base.trim())) {
      estado.preferencias.moneda_base = base.trim().toUpperCase();
    }

    // En qué mitad de la app estaba (T-046). Sin esto, quien está poniendo al
    // día los ahorros vuelve a caer en los gastos cada vez que abre.
    if (preferencias.perfil === 'ahorros' || preferencias.perfil === 'cotidiana') {
      estado.preferencias.perfil = preferencias.perfil;
    }

    if (preferencias.compartir_no_funciona === true) {
      estado.preferencias.compartir_no_funciona = true;
    }

    try {
      estado.preferencias.recordatorio_pospuesto = validarFecha(preferencias.recordatorio_pospuesto);
    } catch {
      // No se pospuso nunca, o el dato estaba roto: el aviso se muestra, que es
      // el lado seguro de equivocarse.
    }
  }

  return estado;
}

function leerLista(valor, nombre, incidencias, validar) {
  if (valor === undefined || valor === null) return [];
  if (!Array.isArray(valor)) {
    incidencias.push(`La lista de ${nombre} guardada no era una lista y se ignoró.`);
    return [];
  }

  const buenos = [];
  const rotos = [];
  // Sin límite de cuántos elementos se recorren: un tope escrito a mano es
  // exactamente cómo el Excel original empezó a mentir (L-001).
  for (let i = 0; i < valor.length; i += 1) {
    try {
      buenos.push(validar(valor[i]));
    } catch (error) {
      rotos.push(`#${i + 1}: ${error.message}`);
    }
  }

  if (rotos.length > 0) {
    const cuantos = rotos.length === 1 ? 'Un registro' : `${rotos.length} registros`;
    incidencias.push(
      `${cuantos} de ${nombre} no se pudieron leer y quedaron afuera de los totales. ` +
      `Detalle — ${rotos.join(' · ')}`
    );
  }
  return buenos;
}

/**
 * Aparta un contenido ilegible bajo su propia clave, con la fecha, para que se
 * pueda rescatar a mano. Si ni siquiera esto se puede hacer, se avisa: es
 * preferible que el usuario sepa que hay algo en riesgo.
 */
function preservar(almacen, crudo, incidencias) {
  const clave = `${PREFIJO_RESCATE}${new Date().toISOString()}`;
  try {
    almacen.setItem(clave, crudo);
    return clave;
  } catch (error) {
    incidencias.push(
      `No se pudo apartar una copia de lo que no se entendió (${error.message}). ` +
      'No guardes nada nuevo hasta revisarlo, o se va a sobrescribir.'
    );
    return null;
  }
}

/**
 * Guarda el estado completo. Escribe una sola vez, con la cadena ya armada.
 *
 * **Tira si no pudo guardar**, a propósito. La tentación es atrapar el error y
 * seguir para que la app no se corte, pero eso deja al usuario cargando gastos
 * sobre un almacenamiento que no los está guardando: cada movimiento se ve en
 * pantalla y ninguno sobrevive a cerrar la app. Un error visible es mucho menos
 * grave que una tarde entera de datos perdidos.
 */
function guardarEstado(estado, almacen = almacenPorDefecto()) {
  if (estado === null || typeof estado !== 'object') {
    throw new Error('No hay estado que guardar.');
  }

  const aGuardar = { ...estado, esquema: ESQUEMA_ACTUAL };
  let texto;
  try {
    texto = JSON.stringify(aGuardar);
  } catch (error) {
    throw new Error(`No se pudo preparar los datos para guardarlos: ${error.message}`);
  }

  try {
    almacen.setItem(CLAVE_DATOS, texto);
  } catch (error) {
    if (esCupoLleno(error)) {
      throw new Error(
        'No entra: el almacenamiento del navegador está lleno, así que este cambio NO se guardó. ' +
        'Exportá tus datos y liberá espacio antes de seguir cargando.'
      );
    }
    throw new Error(`No se pudo guardar: ${error.message}`);
  }

  return texto.length;
}

function esCupoLleno(error) {
  // Cada navegador lo llama distinto, y Safari usa un código propio.
  return (
    error?.name === 'QuotaExceededError' ||
    error?.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
    error?.code === 22 ||
    error?.code === 1014
  );
}

/**
 * Borra los datos de Viajecor. Existe para el "importar reemplazando todo"
 * (T-017) y para que el usuario pueda empezar de cero a propósito.
 *
 * No toca las claves de rescate: son justamente lo que hay que conservar cuando
 * algo salió mal. Quien las quiera borrar tiene que hacerlo a mano.
 */
function borrarEstado(almacen = almacenPorDefecto()) {
  almacen.removeItem(CLAVE_DATOS);
}

/** Las claves de rescate que haya, de la más nueva a la más vieja. */
function listarRescates(almacen = almacenPorDefecto()) {
  const claves = [];
  for (let i = 0; i < almacen.length; i += 1) {
    const clave = almacen.key(i);
    if (typeof clave === 'string' && clave.startsWith(PREFIJO_RESCATE)) claves.push(clave);
  }
  return claves.sort().reverse();
}

// ── ¿Este navegador puede guardar? — T-950 ───────────────────────────────────
//
// El 2026-08-27, el usuario abrió la app en su Android desde la app Archivos,
// cargó cuatro movimientos, cerró Chrome y **perdió todo**.
//
// Android no le pasa al navegador la ubicación del archivo: le pasa un permiso
// temporal de lectura, y la dirección queda como `content://…`. Para el
// navegador eso no es un sitio, es contenido anónimo sin identidad estable. Como
// el almacenamiento se guarda **por sitio**, no hay dónde guardar: deja escribir
// mientras la pestaña vive y lo tira al cerrar.
//
// Lo grave no fue que no se pudiera guardar. Fue que **la app no lo dijo**:
// aceptó los movimientos, los mostró, dijo "guardado", y los perdió. Toda la app
// se apoya en que los datos son del usuario y están en su dispositivo; aceptar
// datos que no se van a guardar rompe esa promesa justo cuando ya confió.
//
// **Por qué no alcanza con probar a escribir.** `localStorage.setItem()`
// funciona igual en `content://`: devuelve bien, se puede leer de vuelta, y todo
// parece correcto. El problema aparece al cerrar, cuando ya es tarde. Lo que
// determina si hay dónde guardar no es si la escritura anda: es si la dirección
// tiene identidad. Por eso se mira el esquema.

/** Direcciones desde las que el navegador SÍ le da un lugar propio a la app. */
const ESQUEMAS_CON_IDENTIDAD = ['file:', 'http:', 'https:'];

const SIN_ALMACENAMIENTO = 'sin-almacenamiento';
const SIN_IDENTIDAD = 'sin-identidad';

/**
 * ¿Corre peligro lo que el usuario cargue? Devuelve `null` si está todo bien.
 *
 * Es una función pura: recibe el esquema de la dirección y el almacén, no los
 * busca en el navegador (`core/` y `datos/` no lo tocan). Así se puede probar
 * el caso `content://` sin un teléfono Android.
 */
function riesgoDeGuardado(protocolo, almacen) {
  // El almacén se resuelve igual que en `leerEstado`. La primera versión lo
