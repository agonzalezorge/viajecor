/**
 * Separa los movimientos que se pueden convertir a euros de los que no.
 *
 * Un movimiento sin tipo de cambio **no se cuenta como cero** y **no se
 * descarta en silencio**: sale aparte, para que la pantalla pueda decir que el
 * total está incompleto. Un total al que le falta un gasto y que no lo dice es
 * peor que no mostrar ningún total: parece completo.
 *
 * Cargar un movimiento así no debería ser posible (RN-04, T-012), pero puede
 * llegar desde un respaldo importado o desde datos editados a mano.
 */
function separarConvertibles(movimientos, cambios) {
  const convertibles = [];
  const sinConvertir = [];
  for (const movimiento of movimientos) {
    if (faltaCambioPara(movimiento, cambios)) sinConvertir.push(movimiento);
    else convertibles.push(movimiento);
  }
  return { convertibles, sinConvertir };
}

function enEuros(movimientos, cambios, monedas) {
  return movimientos.map((m) => movimientoEnEuros(m, cambios, monedas));
}

/**
 * Los tres números del mes: gastos, ingresos y saldo. Reemplaza el bloque
 * `TOTALES` del Excel.
 *
 * `saldo` es ingresos − gastos y **puede ser negativo**, que es justamente el
 * caso en que mirarlo importa.
 */
function totalesDelMes(estado, mes) {
  const delMes = movimientosDelMes(estado.movimientos, mes);
  const { convertibles, sinConvertir } = separarConvertibles(delMes, estado.tipos_cambio);

  const gastos = sumar(
    enEuros(convertibles.filter((m) => m.tipo === TIPO_GASTO), estado.tipos_cambio, estado.monedas)
  );
  const ingresos = sumar(
    enEuros(convertibles.filter((m) => m.tipo === TIPO_INGRESO), estado.tipos_cambio, estado.monedas)
  );

  return {
    gastos,
    ingresos,
    saldo: ingresos - gastos,
    cuantos: delMes.length,
    sinConvertir,
  };
}

/**
 * El desglose por rubro, de mayor a menor. Reemplaza `GASTOS POR TIPO` e
 * `INGRESOS POR TIPO`.
 *
 * Devuelve **solo los rubros con movimientos**: una fila en cero por cada rubro
 * que no usaste llena la pantalla de nada. El porcentaje es sobre el total de
 * ese tipo en ese mes.
 */
function porRubro(estado, mes, tipo) {
  const delMes = movimientosDelMes(estado.movimientos, mes);
  const { convertibles } = separarConvertibles(delMes, estado.tipos_cambio);
  const delTipo = convertibles.filter((m) => m.tipo === tipo);

  const acumulado = new Map();
  for (const movimiento of delTipo) {
    const euros = movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas);
    const anterior = acumulado.get(movimiento.rubro) ?? { rubro: movimiento.rubro, total: 0, cuantos: 0 };
    acumulado.set(movimiento.rubro, {
      rubro: movimiento.rubro,
      total: anterior.total + euros,
      cuantos: anterior.cuantos + 1,
    });
  }

  const total = sumar([...acumulado.values()].map((r) => r.total));

  return [...acumulado.values()]
    .map((r) => ({ ...r, porcentaje: total === 0 ? 0 : (r.total / total) * 100 }))
    // De mayor a menor, y con el nombre como desempate para que el orden no
    // dependa de en qué orden se cargaron dos rubros que suman lo mismo.
    .sort((a, b) => b.total - a.total || a.rubro.localeCompare(b.rubro));
}

/** Los rubros de un tipo que el usuario NO usó este mes. Para el detalle. */
function rubrosSinUsar(estado, mes, tipo) {
  const usados = new Set(porRubro(estado, mes, tipo).map((r) => normalizarClave(r.rubro)));
  return rubrosDe(tipo).filter((r) => !usados.has(r));
}

/**
 * Día por día del mes — CU-05. Reemplaza el bloque `GASTO POR DÍA`.
 *
 * Devuelve **todos** los días del mes, incluidos los que no tienen nada: el
 * acumulado tiene que poder leerse como una línea continua, y un día faltante
 * en el medio se lee como si ese día no hubiera existido.
 */
function porDia(estado, mes) {
  const delMes = movimientosDelMes(estado.movimientos, mes);
  const { convertibles } = separarConvertibles(delMes, estado.tipos_cambio);

  const gastoPorDia = new Map();
  const ingresoPorDia = new Map();
  for (const movimiento of convertibles) {
    const dia = Number(movimiento.fecha.slice(8));
    const euros = movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas);
    const donde = movimiento.tipo === TIPO_GASTO ? gastoPorDia : ingresoPorDia;
    donde.set(dia, (donde.get(dia) ?? 0) + euros);
  }

  const dias = [];
  let gastoAcumulado = 0;
  let ingresoAcumulado = 0;

  for (let dia = 1; dia <= diasDelMes(mes); dia += 1) {
    const gasto = gastoPorDia.get(dia) ?? 0;
    const ingreso = ingresoPorDia.get(dia) ?? 0;
    gastoAcumulado += gasto;
    ingresoAcumulado += ingreso;
    dias.push({
      dia,
      fecha: `${mes}-${String(dia).padStart(2, '0')}`,
      gasto,
      ingreso,
      gastoAcumulado,
      ingresoAcumulado,
    });
  }
  return dias;
}

/**
 * El promedio de gasto por día del mes.
 *
 * **Divide por los días transcurridos, no por los del mes**, cuando el mes es el
 * que está en curso: a mitad de mes, dividir por 31 da un promedio artificalmente
 * bajo y hace creer que se está gastando menos de lo real. Para un mes ya
 * terminado los dos números coinciden.
 *
 * `hasta` es el día hasta el que contar; sin él, el mes entero.
 */
function promedioPorDia(estado, mes, hasta) {
  const { gastos } = totalesDelMes(estado, mes);
  const dias = Math.min(hasta ?? diasDelMes(mes), diasDelMes(mes));
  if (dias <= 0) return 0;
  return redondear(gastos / dias);
}

/**
 * Los comentarios usados en un mes, con su total. Es la base de "cuánto costó un
 * viaje" (CU-11) y del promedio de gastos fijos (CU-12).
 *
 * Agrupa por la **clave** del comentario, no por el texto: `Roma` y `roma` son
 * el mismo viaje (RN-03, L-003). Se muestra la primera escritura que apareció.
 */
function porComentario(estado, mes) {
  const movimientos = mes ? movimientosDelMes(estado.movimientos, mes) : estado.movimientos;
  const { convertibles } = separarConvertibles(movimientos, estado.tipos_cambio);

  const acumulado = new Map();
  for (const movimiento of convertibles) {
    if (!movimiento.comentario) continue;
    const clave = normalizarClave(movimiento.comentario);
    const euros = movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas);
    const anterior = acumulado.get(clave);
    acumulado.set(clave, {
      clave,
      comentario: anterior?.comentario ?? movimiento.comentario,
      total: (anterior?.total ?? 0) + euros,
      cuantos: (anterior?.cuantos ?? 0) + 1,
    });
  }

  return [...acumulado.values()]
    .map((c) => ({ ...c, promedio: redondear(c.total / c.cuantos) }))
    .sort((a, b) => b.total - a.total || a.clave.localeCompare(b.clave));
}

// ── src/core/formato.js ─────────────────────────────────────────
// Cómo se muestran los montos y las fechas.
//
// Es el único módulo cuyo trabajo es puramente cosmético, y aun así puede mentir:
// un importe formateado con los decimales equivocados o una fecha corrida un día
// son errores que el usuario ve como datos, no como fallas de presentación. Y a
// diferencia de un cálculo mal, nadie los va a descubrir con un test de negocio:
// se descubren mirando la pantalla y desconfiando.
//
// Sin librerías: `Intl` viene en el navegador y en Node (ADR-003).
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.


// El español de España: coma decimal, punto de miles, y la fecha como
// día/mes/año. Es el idioma en el que el usuario piensa sus gastos.
const IDIOMA = 'es-ES';

/**
 * Un monto guardado, listo para mostrar: `1250` con 2 decimales sale `12,50 €`.
 *
 * **Los decimales los manda el catálogo del usuario, no `Intl`.** Es la parte
 * que importa de esta función. `Intl` trae su propia idea de cuántos decimales
 * usa cada moneda —para el yen, cero— y si la dejáramos decidir, una moneda que
 * el usuario configuró distinto se mostraría con otros decimales de los que se
 * guardó. El número seguiría siendo correcto por dentro y la pantalla estaría
 * mintiendo. Se fuerzan los nuestros, en los dos sentidos (mínimo y máximo).
 *
 * Para un código de moneda que no existe en el estándar —el usuario puede
 * inventar el que quiera (ADR-011)— `Intl` no falla: muestra el código tal cual,
 * `1.234,50 XYZ`. Comprobado, no supuesto.
 */
function formatearMonto(minimas, decimales, moneda = 'EUR') {
  const codigo = normalizarMoneda(moneda);
  const numero = aNumero(minimas, decimales);

  return new Intl.NumberFormat(IDIOMA, {
    style: 'currency',
    currency: codigo,
    minimumFractionDigits: decimales,
    maximumFractionDigits: decimales,
  }).format(numero);
}

/** Un importe en céntimos de euro, que es la unidad de todos los totales. */
function formatearEuros(centimos) {
  return formatearMonto(centimos, DECIMALES_EURO, 'EUR');
}

/**
 * Un monto sin el símbolo de la moneda, para las tablas donde la moneda ya está
 * en otra columna y repetirla en cada fila es ruido.
 */
function formatearNumero(minimas, decimales) {
  return new Intl.NumberFormat(IDIOMA, {
    minimumFractionDigits: decimales,
    maximumFractionDigits: decimales,
  }).format(aNumero(minimas, decimales));
}

/**
 * El rótulo de un rubro, con la primera letra en mayúscula: `gastos fijos` se
 * muestra como `Gastos fijos`.
 *
 * Solo cambia cómo SE VE. Guardado sigue en minúsculas, que es su forma
 * canónica y la que hace que `VIAJES` y `viajes` sean el mismo rubro (RN-03).
 * Poner la mayúscula acá y no en el dato es lo que permite tener las dos cosas.
 *
 * Va la primera letra de la frase y no la de cada palabra: en español se escribe
 * "Gastos fijos", no "Gastos Fijos".
 */
function formatearRubro(rubro) {
  const texto = String(rubro ?? '').trim();
  if (texto === '') return '';
  return texto[0].toLocaleUpperCase(IDIOMA) + texto.slice(1);
}

// ── Fechas ───────────────────────────────────────────────────────────────────

const MESES = [
  'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
  'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
];

/**
 * Convierte `AAAA-MM-DD` en un `Date` fijado al mediodía UTC.
 *
 * **Por qué no `new Date('2026-03-14')` a secas:** eso da la medianoche UTC, y
 * al mostrarla el navegador la traduce a la zona horaria del dispositivo. En
 * Montevideo (UTC−3) la medianoche del 14 es **las 21:00 del 13**, así que la
 * app mostraría un día menos. Comprobado, no supuesto:
 *
 *     America/Montevideo  →  13/3/2026     ← el gasto se ve el día anterior
 *     Europe/Madrid       →  14/3/2026
 *
 * Y no es un caso de laboratorio: el usuario tiene ahorros y gastos en pesos
 * uruguayos. Un gasto que aparece un día antes en el celular es indistinguible
 * de un error de carga, y ensucia el gasto por día (CU-05).
 *
 * La fecha de un movimiento es un día del calendario, no un instante: no tiene
 * hora ni zona. Fijarla al mediodía UTC hace que ninguna zona horaria del mundo
 * —de UTC−12 a UTC+14— la corra de día.
 */
function comoFecha(iso) {
  const [anio, mes, dia] = validarFecha(iso).split('-').map(Number);
  return new Date(Date.UTC(anio, mes - 1, dia, 12));
}

/**
 * `2026-03-14` → `14/03/2026`. Para listas.
 *
 * Con día y mes de dos dígitos siempre, aunque `Intl` por omisión escriba
 * `14/3/2026`: en una lista de gastos las fechas se leen en columna, y el ancho
 * fijo hace que se puedan comparar de un vistazo.
 */
function formatearFecha(iso) {
  return new Intl.DateTimeFormat(IDIOMA, {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    timeZone: 'UTC',
  }).format(comoFecha(iso));
}

/** `2026-03-14` → `14 de marzo de 2026`. Para encabezados y confirmaciones. */
function formatearFechaLarga(iso) {
  const [anio, mes, dia] = validarFecha(iso).split('-').map(Number);
  return `${dia} de ${MESES[mes - 1]} de ${anio}`;
}

/** `2026-03-14` → `sábado`. Para el detalle del día. */
function formatearDiaSemana(iso) {
  return new Intl.DateTimeFormat(IDIOMA, { weekday: 'long', timeZone: 'UTC' }).format(comoFecha(iso));
}

/**
 * `2026-03` → `marzo de 2026`. Es el título de la pantalla del mes.
 *
 * Recibe el mes como `AAAA-MM` y no una fecha, porque el mes es lo que agrupa
 * (RN-04) y pedir una fecha obligaría a inventar un día.
 */
function formatearMes(mes) {
  if (typeof mes !== 'string' || !/^\d{4}-\d{2}$/.test(mes)) {
    throw new Error(`El mes se escribe como AAAA-MM (por ejemplo 2026-03), y llegó ${JSON.stringify(mes)}.`);
  }
  const numeroMes = Number(mes.slice(5));
  if (numeroMes < 1 || numeroMes > 12) {
    throw new Error(`No existe el mes ${mes}.`);
  }
  return `${MESES[numeroMes - 1]} de ${mes.slice(0, 4)}`;
}

/**
 * El tipo de cambio como el usuario lo conoce: "1 EUR = 630,25 CRC".
 *
 * Se muestra en el sentido de "cuántas unidades por euro" y no al revés, aunque
 * por dentro se guarde al revés (ADR: `core/cambio.js`). Un `0,001587` en
 * pantalla no le dice nada a nadie; `630,25` es el número que la persona vio en
 * la casa de cambio.
 */
function formatearTipoDeCambio(eurosPorUnidad, moneda) {
  const codigo = normalizarMoneda(moneda);
  if (!Number.isFinite(eurosPorUnidad) || eurosPorUnidad <= 0) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }

  const unidadesPorEuro = 1 / eurosPorUnidad;
  // Los decimales que se muestran dependen de la magnitud: con 630 colones por
  // euro sobran dos, pero con 1,08 dólares por euro dos decimales esconderían la
  // diferencia entre 1,085 y 1,089 — que en un mes de gastos son varios euros.
  const decimales = unidadesPorEuro >= 100 ? 2 : unidadesPorEuro >= 1 ? 4 : 6;

  const numero = new Intl.NumberFormat(IDIOMA, {
    minimumFractionDigits: decimales,
    maximumFractionDigits: decimales,
  }).format(unidadesPorEuro);

  return `1 EUR = ${numero} ${codigo}`;
}

// ── src/datos/almacenamiento.js ─────────────────────────────────
// La única puerta a los datos guardados. Todo lo que la app persiste pasa por
// acá, bajo una sola clave de localStorage (ARQUITECTURA §6).
//
// Este módulo carga con el riesgo más grave de toda la arquitectura: acá vive la
// única copia de los gastos del usuario. No hay servidor, no hay papelera, no hay
// historial. Un error de este archivo no da un número mal: borra meses de
// registro. Por eso hay una regla que gobierna todo lo de abajo:
//
//   ANTE LA DUDA, NO SE ESCRIBE.
//
// Si lo guardado no se entiende, este módulo devuelve un estado vacío para que la
// app abra igual, pero AVISA que lo hizo y GUARDA APARTE lo que no pudo leer. Lo
// que nunca hace es pisar en silencio un dato que no entendió: un dato ilegible
// todavía se puede rescatar a mano; uno sobrescrito, no.

const CLAVE_DATOS = 'viajecor:datos:v1';

// Sube solo si cambia la FORMA de los datos guardados (PRODUCTO §9). No sube
// porque se agregue una pantalla ni porque cambie un cálculo.
const ESQUEMA_ACTUAL = 1;

/** El prefijo bajo el que se preserva lo que no se pudo interpretar. */
const PREFIJO_RESCATE = 'viajecor:rescate:';

/**
 * El estado de un primer arranque: la app abierta por primera vez en un
 * dispositivo.
 *
 * `monedas` viene vacío a propósito. Las cuatro precargadas (RN-04b) las define
 * `core/monedas.js` (T-008), y tenerlas también acá serían dos listas que se
 * desincronizan: la trampa de L-005 aplicada al código. Quien arme el estado
 * inicial le pasa la lista.
 */
function estadoInicial({ monedas = [], versionApp } = {}) {
  return {
    esquema: ESQUEMA_ACTUAL,
    version_app: versionApp ?? globalThis.__VIAJECOR_VERSION__ ?? 'sin construir',
    movimientos: [],
    tipos_cambio: [],
    monedas: [...monedas],
    preferencias: { moneda_predeterminada: 'EUR' },
  };
}

function almacenPorDefecto() {
  if (typeof localStorage === 'undefined') {
    throw new Error(
      'No hay dónde guardar: este navegador no tiene localStorage disponible. ' +
      'Suele pasar en ventanas privadas de algunos navegadores.'
    );
  }
  return localStorage;
}

/**
 * Lee el estado guardado.
 *
 * **Nunca tira.** Que la app no abra porque un dato está raro es el peor
 * resultado posible: el usuario se queda sin ver ni siquiera lo que sí está
 * bien. Devuelve siempre algo usable, más un parte de qué pasó:
 *
 *   { estado, incidencias, primerArranque, rescate }
 *
 * `incidencias` es una lista de textos en castellano llano, pensados para
 * mostrarse. Si está vacía, lo guardado se leyó entero y sin pérdida.
 */
function leerEstado(almacen = almacenPorDefecto()) {
  const incidencias = [];
  let crudo = null;

  try {
    crudo = almacen.getItem(CLAVE_DATOS);
  } catch (error) {
    // Safari en modo privado puede tirar hasta al LEER. La app tiene que abrir.
    incidencias.push(`No se pudo acceder al almacenamiento del navegador: ${error.message}`);
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate: null, soloLectura: false };
  }

  if (crudo === null || crudo === '') {
    return { estado: estadoInicial(), incidencias, primerArranque: true, rescate: null, soloLectura: false };
  }

  let leido;
  try {
    leido = JSON.parse(crudo);
  } catch {
    // Lo guardado no es ni JSON. No se entiende nada, así que no se toca: se
    // aparta con su fecha y se sigue. Un dato ilegible todavía se puede rescatar
    // a mano; uno sobrescrito, no.
    const rescate = preservar(almacen, crudo, incidencias);
    incidencias.push(
      'Lo que había guardado no se pudo leer y se apartó sin tocarlo. La app arranca vacía, ' +
      'pero tus datos anteriores no se borraron: seguí desde un respaldo exportado si tenés uno.'
    );
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate, soloLectura: false };
  }

  if (leido === null || typeof leido !== 'object' || Array.isArray(leido)) {
    const rescate = preservar(almacen, crudo, incidencias);
    incidencias.push('Lo guardado no tiene la forma de un juego de datos de Viajecor y se apartó sin tocarlo.');
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate, soloLectura: false };
  }

  // Datos escritos por una versión MÁS NUEVA de la app. Este código no sabe qué
  // significan, y guardar encima los destruiría. Se abre en blanco y se avisa;
  // el usuario abrirá la versión nueva, donde sus datos siguen intactos.
  if (Number.isInteger(leido.esquema) && leido.esquema > ESQUEMA_ACTUAL) {
    incidencias.push(
      `Estos datos los escribió una versión más nueva de Viajecor (esquema ${leido.esquema}, ` +
      `esta app entiende hasta el ${ESQUEMA_ACTUAL}). No se tocaron. Abrilos con la versión nueva.`
    );
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate: null, soloLectura: true };
  }

  const estado = migrarEstado(leido, incidencias);
  return { estado, incidencias, primerArranque: false, rescate: null, soloLectura: false };
}

/**
 * Lleva un estado guardado a la forma actual, campo por campo.
 *
 * Cada campo se valida por separado y lo que no se entiende se descarta CON
 * AVISO. La alternativa —tirar todo el estado porque tres movimientos de
 * quinientos están rotos— pierde 497 movimientos buenos; la otra alternativa
 * —descartarlos en silencio— es peor todavía, porque el total del mes cambia y
 * nadie se entera. Es la misma regla que el importador (T-032): informar fila
 * por fila qué no se pudo leer.
 */
function migrarEstado(guardado, incidencias = []) {
  const estado = estadoInicial();

  if (!Number.isInteger(guardado.esquema)) {
    incidencias.push('Los datos no decían con qué versión del formato se guardaron; se leyeron como la actual.');
  }
  if (typeof guardado.version_app === 'string') {
    estado.version_app = guardado.version_app;
  }

  estado.movimientos = leerLista(guardado.movimientos, 'movimientos', incidencias, (mov) =>
    validarMovimiento(mov)
  );

  estado.tipos_cambio = leerLista(guardado.tipos_cambio, 'tipos de cambio', incidencias, (tc) => {
    if (tc === null || typeof tc !== 'object') throw new Error('no es un tipo de cambio');
    if (typeof tc.moneda !== 'string' || !/^[A-Za-z]{3}$/.test(tc.moneda.trim())) {
      throw new Error('la moneda no es un código de tres letras');
    }
    if (typeof tc.mes !== 'string' || !/^\d{4}-\d{2}$/.test(tc.mes)) {
      throw new Error('el mes no está escrito como AAAA-MM');
    }
    if (!Number.isFinite(tc.euros_por_unidad) || tc.euros_por_unidad <= 0) {
      throw new Error('el tipo de cambio no es un número mayor que cero');
    }
    return {
      moneda: tc.moneda.trim().toUpperCase(),
      mes: tc.mes,
      euros_por_unidad: tc.euros_por_unidad,
      creado: /^\d{4}-\d{2}-\d{2}$/.test(tc.creado) ? tc.creado : '1970-01-01',
    };
  });

  // Las monedas se guardan como vengan: quien manda sobre su forma es
  // core/monedas.js (T-008), y validarlas acá con una copia de sus reglas sería
  // tener dos jueces que tarde o temprano dicen cosas distintas.
  estado.monedas = Array.isArray(guardado.monedas) ? guardado.monedas : [];
  if (guardado.monedas !== undefined && !Array.isArray(guardado.monedas)) {
    incidencias.push('La lista de monedas guardada no era una lista y se ignoró.');
  }

  // ── Preferencias ───────────────────────────────────────────────────────────
  //
  // ⚠️ Cada preferencia se lee EXPLÍCITAMENTE, y la que no esté acá **se pierde
  // al recargar**, sin ningún error. Agregar una preferencia y olvidarse de esta
  // lista da el peor síntoma posible: funciona mientras la app está abierta y
  // desaparece al volver, que es justo cuando nadie está mirando. Pasó con
  // `ultimo_respaldo` en T-016. Ver L-015.
  //
  // Se leen una por una igual, en vez de copiar el objeto entero, porque un
  // respaldo editado a mano puede traer cualquier cosa ahí adentro.
  const preferencias = guardado.preferencias;
  if (preferencias !== null && typeof preferencias === 'object' && !Array.isArray(preferencias)) {
    const moneda = preferencias.moneda_predeterminada;
    if (typeof moneda === 'string' && /^[A-Za-z]{3}$/.test(moneda.trim())) {
      estado.preferencias.moneda_predeterminada = moneda.trim().toUpperCase();
    }

    // El día del último respaldo. Sin esto, la app no puede avisar "hace tres
    // semanas que no respaldás", que es la contramedida al riesgo más grave de
    // toda la arquitectura.
    // Se valida con validarFecha y no con una expresión regular: "2026-13-01"
    // tiene la forma correcta y no existe. Comprobar la forma no es comprobar la
    // fecha — es la misma trampa que RN-01 (L-005), acá aplicada a un ajuste.
    try {
      estado.preferencias.ultimo_respaldo = validarFecha(preferencias.ultimo_respaldo);
    } catch {
      // No había fecha de respaldo, o no era una fecha. Se sigue sin ella: la
      // app va a decir "nunca respaldaste", que es lo correcto si no se sabe.
    }
  }

  return estado;
}

function leerLista(valor, nombre, incidencias, validar) {
  if (valor === undefined || valor === null) return [];
  if (!Array.isArray(valor)) {
    incidencias.push(`La lista de ${nombre} guardada no era una lista y se ignoró.`);
    return [];
  }

  const buenos = [];
  const rotos = [];
  // Sin límite de cuántos elementos se recorren: un tope escrito a mano es
  // exactamente cómo el Excel original empezó a mentir (L-001).
  for (let i = 0; i < valor.length; i += 1) {
    try {
      buenos.push(validar(valor[i]));
    } catch (error) {
      rotos.push(`#${i + 1}: ${error.message}`);
    }
  }

  if (rotos.length > 0) {
    const cuantos = rotos.length === 1 ? 'Un registro' : `${rotos.length} registros`;
    incidencias.push(
      `${cuantos} de ${nombre} no se pudieron leer y quedaron afuera de los totales. ` +
      `Detalle — ${rotos.join(' · ')}`
    );
  }
  return buenos;
}

/**
 * Aparta un contenido ilegible bajo su propia clave, con la fecha, para que se
 * pueda rescatar a mano. Si ni siquiera esto se puede hacer, se avisa: es
 * preferible que el usuario sepa que hay algo en riesgo.
 */
function preservar(almacen, crudo, incidencias) {
  const clave = `${PREFIJO_RESCATE}${new Date().toISOString()}`;
  try {
    almacen.setItem(clave, crudo);
    return clave;
  } catch (error) {
    incidencias.push(
      `No se pudo apartar una copia de lo que no se entendió (${error.message}). ` +
      'No guardes nada nuevo hasta revisarlo, o se va a sobrescribir.'
    );
    return null;
  }
}

/**
 * Guarda el estado completo. Escribe una sola vez, con la cadena ya armada.
 *
 * **Tira si no pudo guardar**, a propósito. La tentación es atrapar el error y
 * seguir para que la app no se corte, pero eso deja al usuario cargando gastos
 * sobre un almacenamiento que no los está guardando: cada movimiento se ve en
 * pantalla y ninguno sobrevive a cerrar la app. Un error visible es mucho menos
 * grave que una tarde entera de datos perdidos.
 */
function guardarEstado(estado, almacen = almacenPorDefecto()) {
  if (estado === null || typeof estado !== 'object') {
    throw new Error('No hay estado que guardar.');
  }

  const aGuardar = { ...estado, esquema: ESQUEMA_ACTUAL };
  let texto;
  try {
    texto = JSON.stringify(aGuardar);
  } catch (error) {
    throw new Error(`No se pudo preparar los datos para guardarlos: ${error.message}`);
  }

  try {
    almacen.setItem(CLAVE_DATOS, texto);
  } catch (error) {
    if (esCupoLleno(error)) {
      throw new Error(
        'No entra: el almacenamiento del navegador está lleno, así que este cambio NO se guardó. ' +
        'Exportá tus datos y liberá espacio antes de seguir cargando.'
      );
    }
    throw new Error(`No se pudo guardar: ${error.message}`);
  }

  return texto.length;
}

function esCupoLleno(error) {
  // Cada navegador lo llama distinto, y Safari usa un código propio.
  return (
    error?.name === 'QuotaExceededError' ||
    error?.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
    error?.code === 22 ||
    error?.code === 1014
  );
}

/**
 * Borra los datos de Viajecor. Existe para el "importar reemplazando todo"
 * (T-017) y para que el usuario pueda empezar de cero a propósito.
 *
 * No toca las claves de rescate: son justamente lo que hay que conservar cuando
 * algo salió mal. Quien las quiera borrar tiene que hacerlo a mano.
 */
function borrarEstado(almacen = almacenPorDefecto()) {
  almacen.removeItem(CLAVE_DATOS);
}

/** Las claves de rescate que haya, de la más nueva a la más vieja. */
function listarRescates(almacen = almacenPorDefecto()) {
  const claves = [];
  for (let i = 0; i < almacen.length; i += 1) {
    const clave = almacen.key(i);
    if (typeof clave === 'string' && clave.startsWith(PREFIJO_RESCATE)) claves.push(clave);
  }
  return claves.sort().reverse();
}

// ── src/datos/exportar.js ───────────────────────────────────────
// Exportar los datos — CU-07.
//
// Esta no es una función más de la app: **es la única copia de seguridad que el
// usuario va a tener**. Los datos viven en un solo navegador, sin servidor y sin
// papelera; "limpiar datos de navegación" en el celular se lleva meses de
// registro y no hay de dónde recuperarlos (ARQUITECTURA §6).
//
// De eso salen las tres decisiones de este archivo:
//
//   1. **Se exporta TODO**, no lo que se está mirando. Un respaldo que solo
//      guarda el mes en pantalla es un respaldo que descubrís incompleto el día
//      que lo necesitás.
//   2. **El archivo se puede leer sin la app.** Es JSON con nombres en
//      castellano, con saltos de línea y sangría. Si dentro de cinco años esta
//      app no abre, el respaldo se sigue entendiendo con cualquier editor de
//      texto — que es media garantía de que los datos son del usuario.
//   3. **El archivo dice de dónde salió y cuándo.** Un `viajecor-2026-08-25.json`
//      encontrado dentro de tres años tiene que poder explicarse solo.
//
// Este archivo no toca el navegador: arma el contenido y el nombre, y quien lo
// descarga es la pantalla. Así se puede testear el respaldo sin un navegador.


const TIPO_JSON = 'application/json';

/**
 * El nombre del archivo: `viajecor-2026-08-25.json`.
 *
 * Con la fecha al principio en formato AAAA-MM-DD para que varios respaldos en
 * una carpeta queden ordenados por fecha al ordenarlos por nombre, que es como
 * los va a ordenar el celular.
 */
function nombreDelRespaldo(fecha = hoy(), extension = 'json') {
  return `viajecor-${fecha}.${extension}`;
}

/**
 * El contenido del respaldo.
 *
 * Lleva **más cosas de las que la app necesita** para reimportarlo: la versión
 * que lo escribió y el día en que se exportó. Ninguna de las dos se usa al
 * importar; están para que el archivo se explique solo dentro de tres años.
 *
 * Con sangría de dos espacios, a propósito. Ocupa alrededor de un tercio más de
 * lugar y a cambio el archivo se puede abrir y leer: para un respaldo de unos
 * cientos de kilobytes, es un intercambio que conviene siempre.
 */
function contenidoDelRespaldo(estado, { fecha = hoy() } = {}) {
  const respaldo = {
    // Estos tres campos son para quien LEA el archivo, no para la app.
    aplicacion: 'Viajecor',
    exportado: fecha,
    version_app: estado.version_app ?? 'desconocida',

    esquema: ESQUEMA_ACTUAL,
    movimientos: estado.movimientos ?? [],
    tipos_cambio: estado.tipos_cambio ?? [],
    monedas: estado.monedas ?? [],
    preferencias: estado.preferencias ?? {},
  };

  return `${JSON.stringify(respaldo, null, 2)}\n`;
}

/**
 * Un respaldo listo para descargar: nombre, contenido y tipo.
 *
 * Devuelve también `cuantos`, porque la pantalla tiene que poder decir qué se
 * llevó el archivo. "Se exportó" no informa nada; "se exportaron 312
 * movimientos" permite darse cuenta de que faltan.
 */
function prepararRespaldo(estado, { fecha = hoy() } = {}) {
  const contenido = contenidoDelRespaldo(estado, { fecha });
  return {
    nombre: nombreDelRespaldo(fecha),
    contenido,
    tipo: TIPO_JSON,
    cuantos: (estado.movimientos ?? []).length,
    bytes: new TextEncoder().encode(contenido).length,
  };
}

/**
 * Deja anotado en los datos el día del último respaldo.
 *
 * Sin este dato no hay forma de avisar "hace tres semanas que no respaldás"
 * (T-903), que es la contramedida al riesgo más grave de toda la arquitectura.
 * Se anota **después** de que la descarga se haya pedido, nunca antes: decir que
 * se respaldó algo que no se respaldó es peor que no anotar nada.
 */
function anotarRespaldo(estado, { fecha = hoy() } = {}) {
  return {
    ...estado,
    preferencias: { ...estado.preferencias, ultimo_respaldo: fecha },
  };
}

/**
 * Cuántos días pasaron desde el último respaldo. `null` si nunca se hizo uno.
 *
 * Cuenta días de calendario, no horas: la app no guarda horas (ADR-021).
 */
function diasSinRespaldar(estado, { fecha = hoy() } = {}) {
  const ultimo = estado.preferencias?.ultimo_respaldo;
  if (typeof ultimo !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(ultimo)) return null;

  return Math.max(0, Math.round((enDias(fecha) - enDias(ultimo)) / 86400000));
}

/** Un día del calendario como milisegundos, para poder restar dos días. */
function enDias(iso) {
  const [anio, mes, dia] = iso.split('-').map(Number);
  return Date.UTC(anio, mes - 1, dia);
}

// ── src/datos/importar.js ───────────────────────────────────────
// Volver a cargar un respaldo — CU-08.
//
// Es la otra mitad de la garantía de que los datos son del usuario: exportar sin
// poder volver a importar produce un archivo, no un respaldo. Y es el camino que
// se usa al cambiar de teléfono, que es cuando más caro sale que salga mal.
//
// ── Por qué esto es delicado ─────────────────────────────────────────────────
//
// Importar es la única operación de la app que puede **destruir datos que el
// usuario no está mirando**. Borrar un movimiento se ve; importar reemplazando
// todo se lleva meses de registro de un toque, y quien lo hace suele estar
// convencido de que está recuperando datos, no perdiéndolos.
//
// De ahí las tres reglas de este archivo:
//
//   1. **Primero se lee, después se decide.** Nunca se toca el estado sin haber
//      podido mostrar antes qué va a pasar, con números concretos.
//   2. **El usuario elige entre reemplazar y agregar**, y la app no elige por
//      él. Son dos cosas muy distintas y solo él sabe cuál quiere.
//   3. **Agregar no duplica.** Un movimiento que ya está —mismo identificador—
//      no entra dos veces. Importar dos veces el mismo respaldo tiene que dejar
//      lo mismo que importarlo una.


/**
 * Lee el texto de un respaldo. **Nunca tira**: devuelve el resultado o el
 * motivo, porque el usuario tiene que poder entender qué pasó y volver a
 * intentar con otro archivo.
 */
function leerRespaldo(texto) {
  if (typeof texto !== 'string' || texto.trim() === '') {
    return { error: 'El archivo está vacío.' };
  }

  let leido;
  try {
    leido = JSON.parse(texto);
  } catch {
    return {
      error: 'Este archivo no es un respaldo de Viajecor: no se pudo leer como JSON. ' +
        '¿Puede ser que sea un CSV, o que se haya copiado a medias?',
    };
  }

  if (leido === null || typeof leido !== 'object' || Array.isArray(leido)) {
    return { error: 'Este archivo no tiene la forma de un respaldo de Viajecor.' };
  }

  if (!Array.isArray(leido.movimientos)) {
    return {
      error: 'Este archivo no tiene una lista de movimientos, así que no parece un respaldo de Viajecor. ' +
        'Los respaldos se llaman viajecor-AAAA-MM-DD.json.',
    };
  }

  // Se pasa por la misma puerta que los datos guardados: un respaldo editado a
  // mano no puede meter nada que el almacenamiento no aceptaría (ADR-017).
  const incidencias = [];
  const estado = migrarEstado(leido, incidencias);

  return {
    estado,
    incidencias,
    // Datos del archivo, para que la pantalla pueda decir de cuándo es.
    exportado: typeof leido.exportado === 'string' ? leido.exportado : null,
    version_app: typeof leido.version_app === 'string' ? leido.version_app : null,
  };
}

/**
 * Qué pasaría si se importara. **No cambia nada**: es lo que se le muestra al
 * usuario antes de que decida.
 *
 * `yaEstan` son los movimientos del respaldo que ya existen en la app, contados
 * por identificador. Es el número que explica por qué "agregar" a veces suma
 * menos de lo que trae el archivo — sin él, alguien creería que se perdieron.
 */
function previsualizar(estadoActual, leido) {
  const actuales = new Set((estadoActual.movimientos ?? []).map((m) => m.id));
  const delRespaldo = leido.estado.movimientos ?? [];

  const yaEstan = delRespaldo.filter((m) => actuales.has(m.id)).length;

  return {
    trae: delRespaldo.length,
    yaEstan,
    nuevos: delRespaldo.length - yaEstan,
    tenes: actuales.size,
    // Cuántos quedarían con cada camino. Son los dos números que hacen la
    // diferencia entre las dos opciones entendible sin explicarla.
    siReemplazo: delRespaldo.length,
    siAgrego: actuales.size + (delRespaldo.length - yaEstan),
    // Cuántos se PERDERÍAN al reemplazar: los que hay ahora y no están en el
    // archivo. Es el número que nadie mira y el que más duele.
    sePierden: (estadoActual.movimientos ?? []).filter(
      (m) => !delRespaldo.some((r) => r.id === m.id)
    ).length,
    incidencias: leido.incidencias ?? [],
  };
}

const MODO_REEMPLAZAR = 'reemplazar';
const MODO_AGREGAR = 'agregar';

/**
 * Aplica la importación. Devuelve un estado nuevo; no modifica el que recibe.
 *
 * **Agregar no duplica:** un movimiento cuyo identificador ya está se saltea.
 * Importar dos veces el mismo respaldo deja lo mismo que importarlo una vez, que
 * es lo que cualquiera espera y lo que evita el desastre silencioso de tener
 * cada gasto contado dos veces en todos los totales.
 */
function aplicarImportacion(estadoActual, leido, modo) {
  if (modo !== MODO_REEMPLAZAR && modo !== MODO_AGREGAR) {
    throw new Error(`Modo de importación desconocido: ${JSON.stringify(modo)}.`);
  }

  const importado = leido.estado;
  const ultimo_respaldo = ultimoRespaldoDespuesDe(estadoActual, leido);

  if (modo === MODO_REEMPLAZAR) {
    // Se conserva una sola cosa de lo que había: la fecha del último respaldo.
    // Es un dato sobre el dispositivo, no sobre los gastos, y perderlo haría
    // que la app dijera "nunca respaldaste" justo después de haber importado un
    // respaldo, que es lo contrario de la verdad.
    return {
      ...importado,
      preferencias: { ...importado.preferencias, ultimo_respaldo },
    };
  }

  const yaEstan = new Set((estadoActual.movimientos ?? []).map((m) => m.id));
  const nuevos = (importado.movimientos ?? []).filter((m) => !yaEstan.has(m.id));

  return {
    ...estadoActual,
    movimientos: [...(estadoActual.movimientos ?? []), ...nuevos],
    // Los tipos de cambio y las monedas del respaldo se suman a los que hay: si
    // el archivo trae el cambio del colón de marzo y la app no lo tiene, sin él
    // esos movimientos entrarían sin poder convertirse a euros.
    tipos_cambio: unirPorClave(
      estadoActual.tipos_cambio ?? [],
      importado.tipos_cambio ?? [],
      (c) => `${c.moneda}|${c.mes}`
    ),
    monedas: unirPorClave(estadoActual.monedas ?? [], importado.monedas ?? [], (m) => m.codigo),
    preferencias: { ...estadoActual.preferencias, ultimo_respaldo },
  };
}

/**
 * La fecha del último respaldo después de importar: la más reciente entre la
 * que tenía el dispositivo y la que dice el archivo.
 *
 * El archivo **es** la prueba de que ese día hubo un respaldo. Sin esto, un
 * teléfono nuevo que acaba de importar un archivo de hoy diría "nunca
 * respaldaste", que es falso y empuja a respaldar de nuevo lo que ya está
 * respaldado. Si la del dispositivo es más nueva, gana esa: el archivo puede
 * ser viejo, y decir que el último respaldo es más antiguo de lo que fue
 * también sería mentir.
 */
function ultimoRespaldoDespuesDe(estadoActual, leido) {
  const propio = estadoActual.preferencias?.ultimo_respaldo ?? null;
  // `validarFecha` tira: el archivo lo pudo escribir cualquiera, y una fecha
  // rota ahí no puede impedir recuperar los gastos.
  let delArchivo = null;
  try {
    delArchivo = validarFecha(leido.exportado);
  } catch {
    delArchivo = null;
  }

  if (propio === null) return delArchivo ?? undefined;
  if (delArchivo === null) return propio;
  // Las fechas son AAAA-MM-DD: comparar como texto es comparar como calendario.
  return delArchivo > propio ? delArchivo : propio;
}

/**
 * Une dos listas sin repetir, **dando prioridad a lo que ya tenía el usuario**.
 *
 * Si el respaldo trae un tipo de cambio para un mes que la app ya tiene, gana el
 * de la app: el usuario pudo haberlo corregido después de exportar, y pisarlo
 * con el viejo cambiaría totales que él ya dio por buenos sin decírselo.
 */
function unirPorClave(propios, ajenos, clave) {
  const vistos = new Set(propios.map(clave));
  return [...propios, ...ajenos.filter((a) => !vistos.has(clave(a)))];
}

// ── src/ui/colores.js ───────────────────────────────────────────
// Un color propio para cada rubro, el mismo en todas las pantallas.
//
// Para qué sirve: cuando `supermercado` es siempre del mismo color, la barra más
// larga del mes se reconoce sin leer su nombre, y el formulario confirma de un
// vistazo qué rubro quedó elegido. El color deja de ser decoración y pasa a ser
// una segunda forma de leer el mismo dato.
//
// ── La regla que no se rompe ─────────────────────────────────────────────────
//
// **El color se asigna por la POSICIÓN del rubro en su lista, nunca por su
// tamaño.** Si dependiera del tamaño, cargar un gasto nuevo repintaría media
// pantalla, y el color dejaría de significar "supermercado" para pasar a
// significar "el más grande de este mes" — que ya lo dice el largo de la barra.
// Un color que cambia de significado no se puede aprender.
//
// ── La paleta ────────────────────────────────────────────────────────────────
//
// Los ocho tonos NO se eligieron a ojo. Salen de la paleta categórica de la guía
// de visualización del proyecto y se comprobaron con su validador contra las dos
// superficies reales de la app. Pasan las seis comprobaciones en claro y en
// oscuro: banda de luminosidad, croma mínimo, separación para daltonismo
// (peor par ΔE 9,1 en claro y 8,4 en oscuro), separación en visión normal
// (ΔE 19,6 y 19,3) y contraste.
//
// La única advertencia es que tres tonos quedan por debajo de 3:1 sobre el fondo
// claro. Está cubierta: **cada barra lleva su nombre y su importe escritos al
// lado**, así que el color nunca es la única manera de saber qué es. Si alguna
// pantalla futura mostrara estos colores sin texto, esa advertencia volvería a
// contar y habría que resolverla ahí.
//
// **Ocho es el techo.** No se agregan más tonos: un noveno color generado es
// indistinguible de alguno de estos bajo daltonismo. Si algún día hay más de
// ocho rubros de un tipo, la salida es agrupar, no inventar un color.

/** Cuántos colores hay. Es un tope, no un valor por omisión. */
const COLORES = 8;

/**
 * En qué franja de color cae un rubro: un número de 1 a 8, estable para
 * siempre. Los rubros de gasto usan las ocho; los de ingreso, las primeras
 * cuatro.
 *
 * Que `otros` de gasto y `otros` de ingreso caigan en franjas distintas es
 * correcto y buscado: son cosas distintas (PRODUCTO §4).
 *
 * Que `gastos fijos` (gasto, franja 1) y `trabajo` (ingreso, franja 1) compartan
 * tono también es correcto: no aparecen nunca en la misma tabla, y cada tabla
 * asigna los tonos desde el principio de la lista.
 */
function franjaDeRubro(tipo, rubro) {
  const lista = tipo === TIPO_GASTO ? RUBROS_GASTO : RUBROS_INGRESO;
  const clave = normalizarClave(String(rubro ?? ''));
  const posicion = lista.indexOf(clave);

  // Un rubro que no está en la lista no debería existir (RN-02), pero si llega
  // de un dato viejo se le da la última franja en vez de romper la pantalla.
  return posicion === -1 ? COLORES : posicion + 1;
}

/** La clase CSS que pinta un rubro. Los tonos viven en `src/estilos.css`. */
function claseDeRubro(tipo, rubro) {
  return `rubro-${franjaDeRubro(tipo, rubro)}`;
}

// ── src/ui/compartir.js ─────────────────────────────────────────
// Entregarle el respaldo al teléfono — T-905.
//
// El respaldo ya se puede descargar (T-016), pero en un celular "descargar" deja
// el archivo en una carpeta que después hay que ir a buscar con un explorador de
// archivos para subirlo a OneDrive. Son cuatro pasos, y el respaldo que exige
// cuatro pasos cada semana es el que no se hace.
//
// El botón de compartir del sistema lo resuelve en uno: la app le entrega el
// archivo al teléfono y el teléfono muestra OneDrive, Drive, el correo, lo que
// haya instalado.
//
// ── Por qué esto NO rompe RN-06 ──────────────────────────────────────────────
//
// La app no hace ninguna petición de red. Le pasa un archivo al sistema
// operativo y termina ahí su participación; quien lo sube es OneDrive, con la
// sesión del usuario, fuera de la app. Es exactamente lo mismo que descargar el
// archivo y arrastrarlo a una carpeta sincronizada, pero sin los tres pasos del
// medio. La guardia de privacidad de `tools/build.mjs` lo confirma: no aparece
// ninguna URL ni ninguna llamada de red en este archivo.
//
// Lo que sí hay que decirle al usuario, y la pantalla se lo dice: **un respaldo
// guardado en la nube deja de ser privado.** La app garantiza la privacidad
// hasta que el archivo sale; de ahí en adelante la garantiza el usuario.

/**
 * El respaldo como archivo, para poder entregarlo.
 *
 * Recibe `File` en vez de tomarlo del entorno para poder probarlo con
 * `node --test`, donde no hay navegador (ADR-022).
 */
function archivoDelRespaldo(respaldo, ConstructorArchivo) {
  return new ConstructorArchivo([respaldo.contenido], respaldo.nombre, { type: respaldo.tipo });
}

/**
 * ¿Este navegador puede compartir **archivos**?
 *
 * Se exige `canShare` y no alcanza con que exista `share`: hay navegadores que
 * comparten texto y direcciones pero no archivos, y ahí `share({files})` falla
 * **después** de que el usuario apretó el botón. Un botón que falla al apretarlo
 * es peor que un botón que no está (L-016): en esta pantalla, encima, el usuario
 * se quedaría creyendo que respaldó.
 *
 * `canShare` puede tirar con datos que no le gustan, así que se pregunta dentro
 * de un `try`: la respuesta a "¿se puede?" no puede ser una excepción.
 */
function sePuedeCompartir(navegador, archivo) {
  try {
    return (
      typeof navegador?.share === 'function' &&
      typeof navegador?.canShare === 'function' &&
      navegador.canShare({ files: [archivo] })
    );
  } catch {
    return false;
  }
}

/**
 * Comparte el respaldo. **Nunca tira**: devuelve qué pasó.
 *
 * Tres resultados y no dos, porque **cancelar no es fallar**. Si el usuario abre
 * el menú de compartir y se arrepiente, el navegador rechaza la promesa con
 * `AbortError`. Mostrarle un error rojo por haber cambiado de idea le enseñaría
 * que la app se rompe sola.
 */
async function compartirRespaldo(navegador, respaldo, ConstructorArchivo) {
  let archivo;
  try {
    archivo = archivoDelRespaldo(respaldo, ConstructorArchivo);
  } catch (error) {
    return { error: `No se pudo preparar el archivo (${error.message}).` };
  }

  if (!sePuedeCompartir(navegador, archivo)) {
    return { error: 'Este navegador no puede compartir archivos. Usá el botón de descargar.' };
  }

  try {
    await navegador.share({
      files: [archivo],
      // Sin `text` ni `url`: hay destinos que, si viene texto, mandan el texto y
      // se olvidan del archivo. Acá lo único que importa es el archivo.
      title: respaldo.nombre,
    });
    return { compartido: true };
  } catch (error) {
    if (error?.name === 'AbortError') return { cancelado: true };
    return { error: `No se pudo compartir el archivo (${error.message}). Probá con el botón de descargar.` };
  }
}

// ── src/ui/pantallas/cambio.js ──────────────────────────────────
// Pedir y corregir tipos de cambio — CU-03.
//
// Dos cosas que parecen la misma y no lo son:
//
//   1. **Pedirlo al vuelo.** Estás en Costa Rica, cargás el primer gasto en
//      colones de marzo, y la app no puede convertirlo a euros. Ahí interrumpe,
//      lo pide, y sigue. Es un momento de fricción inevitable y hay que hacerlo
//      lo más corto posible: un solo campo, con el gasto que estabas cargando a
//      la vista para que se entienda por qué se interrumpió.
//
//   2. **Corregir uno ya usado.** Volviste del viaje y el tipo de cambio estaba
//      mal. Corregirlo arregla el mes entero (RN-05), pero también **cambia
//      totales que ya viste**. Eso no puede pasar en silencio: la app dice
//      cuántos movimientos toca antes de aplicarlo.
//
// El campo se escribe en el sentido en que la gente conoce el dato —"un euro son
// 630 colones"— y la app lo invierte para guardarlo. Escribirlo al revés es el
// error más fácil de cometer acá, y no da ningún error: da totales absurdos.






/**
 * Interpreta lo que el usuario escribió como tipo de cambio.
 *
 * Acepta coma o punto decimal, porque el teclado del celular mete punto y la
 * cabeza escribe coma. No usa `dinero.js`: esto no es un monto en unidades
 * mínimas sino un factor, y puede tener muchos decimales (`0,0000062`).
 */
function leerTipoDeCambio(entrada) {
  if (typeof entrada === 'number') {
    if (!Number.isFinite(entrada) || entrada <= 0) {
      throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
    }
    return entrada;
  }
  if (typeof entrada !== 'string') {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }

  const limpio = entrada.trim().replace(/\s/g, '').replace(',', '.');

  // Un negativo SÍ es un número, solo que no sirve acá. Decirle "no es un
  // número" a alguien que escribió -630 lo manda a buscar un error de tipeo que
  // no existe, en vez de explicarle la regla.
  if (/^-/.test(limpio)) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }
  if (limpio === '' || !/^\d*\.?\d+$/.test(limpio)) {
    throw new Error(`"${entrada}" no es un número. Escribí solo cifras, con coma o punto para los decimales.`);
  }

  const numero = Number(limpio);
  if (!Number.isFinite(numero) || numero <= 0) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }
  return numero;
}

/**
 * Guarda un tipo de cambio escrito **en unidades por euro**, que es como la
 * gente lo conoce. La app lo invierte antes de guardarlo (ADR de `core/cambio.js`).
 *
 * Nunca tira: devuelve `{ estado, error }`, como el resto de las pantallas.
 */
function intentarGuardarCambio(estado, { moneda, mes, unidadesPorEuro }) {
  let codigo;
  try {
    codigo = normalizarMoneda(moneda);
  } catch (error) {
    return { estado, error: error.message };
  }

  if (codigo === MONEDA_BASE) {
    return { estado, error: 'El euro no lleva tipo de cambio: es la moneda en la que se expresan todos los totales.' };
  }

  let valor;
  try {
    valor = leerTipoDeCambio(unidadesPorEuro);
  } catch (error) {
    return { estado, error: error.message };
  }

  let cambio;
  try {
    cambio = crearCambio({ moneda: codigo, mes, euros_por_unidad: desdeUnidadesPorEuro(valor) });
  } catch (error) {
    return { estado, error: error.message };
  }

  return { estado: { ...estado, tipos_cambio: guardarCambio(estado.tipos_cambio, cambio) } };
}

/**
 * Cuántos movimientos cambiarían de importe si se corrigiera este tipo de
 * cambio, y en cuánto cambiaría el total de ese mes.
 *
 * Existe por RN-05, que es una decisión incómoda a propósito: el importe en
 * euros se deriva, así que corregir una vez arregla el mes entero — y también
 * cambia números que el usuario ya dio por buenos. La app tiene que mostrar esa
 * consecuencia **antes**, no después.
 */
function efectoDeCorregir(estado, moneda, mes, nuevasUnidadesPorEuro) {
  const codigo = normalizarMoneda(moneda);
  const afectados = movimientosAfectadosPor(estado.movimientos, codigo, mes);
  if (afectados === 0) return { afectados: 0 };

  let nuevoValor;
  try {
    nuevoValor = desdeUnidadesPorEuro(leerTipoDeCambio(nuevasUnidadesPorEuro));
  } catch {
    return { afectados };
  }

  const viejoValor = buscarCambio(estado.tipos_cambio, codigo, mes);
  if (viejoValor === null) return { afectados };

  const decimales = decimalesDe(estado.monedas, codigo);
  const delMes = estado.movimientos.filter(
    (m) => normalizarMoneda(m.moneda) === codigo && m.fecha.slice(0, 7) === mes
  );

  const antes = delMes.reduce((t, m) => t + convertirAEuros(m.monto, decimales, viejoValor), 0);
  const despues = delMes.reduce((t, m) => t + convertirAEuros(m.monto, decimales, nuevoValor), 0);

  return { afectados, antes, despues, diferencia: despues - antes };
}

// ── Dibujo ───────────────────────────────────────────────────────────────────

/**
 * La interrupción: el gasto que se estaba cargando necesita un tipo de cambio.
 *
 * Muestra el movimiento a la vista, porque el usuario no pidió esta pantalla —
 * lo interrumpimos nosotros— y tiene que entender en un vistazo por qué.
 */
function dibujarPedido(vista) {
  const falta = vista.faltaCambio;
  if (!falta) return '';

  const moneda = buscarMoneda(vista.estado.monedas, falta.moneda);
  const nombre = moneda ? moneda.nombre : falta.moneda;

  // ¿Es la primera vez, o se está corrigiendo uno que ya se usó? No es lo
  // mismo: lo segundo cambia totales que el usuario ya vio (RN-05).
  const actual = buscarCambio(vista.estado.tipos_cambio, falta.moneda, falta.mes);
  const corrigiendo = actual !== null;
  const efecto = corrigiendo
    ? efectoDeCorregir(vista.estado, falta.moneda, falta.mes, vista.borradorCambio)
    : null;

  const explicacion = corrigiendo
    ? `Ahora está cargado como <strong>${escapar(formatearTipoDeCambio(actual, falta.moneda))}</strong>.
       Corregirlo vuelve a calcular todos los movimientos de ${escapar(formatearMes(falta.mes))} en esa moneda.`
    : `Es el primer movimiento en ${escapar(falta.moneda)} de
       ${escapar(formatearMes(falta.mes))}, y sin el tipo de cambio no se puede
       expresar en euros. Vale para todos los movimientos de ese mes, y después
       se puede corregir.`;

  return `
    <form class="tarjeta formulario" data-formulario="cambio" novalidate>
      <h2>${corrigiendo ? 'Corregir el tipo de cambio' : `¿Cuánto vale el ${escapar(nombre.toLowerCase())}?`}</h2>

      <p class="suave">${explicacion}</p>

      ${vista.error ? `<p class="error-carga" role="alert">${escapar(vista.error)}</p>` : ''}
      <div data-aviso-correccion>${dibujarAvisoCorreccion(efecto, falta.moneda)}</div>

      <label class="campo">
        <span>1 EUR son…</span>
        <div class="monto-fila">
          <input name="unidadesPorEuro" class="importe" type="text" inputmode="decimal"
                 autocomplete="off" enterkeyhint="done" placeholder="630"
                 value="${escapar(vista.borradorCambio ?? '')}">
          <span class="sufijo">${escapar(falta.moneda)}</span>
        </div>
      </label>

      <input type="hidden" name="moneda" value="${escapar(falta.moneda)}">
      <input type="hidden" name="mes" value="${escapar(falta.mes)}">

      <button type="submit" class="principal" data-accion="guardar-cambio">
        ${corrigiendo ? 'Aplicar la corrección' : 'Guardar y seguir'}
      </button>
      <button type="button" class="secundario" data-accion="cancelar-cambio">
        Ahora no
      </button>
    </form>
  `;
}

/**
 * La pantalla de tipos de cambio: ver los que hay y corregirlos.
 *
 * Cada fila dice cuántos movimientos usan ese tipo de cambio. Es la información
 * que convierte "corregir un número" en "cambiar el total de once gastos", que
 * es lo que en realidad está pasando.
 */
function dibujarCambios(vista) {
  const estado = vista.estado;
  const cambios = [...estado.tipos_cambio].sort(
    (a, b) => b.mes.localeCompare(a.mes) || a.moneda.localeCompare(b.moneda)
  );

  if (cambios.length === 0) {
    return `
      <section class="tarjeta">
        <h2>Tipos de cambio</h2>
        <p class="suave">Todavía no hay ninguno. La app te lo va a pedir sola la
        primera vez que cargues un gasto en otra moneda.</p>
      </section>
    `;
  }

  const filas = cambios
    .map((c) => {
      const usados = movimientosAfectadosPor(estado.movimientos, c.moneda, c.mes);
      const cuantos =
        usados === 0
          ? 'sin movimientos todavía'
          : usados === 1
            ? '1 movimiento lo usa'
            : `${usados} movimientos lo usan`;

      return `
        <li class="linea-cambio">
          <div>
            <span class="mes-cambio">${escapar(formatearMes(c.mes))}</span>
            <span class="suave">${escapar(cuantos)}</span>
          </div>
          <div class="valor-cambio">
            <span class="importe">${escapar(formatearTipoDeCambio(c.euros_por_unidad, c.moneda))}</span>
            <button type="button" class="secundario chico"
                    data-accion="corregir-cambio"
                    data-moneda="${escapar(c.moneda)}" data-mes="${escapar(c.mes)}">Corregir</button>
          </div>
        </li>`;
    })
    .join('');

  return `
    <section class="tarjeta">
      <h2>Tipos de cambio</h2>
      <p class="suave">Cada uno vale para todos los movimientos de su mes (RN-04).
      Corregir uno cambia los totales de ese mes.</p>
      <ul class="lineas">${filas}</ul>
    </section>
  `;
}

/**
 * El aviso antes de aplicar una corrección: cuántos movimientos cambian y en
 * cuánto queda el total del mes. Sin esto, un número cambiaría solo.
 */
function dibujarAvisoCorreccion(efecto, moneda) {
  if (!efecto || efecto.afectados === 0) return '';
  if (efecto.diferencia === undefined) {
    return `<p class="confirmacion">Este tipo de cambio lo usan ${efecto.afectados} movimientos.</p>`;
  }

  const signo = efecto.diferencia > 0 ? 'sube' : efecto.diferencia < 0 ? 'baja' : 'no cambia';
  const cuantos = efecto.afectados === 1 ? '1 movimiento' : `${efecto.afectados} movimientos`;

  return `
    <p class="confirmacion" role="status">
      Afecta a ${cuantos} en ${escapar(normalizarMoneda(moneda))}.
      El total de ese mes ${signo} de <strong>${escapar(formatearEuros(efecto.antes))}</strong>
      a <strong>${escapar(formatearEuros(efecto.despues))}</strong>.
    </p>
  `;
}

/** El movimiento que quedó esperando, para mostrarlo mientras se pide el dato. */
function dibujarMovimientoEnEspera(estado, borrador) {
  if (!borrador?.monto) return '';
  let importe = `${borrador.monto} ${borrador.moneda}`;
  try {
    const decimales = decimalesDe(estado.monedas, borrador.moneda);
    importe = formatearMonto(aMinimas(borrador.monto, decimales), decimales, borrador.moneda);
  } catch {
    // Si no se puede formatear, se muestra tal como lo escribió: es preferible
    // a no mostrar nada, que dejaría al usuario sin saber qué quedó pendiente.
  }

  return `
    <p class="en-espera">
      Esperando para guardar: <strong>${escapar(importe)}</strong>
      ${borrador.rubro ? `· ${escapar(formatearRubro(borrador.rubro))}` : ''}
    </p>
  `;
}

// ── src/ui/pantallas/resumen.js ─────────────────────────────────
// El resumen del mes — CU-04. Responde "¿cómo vengo este mes?" de un vistazo.
//
// Reemplaza los bloques `GASTOS POR TIPO`, `INGRESOS POR TIPO` y `TOTALES` del
// Excel. Tres decisiones de presentación, con su motivo:
//
//   1. Los tres números de arriba son **números destacados, no un gráfico**. Un
//      gráfico de tres barras para tres cifras que ya se leen en un vistazo
//      agrega trabajo visual y no agrega información.
//
//   2. El desglose por rubro es una **tabla con barras de proporción**, y cada
//      barra lleva **el color de su rubro** (T-909), el mismo que ese rubro tiene
//      en todas las demás pantallas. El color identifica al rubro y **nunca a su
//      tamaño**: pintar más oscuro al más grande codificaría dos veces lo mismo
//      —el largo ya lo dice— y haría que el color cambiara de significado cada
//      vez que se carga un gasto.
//
//   3. Los importes de la tabla llevan cifras de ancho fijo, para poder
//      compararlos en columna. Los tres números grandes de arriba **no**: en un
//      número grande, el ancho fijo abre huecos entre los dígitos y se lee peor.
//
// Igual que el resto de la interfaz (ADR-022), son funciones puras que devuelven
// texto HTML.





/** Un porcentaje para mostrar: sin decimales, que en un desglose no aportan. */
function porcentaje(valor) {
  return `${Math.round(valor)} %`;
}

/**
 * Los tres números del mes.
 *
 * El saldo lleva su signo en el propio número, no solo en el color: quien no
 * distingue el verde del rojo tiene que poder leer si el mes cerró en más o en
 * menos.
 */
function dibujarTotales(totales) {
  const saldoPositivo = totales.saldo >= 0;

  return `
    <section class="tarjeta totales" aria-label="Totales del mes">
      <div class="total">
        <span class="etiqueta">Gastos</span>
        <span class="cifra gasto">${escapar(formatearEuros(totales.gastos))}</span>
      </div>
      <div class="total">
        <span class="etiqueta">Ingresos</span>
        <span class="cifra ingreso">${escapar(formatearEuros(totales.ingresos))}</span>
      </div>
      <div class="total saldo">
        <span class="etiqueta">Saldo</span>
        <span class="cifra ${saldoPositivo ? 'ingreso' : 'gasto'}">
          ${escapar(formatearEuros(totales.saldo))}
        </span>
      </div>
    </section>
  `;
}

/**
 * El aviso de que el total está incompleto.
 *
 * `calculos.js` se toma el trabajo de apartar los movimientos que no se pueden
 * convertir a euros en vez de contarlos como cero (T-013). Si la pantalla no lo
 * dijera, ese cuidado no serviría de nada: el usuario vería un total que parece
 * completo y no lo es.
 */
function dibujarIncompleto(estado, totales) {
  if (totales.sinConvertir.length === 0) return '';

  const faltantes = [...new Set(totales.sinConvertir.map((m) => m.moneda))].join(', ');
  const cuantos = totales.sinConvertir.length === 1
    ? 'Un movimiento no está'
    : `${totales.sinConvertir.length} movimientos no están`;

  return `
    <section class="aviso importante" role="alert">
      <h2>Este total está incompleto</h2>
      <p>${cuantos} contado${totales.sinConvertir.length === 1 ? '' : 's'} acá porque falta
      el tipo de cambio de ${escapar(faltantes)} para este mes.</p>
      <button type="button" class="secundario" data-accion="ir" data-pantalla="cambios">
        Cargar el tipo de cambio
      </button>
    </section>
  `;
}

/**
 * El desglose de un tipo, de mayor a menor.
 *
 * Barras del mismo color, con el extremo redondeado y arrancando todas del mismo
 * borde: lo que se compara es el largo. Y con hueco entre filas, no con línea
 * divisoria adentro de la barra.
 */
function dibujarDesglose(estado, mes, tipo) {
  const filas = porRubro(estado, mes, tipo);
  if (filas.length === 0) return '';

  const titulo = tipo === TIPO_GASTO ? 'En qué se fue' : 'De dónde vino';
  const mayor = filas[0].total || 1;

  // Con un solo rubro no hay nada que comparar: la barra estaría siempre llena y
  // el porcentaje sería siempre 100 %. Dos adornos que ocupan lugar y no dicen
  // nada. Se muestran el nombre y el importe, que es toda la información que hay.
  const hayComparacion = filas.length > 1;

  const cuerpo = filas
    .map((fila) => `
      <li class="fila-rubro">
        <div class="rubro-cabeza">
          <span class="nombre">
            <span class="punto-rubro ${claseDeRubro(tipo, fila.rubro)}" aria-hidden="true"></span>
            ${escapar(formatearRubro(fila.rubro))}
          </span>
          <span class="importe">${escapar(formatearEuros(fila.total))}</span>
        </div>
        ${hayComparacion ? `
        <div class="barra-pista">
          <div class="barra ${claseDeRubro(tipo, fila.rubro)}" style="width: ${(fila.total / mayor) * 100}%"></div>
        </div>` : ''}
        <div class="rubro-pie suave">
          <span>${hayComparacion ? escapar(porcentaje(fila.porcentaje)) : ''}</span>
          <span>${fila.cuantos === 1 ? '1 movimiento' : `${fila.cuantos} movimientos`}</span>
        </div>
      </li>`)
    .join('');

  return `
    <section class="tarjeta">
      <h2>${titulo}</h2>
      <ul class="rubros">${cuerpo}</ul>
    </section>
  `;
}

/**
 * Lo que se muestra cuando el mes está vacío.
 *
 * Un mes sin nada no es un error ni una pantalla rota: puede ser un mes que
 * todavía no empezó a cargarse, o uno viejo. Se dice cuál de las dos cosas es y
 * se ofrece lo único que tiene sentido hacer.
 */
function dibujarMesVacio(mes) {
  const esFuturo = mes > mesDe(hoy());
  const explicacion = esFuturo
    ? 'Este mes todavía no llegó.'
    : 'No cargaste nada en este mes.';

  return `
    <section class="tarjeta">
      <h2>${escapar(formatearMes(mes))}</h2>
      <p class="suave">${explicacion}</p>
      <button type="button" class="principal" data-accion="ir" data-pantalla="nuevo">
        Cargar un movimiento
      </button>
    </section>
  `;
}

/** El promedio por día, que a mitad de mes es el número que dice cómo vas. */
function dibujarPromedio(estado, mes) {
  const { gastos, cuantos } = totalesDelMes(estado, mes);
  if (cuantos === 0 || gastos === 0) return '';

  const esteMes = mes === mesDe(hoy());
  const hasta = esteMes ? Number(hoy().slice(8)) : undefined;
  const promedio = promedioPorDia(estado, mes, hasta);

  const explicacion = esteMes
    ? `en los ${hasta} días que van del mes`
    : 'en todo el mes';

  return `
    <p class="promedio suave">
      <strong>${escapar(formatearEuros(promedio))}</strong> por día ${escapar(explicacion)}.
    </p>
  `;
}

function dibujarResumen(vista) {
  const { estado, mes } = vista;
  const totales = totalesDelMes(estado, mes);

  if (totales.cuantos === 0) return dibujarMesVacio(mes);

  return `
    ${dibujarIncompleto(estado, totales)}
    ${dibujarTotales(totales)}
    ${dibujarPromedio(estado, mes)}
    ${dibujarDesglose(estado, mes, TIPO_GASTO)}
    ${dibujarDesglose(estado, mes, TIPO_INGRESO)}
  `;
}

// ── src/ui/pantallas/lista.js ───────────────────────────────────
// La lista del mes, corregir y borrar — CU-06.
//
// Un monto mal tipeado no puede quedar para siempre, así que esta pantalla es
// necesaria. Pero también es la única de la app que **destruye datos**, y no hay
// papelera ni historial detrás (ARQUITECTURA §11): lo que se borra acá se fue.
//
// De ahí las dos redes de contención, que son lo que más código ocupa en este
// archivo:
//
//   1. **Confirmar antes.** Un toque no borra: pregunta, mostrando qué
//      movimiento es. En un celular, el borrar y el editar quedan a milímetros.
//   2. **Deshacer después.** Confirmar no alcanza: la gente confirma en
//      automático. El deshacer es la red que atrapa al que ya dijo que sí.
//
// La segunda es la que de verdad sirve. La primera frena los accidentes; la
// segunda frena los arrepentimientos, que son más frecuentes.







/**
 * Saca un movimiento del estado y devuelve lo necesario para volver a ponerlo
 * donde estaba.
 *
 * Se guarda **la posición**, no solo el movimiento: restaurarlo al final de la
 * lista lo dejaría en otro lugar del que estaba, y el usuario que deshizo un
 * borrado espera encontrar todo exactamente como lo tenía.
 */
function borrarMovimiento(estado, id) {
  const posicion = estado.movimientos.findIndex((m) => m.id === id);
  if (posicion === -1) return { estado, borrado: null };

  return {
    estado: { ...estado, movimientos: estado.movimientos.filter((m) => m.id !== id) },
    borrado: { movimiento: estado.movimientos[posicion], posicion },
  };
}

/** Vuelve a poner un movimiento borrado en su lugar exacto. */
function restaurarMovimiento(estado, borrado) {
  if (!borrado) return estado;

  const movimientos = [...estado.movimientos];
  movimientos.splice(Math.min(borrado.posicion, movimientos.length), 0, borrado.movimiento);
  return { ...estado, movimientos };
}

function buscarMovimiento(estado, id) {
  return estado.movimientos.find((m) => m.id === id) ?? null;
}

function importeDe(estado, movimiento) {
  try {
    const decimales = decimalesDe(estado.monedas, movimiento.moneda);
    const propio = formatearMonto(movimiento.monto, decimales, movimiento.moneda);
    if (movimiento.moneda === 'EUR') return { propio, enEuros: null };

    if (faltaCambioPara(movimiento, estado.tipos_cambio)) {
      return { propio, enEuros: null, sinCambio: true };
    }
    return { propio, enEuros: formatearEuros(movimientoEnEuros(movimiento, estado.tipos_cambio, estado.monedas)) };
  } catch {
    // Un dato que no se puede formatear se muestra crudo antes que no mostrarse:
    // el usuario tiene que poder verlo para poder corregirlo o borrarlo.
    return { propio: `${movimiento.monto} ${movimiento.moneda}`, enEuros: null };
  }
}

function dibujarMovimiento(estado, movimiento, vista) {
  const importe = importeDe(estado, movimiento);
  const esGasto = movimiento.tipo === TIPO_GASTO;
  const confirmando = vista.borrando === movimiento.id;

  const detalle = [movimiento.comentario, movimiento.detalle].filter(Boolean).join(' · ');

  return `
    <li class="movimiento${confirmando ? ' confirmando' : ''}">
      <div class="movimiento-datos">
        <span class="nombre">
          <span class="punto-rubro ${claseDeRubro(movimiento.tipo, movimiento.rubro)}" aria-hidden="true"></span>
          ${escapar(formatearRubro(movimiento.rubro))}
        </span>
        <span class="importe ${esGasto ? 'gasto' : 'ingreso'}">${escapar(importe.propio)}</span>
      </div>

      ${detalle || importe.enEuros || importe.sinCambio ? `
      <div class="movimiento-pie suave">
        <span>${escapar(detalle)}</span>
        <span>${
          importe.sinCambio
            ? 'sin tipo de cambio'
            : importe.enEuros ? escapar(importe.enEuros) : ''
        }</span>
      </div>` : ''}

      ${confirmando ? `
      <div class="confirmar-borrado" role="alertdialog" aria-label="Confirmar borrado">
        <p>¿Borrar este movimiento?</p>
        <div class="botones">
          <button type="button" class="peligro" data-accion="borrar-si" data-id="${escapar(movimiento.id)}">Sí, borrar</button>
          <button type="button" class="secundario" data-accion="borrar-no">No</button>

      </div>` : `
      <div class="movimiento-acciones">
        <button type="button" class="secundario chico" data-accion="editar" data-id="${escapar(movimiento.id)}">Corregir</button>
        <button type="button" class="secundario chico" data-accion="borrar" data-id="${escapar(movimiento.id)}">Borrar</button>
      </div>`}

}

/**
 * El aviso de deshacer.
 *
 * No se cierra solo a los tres segundos, como suelen hacerse: en un celular, tres
 * segundos es el tiempo que tarda alguien en darse cuenta de lo que hizo. Se
 * queda hasta que se lo cierra o hasta que se cambia de pantalla.
 */
function dibujarDeshacer(vista) {
  if (!vista.borrado) return '';

  const { movimiento } = vista.borrado;
  return `
    <section class="deshacer" role="status">
      <p>Borraste <strong>${escapar(formatearRubro(movimiento.rubro))}</strong>
      del ${escapar(formatearFecha(movimiento.fecha))}.</p>

/**
 * La lista del mes, agrupada por día y del más nuevo al más viejo.
 *
 * Del más nuevo al más viejo porque lo que se corrige casi siempre es lo último
 * que se cargó: tenerlo arriba evita desplazarse por un mes entero para arreglar
 * un dedazo de hace dos minutos.
 */
function dibujarLista(vista) {
  const { estado, mes } = vista;
  const delMes = movimientosDelMes(estado.movimientos, mes);

  if (delMes.length === 0) {
    return `
      ${dibujarDeshacer(vista)}
      <section class="tarjeta">
        <h2>${escapar(formatearMes(mes))}</h2>
        <p class="suave">No hay movimientos en este mes.</p>
        <button type="button" class="principal" data-accion="ir" data-pantalla="nuevo">
          Cargar un movimiento
        </button>
      </section>
    `;
  }

  // Sin ningún tope de filas: se muestran todos los del mes (L-001).
  const porFecha = new Map();
  for (const movimiento of delMes) {
    if (!porFecha.has(movimiento.fecha)) porFecha.set(movimiento.fecha, []);
    porFecha.get(movimiento.fecha).push(movimiento);
  }

  const dias = [...porFecha.keys()].sort().reverse();
  const cuerpo = dias
    .map((fecha) => `
      <section class="tarjeta dia">
        <h2>${escapar(formatearFechaLarga(fecha))}</h2>
        <ul class="movimientos">
          ${porFecha.get(fecha).map((m) => dibujarMovimiento(estado, m, vista)).join('')}
        </ul>
      </section>`)
    .join('');

  const cuantos = delMes.length === 1 ? '1 movimiento' : `${delMes.length} movimientos`;

  return `
    ${dibujarDeshacer(vista)}
    <p class="cuantos suave">${cuantos} en ${escapar(formatearMes(mes))}.</p>
    ${cuerpo}
  `;
}

/** Un tamaño legible: 12 kB dice más que 12.283 bytes. */
function tamanoLegible(bytes) {
  if (bytes < 1024) return `${bytes} bytes`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1).replace('.', ',')} kB`;
  return `${(bytes / (1024 * 1024)).toFixed(1).replace('.', ',')} MB`;
}

/**
 * El aviso de cuánto hace que no se respalda.

 * Se dice siempre, no solo cuando pasó mucho: saber que respaldaste ayer es
 * información útil, y un aviso que solo aparece cuando hay problema enseña a
 * ignorarlo cuando aparece.

function dibujarEstadoRespaldo(estado, { fecha = hoy() } = {}) {
  const dias = diasSinRespaldar(estado, { fecha });
  const cuantos = (estado.movimientos ?? []).length;

  if (cuantos === 0) {
    return `<p class="suave">Todavía no cargaste nada, así que no hay nada que respaldar.</p>`;
  }

  if (dias === null) {
    return `
      <p class="aviso-respaldo pendiente-respaldo" role="status">
        <strong>Nunca respaldaste.</strong> Tus ${cuantos === 1 ? 'datos viven' : `${cuantos} movimientos viven`}
        solo en este navegador: si se borran los datos de navegación, se pierden.
      </p>`;
  }

  if (dias === 0) return `<p class="aviso-respaldo suave">Respaldaste hoy.</p>`;
  if (dias === 1) return `<p class="aviso-respaldo suave">Respaldaste ayer.</p>`;

  const hace = `Hace ${dias} días que no respaldás.`;
  return dias >= 7
    ? `<p class="aviso-respaldo pendiente-respaldo" role="status"><strong>${hace}</strong>
       Todo lo que cargaste desde entonces existe en un solo lugar.</p>`
    : `<p class="aviso-respaldo suave">${escapar(hace)}</p>`;
}

// La pantalla de carga: CU-01 (registrar un gasto) y CU-02 (registrar un
// ingreso). Es la razón de ser de la app — todo lo demás mira datos que entran
// por acá.
//
// El objetivo declarado en PRODUCTO es "anotar un gasto en menos de quince
// segundos, sin conexión". De ahí salen casi todas las decisiones de abajo:
// la fecha viene puesta en hoy, la moneda en la última usada, el tipo en gasto,
// y el monto es el primer campo, porque es el único que la app no puede adivinar.
//
// Igual que el armazón (ADR-022), esto son funciones puras que devuelven texto
// HTML. Quien las mete en el documento es `ui/app.js`.







/**
 * Los campos vacíos de un formulario nuevo.
 *
 * Tres vienen puestos y los tres tienen el mismo motivo: son los que casi
 * siempre valen lo mismo, y tocarlos sería trabajo repetido. La moneda se
 * hereda de la última usada (RN-04), que es lo que evita elegir "colón" treinta
 * veces seguidas en un viaje a Costa Rica.
 */
function borradorNuevo({ estado, fecha } = {}) {
  return {
    fecha: fecha ?? hoy(),
    tipo: TIPO_GASTO,
    monto: '',
    moneda: estado?.preferencias?.moneda_predeterminada ?? 'EUR',
    rubro: '',
    comentario: '',
    detalle: '',
  };
}

/**
 * El formulario cargado con un movimiento que ya existe, para corregirlo.
 *
 * El monto vuelve a texto con la coma decimal del español: si volviera como
 * `12.5`, el usuario vería su gasto escrito de una forma en la que él nunca lo
 * escribiría.
 */
function borradorDesde(movimiento, decimales) {
  return {
    id: movimiento.id,
    fecha: movimiento.fecha,
    tipo: movimiento.tipo,
    monto: formatearNumero(movimiento.monto, decimales),
    moneda: movimiento.moneda,
    rubro: movimiento.rubro,
    comentario: movimiento.comentario,
    detalle: movimiento.detalle,
  };
}

/**
 * Intenta guardar. Devuelve `{ estado, borrador, aviso, error }` — nunca tira.
 *
 * Es una función pura: recibe el estado y devuelve uno nuevo. Quien lo persiste
 * es `ui/app.js` llamando a `guardarEstado()`. Separarlo así permite testear
 * todo lo que puede salir mal —que es casi todo lo interesante— sin navegador y
 * sin almacenamiento.
 */
function intentarGuardar(estado, borrador) {
  let decimales;
  try {
    decimales = decimalesDe(estado.monedas, borrador.moneda);
  } catch (error) {
    return { estado, borrador, error: error.message };
  }

  const original = borrador.id ? estado.movimientos.find((m) => m.id === borrador.id) : null;

  let movimiento;
  try {
    // Al corregir se conservan el identificador y el día de carga: es el mismo
    // movimiento con otros datos, no uno nuevo. Cambiarle el id rompería
    // cualquier cosa que lo señale, y cambiarle `creado` borraría cuándo entró.
    movimiento = crearMovimiento(borrador, {
      decimales,
      id: original?.id,
      creado: original?.creado,
    });
  } catch (error) {
    // El mensaje viene del modelo, ya escrito para una persona. Repetirlo acá
    // con otras palabras sería tener dos versiones de la misma regla.
    return { estado, borrador, error: error.message };
  }

  // RN-04: no se guarda un movimiento en moneda extranjera sin tipo de cambio,
  // porque no habría forma de expresarlo en euros y quedaría fuera de todos los
  // totales sin que nada lo delate.
  const falta = faltaCambioPara(movimiento, estado.tipos_cambio);
  if (falta) {
    return {
      estado,
      borrador,
      error:
        `Falta el tipo de cambio de ${falta.moneda} para ${formatearMes(falta.mes)}. ` +
        `Sin él este gasto no podría contarse en ningún total, así que todavía no se guarda. ` +
        `Cargalo desde la pantalla de tipos de cambio.`,
      faltaCambio: falta,
    };
  }

  // Corregir un movimiento pasa por acá y no por otro camino: si hubiera dos
  // puertas, tarde o temprano una tendría una validación que la otra no.
  const posicion = borrador.id ? estado.movimientos.findIndex((m) => m.id === borrador.id) : -1;
  const corrigiendo = posicion !== -1;

  const movimientos = corrigiendo
    ? estado.movimientos.map((m, i) => (i === posicion ? movimiento : m))
    : [...estado.movimientos, movimiento];

  const nuevoEstado = {
    ...estado,
    movimientos,
    // La moneda elegida queda como predeterminada para la próxima carga (RN-04).
    preferencias: { ...estado.preferencias, moneda_predeterminada: movimiento.moneda },
  };

  return {
    estado: nuevoEstado,
    corrigiendo,
    // El formulario se vacía pero conserva la fecha: cuando alguien carga tres
    // gastos del sábado, volver a poner la fecha en cada uno es exactamente el
    // trabajo repetido que esta app viene a sacar.
    borrador: borradorNuevo({ estado: nuevoEstado, fecha: movimiento.fecha }),
    aviso: { movimiento, decimales, corrigiendo },
  };
}
