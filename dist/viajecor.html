      <p class="leyenda">${leyenda}</p>

      <!-- El viewBox abre 52 px a la izquierda: es donde van los importes del
           eje. Sin ese margen se dibujan igual, fuera del recorte, y no se ven. -->
      <svg class="linea-acumulado" viewBox="-52 -10 ${ANCHO + 72} ${ALTO + 36}" role="img"
           aria-label="${escapar(serie.titulo)}, de ${escapar(serie.puntos[0].etiqueta)} a ${escapar(serie.puntos.at(-1).etiqueta)}"
           data-dibujo>${interiorDeSerie(serie, ventana)}</svg>

      <p class="lectura" data-lectura role="status">${dibujarLectura(serie, null, serie.base)}</p>

      <div class="controles-grafico">
        <button type="button" class="secundario chico" data-accion="grafico-alejar"
                aria-label="Alejar">−</button>
        <button type="button" class="secundario chico" data-accion="grafico-acercar"
                aria-label="Acercar">+</button>
        <button type="button" class="secundario chico" data-accion="grafico-todo">Ver todo</button>
      </div>
      <p class="suave nota">También se puede pellizcar para acercar y arrastrar para
      moverse.</p>
    </section>
  `;
}

// ── src/ui/pantallas/graficos.js ────────────────────────────────
// Los dos gráficos del mes — T-918, pedidos por el usuario a partir de los que
// tiene en su planilla: una torta del reparto por rubro y una línea del gasto
// acumulado día a día.
//
// Se dibujan en SVG escrito a mano. No es purismo: una biblioteca de gráficos
// se trae de un CDN, y eso está prohibido (RN-06). Todo lo que hace falta acá
// —un sector de círculo y una polilínea— son dos fórmulas de trigonometría.
//
// Igual que el resto de la interfaz (ADR-022), son funciones puras que devuelven
// texto HTML. No tocan el documento.
//
// ── Por qué torta, sabiendo que se compara peor ──────────────────────────────
//
// El usuario la eligió por sobre las barras (2026-08-27). El costo es real: el
// ojo compara ángulos peor que longitudes, y dos porciones de 23 % y 20 % se
// distinguen mucho menos que dos barras de esos largos. Lo que se gana es el
// reparto del todo de un vistazo, que es lo que él mira, y la forma que ya
// reconoce de su planilla.
//
// **Por eso la lista de rubros de al lado no se saca**: ahí están el nombre, el
// importe y el porcentaje, que es donde se compara con precisión. La torta da la
// forma; la lista da los números. Sin la lista, el cambio sería una pérdida.
//
// ── El orden de las porciones es FIJO, no por tamaño ─────────────────────────
//
// Con ocho colores ninguna paleta pasa el validador comparando todos contra
// todos (se midió, ADR-029). Sí pasan los pares que quedan pegados, si son
// siempre los mismos. Dibujar de mayor a menor haría que cargar un gasto
// cambiara qué color toca a qué color, y un par que hoy se distingue mañana no.
// Con el orden fijo de la paleta, los vecinos son siempre los mismos y se
// pueden comprobar.




/** El radio de la torta y el medio del lienzo, en unidades del `viewBox`. */
const RADIO = 100;

/** Debajo de este porcentaje la porción no lleva su número escrito adentro. */
const MINIMO_PARA_ROTULO = 8;

/** Redondeo a dos decimales: alcanza para dibujar y hace el SVG comparable. */
function corto(numero) {
  return Math.round(numero * 100) / 100;
}

/**
 * Un punto del borde del círculo.
 *
 * Se resta 90° para que el 0 quede arriba: una torta que arranca a las 3 en
 * punto se lee mal porque nadie la lee así.
 */
function punto(grados, radio) {
  const radianes = ((grados - 90) * Math.PI) / 180;
  return [corto(radio * Math.cos(radianes)), corto(radio * Math.sin(radianes))];
}

/**
 * La torta de un tipo.
 *
 * Devuelve `''` si no hay nada que repartir: una torta de un solo color es un
 * círculo, y un círculo no dice nada que el importe no diga mejor.
 */
function dibujarTorta(filas, tipo, base) {
  if (filas.length < 2) return '';

  const total = filas.reduce((suma, fila) => suma + fila.total, 0);
  if (total <= 0) return '';

  // El orden de dibujo es el de la paleta, no el de la lista. Ver arriba.
  const enOrden = [...filas].sort(
    (a, b) => franjaDeRubro(tipo, a.rubro) - franjaDeRubro(tipo, b.rubro),
  );

  let desde = 0;
  const porciones = enOrden.map((fila) => {
    // El ángulo sale del importe, NO del porcentaje redondeado: ocho números
    // redondeados no suman 360 y la última porción queda con un hueco o pisada.
    const angulo = (fila.total / total) * 360;
    const hasta = desde + angulo;
    const [x1, y1] = punto(desde, RADIO);
    const [x2, y2] = punto(hasta, RADIO);
    const grande = angulo > 180 ? 1 : 0;
    const franja = franjaDeRubro(tipo, fila.rubro);
    const porcentaje = (fila.total / total) * 100;
    const [rx, ry] = punto(desde + angulo / 2, RADIO * 0.62);
    desde = hasta;

    const rotulo = porcentaje >= MINIMO_PARA_ROTULO
      // El rótulo lleva la franja de su porción para que el CSS pueda elegir la
      // tinta: sobre los tonos oscuros de la paleta el negro no se lee (T-049).
      ? `<text class="rotulo-porcion rubro-${franja}" x="${rx}" y="${ry}">${Math.round(porcentaje)} %</text>`
      : '';

    return `
      <g>
        <path class="porcion rubro-${franja}"
              d="M 0 0 L ${x1} ${y1} A ${RADIO} ${RADIO} 0 ${grande} 1 ${x2} ${y2} Z">
          <title>${escapar(formatearRubro(fila.rubro))}: ${escapar(formatearEuros(fila.total, base))} (${Math.round(porcentaje)} %)</title>
        </path>
        ${rotulo}
      </g>`;
  }).join('');

  // `role="img"` con su texto: quien no ve el dibujo escucha el reparto, y el
  // que sí lo ve tiene la lista de abajo. El color nunca es la única vía.
  const resumen = enOrden
    .map((f) => `${formatearRubro(f.rubro)} ${Math.round((f.total / total) * 100)} %`)
    .join(', ');

  return `
    <svg class="torta" viewBox="-110 -110 220 220" role="img"
         aria-label="Reparto por rubro: ${escapar(resumen)}">
      ${porciones}
    </svg>
  `;
}

/**
 * Hasta qué día tiene sentido dibujar el mes.
 *
 * En el mes en curso, seguir la línea hasta el día 31 la deja plana desde hoy
 * hasta fin de mes, y una línea plana en un acumulado se lee como "dejó de
 * gastar". Es mentira: esos días no pasaron todavía.
 */
function diasHasta(dias, hasta) {
  if (hasta === undefined) return dias;
  return dias.filter((d) => d.dia <= hasta);
}

/**
 * La línea del acumulado del mes.
 *
 * Van las dos —gasto e ingreso— porque el dato que se busca acá no es cuánto se
 * gastó, que ya está arriba en número grande, sino **cuándo una cruza a la
 * otra**. Son la misma unidad, así que comparten un solo eje: dos escalas en un
 * mismo dibujo es la forma más común de mentir con un gráfico.
 */
function dibujarLinea(dias, opciones = {}) {
  const base = opciones.base;
  const visibles = diasHasta(dias, opciones.hasta);
  if (visibles.length < 2) return '';

  const techo = Math.max(
    ...visibles.map((d) => Math.max(d.gastoAcumulado, d.ingresoAcumulado)),
  );
  if (techo <= 0) return '';

  const ANCHO = 300;
  const ALTO = 140;
  const ultimo = visibles[visibles.length - 1];

  const x = (dia) => corto(((dia - 1) / Math.max(1, ultimo.dia - 1)) * ANCHO);
  const y = (valor) => corto(ALTO - (valor / techo) * ALTO);

  const linea = (campo) => visibles.map((d) => `${x(d.dia)},${y(d[campo])}`).join(' ');

  return `
    <svg class="linea-acumulado" viewBox="-4 -18 ${ANCHO + 60} ${ALTO + 40}" role="img"
         aria-label="${escapar(opciones.queEs ?? `Acumulado del mes hasta el día ${ultimo.dia}`)}: gastos ${escapar(formatearEuros(ultimo.gastoAcumulado, base))}, ingresos ${escapar(formatearEuros(ultimo.ingresoAcumulado, base))}">
      <line class="eje" x1="0" y1="${ALTO}" x2="${ANCHO}" y2="${ALTO}" />
      <text class="marca-eje" x="0" y="-6">${escapar(formatearEuros(techo, base))}</text>
      <polyline class="traza ingreso" points="${linea('ingresoAcumulado')}" />
      <polyline class="traza gasto" points="${linea('gastoAcumulado')}" />
      <text class="rotulo-traza ingreso" x="${x(ultimo.dia) + 6}" y="${y(ultimo.ingresoAcumulado) + 4}">Ingresos</text>
      <text class="rotulo-traza gasto" x="${x(ultimo.dia) + 6}" y="${y(ultimo.gastoAcumulado) + 4}">Gastos</text>
      <!-- Los rótulos del eje se llaman rotuloInicio y rotuloFin, y no
           desde/hasta: "hasta" ya significa "hasta qué día dibujar" en esta
           misma función, y usarlo para las dos cosas hizo que el rótulo del
           final saliera "10" en vez de "Día 10". Lo agarró un test que ya
           existía. Dos significados para un nombre es un error esperando.
           (Y sin acentos graves adentro: acá estamos dentro de una plantilla, y
           un acento grave la cierra — es L-028, que ya pasó una vez.) -->
      <text class="marca-eje" x="0" y="${ALTO + 16}">${escapar(opciones.rotuloInicio ?? 'Día 1')}</text>
      <text class="marca-eje fin" x="${ANCHO}" y="${ALTO + 16}">${escapar(opciones.rotuloFin ?? `Día ${ultimo.dia}`)}</text>
    </svg>
  `;
}

/** La tarjeta entera de la línea, con su título. */
function dibujarAcumulado(dias, opciones = {}) {
  const base = opciones.base;
  const dibujo = dibujarLinea(dias, opciones);
  if (dibujo === '') return '';

  return `
    <section class="tarjeta">
      <h2>Cómo se fue acumulando</h2>
      ${dibujo}
    </section>
  `;
}

/**
 * El acumulado de TODO el historial — T-940, ahora recorrible (T-942).
 *
 * Contesta lo que ninguna otra pantalla contesta: **si la distancia entre lo que
 * entra y lo que sale se está abriendo o cerrando**. Con el zoom se puede además
 * mirar un tramo corto, que era imposible con trescientos días en 300 píxeles.
 */
function dibujarAcumuladoHistorico(dias) {
  return dibujarSerie({
    id: 'acumulado-historico',
    titulo: 'Todo lo que llevás gastado y cobrado',
    nota: `Día por día desde el primer movimiento. Lo que importa acá no es la
      altura sino <strong>si las dos líneas se separan o se juntan</strong>.`,
    series: [
      { clase: 'ingreso', nombre: 'Ingresos' },
      { clase: 'gasto', nombre: 'Gastos' },
    ],
    puntos: dias.map((d) => ({
      etiqueta: formatearMesCorto(d.mes),
      // Lo que se lee al tocar un punto lleva el día completo: la etiqueta del
      // eje dice el mes porque no entra más, pero el punto es de un día.
      cuando: formatearFechaLarga(d.fecha),
      valores: [d.ingresoAcumulado, d.gastoAcumulado],
    })),
  });
}

/**
 * Ingresos, gastos y saldo mes a mes — T-940, ahora recorrible (T-942).
 *
 * **Tres series en un solo eje.** Son la misma unidad, así que comparten
 * escala: dos escalas en un mismo dibujo es la forma más común de mentir con un
 * gráfico. El saldo va punteado y en color de texto porque es un resultado de
 * los otros dos, no una cosa más, y cuando alguno es negativo se dibuja la línea
 * del cero: sin ella, −200 y +200 se ven como dos puntos cualesquiera.
 */
function dibujarMesAMes(filas) {
  return dibujarSerie({
    id: 'mes-a-mes',
    titulo: 'Mes a mes',
    nota: 'Lo que entró, lo que salió y lo que quedó, mes por mes.',
    series: [
      { clase: 'ingreso', nombre: 'Ingresos' },
      { clase: 'gasto', nombre: 'Gastos' },
      { clase: 'saldo', nombre: 'Saldo' },
    ],
    puntos: filas.map((f) => ({
      etiqueta: formatearMesCorto(f.mes),
      cuando: formatearMes(f.mes),
      valores: [f.ingresos, f.gastos, f.saldo],
    })),
  });
}

// ── src/ui/pantallas/resumen.js ─────────────────────────────────
// El resumen del mes — CU-04. Responde "¿cómo vengo este mes?" de un vistazo.
//
// Reemplaza los bloques `GASTOS POR TIPO`, `INGRESOS POR TIPO` y `TOTALES` del
// Excel. Tres decisiones de presentación, con su motivo:
//
//   1. Los tres números de arriba son **números destacados, no un gráfico**. Un
//      gráfico de tres barras para tres cifras que ya se leen en un vistazo
//      agrega trabajo visual y no agrega información.
//
//   2. El desglose por rubro es una **torta más una tabla** (T-918). La torta da
//      el reparto del todo de un vistazo; la tabla, ordenada de mayor a menor,
//      da el nombre, el importe y el porcentaje, que es donde se compara con
//      precisión. Hasta el 2026-08-28 la tabla llevaba barras de proporción: las
//      reemplazó la torta por pedido del usuario, que es la forma que reconoce
//      de su planilla. La tabla se quedó justamente porque la torta compara
//      peor, y sin ella el cambio sería una pérdida.
//
//      Cada rubro lleva **el color que tiene en todas las demás pantallas**
//      (T-909, T-922). El color identifica al rubro y **nunca a su tamaño**:
//      pintar más oscuro al más grande codificaría dos veces lo mismo y haría
//      que el color cambiara de significado cada vez que se carga un gasto.
//
//   3. Los importes de la tabla llevan cifras de ancho fijo, para poder
//      compararlos en columna. Los tres números grandes de arriba **no**: en un
//      número grande, el ancho fijo abre huecos entre los dígitos y se lee peor.
//
// Igual que el resto de la interfaz (ADR-022), son funciones puras que devuelven
// texto HTML.







/** Un porcentaje para mostrar: sin decimales, que en un desglose no aportan. */
function porcentaje(valor) {
  return `${Math.round(valor)} %`;
}

/**
 * Los tres números del mes.
 *
 * El saldo lleva su signo en el propio número, no solo en el color: quien no
 * distingue el verde del rojo tiene que poder leer si el mes cerró en más o en
 * menos.
 */
function dibujarTotales(totales, base) {
  const saldoPositivo = totales.saldo >= 0;

  return `
    <section class="tarjeta totales" aria-label="Totales del mes">
      <div class="total">
        <span class="etiqueta">Gastos</span>
        <span class="cifra gasto">${escapar(formatearEuros(totales.gastos, base))}</span>
      </div>
      <div class="total">
        <span class="etiqueta">Ingresos</span>
        <span class="cifra ingreso">${escapar(formatearEuros(totales.ingresos, base))}</span>
      </div>
      <div class="total saldo">
        <span class="etiqueta">Saldo</span>
        <span class="cifra ${saldoPositivo ? 'ingreso' : 'gasto'}">
          ${escapar(formatearEuros(totales.saldo, base))}
        </span>
      </div>
    </section>
  `;
}

/**
 * El aviso de que el total está incompleto.
 *
 * `calculos.js` se toma el trabajo de apartar los movimientos que no se pueden
 * convertir a euros en vez de contarlos como cero (T-013). Si la pantalla no lo
 * dijera, ese cuidado no serviría de nada: el usuario vería un total que parece
 * completo y no lo es.
 */
function dibujarIncompleto(estado, totales) {
  if (totales.sinConvertir.length === 0) return '';

  const faltantes = [...new Set(totales.sinConvertir.map((m) => m.moneda))].join(', ');
  const cuantos = totales.sinConvertir.length === 1
    ? 'Un movimiento no está'
    : `${totales.sinConvertir.length} movimientos no están`;

  return `
    <section class="aviso importante" role="alert">
      <h2>Este total está incompleto</h2>
      <p>${cuantos} contado${totales.sinConvertir.length === 1 ? '' : 's'} acá porque falta
      el tipo de cambio de ${escapar(faltantes)} para este mes.</p>
      <button type="button" class="secundario" data-accion="ir" data-pantalla="cambios">
        Cargar el tipo de cambio
      </button>
    </section>
  `;
}

/**
 * El desglose de un tipo: la torta arriba, la lista de mayor a menor abajo.
 *
 * Las dos leen los mismos datos y las dos están siempre: el dibujo muestra el
 * reparto, la lista muestra los números. La torta se dibuja en el orden fijo de
 * la paleta, no en el de la lista — el motivo está en `graficos.js`.
 */
function dibujarDesglose(estado, mes, tipo) {
  const base = monedaBaseDe(estado);
  const filas = porRubro(estado, mes, tipo);
  if (filas.length === 0) return '';

  const titulo = tipo === TIPO_GASTO ? 'En qué se fue' : 'De dónde vino';

  // Con un solo rubro no hay nada que comparar: la barra estaría siempre llena y
  // el porcentaje sería siempre 100 %. Dos adornos que ocupan lugar y no dicen
  // nada. Se muestran el nombre y el importe, que es toda la información que hay.
  const hayComparacion = filas.length > 1;

  const cuerpo = filas
    .map((fila) => `
      <li class="fila-rubro">
        <!-- La fila entera es un botón: tocarla lleva a los movimientos que
             componen ese número (T-026). Antes cada total era un callejón sin
             salida: decía "Supermercado 410,00 €" y para saber de qué se
             componía había que ir a la lista y leer el mes entero.

             Se toca la FILA y no la porción de la torta: una porción del 1 % en
             un teléfono son dos milímetros, y la fila está siempre, tenga el
             tamaño que tenga. -->
        <button type="button" class="fila-toque" data-accion="ver-rubro"
                data-tipo="${escapar(tipo)}" data-rubro="${escapar(fila.rubro)}">
          <span class="rubro-cabeza">
            <span class="nombre">
              <span class="punto-rubro ${claseDeRubro(tipo, fila.rubro)}" aria-hidden="true"></span>
              ${escapar(formatearRubro(fila.rubro))}
            </span>
            <span class="importe">${escapar(formatearEuros(fila.total, base))}</span>
          </span>
        </button>
        <div class="rubro-pie suave">
          <span>${hayComparacion ? escapar(porcentaje(fila.porcentaje)) : ''}</span>
          <span>${fila.cuantos === 1 ? '1 movimiento' : `${fila.cuantos} movimientos`}</span>
        </div>
      </li>`)
    .join('');

  return `
    <section class="tarjeta">
      <h2>${titulo}</h2>
      ${dibujarTorta(filas, tipo, base)}
      <ul class="rubros">${cuerpo}</ul>
    </section>
  `;
}

/**
 * Lo que se muestra cuando el mes está vacío.
 *
 * Un mes sin nada no es un error ni una pantalla rota: puede ser un mes que
 * todavía no empezó a cargarse, o uno viejo. Se dice cuál de las dos cosas es y
 * se ofrece lo único que tiene sentido hacer.
 */
function dibujarMesVacio(mes) {
  const esFuturo = mes > mesDe(hoy());
  const explicacion = esFuturo
    ? 'Este mes todavía no llegó.'
    : 'No cargaste nada en este mes.';

  return `
    <section class="tarjeta">
      <h2>${escapar(formatearMes(mes))}</h2>
      <p class="suave">${explicacion}</p>
      <button type="button" class="principal" data-accion="ir" data-pantalla="nuevo">
        Cargar un movimiento
      </button>
      <!-- Los ahorros no dependen del mes que estés mirando: son otro registro.
           Sin esto, un mes sin gastos los deja inalcanzables desde acá, que es
           el mismo defecto que ya había tenido la evolución. -->
      <button type="button" class="secundario" data-accion="ir" data-pantalla="ahorros">
        Ahorros conjuntos
      </button>
    </section>
  `;
}

/** El promedio por día, que a mitad de mes es el número que dice cómo vas. */
function dibujarPromedio(estado, mes) {
  const base = monedaBaseDe(estado);
  const { gastos, cuantos } = totalesDelMes(estado, mes);
  if (cuantos === 0 || gastos === 0) return '';

  const esteMes = mes === mesDe(hoy());
  const hasta = esteMes ? Number(hoy().slice(8)) : undefined;
  const promedio = promedioPorDia(estado, mes, hasta);

  const explicacion = esteMes
    ? `en los ${hasta} días que van del mes`
    : 'en todo el mes';

  return `
    <p class="promedio suave">
      <strong>${escapar(formatearEuros(promedio, base))}</strong> por día ${escapar(explicacion)}.
    </p>
  `;
}

/**
 * La puerta a la evolución mes a mes.
 *
 * Va al final del resumen porque es ahí donde nace la pregunta: se termina de
 * leer "620,00 € en gastos fijos" y lo siguiente que uno quiere saber es si eso
 * es mucho o poco comparado con los meses anteriores.
 */
function dibujarIrAEvolucion() {
  return `
    <section class="tarjeta">
      <h2>¿Y comparado con los otros meses?</h2>
      <button type="button" class="secundario" data-accion="ir" data-pantalla="evolucion">
        Ver la evolución y los gastos fijos
      </button>
      <button type="button" class="secundario" data-accion="ir" data-pantalla="viajes">
        Ver el gasto por viaje
      </button>
      <button type="button" class="secundario" data-accion="ir" data-pantalla="grupos">
        Ver los otros grupos de gastos
      </button>
      <!-- Los ahorros van acá abajo, con los otros historiales, y no en la barra
           de navegación: no son gastos ni ingresos del mes —no entran en ningún
           total de esta pantalla— y se miran una vez por mes. Lo pidió el
           usuario así (2026-08-31). -->
      <button type="button" class="secundario" data-accion="ir" data-pantalla="ahorros">
        Ahorros conjuntos
      </button>
    </section>
  `;
}

function dibujarResumen(vista) {
  const { estado, mes } = vista;
  const totales = totalesDelMes(estado, mes);

  if (totales.cuantos === 0) return dibujarMesVacio(mes);

  return `
    ${dibujarIncompleto(estado, totales)}
    ${dibujarTotales(totales, monedaBaseDe(estado))}
    ${dibujarPromedio(estado, mes)}
    ${dibujarDesglose(estado, mes, TIPO_GASTO)}
    ${dibujarAcumulado(porDia(estado, mes), {
      hasta: mes === mesDe(hoy()) ? Number(hoy().slice(8)) : undefined,
      base: monedaBaseDe(estado),
    })}
    ${dibujarDesglose(estado, mes, TIPO_INGRESO)}
    ${dibujarIrAEvolucion()}
  `;
}

// ── src/core/etiquetas.js ───────────────────────────────────────
// Las etiquetas que el usuario ya escribió — CU-16, T-025.
//
// ── Lo primero que hay que entender, porque cambia todo lo demás ────────────
//
// **No existe ningún catálogo de comentarios ni de detalles.** Los rubros sí son
// una lista cerrada de ocho; el comentario y el detalle son **texto libre
// escrito en cada movimiento**. Este archivo no lee un catálogo: lo *deduce*
// recorriendo los movimientos.
//
// Por eso "borrar una etiqueta" no es borrar un registro: es **vaciar ese texto
// en los N movimientos que lo tienen**, y "renombrarla" es reescribirlo en los
// N. Son operaciones en lote sobre datos ya cargados, así que les corresponde la
// regla de siempre (ADR-019, ADR-033): **decir cuántos movimientos tocan antes
// de tocarlos**. Por eso cada operación viene con su `efectoDe…`.
//
// ── Para qué sirve de verdad ────────────────────────────────────────────────
//
// El comentario es lo que AGRUPA: los totales por viaje y por gasto fijo salen
// de él. `Barcelona26` y `barcelona 26` son dos grupos distintos, y un typo
// parte un total en dos sin avisar (L-002). Renombrar uno con el nombre del otro
// **los une**, y esa es la razón principal de esta pantalla.
//
// Es también la salida a la pregunta que ADR-013 dejó abierta: `Perú` y `Peru`
// son dos claves distintas a propósito —sacar tildes automáticamente juntaría
// palabras que el usuario quiso separar—, y acá se pueden juntar a mano las que
// él decida que son la misma.
//
// El detalle no agrupa nada: limpiarlo es orden, no arreglar un total. Se ofrece
// igual porque el usuario lo pidió, pero la pantalla lo dice.
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.

/** Los campos de texto libre que se pueden limpiar. */
const CAMPOS = Object.freeze(['comentario', 'detalle']);

function exigirCampo(campo) {
  if (!CAMPOS.includes(campo)) {
    throw new Error(`No se puede limpiar el campo ${JSON.stringify(campo)}: solo ${CAMPOS.join(' y ')}.`);
  }
}

/**
 * Las etiquetas que existen en un campo, con cuántos movimientos usa cada una.
 *
 * Agrupa por la **clave** (RN-03) y muestra **la primera escritura que
 * apareció**, igual que `porComentario()` y que las sugerencias: tres criterios
 * distintos para elegir cómo se escribe un grupo terminarían mostrando tres
 * nombres para la misma cosa.
 *
 * Devuelve también cuántas **escrituras distintas** tiene cada etiqueta. Es el
 * dato que delata un typo: "Barcelona26 · 2 formas de escribirlo" es exactamente
 * lo que hay que ir a arreglar.
 *
 * Sin ningún tope de filas (L-001).
 */
function etiquetasUsadas(movimientos, campo) {
  exigirCampo(campo);
  if (!Array.isArray(movimientos)) return [];

  const porClave = new Map();

  for (const movimiento of movimientos) {
    const texto = normalizarTextoVisible(String(movimiento?.[campo] ?? ''));
    if (texto === '') continue;

    const clave = normalizarClave(texto);
    const visto = porClave.get(clave);
    if (!visto) {
      porClave.set(clave, { clave, texto, cuantos: 1, escrituras: new Set([texto]) });
    } else {
      visto.cuantos += 1;
      visto.escrituras.add(texto);
    }
  }

  return [...porClave.values()]
    .map(({ escrituras, ...resto }) => ({ ...resto, escrituras: escrituras.size }))
    // De más usada a menos, y por texto para desempatar: el orden no puede
    // depender de en qué orden se cargaron dos etiquetas con el mismo uso.
    .sort((a, b) => b.cuantos - a.cuantos || a.texto.localeCompare(b.texto));
}

/** Los movimientos que tienen esa etiqueta en ese campo. */
function movimientosCon(movimientos, campo, clave) {
  exigirCampo(campo);
  const buscada = normalizarClave(String(clave ?? ''));
  return (movimientos ?? []).filter(
    (m) => normalizarClave(String(m?.[campo] ?? '')) === buscada,
  );
}

/**
 * Qué pasaría al renombrar. **Lo importante es `seUneCon`**: si el texto nuevo
 * ya existe, los dos grupos pasan a ser uno solo, y eso cambia totales. Es la
 * razón de ser de la pantalla y, si no se dice antes, es una sorpresa.
 */
function efectoDeRenombrar(movimientos, campo, clave, nuevoTexto) {
  exigirCampo(campo);
  const texto = normalizarTextoVisible(String(nuevoTexto ?? ''));
  const claveVieja = normalizarClave(String(clave ?? ''));
  const claveNueva = texto === '' ? '' : normalizarClave(texto);

  const afectados = movimientosCon(movimientos, campo, claveVieja).length;
  const otra = claveNueva !== '' && claveNueva !== claveVieja
    ? etiquetasUsadas(movimientos, campo).find((e) => e.clave === claveNueva)
    : undefined;

  return {
    afectados,
    // Cambiar solo mayúsculas o espacios NO une nada: es la misma clave. Se
    // informa igual, porque para el usuario el texto sí cambió.
    seUneCon: otra ? { texto: otra.texto, cuantos: otra.cuantos } : null,
    quedan: afectados + (otra?.cuantos ?? 0),
  };
}

/**
 * Renombra una etiqueta en todos los movimientos que la tienen.
 *
 * Devuelve una lista nueva; no modifica la que recibe. El texto se guarda
 * **normalizado igual que al cargarlo** (`normalizarTextoVisible`): si acá se
 * guardara crudo, esta pantalla sería la única forma de meter en los datos un
 * texto con dos espacios o sin normalizar en NFC, que es justo lo que esa
 * función existe para impedir (L-003).
 */
function renombrarEtiqueta(movimientos, campo, clave, nuevoTexto) {
  exigirCampo(campo);
  const texto = normalizarTextoVisible(String(nuevoTexto ?? ''));
  if (texto === '') {
    throw new Error('Para dejar la etiqueta vacía, usá borrar: así queda claro que se saca de todos sus movimientos.');
  }

  const buscada = normalizarClave(String(clave ?? ''));
  return (movimientos ?? []).map((m) =>
    normalizarClave(String(m?.[campo] ?? '')) === buscada ? { ...m, [campo]: texto } : m,
  );
}

/**
 * Saca una etiqueta de todos sus movimientos. **No borra ningún movimiento**:
 * les deja ese campo vacío. La pantalla tiene que decirlo con todas las letras
 * —"borrar la etiqueta" y "borrar los gastos" se confunden fácil, y uno de los
 * dos no se puede deshacer.
 */
function borrarEtiqueta(movimientos, campo, clave) {
  exigirCampo(campo);
  const buscada = normalizarClave(String(clave ?? ''));
  return (movimientos ?? []).map((m) =>
    normalizarClave(String(m?.[campo] ?? '')) === buscada ? { ...m, [campo]: '' } : m,
  );
}

// ── src/core/viajes.js ──────────────────────────────────────────
// El gasto por viaje — CU-11, T-023. Reemplaza el bloque `GASTOS POR VIAJE`,
// que es el motivo por el que la planilla se llama "Viaje Coruña".
//
// ── Qué es un viaje, y por qué no es un registro ────────────────────────────
//
// **Un viaje no existe como cosa guardada.** Es un comentario repetido en varios
// movimientos, igual que un gasto fijo. El usuario decidió (2026-08-28) que se
// siga escribiendo a mano, con la condición de poder corregirlo en un solo lugar
// y que el cambio llegue a todos los registros — eso es T-025.
//
// **Cuál de todos los comentarios es un viaje:** el que tenga al menos un gasto
// del rubro `viajes`. Es una regla que sale de los datos y no de una lista
// aparte, así que no hay dos lugares que se puedan desincronizar. `Luz` nunca va
// a tener un gasto de rubro `viajes`, así que nunca va a aparecer acá.
//
// **Pero el total del viaje suma TODOS sus rubros**, no solo el de `viajes`: en
// un viaje se come, se toma transporte y se compra en el supermercado, y todo
// eso es plata del viaje. Es lo mismo que hace la planilla, que suma por
// comentario sin mirar el rubro.
//
// ── Se escriben las FECHAS, y los días se calculan ──────────────────────────
//
// La duración **no se deduce de los movimientos**: un viaje puede empezar antes
// de que se registre el primer gasto o terminar después del último, y deducirlo
// daría un gasto por día más alto de lo real, sin avisar.
//
// Pero tampoco se escribe a mano. **Se escriben la fecha de inicio y la de fin,
// y los días salen de restarlas** (pedido del usuario, 2026-08-28). Es mejor por
// dos motivos: una fecha es un dato que uno recuerda —"salí el 3 y volví el
// 12"— y un número de días es una cuenta que hay que hacer; y con las fechas
// guardadas, los viajes se pueden **ordenar por cuándo terminaron**, que es como
// uno los piensa.
//
// Viven en `estado.fechas_de_viaje`: una lista de `{ clave, desde, hasta }`.
// **Se llama así y no `viajes` a propósito**: no es un catálogo de viajes —la
// lista de viajes sigue saliendo de las etiquetas— sino un dato suelto sobre
// uno de ellos.
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.




/** El rubro que marca a un comentario como viaje. */
const RUBRO_VIAJE = 'viajes';

/** Las fechas guardadas de un viaje, o `null` si no se escribieron. */
function fechasDeViaje(estado, clave) {
  const buscada = normalizarClave(String(clave ?? ''));
  const guardado = (estado?.fechas_de_viaje ?? []).find(
    (v) => normalizarClave(String(v?.clave ?? '')) === buscada,
  );
  return guardado ? { desde: guardado.desde, hasta: guardado.hasta } : null;
}

/**
 * Cuántos días dura un viaje entre dos fechas, **contando las dos puntas**.
 *
 * Del 3 al 12 son diez días, no nueve: el 3 se viajó y el 12 también. Es la
 * cuenta que hace una persona, y la que no hace una resta de fechas a secas.
 */
function duracionEnDias(desde, hasta) {
  const dias = (Date.parse(`${hasta}T12:00:00Z`) - Date.parse(`${desde}T12:00:00Z`)) / 86400000;
  return Math.round(dias) + 1;
}

/**
 * Escribe las fechas de un viaje. Devuelve un estado nuevo.
 *
 * `null` las borra: es la forma de decir "no me acuerdo cuándo fue".
 */
function fijarFechasDeViaje(estado, clave, desde, hasta) {
  const buscada = normalizarClave(String(clave ?? ''));
  if (buscada === '') throw new Error('Hace falta saber de qué viaje son las fechas.');

  const otros = (estado.fechas_de_viaje ?? []).filter(
    (v) => normalizarClave(String(v?.clave ?? '')) !== buscada,
  );

  const vacia = (f) => f === null || f === undefined || String(f).trim() === '';
  if (vacia(desde) && vacia(hasta)) return { ...estado, fechas_de_viaje: otros };

  if (vacia(desde) || vacia(hasta)) {
    throw new Error('Hacen falta las dos fechas: la de inicio y la de fin.');
  }

  // `validarFecha` comprueba que la fecha EXISTA, no solo que tenga la forma:
  // un 31 de abril tiene la forma correcta y no existe (L-005).
  const inicio = validarFecha(desde);
  const fin = validarFecha(hasta);

  if (fin < inicio) {
    throw new Error('El viaje no puede terminar antes de empezar: revisá las fechas.');
  }
  if (duracionEnDias(inicio, fin) > 3650) {
    throw new Error('Diez años de viaje son muchos: revisá las fechas.');
  }

  return { ...estado, fechas_de_viaje: [...otros, { clave: buscada, desde: inicio, hasta: fin }] };
}

/**
 * Los viajes, de más caro a más barato.
 *
 * Cada uno trae su total, cuántos movimientos, entre qué fechas se gastó, los
 * días escritos (o `null`) y el gasto por día **solo si los días están**. Sin
 * días no se inventa un promedio: sería el número que el usuario vino a buscar,
 * calculado sobre un supuesto que nadie confirmó.
 */
function viajes(estado) {
  const todos = estado?.movimientos ?? [];
  const { convertibles, sinConvertir } = separarConvertibles(todos, estado?.tipos_cambio);

  // Primero, qué comentarios son viajes: los que tienen algún gasto de `viajes`.
  const esViaje = new Set();
  for (const m of todos) {
    if (m.tipo === TIPO_GASTO
      && normalizarClave(String(m.rubro ?? '')) === RUBRO_VIAJE
      && String(m.comentario ?? '') !== '') {
      esViaje.add(normalizarClave(m.comentario));
    }
  }
  if (esViaje.size === 0) return [];

  const acumulado = new Map();
  for (const m of convertibles) {
    if (m.tipo !== TIPO_GASTO) continue;
    const comentario = String(m.comentario ?? '');
    if (comentario === '') continue;
    const clave = normalizarClave(comentario);
    if (!esViaje.has(clave)) continue;

    const euros = movimientoEnEuros(m, estado.tipos_cambio, estado.monedas);
    const antes = acumulado.get(clave);
    if (!antes) {
      acumulado.set(clave, {
        clave, comentario, total: euros, cuantos: 1,
        desde: m.fecha, hasta: m.fecha,
      });
    } else {
      antes.total += euros;
      antes.cuantos += 1;
      if (m.fecha < antes.desde) antes.desde = m.fecha;
      if (m.fecha > antes.hasta) antes.hasta = m.fecha;
    }
  }

  // Los que no se pudieron convertir se cuentan aparte, por viaje: un total al
  // que le falta un gasto y que no lo dice es peor que no mostrar ningún total.
  const incompletos = new Set();
  for (const m of sinConvertir) {
    const clave = normalizarClave(String(m.comentario ?? ''));
    if (esViaje.has(clave)) incompletos.add(clave);
  }

  return [...acumulado.values()]
    .map((v) => {
      const fechas = fechasDeViaje(estado, v.clave);
      const dias = fechas === null ? null : duracionEnDias(fechas.desde, fechas.hasta);
      return {
        ...v,
        mes: mesDe(v.desde),
        fechas,
        dias,
        porDia: dias === null ? null : redondear(v.total / dias),
        // Por cuándo terminó, que es el orden que pidió el usuario. Un viaje sin
        // fechas escritas se ordena por su último gasto: es lo más parecido que
        // se sabe, y sin eso todos los viajes sin fechas se amontonarían juntos
        // en una punta de la lista, lejos de cuando de verdad pasaron.
        termino: fechas === null ? v.hasta : fechas.hasta,
        incompleto: incompletos.has(v.clave),
      };
    })
    // Del más reciente arriba al más viejo abajo.
    .sort((a, b) => b.termino.localeCompare(a.termino) || a.clave.localeCompare(b.clave));
}

// ── src/ui/pantallas/etiquetas.js ───────────────────────────────
// Ver, renombrar y borrar las etiquetas ya escritas — CU-16, T-025.
//
// Pedida por el usuario (2026-08-28): quería poder editar y borrar "las
// categorías" que ya usó. La respuesta honesta es que **no son categorías**: son
// texto libre escrito en cada movimiento (ver `core/etiquetas.js`). Así que esta
// pantalla no edita un catálogo, edita **todos los movimientos que comparten un
// texto**, y eso obliga a dos cosas:
//
//   1. **Decir cuántos toca antes de tocarlos.** Es la misma regla del cambio de
//      decimales (ADR-033) y de la corrección de un tipo de cambio (ADR-019).
//   2. **Decir que borrar la etiqueta NO borra los movimientos.** "Borrar Luz" y
//      "borrar los gastos de luz" se confunden con una lectura rápida, y uno de
//      los dos no se puede deshacer.
//
// Igual que el resto de la interfaz (ADR-022), las funciones de dibujo son puras
// y las de cambio devuelven un estado nuevo sin guardarlo.



const TITULOS = {
  comentario: 'Etiquetas',
  detalle: 'Detalles',
};

const EXPLICACIONES = {
  comentario: `La etiqueta es lo que <strong>agrupa</strong>: de ella salen los
    totales por viaje y por gasto fijo. Dos escrituras distintas son dos totales
    distintos, así que renombrar una con el nombre de la otra las une.`,
  detalle: `El detalle es una nota para acordarte: <strong>no agrupa nada</strong>.
    Limpiarlo es orden, no arreglar un número.`,
};

/** Cuántos movimientos usan una etiqueta, en palabras. */
function enCuantos(cuantos) {
  return cuantos === 1 ? '1 movimiento' : `${cuantos} movimientos`;
}

/**
 * Una etiqueta de la lista.
 *
 * Si tiene **más de una escritura**, se dice: es exactamente el dato que delata
 * un typo, y es lo que hay que ir a arreglar. Sin eso, `Barcelona26` y
 * `barcelona 26` se ven como dos filas cualesquiera.
 */
function dibujarEtiqueta(campo, etiqueta) {
  const aviso = etiqueta.escrituras > 1
    ? `<span class="suave">· ${etiqueta.escrituras} formas de escribirlo</span>`
    : '';

  return `
    <li class="fila-rubro">
      <div class="rubro-cabeza">
        <span class="nombre">${escapar(etiqueta.texto)}</span>
        <span class="importe">${escapar(enCuantos(etiqueta.cuantos))}</span>
      </div>
      <div class="rubro-pie suave">
        <span>${aviso}</span>
        <span class="acciones-etiqueta">
          ${campo === 'comentario' ? `
          <!-- Solo el comentario ofrece "Ver": la lista se puede filtrar por
               comentario, no por detalle. Un botón escondido con el atributo
               hidden sigue estando en la página; el que no hace falta
               directamente no se dibuja. -->
          <button type="button" class="secundario chico" data-accion="ver-comentario"
                  data-comentario="${escapar(etiqueta.texto)}">Ver</button>` : ''}
          <button type="button" class="secundario chico" data-accion="renombrar-etiqueta"
                  data-campo="${escapar(campo)}" data-clave="${escapar(etiqueta.clave)}">Renombrar</button>
          <button type="button" class="secundario chico" data-accion="borrar-etiqueta"
                  data-campo="${escapar(campo)}" data-clave="${escapar(etiqueta.clave)}">Borrar</button>
        </span>
      </div>
    </li>
  `;
}

/** El aviso de qué va a pasar al renombrar. */
function dibujarAvisoRenombrar(efecto) {
  if (efecto === null) return '';

  const cuantos = enCuantos(efecto.afectados);
  if (efecto.seUneCon === null) {
    return `<p class="confirmacion" role="status">Se reescribe en ${escapar(cuantos)}.</p>`;
  }

  return `
    <p class="confirmacion importante" role="status">
      <strong>Se van a unir.</strong> Ya existe
      <strong>${escapar(efecto.seUneCon.texto)}</strong> con
      ${escapar(enCuantos(efecto.seUneCon.cuantos))}: al renombrar,
      los ${escapar(String(efecto.quedan))} quedan en un solo grupo y sus totales
      pasan a sumar juntos.
    </p>
  `;
}

/** El paso aparte para renombrar. */
function dibujarRenombrar(vista) {
  const { campo, clave } = vista.etiquetaEditada;
  const etiqueta = etiquetasUsadas(vista.estado.movimientos, campo).find((e) => e.clave === clave);
  if (etiqueta === undefined) return '';

  const escrito = vista.borradorEtiqueta ?? etiqueta.texto;
  const efecto = efectoDeRenombrar(vista.estado.movimientos, campo, clave, escrito);

  return `
    <form class="tarjeta" data-formulario="etiqueta">
      <h2>Renombrar «${escapar(etiqueta.texto)}»</h2>
      <p class="suave">Está en ${escapar(enCuantos(etiqueta.cuantos))}.</p>

      <label class="campo">
        <span>Nuevo nombre</span>
        <input name="texto" type="text" autocomplete="off"
               data-accion-entrada="renombrar" value="${escapar(escrito)}">
      </label>

      <div data-aviso-etiqueta>${dibujarAvisoRenombrar(efecto)}</div>

      <input type="hidden" name="campo" value="${escapar(campo)}">
      <input type="hidden" name="clave" value="${escapar(clave)}">
      <button type="submit" class="principal" data-accion="guardar-etiqueta">Renombrar</button>
      <button type="button" class="secundario" data-accion="cancelar-etiqueta">Ahora no</button>
    </form>
  `;
}

/**
 * La confirmación antes de borrar.
 *
 * Dice **con todas las letras** que los movimientos no se tocan. Es la frase más
 * importante de la pantalla: sin ella, "borrar Luz" se lee como "borrar los
 * gastos de luz", y esa confusión no se puede deshacer.
 */
function dibujarBorrarEtiqueta(vista) {
  const { campo, clave } = vista.etiquetaBorrando;
  const etiqueta = etiquetasUsadas(vista.estado.movimientos, campo).find((e) => e.clave === clave);
  if (etiqueta === undefined) return '';

  return `
    <section class="tarjeta aviso importante" role="alert">
      <h2>¿Sacar «${escapar(etiqueta.texto)}»?</h2>
      <p>Se le saca ${campo === 'comentario' ? 'la etiqueta' : 'el detalle'} a
      ${escapar(enCuantos(etiqueta.cuantos))}.</p>
      <p><strong>Los movimientos no se borran</strong>: siguen ahí, con su fecha,
      su rubro y su importe. Lo único que se va es la etiqueta.</p>
      ${campo === 'comentario' ? `<p class="suave">Van a dejar de contarse en
        cualquier total agrupado por esa etiqueta.</p>` : ''}
      <button type="button" class="principal" data-accion="confirmar-borrar-etiqueta"
              data-campo="${escapar(campo)}" data-clave="${escapar(clave)}">
        Sí, sacarla
      </button>
      <button type="button" class="secundario" data-accion="cancelar-borrar-etiqueta">No</button>
    </section>
  `;
}

function dibujarSeccion(estado, campo) {
  const etiquetas = etiquetasUsadas(estado.movimientos, campo);
  if (etiquetas.length === 0) {
    return `
      <section class="tarjeta">
        <h2>${TITULOS[campo]}</h2>
        <p class="suave">Todavía no escribiste ninguno.</p>
      </section>
    `;
  }

  return `
    <section class="tarjeta">
      <h2>${TITULOS[campo]}</h2>
      <p class="suave nota">${EXPLICACIONES[campo]}</p>
      <ul class="rubros">${etiquetas.map((e) => dibujarEtiqueta(campo, e)).join('')}</ul>
    </section>
  `;
}

function dibujarEtiquetas(vista) {
  const estado = vista.estado;

  // Un paso a la vez: renombrar y borrar no se muestran juntos, y ninguno de los
  // dos convive con la lista de acciones. Dos cosas delicadas a la vez son dos
  // decisiones simultáneas.
  if (vista.etiquetaBorrando) return dibujarBorrarEtiqueta(vista);
  if (vista.etiquetaEditada) return dibujarRenombrar(vista);

  const confirmacion = vista.avisoEtiqueta
    ? `<p class="confirmacion" role="status">${escapar(vista.avisoEtiqueta)}</p>`
    : '';

  return `
    ${dibujarError(vista.error)}
    ${confirmacion}
    ${dibujarSeccion(estado, 'comentario')}
    ${dibujarSeccion(estado, 'detalle')}
  `;
}


// ── Los cambios de estado ────────────────────────────────────────────────────

function intentarEtiqueta(hacer) {
  try {
    return { estado: hacer() };
  } catch (error) {
    return { error: error.message };
  }
}

function intentarRenombrar(estado, campo, clave, texto) {
  return intentarEtiqueta(() => ({
    ...estado,
    movimientos: renombrarEtiqueta(estado.movimientos, campo, clave, texto),
  }));
}

function intentarBorrarEtiqueta(estado, campo, clave) {
  return intentarEtiqueta(() => ({
    ...estado,
    movimientos: borrarEtiqueta(estado.movimientos, campo, clave),
  }));
}

// ── src/ui/pantallas/viajes.js ──────────────────────────────────
// Gasto por viaje — CU-11, T-023. Reemplaza el bloque `GASTOS POR VIAJE` de la
// planilla, que es de donde salió el nombre "Viaje Coruña".
//
// ── Lo que esta pantalla no hace, y por qué ─────────────────────────────────
//
// **No deduce la duración de los movimientos.** Se escriben **la fecha de inicio
// y la de fin**, y los días salen de restarlas (T-941). Un viaje puede empezar
// antes del primer gasto registrado o terminar después del último, y deducirlo
// daría un gasto por día más alto de lo real sin avisar. Mientras las fechas no
// estén, **no hay gasto por día**: no se muestra un número aproximado, se
// muestra el pedido de escribirlas.
//
// **No tiene una lista de viajes propia.** Un viaje es una etiqueta con al menos
// un gasto del rubro `viajes` (ver `core/viajes.js`). Se escribe a mano al
// cargar, y se corrige en Datos → Etiquetas y detalles, donde renombrar une dos
// escrituras del mismo viaje.
//
// Igual que el resto de la interfaz (ADR-022), las funciones de dibujo son puras.





/** Un rango de fechas, o una sola si son la misma. */
function dibujarRango(desde, hasta) {
  if (desde === hasta) return formatearFecha(desde);
  return `${formatearFecha(desde)} → ${formatearFecha(hasta)}`;
}

/** Entre qué fechas se GASTÓ. Es contexto para escribir las del viaje, no el dato. */
function dibujarFechas(viaje) {
  return dibujarRango(viaje.desde, viaje.hasta);
}

/**
 * Un viaje.
 *
 * **El número grande es el total**, que es lo que la planilla contestaba. El
 * gasto por día va debajo y **solo si los días están escritos**: sin ellos, en
 * su lugar va el botón para escribirlos, que es la acción que falta.
 */
function dibujarViaje(viaje, base) {
  const cuantos = viaje.cuantos === 1 ? '1 gasto' : `${viaje.cuantos} gastos`;

  const porDia = viaje.fechas === null
    ? `<button type="button" class="secundario chico" data-accion="fechas-viaje"
               data-clave="${escapar(viaje.clave)}">¿Cuándo fue?</button>`
    : `<span><strong>${escapar(formatearEuros(viaje.porDia, base))}</strong> por día
         en ${viaje.dias} ${viaje.dias === 1 ? 'día' : 'días'}
         <button type="button" class="enlace" data-accion="fechas-viaje"
                 data-clave="${escapar(viaje.clave)}">${escapar(dibujarRango(viaje.fechas.desde, viaje.fechas.hasta))}</button></span>`;

  const aviso = viaje.incompleto
    ? `<p class="suave">A este viaje le falta un tipo de cambio: el total está incompleto.</p>`
    : '';

  return `
    <li class="fila-rubro">
      <button type="button" class="fila-toque" data-accion="ver-comentario"
              data-comentario="${escapar(viaje.comentario)}">
        <span class="rubro-cabeza">
          <span class="nombre">${escapar(viaje.comentario)}</span>
          <span class="importe">${escapar(formatearEuros(viaje.total, base))}</span>
        </span>
      </button>
      <div class="rubro-pie suave">
        <span>${escapar(cuantos)} · ${escapar(dibujarFechas(viaje))}</span>
      </div>
      <div class="rubro-pie suave">${porDia}</div>
      ${aviso}
    </li>
  `;
}

/**
 * El formulario para escribir cuándo fue el viaje.
 *
 * **Los días no se piden: se calculan y se muestran mientras se escribe.** Es la
 * diferencia con la versión anterior, que pedía el número de días: una fecha es
 * algo que uno recuerda —"salí el 3 y volví el 12"— y un número de días es una
 * cuenta que hay que hacer, y hacerla mal es fácil.
 */
function dibujarFechasDeViaje(vista) {
  const clave = vista.viajeEditado;
  const viaje = viajes(vista.estado).find((v) => v.clave === clave);
  if (viaje === undefined) return '';

  const borrador = vista.borradorFechas ?? {};
  const desde = borrador.desde ?? viaje.fechas?.desde ?? '';
  const hasta = borrador.hasta ?? viaje.fechas?.hasta ?? '';

  return `
    <form class="tarjeta" data-formulario="fechas-viaje">
      <h2>¿Cuándo fue ${escapar(viaje.comentario)}?</h2>
      <p class="suave">Se gastó entre el ${escapar(dibujarFechas(viaje))}, pero el
      viaje puede haber sido más largo: podés haber salido antes del primer gasto
      que anotaste, o vuelto después del último. Por eso se escriben las fechas y
      no se deducen de los gastos.</p>

      <label class="campo">
        <span>Salí el</span>
        <input name="desde" type="date" data-accion-entrada="fechas-viaje"
               value="${escapar(desde)}">
      </label>

      <label class="campo">
        <span>Volví el</span>
        <input name="hasta" type="date" data-accion-entrada="fechas-viaje"
               value="${escapar(hasta)}">
      </label>

      <p class="confirmacion" data-duracion role="status">${dibujarDuracion(desde, hasta)}</p>

      ${dibujarError(vista.error)}

      <input type="hidden" name="clave" value="${escapar(clave)}">
      <button type="submit" class="principal" data-accion="guardar-fechas-viaje">Guardar</button>
      <button type="button" class="secundario" data-accion="borrar-fechas-viaje"
              data-clave="${escapar(clave)}">No me acuerdo cuándo fue</button>
      <button type="button" class="secundario" data-accion="cancelar-fechas-viaje">Ahora no</button>
    </form>
  `;
}

/**
 * Cuántos días dan las dos fechas escritas, para mostrarlo mientras se escribe.
 *
 * Es lo que convierte dos fechas en el dato que interesa sin que el usuario
 * tenga que confiar: ve la cuenta hecha antes de guardar.
 */
function dibujarDuracion(desde, hasta) {
  if (!desde || !hasta) return 'Escribí las dos fechas y te digo cuántos días son.';
  if (hasta < desde) return 'El viaje no puede terminar antes de empezar.';

  const dias = duracionEnDias(desde, hasta);
  return `Son ${dias} ${dias === 1 ? 'día' : 'días'}, contando el primero y el último.`;
}

function dibujarViajes(vista) {
  const base = monedaBaseDe(vista.estado);
  if (vista.viajeEditado) return dibujarFechasDeViaje(vista);

  const lista = viajes(vista.estado);
  if (lista.length === 0) {
    return `
      <section class="tarjeta">
        <h2>Gasto por viaje</h2>
        <p class="suave">Todavía no hay ninguno. Un viaje es una etiqueta con al
        menos un gasto del rubro <strong>viajes</strong>: cargá el pasaje o el
        hotel con el rubro «viajes» y el nombre del viaje en la etiqueta, y todo
        lo que lleve esa etiqueta —comidas, transporte, supermercado— se suma
        acá.</p>
      </section>
    `;
  }

  return `
    ${dibujarError(vista.error)}
    <section class="tarjeta">
      <h2>Gasto por viaje</h2>
      <p class="suave nota">El total incluye <strong>todos</strong> los rubros de
      ese viaje, no solo los del rubro «viajes». Tocá uno para ver sus gastos.</p>
      <ul class="rubros">${lista.map((v) => dibujarViaje(v, base)).join('')}</ul>
    </section>
  `;
}


// ── Los cambios de estado ────────────────────────────────────────────────────

/**
 * Toma lo escrito y lo guarda, o devuelve el error para mostrarlo.
 *
 * **La regla de qué es un número de días válido está en `core/viajes.js` y no
 * acá.** La primera versión la repetía —una expresión regular de dígitos— y una
 * mutación la delató: sacarla no ponía ni un test en rojo, porque el núcleo ya
 * rechazaba todo lo que ella rechazaba. Dos copias de la misma regla son dos
 * reglas que tarde o temprano dicen cosas distintas, y la que se queda atrás es
 * siempre la de más afuera.
 *
 * `Number('')` da 0 y `Number('7 días')` da NaN: los dos caen en el "entero de 1
 * para arriba" del núcleo.
 */
function intentarFijarFechas(estado, clave, desde, hasta) {
  try {
    return { estado: fijarFechasDeViaje(estado, clave, desde, hasta) };
  } catch (error) {
    return { error: error.message };
  }
}

function intentarBorrarFechas(estado, clave) {
  try {
    return { estado: fijarFechasDeViaje(estado, clave, null, null) };
  } catch (error) {
    return { error: error.message };
  }
}

// ── src/ui/pantallas/base.js ────────────────────────────────────
// Elegir la moneda base — T-050, CU-20.
//
// ── Por qué esta pantalla pregunta dos veces ─────────────────────────────────
//
// Cambiar la base **reexpresa todos los tipos de cambio guardados** y, en los
// meses donde no hay cotización de la moneda nueva, los pierde. No borra ningún
// movimiento —los montos siguen en su moneda— pero sí puede dejar meses sin
// forma de convertirse hasta que el usuario cargue las cotizaciones que faltan.
//
// Por eso el flujo es: elegir → **ver qué va a pasar, con números** → confirmar.
// Un desplegable que cambia todo al soltarlo sería la forma más rápida de que
// alguien pierda datos por curiosear.
//
// Igual que el resto de la interfaz (ADR-022), son funciones puras.




/** Lo que va a pasar, con números, antes de tocar nada. */
function dibujarEfectoDeBase(efecto) {
  if (!efecto || efecto.sinCambios) return '';

  const perdidos = efecto.perdidos ?? [];
  const meses = [...new Set(perdidos.map((p) => p.mes))].sort();
  const faltantes = efecto.faltantes ?? [];
  const monedasEnFalta = [...new Set(faltantes.flatMap((f) => f.monedas))].sort();

  return `
    <div class="aviso importante" role="alert">
      <h2>Pasar los totales a ${escapar(efecto.destino)}</h2>

      <p>Tus movimientos <strong>no se tocan</strong>: cada uno sigue guardado en
      su moneda y con su monto. Lo que cambia es en qué moneda se suman.</p>

      ${efecto.reexpresados > 0 ? `
      <p class="suave">Se van a recalcular
      <strong>${efecto.reexpresados}</strong> tipos de cambio para expresarlos en
      ${escapar(efecto.destino)}. ${escapar(efecto.actual)} pasa a ser una moneda
      más y va a tener su propia cotización.</p>` : ''}

      ${perdidos.length > 0 ? `
      <p class="suave">${perdidos.length === 1 ? 'Se pierde' : 'Se pierden'}
      <strong>${perdidos.length}</strong> ${perdidos.length === 1 ? 'tipo de cambio guardado' : 'tipos de cambio guardados'}
      (${escapar(meses.map(formatearMes).join(', '))}): en ${meses.length === 1 ? 'ese mes' : 'esos meses'}
      no hay cotización de ${escapar(efecto.destino)} para poder reexpresarlo${perdidos.length === 1 ? '' : 's'}.</p>` : ''}

      ${faltantes.length > 0 ? `
      <p><strong>Ojo:</strong> te va a faltar la cotización de
      ${escapar(monedasEnFalta.join(', '))} en
      ${faltantes.length === 1 ? 'un mes' : `${faltantes.length} meses`}
      —${escapar(faltantes.map((f) => formatearMes(f.mes)).join(', '))}—,
      así que <strong>${efecto.movimientosSinConvertir}</strong>
      ${efecto.movimientosSinConvertir === 1 ? 'movimiento no va' : 'movimientos no van'}
      a poder contarse en los totales hasta que la cargues.</p>

      <p class="suave">Los movimientos siguen ahí: lo que falta es el tipo de
      cambio. Tenés que cargarlo <strong>hacia atrás, mes por mes</strong>, en
      Tipos de cambio.
      ${efecto.movimientosSinConvertirAhora > 0
        ? `(${efecto.movimientosSinConvertirAhora} ya no se ${efecto.movimientosSinConvertirAhora === 1 ? 'puede' : 'pueden'} convertir hoy, antes de este cambio.)`
        : ''}</p>` : ''}

      <div class="botones">
        <button type="button" class="peligro" data-accion="confirmar-base" data-moneda="${escapar(efecto.destino)}">
          Sí, usar ${escapar(efecto.destino)}
        </button>
        <button type="button" class="secundario" data-accion="cancelar-base">Dejar como está</button>
      </div>
    </div>
  `;
}

function dibujarMonedaBase(vista) {
  const estado = vista.estado ?? {};
  const actual = monedaBaseDe(estado);
  const efecto = vista.baseElegida ? efectoDeCambiarBase(estado, vista.baseElegida) : null;

  const opciones = monedasVisibles(estado.monedas ?? []).map((m) => `
    <li class="fila-rubro">
      <span class="rubro-cabeza">
        <span class="nombre">${escapar(m.codigo)} — ${escapar(m.nombre)}</span>
        ${m.codigo === actual
          ? '<span class="suave">es la base</span>'
          : `<button type="button" class="secundario chico" data-accion="elegir-base" data-moneda="${escapar(m.codigo)}">Usar esta</button>`}
      </span>
    </li>`).join('');

  return `
    ${vista.error ? `<p class="error-carga" role="alert">${escapar(vista.error)}</p>` : ''}
    ${vista.avisoBase ? `<p class="confirmacion" role="status">${escapar(vista.avisoBase)}</p>` : ''}
    ${dibujarEfectoDeBase(efecto)}

    <section class="tarjeta">
      <h2>Moneda base</h2>
      <p class="suave nota">Es la moneda en la que se muestran <strong>todos los
      totales</strong>: el resumen del mes, la evolución, los viajes. Es también
      la única que no lleva tipo de cambio, porque vale 1 contra sí misma.</p>
      <p class="suave">Ahora es <strong>${escapar(actual)}</strong>.</p>

      <ul class="rubros">${opciones}</ul>

      <p class="suave nota">Los ahorros conjuntos no usan la moneda base: ahí cada
      moneda se muestra por separado y nunca se convierte.</p>
    </section>
  `;
}

// ── src/ui/pantallas/rubros.js ──────────────────────────────────
// La pantalla de rubros — T-048, CU-19.
//
// ── Lo que esta pantalla tiene que dejar clarísimo ───────────────────────────
//
// Que **acá se mueve plata**. Renombrar un rubro reescribe el rubro de todos sus
// movimientos; unir dos los pasa de uno al otro. No es editar una lista: es
// tocar el historial. Por eso cada rubro muestra **cuántos movimientos usa** y
// cada acción dice qué va a pasar antes de hacerla.
//
// El tope de ocho tampoco es un capricho y se explica donde se choca con él: la
// paleta tiene ocho colores que pasaron el validador de daltonismo, y un noveno
// tono generado sería indistinguible de alguno (ADR-029).
//
// Igual que el resto de la interfaz (ADR-022), son funciones puras.





const NOMBRE_DEL_TIPO = { [TIPO_GASTO]: 'gasto', [TIPO_INGRESO]: 'ingreso' };

/** Cuántos movimientos usa un rubro, escrito para leer. */
function dibujarUso(cuantos) {
  if (cuantos === 0) return 'sin movimientos';
  return cuantos === 1 ? '1 movimiento' : `${cuantos} movimientos`;
}

/** Una fila de rubro, con su color, su uso y sus acciones. */
function dibujarRubro(rubro, cuantos, tipo, catalogo, vista = {}) {
  const editando = vista.rubroEditado?.tipo === tipo && vista.rubroEditado?.rubro === rubro;
  const uniendo = vista.rubroUnido?.tipo === tipo && vista.rubroUnido?.rubro === rubro;
  const otros = catalogo.filter((r) => r !== rubro);

  return `
    <li class="fila-rubro">
      <span class="rubro-cabeza">
        <span class="nombre">
          <span class="punto-rubro ${claseDeRubro(tipo, rubro, vista.estado?.rubros)}" aria-hidden="true"></span>
          ${escapar(formatearRubro(rubro))}
        </span>
        <span class="suave">${escapar(dibujarUso(cuantos))}</span>
      </span>

      ${editando ? `
      <form class="formulario-linea" data-formulario="rubro" novalidate>
        <input type="hidden" name="tipo" value="${escapar(tipo)}">
        <input type="hidden" name="viejo" value="${escapar(rubro)}">
        <input name="nombre" type="text" autocomplete="off" value="${escapar(formatearRubro(rubro))}"
               aria-label="Nombre del rubro">
        <p class="suave nota">Si le ponés el nombre de otro rubro que ya existe,
        los dos se unen en uno.</p>
        <div class="botones">
          <button type="submit" class="principal chico" data-accion="guardar-rubro">Guardar</button>
          <button type="button" class="secundario chico" data-accion="cancelar-rubro">Cancelar</button>
        </div>
      </form>` : ''}

      ${uniendo ? `
      <form class="formulario-linea" data-formulario="unir-rubro" novalidate>
        <input type="hidden" name="tipo" value="${escapar(tipo)}">
        <input type="hidden" name="desde" value="${escapar(rubro)}">
        <label class="campo">
          <span>Pasar sus ${escapar(dibujarUso(cuantos))} a…</span>
          <select name="hasta">${otros.map((r) => `
            <option value="${escapar(r)}">${escapar(formatearRubro(r))}</option>`).join('')}</select>
        </label>
        <p class="suave nota"><strong>${escapar(formatearRubro(rubro))}</strong> deja de
        existir y sus movimientos pasan al otro rubro. Los movimientos no se borran.</p>

// Cargar, corregir y borrar un movimiento de ahorro — T-045, CU-14.
//
// ── Por qué es un formulario aparte del de gastos ────────────────────────────
//
// Porque son otra cosa, y el usuario lo dijo antes que yo: "no son gastos e
// ingresos normales, son una cosa aparte". Un ahorro no tiene rubro y sí tiene
// persona; no entra en el saldo del mes ni en la evolución. Meter una tercera
// opción en el formulario que se usa todos los días haría más lento el 99 % de
// las cargas para servir al 1 %.
//
// ── Y por qué, aun así, funciona EXACTAMENTE igual ───────────────────────────
//
// Mismo borrador, misma función pura que intenta guardar y devuelve estado
// nuevo, mismos avisos, mismo "deshacer" al borrar. Lo que cambia son los
// campos; lo que no cambia es cómo se comporta. Que dos pantallas parecidas
// tengan mecánicas distintas es lo que obliga a aprender la app dos veces.
//
// Igual que el resto de la interfaz (ADR-022), son funciones puras: reciben
// estado y devuelven texto o estado nuevo. Quien guarda es `ui/app.js`.






/** El formulario vacío. */
function borradorDeAhorro({ estado, fecha, persona } = {}) {
  return {
    fecha: fecha ?? hoy(),
    tipo: AHORRO_ENTRA,
    // La persona y la moneda se mantienen entre cargas: quien anota los
    // ahorros de un mes suele cargar varios seguidos del mismo lado.
    persona: persona ?? PERSONAS[0],
    monto: '',
    moneda: estado?.preferencias?.moneda_predeterminada ?? 'EUR',
    comentario: '',
    detalle: '',
  };
}

/**
 * El formulario cargado con un ahorro que ya existe, para corregirlo.
 *
 * El monto vuelve a texto con la coma decimal del español: si volviera como
 * `12.5`, el usuario vería su movimiento escrito de una forma en la que él
 * nunca lo escribiría.
 */
function borradorDesdeAhorro(ahorro, decimales) {
  return {
    id: ahorro.id,
    fecha: ahorro.fecha,
    tipo: ahorro.tipo,
    persona: ahorro.persona,
    monto: formatearNumero(ahorro.monto, decimales),
    moneda: ahorro.moneda,
    comentario: ahorro.comentario,
    detalle: ahorro.detalle,
  };
}

/**
 * Intenta guardar. Devuelve `{ estado, borrador, aviso, error }` — nunca tira.
 *
 * **No pide tipo de cambio**, a diferencia de los gastos (RN-04): los ahorros no
 * se convierten a euros nunca, así que un ahorro en pesos no queda fuera de
 * ningún total por no tener cambio. Es la misma regla de siempre vista desde el
 * otro lado — pedir un dato que no se va a usar es pedirlo porque sí.
 */
function intentarGuardarAhorro(estado, borrador) {
  let decimales;
  try {
    decimales = decimalesDe(estado.monedas, borrador.moneda);
  } catch (error) {
    return { estado, borrador, error: error.message };
  }

  const anteriores = estado.ahorros ?? [];
  const original = borrador.id ? anteriores.find((a) => a.id === borrador.id) : null;

  let ahorro;
  try {
    // Al corregir se conservan el identificador y el día de carga: es el mismo
    // movimiento con otros datos, no uno nuevo.
    ahorro = crearAhorro(borrador, { decimales, id: original?.id, creado: original?.creado });
  } catch (error) {
    // El mensaje viene del modelo, ya escrito para una persona.
    return { estado, borrador, error: error.message };
  }

  const posicion = borrador.id ? anteriores.findIndex((a) => a.id === borrador.id) : -1;
  const corrigiendo = posicion !== -1;

  const nuevoEstado = {
    ...estado,
    ahorros: corrigiendo
      ? anteriores.map((a, i) => (i === posicion ? ahorro : a))
      : [...anteriores, ahorro],
    preferencias: { ...estado.preferencias, moneda_predeterminada: ahorro.moneda },
  };

  return {
    estado: nuevoEstado,
    corrigiendo,
    // El formulario se vacía pero conserva la fecha y la persona: cargar los
    // ahorros de un mes es cargar varios seguidos parecidos.
    borrador: borradorDeAhorro({ estado: nuevoEstado, fecha: ahorro.fecha, persona: ahorro.persona }),
    aviso: { ahorro, decimales, corrigiendo },
  };
}

/** Saca un ahorro, y devuelve lo necesario para poder deshacerlo. */
function borrarAhorro(estado, id) {
  const anteriores = estado.ahorros ?? [];
  const posicion = anteriores.findIndex((a) => a.id === id);
  if (posicion === -1) return { estado, borrado: null };

  return {
    estado: { ...estado, ahorros: anteriores.filter((a) => a.id !== id) },
    borrado: { ahorro: anteriores[posicion], posicion },
  };
}

/** Vuelve a poner un ahorro borrado en su lugar exacto. */
function restaurarAhorro(estado, borrado) {
  if (!borrado) return estado;

  const ahorros = [...(estado.ahorros ?? [])];
  ahorros.splice(Math.min(borrado.posicion, ahorros.length), 0, borrado.ahorro);
  return { ...estado, ahorros };
}

/** Busca un ahorro por su identificador. */
function buscarAhorro(estado, id) {
  return (estado.ahorros ?? []).find((a) => a.id === id) ?? null;
}

/** Las etiquetas de ahorro ya usadas, para ofrecerlas al escribir (RN-03). */

  const vistas = new Map();
