    <button type="button" class="secundario" data-accion="cancelar-importar">
      Dejar como está
    </button>
  `;
}

/**
 * La planilla de Excel — T-906.
 *
 * Es para **mirar**, no para restaurar, y la pantalla lo dice con todas las
 * letras. Un `.xlsx` no lleva los identificadores de los movimientos, ni los
 * tipos de cambio, ni tus monedas: se puede abrir y leer, pero no se puede
 * volver a cargar en la app sin perder cosas. Por eso **descargarla no cuenta
 * como respaldo** y no apaga el aviso de "hace tantos días que no respaldás".
 *
 * Dejar que lo apagara sería lo peor que puede hacer esta pantalla: el usuario
 * se quedaría tranquilo con un archivo que no lo puede salvar.
 */
function dibujarPlanilla(vista) {
  const base = monedaBaseDe(vista.estado);
  const cuantos = (vista.estado.movimientos ?? []).length;
  const planilla = cuantos === 0 ? null : crearPlanilla(vista.estado);
  const csv = cuantos === 0 ? null : prepararCsv(vista.estado);

  return `
    <section class="tarjeta">
      <h2>Planilla de Excel</h2>

      <p class="suave">Tus gastos con la forma de tu planilla de siempre: un
      bloque por mes, los mismos encabezados, el acumulado y el total por rubro.
      La diferencia es que <strong>los totales están calculados sobre todas las
      filas</strong>, no con fórmulas de rango escritas a mano.</p>

      ${planilla && planilla.sinConvertir > 0 ? `
      <p class="aviso-respaldo pendiente-respaldo" role="status">
        ${planilla.sinConvertir === 1
          ? `Hay 1 movimiento que no se puede pasar a ${escapar(base)} porque falta su tipo de cambio.`
          : `Hay ${planilla.sinConvertir} movimientos que no se pueden pasar a ${escapar(base)} porque falta su tipo de cambio.`}
        Entran igual en la planilla, con el monto vacío y el motivo escrito al lado.
      </p>` : ''}

      ${vista.errorPlanilla ? `<p class="error-carga" role="alert">${escapar(vista.errorPlanilla)}</p>` : ''}
      ${vista.avisoPlanilla ? `<p class="confirmacion" role="status">${escapar(vista.avisoPlanilla)}</p>` : ''}

      ${ofreceCompartir(vista) ? `
      <button type="button" class="secundario" data-accion="compartir-planilla"${cuantos === 0 ? ' disabled' : ''}>
        Compartir la planilla
      </button>` : ''}

      <button type="button" class="secundario" data-accion="exportar-planilla"${cuantos === 0 ? ' disabled' : ''}>
        Descargar ${planilla ? escapar(planilla.nombre) : 'la planilla'}
      </button>

      <p class="suave"><strong>Esto no es un respaldo.</strong> La planilla se
      puede leer pero no se puede volver a cargar en la app: no lleva los tipos
      de cambio ni tus monedas. Para eso está el archivo de arriba.</p>

      <h3>Y en CSV, para hacer cuentas en otro lado</h3>
      <p class="suave">Una fila por movimiento, con todas las columnas: el monto
      original con su moneda, <strong>el tipo de cambio que se aplicó</strong> y el
      importe en ${escapar(base)}. La planilla lleva solo la moneda base porque se
      mira; el CSV lleva
      las dos cosas porque es para procesar, y ahí perder el dato original duele.</p>

      <button type="button" class="secundario" data-accion="exportar-csv"${cuantos === 0 ? ' disabled' : ''}>
        Descargar ${csv ? escapar(csv.nombre) : 'el CSV'}
      </button>
    </section>
  `;
}

/**
 * Traer la planilla de Excel — T-032, CU-13.
 *
 * Es la operación que se corre **una sola vez**, sobre todo el historial. Por
 * eso la pantalla insiste en dos cosas antes de dejar tocar nada: **qué se
 * importó** y —sobre todo— **qué no**.
 */
function dibujarPlanillaVieja(vista) {
  const previa = vista.planilla;

  return `
    <section class="tarjeta">
      <h2>Traer tu planilla de Excel</h2>

      ${previa ? '' : `
      <p class="suave">Para cargar de una vez todo lo que venías anotando. Elegí
      tu archivo <code>.xlsx</code>: la app lo lee sin que tengas que convertirlo
      a nada, y <strong>no lo modifica</strong>.</p>

      <label class="campo">
        <span>Elegir la planilla</span>
        <input type="file" name="planilla" accept=".xlsx" data-accion="elegir-planilla">
      </label>`}

      ${vista.errorPlanillaVieja ? `<p class="error-carga" role="alert">${escapar(vista.errorPlanillaVieja)}</p>` : ''}
      ${vista.avisoPlanillaVieja ? `<p class="confirmacion" role="status">${escapar(vista.avisoPlanillaVieja)}</p>` : ''}
      ${previa ? dibujarPreviaDePlanilla(previa, vista.estado?.monedas ?? [], monedaBaseDe(vista.estado)) : ''}
    </section>
  `;
}

/** Lo que se leyó, antes de tocar nada. */
/**
 * Lo que la planilla trae de la hoja de ahorros conjuntos — T-042.
 *
 * Va aparte del bloque de movimientos porque **son otra cosa**: no entran en el
 * saldo del mes ni se reparten por rubro. Y se cuenta igual que lo demás: lo que
 * entra, lo que ya estaba y lo que no se pudo traer, con su número de fila.
 */
function dibujarPreviaDeAhorros(planilla) {
  const ahorros = planilla.ahorros ?? [];
  const problemas = planilla.problemasDeAhorros ?? [];
  if (ahorros.length === 0 && problemas.length === 0) return '';

  const yaEstan = planilla.ahorrosQueEstan ?? 0;
  const nuevos = ahorros.length - yaEstan;

  return `
    <p class="suave nota">La planilla también tiene la hoja de <strong>ahorros
    conjuntos</strong>: se leyeron
    ${ahorros.length === 1 ? '1 movimiento' : `${ahorros.length} movimientos`} de
    ahorro${yaEstan > 0 ? `, de los que ${yaEstan === 1 ? '1 ya está' : `${yaEstan} ya están`}` : ''}.
    ${nuevos > 0 ? `Entra${nuevos === 1 ? '' : 'n'} con el mismo botón.` : ''}</p>
    ${dibujarComprobacionesDeAhorros(planilla.comprobacionesDeAhorros ?? [])}
    ${dibujarProblemas(problemas)}
  `;
}

/** Lo que suma la app contra el cuadro de totales de la hoja. */
function dibujarComprobacionesDeAhorros(comprobaciones) {
  if (comprobaciones.length === 0) return '';

  const difieren = comprobaciones.filter((c) => !c.cuadra);
  if (difieren.length === 0) {
    return `<p class="suave">Los totales por moneda coinciden con los que
      calculaba la planilla.</p>`;
  }

  // Una diferencia no dice necesariamente que la app se equivocó: la hoja suma
  // tres rangos distintos ($E4:$E89, $E4:$E93, $E4:$E97). Pero dice que alguno
  // de los dos está mal, y esta es la última oportunidad de mirarlo.
  return `
    <p class="suave">En ${difieren.length === 1 ? 'una moneda' : `${difieren.length} monedas`}
    el total no coincide con el de la planilla. No significa que la app esté mal
    —la hoja suma rangos de filas distintos en cada cuadro— pero conviene
    mirarlo antes de archivarla.</p>
    <ul class="filas-con-problema">${difieren.map((c) => `<li>
      <strong>${escapar(c.moneda)}</strong>: la app suma
      ${escapar(formatearNumero(c.nuestro, DECIMALES_EURO))} y la planilla decía
      ${escapar(formatearNumero(c.planilla, DECIMALES_EURO))}.
    </li>`).join('')}</ul>
  `;
}

/**
 * El botón de traer, que tiene que nombrar lo que de verdad va a entrar.
 *
 * Decir "traer los 43 movimientos" cuando además entran 11 ahorros hace que el
 * usuario no se entere de la mitad de lo que acaba de hacer.
 */
function dibujarBotonDeTraer(movimientos, ahorros) {
  const partes = [];
  if (movimientos > 0) partes.push(movimientos === 1 ? '1 movimiento' : `${movimientos} movimientos`);
  if (ahorros > 0) partes.push(ahorros === 1 ? '1 ahorro' : `${ahorros} ahorros`);

  const nada = partes.length === 0;
  return `
    <button type="button" class="principal" data-accion="importar-planilla"${nada ? ' disabled' : ''}>
      ${nada ? 'No hay nada nuevo que traer' : `Traer ${partes.join(' y ')}`}
    </button>
  `;
}

/**
 * Cuántos se muestran de la lista de lo que va a entrar.
 *
 * En la primera importación son cientos y listarlos todos haría una pantalla
 * inmanejable. En la segunda son dos o tres, que es cuando la lista importa de
 * verdad — y ahí entran todos.
 */
const NUEVOS_QUE_SE_MUESTRAN = 25;

/**
 * Qué es cada cosa que va a entrar — T-044.
 *
 * Lo pidió el usuario: la app le decía "voy a traer 1 movimiento" y no tenía
 * forma de saber cuál. Pasa al importar por segunda vez, que es cuando la
 * diferencia es de uno o dos y **el que aparece suele ser uno que él había
 * borrado a mano**. Sin la lista hay que aceptar a ciegas y salir a buscarlo
 * después.
 */
function dibujarQueEntra(planilla, { monedas = [], tope = NUEVOS_QUE_SE_MUESTRAN } = {}) {
  const nuevos = planilla.nuevos ?? [];
  const ahorros = planilla.ahorrosNuevos ?? [];
  const cuantos = nuevos.length + ahorros.length;
  if (cuantos === 0) return '';

  const lineas = [
    ...nuevos.map((m) => ({
      fecha: m.fecha,
      que: formatearRubro(m.rubro),
      importe: `${m.tipo === TIPO_GASTO ? '−' : '+'}${formatearEnSuMoneda(m.monto, m.moneda, monedas)}`,
      pie: [m.comentario, m.detalle].filter((t) => t).join(' · '),
    })),
    ...ahorros.map((a) => ({
      fecha: a.fecha,
      que: `Ahorro · ${a.persona}`,
      importe: `${a.tipo === 'G' ? '−' : '+'}${formatearEnSuMoneda(a.monto, a.moneda, monedas)}`,
      pie: [a.comentario, a.detalle].filter((t) => t).join(' · '),
    })),
  ].sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0));

  const muestra = lineas.slice(0, tope);
  const restan = lineas.length - muestra.length;

  return `
    <details class="que-entra"${cuantos <= tope ? ' open' : ''}>
      <summary>Ver ${cuantos === 1 ? 'el que va a entrar' : `los ${cuantos} que van a entrar`}</summary>
      <ul class="rubros">${muestra.map((l) => `
        <li class="fila-rubro">
          <span class="rubro-cabeza">
            <span class="nombre">${escapar(l.que)}</span>
            <span class="importe">${escapar(l.importe)}</span>
          </span>
          <div class="rubro-pie suave">
            <span>${escapar(formatearFecha(l.fecha))}</span>
            <span>${escapar(l.pie)}</span>
          </div>
        </li>`).join('')}</ul>
      ${restan > 0 ? `<p class="suave nota">Y ${restan} más. Se ven todos en
        Movimientos después de traerlos.</p>` : ''}
    </details>
  `;
}

/**
 * Los rubros que la planilla trae y la app todavía no tiene — T-049.
 *
 * Se muestran **antes** de importar. Agregarle rubros al catálogo de alguien sin
 * decírselo es cambiarle la app por la ventana; y además, un rubro que aparece
 * por un error de tipeo en la planilla se ve acá y se arregla antes, no después.
 */
function dibujarRubrosNuevos(planilla) {
  const nuevos = planilla.rubrosNuevos ?? [];
  if (nuevos.length === 0) return '';

  const nombre = (n) => `${formatearRubro(n.rubro)} (${n.tipo === TIPO_GASTO ? 'gasto' : 'ingreso'})`;

  return `
    <p class="suave nota">La planilla usa
    ${nuevos.length === 1 ? '<strong>un rubro</strong> que' : `<strong>${nuevos.length} rubros</strong> que`}
    esta app todavía no ${nuevos.length === 1 ? 'tiene' : 'tenía'}:
    <strong>${escapar(nuevos.map(nombre).join(', '))}</strong>.
    Se ${nuevos.length === 1 ? 'agrega' : 'agregan'} con el mismo botón, cada uno con
    su color. Después se pueden renombrar o unir con otros desde Ajustes.</p>
  `;
}

function dibujarPreviaDePlanilla(planilla, monedas, base) {
  const { movimientos, problemas, comprobaciones, yaEstan } = planilla;
  const nuevos = movimientos.length - yaEstan;

  return `
    ${movimientos.length === 0 && (planilla.ahorros ?? []).length > 0 ? '' : `
    <p class="suave">Se leyeron
    <strong>${movimientos.length === 1 ? '1 movimiento' : `${movimientos.length} movimientos`}</strong>.
    ${yaEstan > 0
      ? `${yaEstan === 1 ? '1 ya está' : `${yaEstan} ya están`} cargado${yaEstan === 1 ? '' : 's'} en la app, así que
         ${nuevos === 1 ? 'entraría 1' : `entrarían ${nuevos}`}.`
      : 'Ninguno está todavía en la app.'}</p>`}

    ${dibujarComprobaciones(comprobaciones, base)}
    ${dibujarProblemas(problemas)}
    ${dibujarPreviaDeAhorros(planilla)}

    ${dibujarRubrosNuevos(planilla)}
    ${dibujarQueEntra(planilla, { monedas })}
    ${dibujarBotonDeTraer(nuevos, (planilla.ahorros ?? []).length - (planilla.ahorrosQueEstan ?? 0))}
    <button type="button" class="secundario" data-accion="cancelar-planilla">Dejar como está</button>
  `;
}

/**
 * La comparación contra el acumulado que traía la planilla.
 *
 * Es la única vez que se puede contrastar el resultado con un número calculado
 * por **otra herramienta**: después de importar, la planilla se archiva. Si acá
 * no se mira, no se mira nunca.
 */
function dibujarComprobaciones(comprobaciones, base) {
  if (comprobaciones.length === 0) return '';
  const difieren = comprobaciones.filter((c) => !c.coincide);

  if (difieren.length === 0) {
    return `<p class="suave">Los totales de los ${comprobaciones.length} meses coinciden con
    los que traía tu planilla.</p>`;
  }

  // El signo de la diferencia dice de qué lado mirar, y por eso se separan. Un
  // "no cuadra" a secas hace pensar que la app se equivocó, y en el caso más
  // común es al revés: apareció un gasto que la planilla no estaba sumando.
  const deMas = difieren.filter((c) => c.diferencia > 0);
  const deMenos = difieren.filter((c) => c.diferencia < 0);

  const linea = (c) => `<li>${escapar(c.mes)}: tu planilla dice
    ${escapar(formatearEuros(c.enLaPlanilla, base))} y acá suman
    ${escapar(formatearEuros(c.importado, base))}
    <strong>(${c.diferencia > 0 ? '+' : ''}${escapar(formatearEuros(c.diferencia, base))})</strong></li>`;

  return `
    <div class="aviso importante" role="alert">
      <h2>${difieren.length === 1 ? 'Un mes no coincide' : `${difieren.length} meses no coinciden`}</h2>

      ${deMas.length > 0 ? `
      <p class="suave"><strong>Se leyó de más</strong> en
      ${deMas.length === 1 ? 'un mes' : `${deMas.length} meses`}. La causa más
      frecuente es un gasto que <strong>tu planilla no estaba sumando</strong>:
      cuando un monto quedó escrito como texto —se ve igual, pero está pegado a la
      izquierda de la celda— Excel lo saltea sin avisar. Si la diferencia coincide
      con el importe de alguna fila, es eso.</p>
      <ul>${deMas.map(linea).join('')}</ul>` : ''}

      ${deMenos.length > 0 ? `
      <p class="suave"><strong>Se leyó de menos</strong> en
      ${deMenos.length === 1 ? 'un mes' : `${deMenos.length} meses`}. Acá sí conviene
      mirar la lista de filas que quedaron afuera: puede que alguna sea un gasto de
      verdad que no se pudo interpretar.</p>
      <ul>${deMenos.map(linea).join('')}</ul>` : ''}
    </div>`;
}

/**
 * Las filas que no entraron, **con su número de fila**.
 *
 * Sin el número, el informe dice «hubo 14 problemas» y no sirve para nada. Con
 * él, el usuario abre su planilla, va a esa fila y decide.
 */
/**
 * Saca el punto final, si lo tiene.
 *
 * El motivo puede venir de un mensaje del modelo, que ya termina en punto, y la
 * lista le agrega el suyo: quedaba "…no el número.. Decía: .". Dos puntos
 * seguidos y una frase vacía es cómo se ve un informe que nadie miró.
 */
function sinPuntoFinal(texto) {
  return String(texto ?? '').trim().replace(/\.+$/, '');
}

function dibujarProblemas(problemas) {
  if (problemas.length === 0) {
    return `<p class="suave">No quedó ninguna fila afuera.</p>`;
  }

  return `
    <div class="aviso importante" role="alert">
      <h2>${problemas.length === 1 ? 'Una fila no se pudo traer' : `${problemas.length} filas no se pudieron traer`}</h2>
      <p class="suave">Están con su número de fila para que puedas abrir tu planilla y
      mirarlas. El resto se importa igual.</p>
      <ul class="filas-con-problema">${problemas.map((p) => `<li>
        <strong>Fila ${p.fila}:</strong> ${escapar(sinPuntoFinal(p.motivo))}.
        ${p.decia ? `<span class="suave">Decía: ${escapar(sinPuntoFinal(p.decia))}.</span>` : ''}
      </li>`).join('')}</ul>
    </div>`;
}

// ── src/ui/pantallas/movimiento.js ──────────────────────────────
// La pantalla de carga: CU-01 (registrar un gasto) y CU-02 (registrar un
// ingreso). Es la razón de ser de la app — todo lo demás mira datos que entran
// por acá.
//
// El objetivo declarado en PRODUCTO es "anotar un gasto en menos de quince
// segundos, sin conexión". De ahí salen casi todas las decisiones de abajo:
// la fecha viene puesta en hoy, la moneda en la última usada, el tipo en gasto,
// y el monto es el primer campo, porque es el único que la app no puede adivinar.
//
// Igual que el armazón (ADR-022), esto son funciones puras que devuelven texto
// HTML. Quien las mete en el documento es `ui/app.js`.








/**
 * Los campos vacíos de un formulario nuevo.
 *
 * Tres vienen puestos y los tres tienen el mismo motivo: son los que casi
 * siempre valen lo mismo, y tocarlos sería trabajo repetido. La moneda se
 * hereda de la última usada (RN-04), que es lo que evita elegir "colón" treinta
 * veces seguidas en un viaje a Costa Rica.
 */
function borradorNuevo({ estado, fecha } = {}) {
  return {
    fecha: fecha ?? hoy(),
    tipo: TIPO_GASTO,
    monto: '',
    moneda: estado?.preferencias?.moneda_predeterminada ?? 'EUR',
    rubro: '',
    comentario: '',
    detalle: '',
  };
}

/**
 * El formulario cargado con un movimiento que ya existe, para corregirlo.
 *
 * El monto vuelve a texto con la coma decimal del español: si volviera como
 * `12.5`, el usuario vería su gasto escrito de una forma en la que él nunca lo
 * escribiría.
 */
function borradorDesde(movimiento, decimales) {
  return {
    id: movimiento.id,
    fecha: movimiento.fecha,
    tipo: movimiento.tipo,
    monto: formatearNumero(movimiento.monto, decimales),
    moneda: movimiento.moneda,
    rubro: movimiento.rubro,
    comentario: movimiento.comentario,
    detalle: movimiento.detalle,
  };
}

/**
 * Intenta guardar. Devuelve `{ estado, borrador, aviso, error }` — nunca tira.
 *
 * Es una función pura: recibe el estado y devuelve uno nuevo. Quien lo persiste
 * es `ui/app.js` llamando a `guardarEstado()`. Separarlo así permite testear
 * todo lo que puede salir mal —que es casi todo lo interesante— sin navegador y
 * sin almacenamiento.
 */
function intentarGuardar(estado, borrador) {
  let decimales;
  try {
    decimales = decimalesDe(estado.monedas, borrador.moneda);
  } catch (error) {
    return { estado, borrador, error: error.message };
  }

  const original = borrador.id ? estado.movimientos.find((m) => m.id === borrador.id) : null;

  let movimiento;
  try {
    // Al corregir se conservan el identificador y el día de carga: es el mismo
    // movimiento con otros datos, no uno nuevo. Cambiarle el id rompería
    // cualquier cosa que lo señale, y cambiarle `creado` borraría cuándo entró.
    movimiento = crearMovimiento(borrador, {
      decimales,
      id: original?.id,
      creado: original?.creado,
      // Los rubros que valen son los del usuario (T-048), no los de fábrica.
      catalogo: estado.rubros,
    });
  } catch (error) {
    // El mensaje viene del modelo, ya escrito para una persona. Repetirlo acá
    // con otras palabras sería tener dos versiones de la misma regla.
    return { estado, borrador, error: error.message };
  }

  // RN-04: no se guarda un movimiento en moneda extranjera sin tipo de cambio,
  // porque no habría forma de expresarlo en euros y quedaría fuera de todos los
  // totales sin que nada lo delate.
  const falta = faltaCambioPara(movimiento, estado.tipos_cambio);
  if (falta) {
    return {
      estado,
      borrador,
      error:
        `Falta el tipo de cambio de ${falta.moneda} para ${formatearMes(falta.mes)}. ` +
        `Sin él este gasto no podría contarse en ningún total, así que todavía no se guarda. ` +
        `Cargalo desde la pantalla de tipos de cambio.`,
      faltaCambio: falta,
    };
  }

  // Corregir un movimiento pasa por acá y no por otro camino: si hubiera dos
  // puertas, tarde o temprano una tendría una validación que la otra no.
  const posicion = borrador.id ? estado.movimientos.findIndex((m) => m.id === borrador.id) : -1;
  const corrigiendo = posicion !== -1;

  const movimientos = corrigiendo
    ? estado.movimientos.map((m, i) => (i === posicion ? movimiento : m))
    : [...estado.movimientos, movimiento];

  const nuevoEstado = {
    ...estado,
    movimientos,
    // La moneda elegida queda como predeterminada para la próxima carga (RN-04).
    preferencias: { ...estado.preferencias, moneda_predeterminada: movimiento.moneda },
  };

  return {
    estado: nuevoEstado,
    corrigiendo,
    // El formulario se vacía pero conserva la fecha: cuando alguien carga tres
    // gastos del sábado, volver a poner la fecha en cada uno es exactamente el
    // trabajo repetido que esta app viene a sacar.
    borrador: borradorNuevo({ estado: nuevoEstado, fecha: movimiento.fecha }),
    aviso: { movimiento, decimales, corrigiendo },
  };
}

// ── Dibujo ───────────────────────────────────────────────────────────────────

/**
 * La fecha escrita en palabras, para poner debajo del calendario del sistema.
 *
 * Si la fecha no se puede leer todavía —el campo a medio escribir— devuelve
 * vacío en vez de tirar: un formulario a medio llenar no es un error.
 */
function fechaEnPalabras(iso) {
  try {
    return `${formatearDiaSemana(iso)}, ${formatearFechaLarga(iso)}`;
  } catch {
    return '';
  }
}

/**
 * Las `<option>` de un `<select>`. Exportada para que el formulario de ahorros
 * use exactamente la misma: dos versiones de esto se separan el día que una
 * aprende a escapar algo que la otra no.
 */
function opciones(valores, elegido) {
  return valores
    .map((v) => {
      const valor = typeof v === 'string' ? v : v.valor;
      const texto = typeof v === 'string' ? v : v.texto;
      return `<option value="${escapar(valor)}"${valor === elegido ? ' selected' : ''}>${escapar(texto)}</option>`;
    })
    .join('');
}

function dibujarAviso(aviso) {
  if (!aviso) return '';
  const { movimiento, decimales } = aviso;
  const importe = formatearMonto(movimiento.monto, decimales, movimiento.moneda);
  const que = movimiento.tipo === TIPO_GASTO ? 'Gasto' : 'Ingreso';
  const accion = aviso.corrigiendo ? 'corregido' : 'guardado';

  return `
    <p class="confirmacion" role="status">
      ${que} ${accion}: <strong>${escapar(importe)}</strong> ·
      ${escapar(formatearRubro(movimiento.rubro))} · ${escapar(formatearFecha(movimiento.fecha))}
    </p>
  `;
}

/**
 * Un error para mostrarle al usuario. Se exporta porque lo usan también las
 * monedas (T-024): dos formas distintas de mostrar un error son dos lugares
 * donde arreglar el mismo problema, y uno de los dos se olvida.
 */
function dibujarError(error) {
  if (!error) return '';
  return `<p class="error-carga" role="alert">${escapar(error)}</p>`;
}

/**
 * Los últimos movimientos cargados, para responder "¿se guardó?" sin cambiar de
 * pantalla. No es la lista de verdad —esa es T-015, con editar y borrar—: son
 * cinco líneas de confirmación.
 */
function dibujarUltimos(estado) {
  const ultimos = estado.movimientos.slice(-5).reverse();
  if (ultimos.length === 0) return '';

  const filas = ultimos
    .map((m) => {
      let importe;
      try {
        importe = formatearMonto(m.monto, decimalesDe(estado.monedas, m.moneda), m.moneda);
      } catch {
        importe = `${m.monto} ${m.moneda}`;
      }
      const signo = m.tipo === TIPO_GASTO ? 'gasto' : 'ingreso';
      return `
        <li class="linea ${signo}">
          <span class="fecha">${escapar(formatearFecha(m.fecha))}</span>
          <span class="rubro">
            <span class="punto-rubro ${claseDeRubro(m.tipo, m.rubro)}" aria-hidden="true"></span>
            ${escapar(formatearRubro(m.rubro))}${m.comentario ? ` · ${escapar(m.comentario)}` : ''}</span>
          <span class="importe">${escapar(importe)}</span>
        </li>`;
    })
    .join('');

  return `
    <section class="tarjeta">
      <h2>Últimos cargados</h2>
      <ul class="lineas">${filas}</ul>
      <p class="suave">Corregir y borrar llega con T-015.</p>
    </section>
  `;
}

/**
 * Las sugerencias de un campo, como botones — T-920.
 *
 * **No se usa `<datalist>`.** Se usaba (T-912) y en el Android del usuario **no
 * aparece nada**: el navegador lo dibuja como quiere, y ahí directamente no lo
 * dibuja. Es L-013 en su forma más cara — un control cedido al sistema que no
 * hace nada y no avisa—. Unos botones propios son más código y hay que
 * mantenerlos, pero se pueden ver, tocar y comprobar.
 *
 * Son `<button type="button">` y no enlaces ni divs: se llega con el teclado,
 * los lee un lector de pantalla, y `type="button"` evita que enviar el
 * formulario sea lo que pasa al tocarlos.
 */
function dibujarSugerencias(campo, escrito, usados) {
  const sugerencias = sugerenciasPara(escrito, usados);
  if (sugerencias.length === 0) return '';

  return sugerencias
    .map((texto) => `<button type="button" class="sugerencia" data-accion="sugerencia"
        data-campo="${escapar(campo)}" data-texto="${escapar(texto)}">${escapar(texto)}</button>`)
    .join('');
}

/**
 * Lo ya escrito en cada campo que sugiere, para no calcularlo dos veces.
 *
 * Solo el comentario. El detalle también sugería hasta el 2026-08-28 y **el
 * usuario pidió que no**: el comentario es lo que agrupa los gastos de un viaje
 * (RN-03) y ahí elegir la escritura que ya existe evita partir un total en dos;
 * el detalle es una nota para acordarse, no agrupa nada, y una lista debajo es
 * ruido mientras escribís.
 */
function usadosDe(estado) {
  const movimientos = estado?.movimientos ?? [];
  return { comentario: comentariosUsados(movimientos) };
}

function dibujarNuevo(vista) {
  const estado = vista.estado;
  const borrador = vista.borrador ?? borradorNuevo({ estado });
  const usados = usadosDe(estado);

  // Si el gasto que se está cargando necesita un tipo de cambio, la app
  // interrumpe y lo pide (CU-03). Se reemplaza el formulario en vez de agregar
  // el pedido debajo: dos formularios a la vez son dos cosas para decidir, y
  // este es un momento en que el usuario ya fue interrumpido una vez.
  if (vista.faltaCambio) {
    return dibujarMovimientoEnEspera(estado, borrador) + dibujarPedido(vista);
  }
  const esGasto = borrador.tipo !== TIPO_INGRESO;

  // Solo el código, no "EUR — Euro": el nombre completo no entra al lado del
  // monto en una pantalla de celular y se corta a la mitad, que es peor que no
  // ponerlo. La lista con nombres vive en la pantalla de monedas (T-024).
  const monedas = monedasVisibles(estado.monedas).map((m) => ({
    valor: m.codigo,
    texto: m.codigo,
  }));

  return `
    <form class="tarjeta formulario" data-formulario="movimiento" novalidate>
      <h2>${borrador.id ? (esGasto ? 'Corregir gasto' : 'Corregir ingreso') : (esGasto ? 'Nuevo gasto' : 'Nuevo ingreso')}</h2>

      ${dibujarError(vista.error)}
      ${dibujarAviso(vista.aviso)}

      <div class="tipo" role="group" aria-label="Tipo de movimiento">
        <button type="button" class="opcion-tipo${esGasto ? ' activa' : ''}"
                data-accion="tipo" data-tipo="${TIPO_GASTO}" aria-pressed="${esGasto}">Gasto</button>
        <button type="button" class="opcion-tipo${esGasto ? '' : ' activa'}"
                data-accion="tipo" data-tipo="${TIPO_INGRESO}" aria-pressed="${!esGasto}">Ingreso</button>
      </div>

      <label class="campo">
        <span>Monto</span>
        <div class="monto-fila">
          <!-- inputmode="decimal" abre el teclado numérico del celular con coma.
               Con el teclado de texto, escribir un importe es tres toques más. -->
          <input name="monto" class="importe" type="text" inputmode="decimal"
                 autocomplete="off" enterkeyhint="done" placeholder="0,00"
                 value="${escapar(borrador.monto)}">
          <select name="moneda" aria-label="Moneda">${opciones(monedas, borrador.moneda)}</select>
        </div>
        <!-- La salida cuando la moneda del país donde estás no está en la lista
             (CU-15). Sin esto, el viaje se anota mal o no se anota. -->
        <button type="button" class="enlace" data-accion="ir" data-pantalla="monedas">
          ¿Falta una moneda?
        </button>
      </label>

      <label class="campo">
        <span>Rubro</span>
        <!-- El campo se pinta del color del rubro elegido: es la confirmación
             de que quedó puesto el que se quería, sin volver a leerlo. El mismo
             color que va a tener después en el resumen del mes. -->
        <div class="campo-rubro ${borrador.rubro ? claseDeRubro(borrador.tipo, borrador.rubro, estado.rubros) : 'sin-elegir'}"
             data-campo-rubro>
          <select name="rubro">
            <option value=""${borrador.rubro ? '' : ' selected'} disabled>Elegí un rubro</option>
            ${opciones(
              rubrosDe(borrador.tipo, estado.rubros).map((r) => ({ valor: r, texto: formatearRubro(r) })),
              borrador.rubro
            )}
          </select>
        </div>
      </label>

      <label class="campo">
        <span>Fecha</span>
        <div class="fecha-fila">
          <input name="fecha" type="date" value="${escapar(borrador.fecha)}">
          <!-- El botón aparece SOLO cuando la fecha no es la de hoy. Así hace
               dos cosas con un mismo gesto: la trae a hoy de un toque, y su sola
               presencia avisa que la puesta no es la de hoy. Uno siempre visible
               sería un adorno el 90 % de las veces y no avisaría nada. Lo pidió
               el usuario (2026-09-04): después de editar un movimiento viejo, la
               fecha quedaba en la de ese movimiento. -->
          ${borrador.fecha === hoy() ? '' : `
          <button type="button" class="secundario chico" data-accion="fecha-hoy"
                  data-fecha-hoy>Hoy</button>`}
        </div>
        <!-- El calendario de "type=date" lo dibuja el SISTEMA, no la app, y cada
             navegador elige el formato según su propio idioma: puede mostrar
             25/08/2026 o 08/25/2026 y no hay forma de decidirlo desde acá.
             En vez de confiar en que salga bien, la app escribe debajo la fecha
             en español, sin ambigüedad posible. Ver L-013. -->
        <span class="fecha-legible" data-fecha-legible>${escapar(fechaEnPalabras(borrador.fecha))}</span>
      </label>

      <label class="campo">
        <span>Detalle <em class="suave">— para acordarte</em></span>
        <!-- Sin lista de sugerencias, por pedido del usuario (2026-08-28). El
             detalle no agrupa nada: es una nota para acordarse. -->
        <input name="detalle" type="text" autocomplete="off"
               placeholder="cena" value="${escapar(borrador.detalle)}">
      </label>

      <!-- La etiqueta va última y ofrece las que ya usaste (T-912, T-920). No
           es comodidad: la etiqueta es lo que agrupa los gastos de un viaje
           (RN-03), y "Barcelona26" y "barcelona 26" son dos viajes distintos en
           los totales. Ofrecer lo que ya existe es la forma más barata de que
           elijas la escritura que ya tenés en vez de inventar una nueva. -->
      <label class="campo">
        <span>Etiqueta <em class="suave">(agrupar por)</em></span>
        <input name="comentario" type="text" autocomplete="off"
               placeholder="Roma, Luz…" value="${escapar(borrador.comentario)}">
        <div class="sugerencias" data-sugerencias="comentario">${
          dibujarSugerencias('comentario', borrador.comentario, usados.comentario)
        }</div>
      </label>

      <button type="submit" class="principal" data-accion="guardar">
        ${borrador.id ? 'Guardar los cambios' : `Guardar ${esGasto ? 'gasto' : 'ingreso'}`}
      </button>
      ${borrador.id ? `
      <button type="button" class="secundario" data-accion="cancelar-edicion">
        Dejar como estaba
      </button>` : ''}
    </form>

    ${dibujarUltimos(estado)}
  `;
}

// ── src/ui/series-interaccion.js ────────────────────────────────
// Lo único de los gráficos que toca el navegador — T-942.
//
// El dibujo es puro y vive en `pantallas/series.js`: recibe una **ventana** —dos
// índices— y devuelve el SVG de esa parte de la serie. Acá se traduce lo que
// hace el dedo en una ventana nueva, y se vuelve a pedir el dibujo.
//
// Es la misma división que ADR-022 en todos lados: casi todo se puede probar con
// `node --test`, y lo que no —que un gesto llegue a donde tiene que llegar— se
// prueba abriendo la app.
//
// ── Por qué la ventana NO vive en el estado de la app ───────────────────────
//
// Es ADR-023: lo que el usuario está manipulando vive en el documento, no en el
// estado, y no se redibuja la pantalla entera por cada movimiento del dedo.
// Redibujar todo en cada `pointermove` sería lento y perdería el gesto a la
// mitad. La ventana vive en el elemento del gráfico y se va con él, que es lo
// correcto: es cómo estás mirando, no un dato tuyo.

/** Cuánto se acerca o aleja cada toque de un botón. */
const PASO = 0.6;

/** Un movimiento de menos de esto es un toque, no un arrastre. */
const TOLERANCIA_TOQUE = 8;

const estados = new WeakMap();

function estadoDe(tarjeta) {
  if (!estados.has(tarjeta)) {
    const serie = JSON.parse(tarjeta.dataset.puntos);
    estados.set(tarjeta, {
      serie,
      ventana: { desde: 0, hasta: serie.puntos.length - 1 },
      seleccion: null,
    });
  }
  return estados.get(tarjeta);
}

function repintar(tarjeta) {
  const { serie, ventana, seleccion } = estadoDe(tarjeta);
  tarjeta.querySelector('[data-dibujo]').innerHTML = interiorDeSerie(serie, ventana, seleccion);
  tarjeta.querySelector('[data-lectura]').innerHTML = dibujarLectura(serie, seleccion, serie.base);
}

/** De dónde se tocó al índice del punto más cercano. */
function indiceEn(tarjeta, clienteX) {
  const { serie, ventana } = estadoDe(tarjeta);
  const svg = tarjeta.querySelector('[data-dibujo]');
  const caja = svg.getBoundingClientRect();
  if (caja.width === 0) return null;

  // El viewBox arranca en −4 y mide ANCHO + 20: hay que pasar del píxel de la
  // pantalla a la coordenada del dibujo antes de convertirla en índice.
  const [vbX, , vbAncho] = svg.getAttribute('viewBox').split(' ').map(Number);
  const enDibujo = vbX + ((clienteX - caja.left) / caja.width) * vbAncho;

  const { desde, hasta } = acomodarVentana(ventana, serie.puntos.length);
  const proporcion = Math.max(0, Math.min(1, enDibujo / ANCHO));
  return desde + Math.round(proporcion * (hasta - desde));
}

/** La distancia entre dos dedos. */
const separacion = (a, b) => Math.abs(a - b);

/**
 * Engancha los gráficos de una pantalla ya dibujada.
 *
 * Se llama después de cada repintado. Los escuchadores van en cada tarjeta y no
 * en la raíz porque el pellizco necesita seguir a los dos dedos dentro de un
 * mismo gráfico, y una pantalla puede tener dos.
 */
function conectarSeries(raiz) {
  for (const tarjeta of raiz.querySelectorAll('[data-serie]')) {
    if (tarjeta.dataset.conectado === 'sí') continue;
    tarjeta.dataset.conectado = 'sí';
    conectarUna(tarjeta);
  }
}

function conectarUna(tarjeta) {
  const svg = tarjeta.querySelector('[data-dibujo]');
  const dedos = new Map();
  let arrastre = null;

  tarjeta.addEventListener('click', (evento) => {
    const boton = evento.target.closest('[data-accion]');
    if (!boton || !tarjeta.contains(boton)) return;
    const estado = estadoDe(tarjeta);
    const cuantos = estado.serie.puntos.length;

    if (boton.dataset.accion === 'grafico-acercar') {
      estado.ventana = acercar(estado.ventana, cuantos, PASO, estado.seleccion ?? undefined);
    } else if (boton.dataset.accion === 'grafico-alejar') {
      estado.ventana = acercar(estado.ventana, cuantos, 1 / PASO, estado.seleccion ?? undefined);
    } else if (boton.dataset.accion === 'grafico-todo') {
      estado.ventana = { desde: 0, hasta: cuantos - 1 };
    } else {
      return;
    }
    evento.stopPropagation();
    repintar(tarjeta);
  });

  svg.addEventListener('pointerdown', (evento) => {
    dedos.set(evento.pointerId, evento.clientX);
    svg.setPointerCapture(evento.pointerId);

    if (dedos.size === 1) {
      arrastre = { desdeX: evento.clientX, movido: 0, ventana: { ...estadoDe(tarjeta).ventana } };
    } else if (dedos.size === 2) {
      // Con el segundo dedo empieza el pellizco y se cancela el arrastre: si no,
      // el gráfico se correría además de acercarse.
      const [a, b] = [...dedos.values()];
      arrastre = null;
      tarjeta.dataset.pellizco = JSON.stringify({
        separacion: separacion(a, b),
        ventana: { ...estadoDe(tarjeta).ventana },
      });
    }
  });

  svg.addEventListener('pointermove', (evento) => {
    if (!dedos.has(evento.pointerId)) return;
    dedos.set(evento.pointerId, evento.clientX);
    const estado = estadoDe(tarjeta);
    const cuantos = estado.serie.puntos.length;

    if (dedos.size >= 2 && tarjeta.dataset.pellizco) {
      const inicio = JSON.parse(tarjeta.dataset.pellizco);
      const [a, b] = [...dedos.values()];
      const ahora = separacion(a, b);
      if (inicio.separacion < 1 || ahora < 1) return;
      // Separar los dedos acerca: la ventana se hace más angosta.
      estado.ventana = acercar(inicio.ventana, cuantos, inicio.separacion / ahora);
      repintar(tarjeta);
      return;
    }

    if (arrastre === null) return;
    const corrido = evento.clientX - arrastre.desdeX;
    arrastre.movido = Math.max(arrastre.movido, Math.abs(corrido));
    if (arrastre.movido < TOLERANCIA_TOQUE) return;

    // Cuántos índices son esos píxeles, con el ancho que la ventana tiene ahora.
    const caja = svg.getBoundingClientRect();
    const { desde, hasta } = acomodarVentana(arrastre.ventana, cuantos);
    const porPixel = (hasta - desde) / Math.max(1, caja.width);
    estado.ventana = correr(arrastre.ventana, cuantos, -corrido * porPixel);
    repintar(tarjeta);
  });

  const soltar = (evento) => {
    dedos.delete(evento.pointerId);
    if (dedos.size < 2) delete tarjeta.dataset.pellizco;
    if (dedos.size > 0) return;

    // Un toque —sin arrastre— elige el punto. Con arrastre no: quien movió el
    // gráfico no pidió además cambiar el punto elegido.
    if (arrastre !== null && arrastre.movido < TOLERANCIA_TOQUE) {
      const estado = estadoDe(tarjeta);
      const indice = indiceEn(tarjeta, evento.clientX);
      if (indice !== null) {
        estado.seleccion = indice;
        repintar(tarjeta);
      }
    }
    arrastre = null;
  };

  svg.addEventListener('pointerup', soltar);
  svg.addEventListener('pointercancel', soltar);
}

// ── src/ui/app.js ───────────────────────────────────────────────
// El armazón de la interfaz: encabezado, navegación entre pantallas y el hueco
// donde cada pantalla dibuja lo suyo.
//
// Está partido en dos capas a propósito:
//
//   1. Funciones que reciben datos y devuelven TEXTO HTML. Son puras: no tocan
//      el navegador, así que se pueden testear con node --test sin inventar un
//      DOM falso. Es donde vive casi toda la lógica de qué se muestra.
//   2. `iniciar()`, que es la única que toca el documento y engancha los clics.
//
// La frontera importa: un error de "qué se muestra" se puede cazar con un test;
// uno de "cómo se engancha un clic" solo se ve abriendo la app. Cuanto más de lo
// primero y menos de lo segundo, más barato es equivocarse.



































/**
 * La versión la inyecta tools/build.mjs al construir, leyéndola del archivo
 * VERSION. Fuera del archivo construido (por ejemplo en los tests) no hay
 * versión publicada, y decirlo es más honesto que inventar un número.
 */
function versionApp() {
  return globalThis.__VIAJECOR_VERSION__ || 'sin construir';
}

/**
 * Escapa un texto para meterlo en HTML.
 *
 * No es una precaución teórica: el comentario y el detalle de un movimiento son
 * texto libre que escribe el usuario, y alcanza con un `<` para romper la
 * página. Todo lo que venga de los datos pasa por acá antes de entrar en una
 * plantilla; lo que no pase, es un error.
 */
function escapar(texto) {
  return String(texto ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Las pantallas ────────────────────────────────────────────────────────────
//
// Cada pantalla se registra acá con su nombre, su etiqueta en la barra de abajo
// y una función que dibuja su contenido.
//
// Hasta el 2026-08-28 había además un `marcador()`: una pantalla de mentira que
// decía "todavía no está construida — T-0XX". Se fue con T-024, cuando dejó de
// haber pantallas sin construir. Si vuelve a hacer falta, está en el historial;
// lo que no se deja es una función que no llama nadie.

// ── Los perfiles ─────────────────────────────────────────────────────────────
//
// La app hace dos cosas que casi no se tocan entre sí:
//
//   - **Vida cotidiana**: los gastos e ingresos del mes, con sus rubros, sus
//     viajes y sus historiales. Todo en euros, todo con un mes de por medio.
//   - **Ahorros conjuntos**: la plata guardada de dos personas en tres monedas
//     que **no se convierten entre sí**, sin mes y sin rubros.
//
// Mezclarlas en una sola barra de abajo tiene un costo que se paga todos los
// días: cinco pestañas de las que dos no sirven para lo que estás haciendo. El
// selector de arriba cambia **de qué app estamos hablando**, y la barra pasa a
// mostrar solo lo de ese perfil.
//
// Lo pidió el usuario (2026-08-31) después de ver algo parecido en otra app.
// La decisión de fondo ya estaba tomada desde CU-14 —los ahorros son un
// registro aparte, no un rubro más—; esto la hace visible.

const PERFIL_COTIDIANA = 'cotidiana';
const PERFIL_AHORROS = 'ahorros';

const PERFILES = Object.freeze([
  { clave: PERFIL_COTIDIANA, etiqueta: 'Vida cotidiana', inicio: 'mes' },
  { clave: PERFIL_AHORROS, etiqueta: 'Ahorros conjuntos', inicio: 'ahorros' },
]);

/** El perfil al que pertenece una pantalla. `ambos` la deja en los dos. */
function perfilDe(definicion) {
  return definicion?.perfil ?? PERFIL_COTIDIANA;
}

/** ¿Esta pantalla se ve estando en este perfil? */
function esDelPerfil(definicion, perfil) {
  const suyo = perfilDe(definicion);
  return suyo === 'ambos' || suyo === perfil;
}

const PANTALLAS = new Map();

function registrarPantalla(nombre, definicion) {
  PANTALLAS.set(nombre, { nombre, ...definicion });
  return PANTALLAS.get(nombre);
}

function pantallasRegistradas() {
  return [...PANTALLAS.values()];
}

function pantalla(nombre) {
  return PANTALLAS.get(nombre) ?? null;
}

registrarPantalla('mes', {
  etiqueta: 'Mes',
  orden: 2,
  icono: '◧',
  conMes: true,
  dibujar: dibujarResumen,
});

registrarPantalla('movimientos', {
  etiqueta: 'Movimientos',
  orden: 3,
  icono: '≡',
  conMes: true,
  dibujar: dibujarLista,
});

// Los datos son de TODA la app —el respaldo lleva las dos mitades, y la
// planilla trae las dos hojas—, así que la pestaña está en los dos perfiles.
registrarPantalla('datos', {
  perfil: 'ambos',
  etiqueta: 'Datos',
  orden: 4,
  icono: '↧',
  conMes: false,
