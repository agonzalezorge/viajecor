<style>
/* Estilos base. Sin fuentes externas: usar una fuente de un CDN haría que ese
   CDN viera la IP y la hora de uso de la app, lo que rompe RN-06. */

:root {
  --fondo: #fbfaf8;
  --superficie: #ffffff;
  --borde: #e3ded6;
  --texto: #1c1a17;
  --texto-suave: #6b645b;
  --acento: #2f6f4e;
  --gasto: #a4342c;
  --ingreso: #2f6f4e;
  --radio: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #171614;
    --superficie: #211f1c;
    --borde: #38342f;
    --texto: #f0ece6;
    --texto-suave: #a49c91;
    --acento: #6fbb90;
    --gasto: #e08b83;
    --ingreso: #6fbb90;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.app {
  max-width: 40rem;
  margin: 0 auto;
  padding: 1.25rem 1rem 4rem;
}

.encabezado {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--borde);
  margin-bottom: 1.25rem;
}

.encabezado h1 {
  margin: 0;
  font-size: 1.5rem;
  letter-spacing: -0.02em;
}

.version {
  font-size: 0.8125rem;
  color: var(--texto-suave);
  font-variant-numeric: tabular-nums;
}

.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 1rem 1.125rem;
  margin-bottom: 1rem;
}

.tarjeta h2 {
  margin: 0 0 0.5rem;
  font-size: 1rem;
}

.tarjeta p { margin: 0 0 0.5rem; }
.tarjeta p:last-child { margin-bottom: 0; }

.suave { color: var(--texto-suave); font-size: 0.9375rem; }

.estado {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.875rem;

  width: 0.5rem;

}

  border: 1px solid var(--borde);

  padding: 1rem;
}

ul.pasos { margin: 0.5rem 0 0; padding-left: 1.25rem; }

</style>

<div id="app" class="app">
  <noscript>
    <p class="aviso">Esta aplicación necesita JavaScript. Está todo dentro de este
    mismo archivo: no descarga nada de internet.</p>
  </noscript>
</div>

<script>
(function () {
'use strict';

globalThis.__VIAJECOR_VERSION__ = "0.1.0";

// ── src/core/dinero.js ──────────────────────────────────────────
// Aritmética de dinero.
//
// La regla que gobierna todo este archivo: el dinero se guarda como número
// ENTERO en la unidad mínima de su moneda. 12,50 € es 1250. Ver ADR-005.
//
// Por qué: en JavaScript 0.1 + 0.2 da 0.30000000000000004. Sumar cientos de
// gastos con decimales acumula error, y un total que no cierra por un céntimo
// destruye la confianza en todos los demás números. Con enteros, la suma es
// exacta y punto.
//
// Los decimales de cada moneda entran por parámetro: la lista de monedas la
// maneja el usuario (RN-04b, ADR-011), así que este módulo no puede tener una
// tabla propia que se desactualice.
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.

// Más allá de este valor JavaScript deja de contar enteros de a uno y empieza a
// saltearse números, que es justo lo que veníamos a evitar. Son unos 90 billones
// de euros en céntimos: si un monto lo supera, es un error de carga, no un gasto.
const MAXIMO = Number.MAX_SAFE_INTEGER;

const DECIMALES_EURO = 2;

/**
 * Cuántas unidades mínimas entran en una unidad de la moneda.
 * 2 decimales → 100 (céntimos por euro). 0 decimales → 1 (el yen no tiene).
 */
function unidadMinima(decimales) {
  validarDecimales(decimales);
  return 10 ** decimales;
}

function validarDecimales(decimales) {
  if (!Number.isInteger(decimales) || decimales < 0 || decimales > 4) {
    throw new Error(
      `Los decimales de una moneda tienen que ser un número entero de 0 a 4, y llegó ${JSON.stringify(decimales)}.`
    );
  }
}

/**
 * Redondea al entero más cercano, con el medio siempre hacia arriba en valor
 * absoluto: 2,5 → 3 y -2,5 → -3.
 *
 * Por qué no alcanza Math.round: Math.round(-2.5) da -2, porque redondea hacia
 * el infinito positivo. Eso rompe la simetría — el mismo importe redondearía
 * distinto según su signo. Acá casi todos los montos son positivos, pero un
 * saldo mensual sí puede ser negativo, y una regla que depende del signo es una
 * trampa esperando.
 */
function redondear(numero) {
  if (!Number.isFinite(numero)) {
    throw new Error(`No se puede redondear ${JSON.stringify(numero)}.`);
  }
  return numero < 0 ? -Math.round(-numero) : Math.round(numero);
}

/**
 * Comprueba que un valor sirva como monto guardado: entero, no negativo y
 * dentro del rango en que JavaScript cuenta bien.
 */
function validarMonto(minimas) {
  if (!Number.isInteger(minimas)) {
    throw new Error(
      `Un monto se guarda como número entero de unidades mínimas, y llegó ${JSON.stringify(minimas)}.`
    );
  }
  if (minimas < 0) {
    throw new Error(
      'Un monto no puede ser negativo. Si es un gasto, se registra como gasto; el signo lo da el tipo del movimiento, no el número.'
    );
  }
  if (minimas > MAXIMO) {
    throw new Error('El monto es demasiado grande: seguro es un error de carga.');
  }
  return minimas;
}

/**
 * Interpreta lo que el usuario escribió y lo convierte a unidades mínimas.
 *
 * El separador decimal es AMBIGUO en la práctica: en español la coma separa
 * decimales ("12,50") pero los teclados de celular meten punto, y al copiar de
 * un banco pueden venir miles ("1.234,56" o "1,234.56"). Las reglas:
 *
 *   1. El ÚLTIMO punto o coma es el separador decimal si lo siguen 1 o 2
 *      dígitos. Así "12,50", "12.50", "1.234,56" y "1,234.56" dan lo esperado.
 *   2. Los demás separadores son de miles, y tienen que agrupar de a tres.
 *   3. Un único separador seguido de EXACTAMENTE tres dígitos —"1.234",
 *      "12,345"— es genuinamente ambiguo y se RECHAZA pidiendo aclaración.
 *
 * La regla 3 es la importante. "1.234" puede ser mil doscientos treinta y
 * cuatro; "12,345" es casi seguro alguien que quiso escribir 12,34 y se le
 * escapó un dígito. Tienen la misma forma y no hay forma de distinguirlos.
 * Elegir cualquiera de las dos lecturas en silencio significa equivocarse por
 * un factor de mil en el monto de alguien, sin avisarle. Preguntar es molesto
 * una vez; equivocarse acá corrompe un total para siempre. Ver ADR-012.
 */
function aMinimas(entrada, decimales) {
  validarDecimales(decimales);

  if (typeof entrada === 'number') {
    if (!Number.isFinite(entrada)) {
      throw new Error(`"${entrada}" no es un monto.`);
    }
    return validarMonto(redondear(entrada * unidadMinima(decimales)));
  }

  if (typeof entrada !== 'string') {
    throw new Error(`No se puede leer ${JSON.stringify(entrada)} como un monto.`);
  }

  const limpio = entrada.trim().replace(/\s/g, '');
  if (limpio === '') throw new Error('Falta el monto.');
  if (!/^-?[\d.,]+$/.test(limpio)) {
    throw new Error(`"${entrada}" no es un monto: solo se aceptan números, punto y coma.`);
  }

  const negativo = limpio.startsWith('-');
  const sinSigno = negativo ? limpio.slice(1) : limpio;

  const separadores = sinSigno.match(/[.,]/g) || [];
  const ultimoSeparador = Math.max(sinSigno.lastIndexOf('.'), sinSigno.lastIndexOf(','));
  const digitosDespues = ultimoSeparador === -1 ? -1 : sinSigno.length - ultimoSeparador - 1;
  const hayParteDecimal = digitosDespues === 1 || digitosDespues === 2;

  // Regla 3: un solo separador con tres dígitos detrás no se puede leer.
  if (!hayParteDecimal && separadores.length === 1 && digitosDespues === 3) {
    throw new Error(
      `"${entrada}" se puede leer de dos formas y no quiero adivinar con tu dinero: ` +
      `¿son ${sinSigno.replace(/[.,]/, '')} enteros, o querías escribir dos decimales? ` +
      `Escribilo sin separador de miles, o con dos decimales.`
    );
  }

  const entera = hayParteDecimal ? sinSigno.slice(0, ultimoSeparador) : sinSigno;
  const decimal = hayParteDecimal ? sinSigno.slice(ultimoSeparador + 1) : '';

  // Los separadores que quedan en la parte entera son de miles: tienen que
  // agrupar de a tres exactos. Si no, el número está mal escrito y decirlo es
  // mejor que inventar una lectura.
  if (/[.,]/.test(entera)) {
    const grupos = entera.split(/[.,]/);
    const primeroValido = /^\d{1,3}$/.test(grupos[0]);
    const restoValido = grupos.slice(1).every((g) => /^\d{3}$/.test(g));
    if (!primeroValido || !restoValido) {
      throw new Error(
        `"${entrada}" no es un monto: los separadores de miles tienen que agrupar de a tres dígitos.`
      );
    }
  }

  const soloDigitosEnteros = entera.replace(/[.,]/g, '');
  if (soloDigitosEnteros === '' && decimal === '') {
    throw new Error(`"${entrada}" no es un monto.`);
  }

  // Una moneda sin decimales con céntimos escritos es un error del usuario, no
  // algo que se pueda redondear en silencio: redondear le cambiaría el importe
  // sin decirle nada.
  if (decimal !== '' && decimales === 0) {
    throw new Error('Esta moneda no usa decimales, así que el monto tiene que ser un número entero.');
  }
  if (decimal.length > decimales) {
    const plural = decimales === 1 ? 'decimal' : 'decimales';
    throw new Error(
      `Esta moneda usa ${decimales} ${plural}, y "${entrada}" tiene ${decimal.length}.`
    );
  }

  // Se arma el entero pegando dígitos, sin pasar nunca por un número con coma
  // flotante: así "0,10" + "0,20" no puede dar 0.30000000000000004.
  const relleno = decimal.padEnd(decimales, '0');
  const minimas = Number(`${soloDigitosEnteros || '0'}${relleno}`);

  return validarMonto(negativo ? -minimas : minimas);
}

/**
 * De unidades mínimas al número con decimales. Solo para mostrar y para
 * exportar: nunca para seguir calculando encima.
 */
function aNumero(minimas, decimales) {
  validarDecimales(decimales);
  if (!Number.isInteger(minimas)) {
    throw new Error(`Se esperaba un entero de unidades mínimas y llegó ${JSON.stringify(minimas)}.`);
  }
  return minimas / unidadMinima(decimales);
}

/**
 * Suma exacta. Recibe la lista completa: no hay ningún límite de cuántos
 * elementos acepta, porque así es como el Excel original empezó a mentir (L-001).
 */
function sumar(minimas) {
  if (!Array.isArray(minimas)) {
    throw new Error('sumar() espera una lista de montos.');
  }
  let total = 0;
  for (const m of minimas) {
    if (!Number.isInteger(m)) {
      throw new Error(`La lista tiene un valor que no es entero: ${JSON.stringify(m)}.`);
    }
    total += m;
    if (!Number.isSafeInteger(total)) {
      throw new Error('La suma se pasó del rango en que JavaScript cuenta bien.');
    }
  }
  return total;
}

/**
 * Convierte un monto a céntimos de euro usando el tipo de cambio del mes
 * (RN-04): cuántos euros vale UNA unidad de esa moneda.
 *
 * El redondeo ocurre UNA SOLA VEZ, acá al final. Si se redondeara antes —por
 * ejemplo pasando primero a euros con decimales y después sumando— el error se
 * acumularía movimiento a movimiento.
 */
function convertirAEuros(minimas, decimales, eurosPorUnidad) {
  validarDecimales(decimales);
  if (!Number.isInteger(minimas)) {
    throw new Error(`Se esperaba un entero de unidades mínimas y llegó ${JSON.stringify(minimas)}.`);
  }
  if (!Number.isFinite(eurosPorUnidad) || eurosPorUnidad <= 0) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }

  const enEuros = (minimas / unidadMinima(decimales)) * eurosPorUnidad;
  const centimos = redondear(enEuros * unidadMinima(DECIMALES_EURO));

  if (!Number.isSafeInteger(centimos)) {
    throw new Error('La conversión se pasó del rango en que JavaScript cuenta bien.');
  }
  return centimos;
}

/**
 * Invierte un tipo de cambio expresado al revés. El usuario suele conocerlo como
 * "cuántos colones es un euro" (CU-03), pero se guarda como euros por colón.
 */
function invertirCambio(unidadesPorEuro) {
  if (!Number.isFinite(unidadesPorEuro) || unidadesPorEuro <= 0) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }
  return 1 / unidadesPorEuro;
}

/**
 * Promedio de una lista de montos, redondeado una sola vez al final.
 * Una lista vacía da 0: no hay nada que promediar, y devolver 0 evita que la
 * app tenga que manejar un "no hay dato" en cada pantalla que muestre promedios.
 */
function promediar(minimas) {
  if (!Array.isArray(minimas)) {
    throw new Error('promediar() espera una lista de montos.');
  }
  if (minimas.length === 0) return 0;
  return redondear(sumar(minimas) / minimas.length);
}

// ── src/core/modelo.js ──────────────────────────────────────────
// Forma y validación de un movimiento: la única puerta por la que un gasto o un
// ingreso entra a los datos de la app.
//
// Por qué existe un módulo entero para esto: un movimiento mal formado no
// explota, se guarda. Y una vez guardado contamina el total del mes, el del año
// y el del viaje, sin que nada lo delate. Las reglas que impiden eso —RN-01,
// RN-02, RN-03— tienen que estar en UN solo lugar, con tests, y no repartidas
// por cada pantalla que cargue datos.
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.

// ── Vocabulario del dominio (PRODUCTO §4) ────────────────────────────────────
//
// Los nombres son los del Excel, tal cual (ADR-008): el usuario ya piensa en
// esos términos y renombrarlos lo obligaría a traducir mentalmente cada vez.

const TIPO_GASTO = 'G';
const TIPO_INGRESO = 'I';

const RUBROS_GASTO = Object.freeze([
  'gastos fijos',
  'supermercado',
  'comida hecha',
  'viajes',
  'entretenimiento',
  'transporte',
  'salud',
  'otros',
]);

const RUBROS_INGRESO = Object.freeze([
  'trabajo',
  'inversiones',
  'regalos',
  'otros',
]);

/**
 * Los rubros que acepta un tipo. `otros` aparece en las dos listas y son cosas
 * distintas: "otros gastos" y "otros ingresos" no se mezclan nunca en un total,
 * y lo que los mantiene separados es el campo `tipo`, no el nombre del rubro.
 */
function rubrosDe(tipo) {
  const normalizado = normalizarTipo(tipo);
  return normalizado === TIPO_GASTO ? RUBROS_GASTO : RUBROS_INGRESO;
}

// ── Normalización de texto (RN-03, L-002) ────────────────────────────────────

/**
 * Deja un texto listo para MOSTRARSE: sin espacios al principio ni al final, y
 * sin espacios repetidos en el medio. Conserva las mayúsculas.
 *
 * El `normalize('NFC')` no es adorno. En Unicode, "café" se puede escribir de
 * dos maneras: con una única "é" (U+00E9) o con una "e" seguida de una tilde
 * suelta (U+0065 U+0301). Se ven idénticas en pantalla y `===` dice que son
 * distintas. Los teclados de iOS y el texto copiado desde macOS producen a
 * veces la segunda forma. Sin esta línea, dos comentarios que el usuario ve
 * iguales quedarían como dos viajes distintos — la trampa de L-003, pero
 * invisible incluso mirando el dato. NFC elige siempre la forma compuesta.
 */
function normalizarTextoVisible(texto) {
  if (typeof texto !== 'string') {
    throw new Error(`Se esperaba un texto y llegó ${JSON.stringify(texto)}.`);
  }
  return texto.normalize('NFC').trim().replace(/\s+/g, ' ');
}

/**
 * La clave con la que se COMPARA y se AGRUPA un texto (RN-03): lo mismo que
 * arriba, más pasarlo a minúsculas.
 *
 * `VIAJES`, `viajes` y ` Viajes ` dan la misma clave. Excel comparaba así de
 * fábrica y nadie lo pidió; al reimplementar los cálculos en JavaScript, que
 * compara exacto, esa regla hay que escribirla o desaparece con parte del
 * dinero adentro de una categoría fantasma (L-002).
 *
 * Lo que esta función NO hace es sacar las tildes: `Perú` y `Peru` quedan como
 * dos claves distintas. Es a propósito y está anotado en ADR-013 — sacar
 * tildes también juntaría palabras que el usuario quiso separar, y es una
 * decisión de producto, no técnica.
 */
function normalizarClave(texto) {
  return normalizarTextoVisible(texto).toLowerCase();
}

/** El comentario es lo que agrupa un viaje o un gasto fijo. Se agrupa por esto. */
function claveDeComentario(comentario) {
  return normalizarClave(comentario);
}

function normalizarTipo(tipo) {
  const clave = normalizarClave(String(tipo ?? '')).toUpperCase();
  if (clave !== TIPO_GASTO && clave !== TIPO_INGRESO) {
    throw new Error(
      `El tipo de un movimiento es "${TIPO_GASTO}" (gasto) o "${TIPO_INGRESO}" (ingreso), y llegó ${JSON.stringify(tipo)}.`
    );
  }
  return clave;
}

/**
 * El rubro se guarda ya normalizado, en minúsculas. No se pierde nada al
 * mostrarlo: viene de una lista cerrada cuya forma canónica ya es minúscula
 * (`supermercado`, `gastos fijos`).
 */
function normalizarRubro(rubro, tipo) {
  const clave = normalizarClave(String(rubro ?? ''));
  const permitidos = rubrosDe(tipo);
  if (!permitidos.includes(clave)) {
    const nombreTipo = normalizarTipo(tipo) === TIPO_GASTO ? 'gasto' : 'ingreso';
    throw new Error(
      `"${rubro}" no es un rubro de ${nombreTipo}. Los de ${nombreTipo} son: ${permitidos.join(', ')}.`
    );
  }
  return clave;
}

/**
 * El código de moneda se guarda en mayúsculas (`EUR`, `CRC`).
 *
 * Acá solo se comprueba la FORMA. Que la moneda exista en la lista del usuario
 * lo decide `core/monedas.js` (T-008): la lista vive en los datos, no en el
 * código (RN-04b, ADR-011), así que este módulo no puede saberla sin tener una
 * copia que se desactualice.
 */
function normalizarMoneda(moneda) {
  const codigo = normalizarClave(String(moneda ?? '')).toUpperCase();
  if (!/^[A-Z]{3}$/.test(codigo)) {
    throw new Error(
      `El código de una moneda son tres letras, como EUR o CRC, y llegó ${JSON.stringify(moneda)}.`
    );
  }
  return codigo;
}

// ── Fecha (RN-01, L-005) ─────────────────────────────────────────────────────

const PATRON_FECHA = /^(\d{4})-(\d{2})-(\d{2})$/;

/**
 * Un movimiento tiene UNA fecha, `AAAA-MM-DD`, y de ella se derivan el día, el
 * mes y el año (RN-01). En el Excel el día y el mes eran dos columnas
 * independientes y nada obligaba a que dijeran lo mismo (L-005).
 *
 * La validación comprueba que el día EXISTA, no solo que el texto tenga la
 * forma correcta. `new Date('2026-02-30')` no falla: devuelve el 2 de marzo. Si
 * nos conformáramos con la forma, un dedazo mandaría el gasto a otro mes y el
 * total de febrero daría de menos sin ningún aviso.
 */
function validarFecha(valor) {
  if (typeof valor !== 'string') {
    throw new Error(`La fecha tiene que ser un texto AAAA-MM-DD, y llegó ${JSON.stringify(valor)}.`);
  }
  const coincidencia = PATRON_FECHA.exec(valor.trim());
  if (!coincidencia) {
    throw new Error(`La fecha se escribe como AAAA-MM-DD (por ejemplo 2026-03-14), y llegó "${valor}".`);
  }
  const [, textoAnio, textoMes, textoDia] = coincidencia;
  const anio = Number(textoAnio);
  const mes = Number(textoMes);
  const dia = Number(textoDia);

  const fecha = new Date(Date.UTC(anio, mes - 1, dia));
  const existe =
    fecha.getUTCFullYear() === anio &&
    fecha.getUTCMonth() === mes - 1 &&
    fecha.getUTCDate() === dia;

  if (!existe) {
    throw new Error(`El ${textoDia}/${textoMes}/${textoAnio} no existe en el calendario.`);
  }
  return `${textoAnio}-${textoMes}-${textoDia}`;
}

/**
 * El día de hoy, `AAAA-MM-DD`, según el calendario del dispositivo.
 *
 * Se leen el año, el mes y el día locales en vez de recortar un instante en UTC:
 * lo que importa es qué día es para la persona que está cargando el gasto, no
 * qué día es en Greenwich. A las 22:00 de un martes en Montevideo, recortar un
 * instante UTC daría el miércoles.
 */
function hoy(momento = new Date()) {
  const anio = momento.getFullYear();
  const mes = String(momento.getMonth() + 1).padStart(2, '0');
  const dia = String(momento.getDate()).padStart(2, '0');
  return `${anio}-${mes}-${dia}`;
}

/** El mes al que pertenece un movimiento, `AAAA-MM`. Se DERIVA de la fecha. */
function mesDe(fecha) {
  return validarFecha(fecha).slice(0, 7);
}

/**
 * Una fecha futura se PERMITE —se puede querer anotar algo ya pagado que
 * corresponde a otro día (CU-01)— pero la app avisa. Esta función es la que le
 * permite avisar; no rechaza nada.
 */
function esFechaFutura(fecha, hoy) {
  return validarFecha(fecha) > validarFecha(hoy);
}

// ── Identificador ────────────────────────────────────────────────────────────

/**
 * Un identificador estable, del estilo `mov_9f2c1a4b3d7e5602`.
 *
 * Son 8 bytes al azar (16 dígitos hexadecimales) y no 4, aunque el ejemplo de
 * ARQUITECTURA §5 mostrara 8 dígitos. Con 8 dígitos hay 4.294.967.296 valores
 * posibles, que suena a muchísimo, pero por la paradoja del cumpleaños la
 * probabilidad de que DOS movimientos compartan identificador ronda el 10% con
 * apenas 30.000 movimientos — el volumen que ARQUITECTURA §6 da por esperable.
 * Dos movimientos con el mismo id significan que editar uno cambia el otro y
 * que borrar uno borra el que no era. Con 16 dígitos la probabilidad se vuelve
 * despreciable y cuesta ocho caracteres más.
 *
 * `crypto` es un objeto global tanto en el navegador como en Node, así que usarlo
 * no rompe la regla de que `core/` no depende del navegador.
 */
function nuevoId(prefijo = 'mov') {
  const bytes = new Uint8Array(8);
  crypto.getRandomValues(bytes);
  const hex = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
  return `${prefijo}_${hex}`;
}

// ── Crear y validar un movimiento ────────────────────────────────────────────

/**
 * Arma un movimiento a partir de lo que una persona ESCRIBIÓ.
 *
 * `monto` viene en unidades de la moneda —lo que el usuario tipeó: `"12,50"`,
 * `12.5`— y sale guardado en unidades mínimas (`1250`). Por eso hace falta
 * `decimales`: cuántos usa esa moneda lo dice la lista del usuario (RN-04b), no
 * este módulo.
 *
 * `creado` es el DÍA en que se cargó, no un instante: la app no registra la
 * hora de nada (ADR-021).
 *
 * Para un movimiento que YA está guardado —leído de localStorage o de un
 * respaldo, con el monto ya en enteros— está `validarMovimiento()`. Son dos
 * puertas separadas a propósito (ADR-014): si una sola función tuviera que
 * adivinar si `1250` son 1250 € o 12,50 €, se equivocaría por un factor de cien
 * en silencio, que es exactamente el error que ADR-005 vino a evitar.
 */
function crearMovimiento(entrada, opciones = {}) {
  if (entrada === null || typeof entrada !== 'object') {
    throw new Error('Para crear un movimiento hace falta un objeto con sus datos.');
  }
  const { decimales, id, creado } = opciones;
  if (decimales === undefined) {
    throw new Error(
      'Falta saber cuántos decimales usa la moneda: sin ese dato el monto se guardaría cien veces más grande o más chico (RN-04b).'
    );
  }

  const tipo = normalizarTipo(entrada.tipo);
  const monto = aMinimas(entrada.monto, decimales);
  if (monto === 0) {
    throw new Error('Un movimiento de cero no se guarda: si no hubo dinero de por medio, no hay nada que registrar.');
  }

  return {
    id: id ?? nuevoId(),
    fecha: validarFecha(entrada.fecha),
    tipo,
    rubro: normalizarRubro(entrada.rubro, tipo),
    monto,
    moneda: normalizarMoneda(entrada.moneda),
    // El comentario se guarda TAL COMO SE ESCRIBIÓ (sin espacios de más) para
    // que la app pueda mostrar "Roma" y no "roma". Lo que agrupa no es este
    // texto sino su clave, que sale de claveDeComentario(). Ver ADR-013.
    comentario: entrada.comentario ? normalizarTextoVisible(entrada.comentario) : '',
    // El detalle es texto libre y NO agrupa nada (PRODUCTO §4), así que se
    // respeta entero: solo se le sacan los espacios de los bordes.
    detalle: entrada.detalle ? entrada.detalle.normalize('NFC').trim() : '',
    creado: creado ? validarFecha(creado) : hoy(),
  };
}

/**
 * Comprueba un movimiento que YA viene guardado y devuelve una copia limpia.
 * Acá `monto` es un entero en unidades mínimas: no se reinterpreta.
 *
 * Devuelve una copia con solo los campos del modelo, en vez del objeto original:
 * un respaldo editado a mano o el archivo de otra versión de la app pueden traer
 * campos de más, y arrastrarlos hacia adentro es cómo un dato viejo sobrevive a
 * su propia migración.
 */
function validarMovimiento(movimiento) {
  if (movimiento === null || typeof movimiento !== 'object') {
    throw new Error(`Se esperaba un movimiento y llegó ${JSON.stringify(movimiento)}.`);
  }
  if (typeof movimiento.id !== 'string' || movimiento.id.trim() === '') {
    throw new Error('El movimiento no tiene identificador.');
  }
  const tipo = normalizarTipo(movimiento.tipo);
  const monto = validarMonto(movimiento.monto);
  if (monto === 0) {
    throw new Error(`El movimiento ${movimiento.id} tiene monto cero.`);
  }
  let creado;
  try {
    creado = validarFecha(movimiento.creado);
  } catch {
    throw new Error(`El movimiento ${movimiento.id} no tiene una fecha de creación válida.`);
  }

  return {
    id: movimiento.id.trim(),
    fecha: validarFecha(movimiento.fecha),
    tipo,
    rubro: normalizarRubro(movimiento.rubro, tipo),
    monto,
    moneda: normalizarMoneda(movimiento.moneda),
    comentario: movimiento.comentario ? normalizarTextoVisible(movimiento.comentario) : '',
    detalle: movimiento.detalle ? movimiento.detalle.normalize('NFC').trim() : '',
    creado,
  };
}

// ── src/core/monedas.js ─────────────────────────────────────────
// El catálogo de monedas.
//
// La lista vive en los DATOS del usuario, no en este código (RN-04b, ADR-011).
// El motivo es concreto: si estuviera en el código, agregar una moneda para un
// viaje imprevisto exigiría publicar una versión nueva de la app — con la persona
// en otro país, sin poder registrar sus gastos, esperando un archivo.
//
// Este módulo no guarda nada: recibe la lista y devuelve una lista nueva. Quien
// persiste es `datos/almacenamiento.js`. Todas las funciones de acá son puras y
// **no modifican la lista que reciben**, porque una función que muta lo que le
// pasan obliga a acordarse de copiar en cada llamada, y basta olvidarse una vez.
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.


/**
 * El euro es distinto de todas las demás: es la moneda base (RN-04), todos los
 * totales se expresan en ella, y por eso no se puede borrar, ni ocultar, ni
 * cambiarle los decimales.
 */
const MONEDA_BASE = 'EUR';

// Las cuatro que el usuario usa hoy (RN-04b). Son un punto de partida editable,
// no una lista cerrada: se agregan y se ocultan desde la app (CU-15).
const INICIALES = [
  { codigo: 'EUR', nombre: 'Euro', decimales: 2, oculta: false },
  { codigo: 'UYU', nombre: 'Peso uruguayo', decimales: 2, oculta: false },
  { codigo: 'USD', nombre: 'Dólar estadounidense', decimales: 2, oculta: false },
  { codigo: 'CRC', nombre: 'Colón costarricense', decimales: 2, oculta: false },
];

/**
 * Las monedas de un primer arranque. Devuelve copias nuevas cada vez: si
 * devolviera siempre los mismos objetos, ocultar una moneda en un juego de datos
 * la ocultaría también en el siguiente.
 */
function monedasIniciales() {
  return INICIALES.map((moneda) => ({ ...moneda }));
}

/**
 * Arma una moneda válida a partir de lo que el usuario escribió.
 *
 * Los decimales los valida `dinero.js` llamando a `unidadMinima()`, en vez de
 * repetir acá el rango permitido. Dos reglas iguales escritas en dos lugares es
 * cómo terminan diciendo cosas distintas.
 */
function crearMoneda({ codigo, nombre, decimales = 2 } = {}) {
  const codigoNormalizado = normalizarMoneda(codigo);

  if (typeof nombre !== 'string' || nombre.trim() === '') {
    throw new Error(`Falta el nombre de la moneda ${codigoNormalizado}.`);
  }
  unidadMinima(decimales); // tira si no es un entero de 0 a 4

  return {
    codigo: codigoNormalizado,
    nombre: normalizarTextoVisible(nombre),
    decimales,
    oculta: false,
  };
}

/** Busca por código, sin distinguir mayúsculas ni espacios (RN-03). */
function buscarMoneda(monedas, codigo) {
  const buscado = normalizarClave(String(codigo ?? ''));
  return listaDe(monedas).find((m) => normalizarClave(String(m?.codigo ?? '')) === buscado) ?? null;
}

/**
 * Cuántos decimales usa una moneda.
 *
 * **Tira si la moneda no está en la lista**, en vez de suponer 2. Suponer sería
 * cómodo y equivocarse costaría un factor de cien en todos los importes de esa
 * moneda (ADR-005, ADR-011). Un error acá se ve enseguida; una suposición
 * silenciosa aparece meses después, en un total que nadie sabe explicar.
 */
function decimalesDe(monedas, codigo) {
  const moneda = buscarMoneda(monedas, codigo);
  if (moneda === null) {
    throw new Error(
      `La moneda "${codigo}" no está en tu lista, así que no se sabe cuántos decimales usa. Agregala antes de cargar el movimiento.`
    );
  }
  return moneda.decimales;
}

/** Las que se muestran en el formulario de carga: todas menos las ocultas. */
function monedasVisibles(monedas) {
  return listaDe(monedas).filter((m) => m?.oculta !== true);
}

/**
 * Agrega una moneda. El código repetido se rechaza sin distinguir mayúsculas:
 * `crc` y `CRC` son la misma moneda, y admitir las dos partiría los totales de
 * Costa Rica en dos mitades que nunca se suman (L-002).
 */
function agregarMoneda(monedas, entrada) {
  const lista = listaDe(monedas);
  const nueva = crearMoneda(entrada);

  if (buscarMoneda(lista, nueva.codigo) !== null) {
    throw new Error(`Ya tenés una moneda con el código ${nueva.codigo}.`);
  }
  return [...lista, nueva];
}

/**
 * Cambia los decimales de una moneda.
 *
 * **Esto reinterpreta todos los importes ya cargados en esa moneda** (PRODUCTO,
 * CU-15): un monto guardado como `1500` son 15,00 con dos decimales y 1500 con
 * cero. No se reescriben los montos, se leen distinto. Quien llame tiene que
 * avisarle al usuario cuántos movimientos cambian de significado — para eso está
 * `contarMovimientosDe()`.
 */
function cambiarDecimalesDe(monedas, codigo, decimales) {
  const lista = listaDe(monedas);
  const moneda = exigirMoneda(lista, codigo);

  if (moneda.codigo === MONEDA_BASE) {
    throw new Error(
      'El euro es la moneda base y siempre usa dos decimales: todos los totales de la app se expresan en euros.'
    );
  }
  unidadMinima(decimales);

  return lista.map((m) => (m === moneda ? { ...m, decimales } : m));
}

/** Cuántos movimientos hay cargados en una moneda. Sin tope de filas (L-001). */
function contarMovimientosDe(movimientos, codigo) {
  const buscado = normalizarClave(String(codigo ?? ''));
  if (!Array.isArray(movimientos)) return 0;
  return movimientos.filter((m) => normalizarClave(String(m?.moneda ?? '')) === buscado).length;
}

/**
 * Oculta una moneda: deja de ofrecerse al cargar, pero sus movimientos siguen
 * existiendo y contando en los totales.
 *
 * Es la salida para "esta ya no la uso" sin perder el historial del viaje.
 */
function ocultarMoneda(monedas, codigo) {
  const lista = listaDe(monedas);
  const moneda = exigirMoneda(lista, codigo);

  if (moneda.codigo === MONEDA_BASE) {
    throw new Error('El euro no se puede ocultar: es la moneda en la que se expresan todos los totales.');
  }
  return lista.map((m) => (m === moneda ? { ...m, oculta: true } : m));
}

function mostrarMoneda(monedas, codigo) {
  const lista = listaDe(monedas);
  const moneda = exigirMoneda(lista, codigo);
  return lista.map((m) => (m === moneda ? { ...m, oculta: false } : m));
}

/**
 * Borra una moneda de la lista. Solo se puede si NO tiene movimientos.
 *
 * Borrar una moneda con movimientos dejaría gastos sin forma de saber cuántos
 * decimales tienen ni cómo convertirlos a euros: registros huérfanos que ninguna
 * pantalla podría mostrar bien y que ningún total podría sumar. Por eso la
 * respuesta no es "¿estás seguro?" sino "no, y en cambio podés ocultarla".
 */
function borrarMoneda(monedas, codigo, movimientos = []) {
  const lista = listaDe(monedas);
  const moneda = exigirMoneda(lista, codigo);

  if (moneda.codigo === MONEDA_BASE) {
    throw new Error('El euro no se puede borrar: es la moneda base de la app.');
  }

  const cuantos = contarMovimientosDe(movimientos, moneda.codigo);
  if (cuantos > 0) {
    const plural = cuantos === 1 ? 'movimiento cargado' : 'movimientos cargados';
    throw new Error(
      `${moneda.nombre} tiene ${cuantos} ${plural}: borrarla los dejaría sin forma de convertirse a euros. Ocultala en vez de borrarla.`
    );
  }
  return lista.filter((m) => m !== moneda);
}

function listaDe(monedas) {
  if (!Array.isArray(monedas)) {
    throw new Error('El catálogo de monedas tiene que ser una lista.');
  }
  return monedas;
}

function exigirMoneda(lista, codigo) {
  const moneda = buscarMoneda(lista, codigo);
  if (moneda === null) {
    throw new Error(`No hay ninguna moneda con el código "${codigo}" en tu lista.`);
  }
  return moneda;
}

// ── src/core/cambio.js ──────────────────────────────────────────
// Tipos de cambio y conversión a euros.
//
// Todo total de la app se expresa en euros (RN-04), pero cada gasto se carga en
// la moneda en que se gastó. Este módulo es el puente: guarda cuánto valía una
// moneda en un mes dado, y convierte.
//
// Dos reglas del producto gobiernan el archivo:
//
//   RN-04 — el tipo de cambio es por (moneda, MES), no por día ni por
//           movimiento. Un viaje de dos semanas usa el mismo para todo el mes.
//   RN-05 — el importe en euros NO se guarda: se deriva. Si más adelante se
//           descubre que el tipo de cambio estaba mal, corregirlo una vez
//           arregla el mes entero.
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.



/**
 * El euro no necesita tipo de cambio: vale 1 euro por definición. Tenerlo como
 * un dato guardado sería una fuente de error —alguien podría cargarlo mal— y
 * obligaría a pedirlo al usuario la primera vez que registre un gasto en euros,
 * que es el 90% de los casos.
 */
const CAMBIO_EURO = 1;

const PATRON_MES = /^\d{4}-\d{2}$/;

/**
 * ¿Dos códigos de moneda son el mismo? Sin tirar: un dato guardado puede traer
 * la moneda rota, y buscar un tipo de cambio no es el lugar donde eso tiene que
 * explotar — para eso está la validación al leer (T-004).
 */
function mismoCodigo(uno, otro) {
  try {
    return normalizarMoneda(uno) === normalizarMoneda(otro);
  } catch {
    return false;
  }
}

function validarMes(mes) {
  if (typeof mes !== 'string' || !PATRON_MES.test(mes)) {
    throw new Error(`El mes se escribe como AAAA-MM (por ejemplo 2026-03), y llegó ${JSON.stringify(mes)}.`);
  }
  const numeroMes = Number(mes.slice(5));
  if (numeroMes < 1 || numeroMes > 12) {
    throw new Error(`No existe el mes ${mes}.`);
  }
  return mes;
}

/**
 * Arma un tipo de cambio para guardar.
 *
 * Se guarda **euros por una unidad de la moneda extranjera**, porque convertir
 * es entonces una multiplicación, que es la operación que menos se presta a
 * error. Al usuario se le puede preguntar en cualquiera de los dos sentidos
 * (CU-03) y la app invierte el número antes de guardarlo — ver `desdeUnidadesPorEuro`.
 */
function crearCambio({ moneda, mes, euros_por_unidad } = {}, { creado } = {}) {
  const codigo = normalizarMoneda(moneda);

  if (codigo === MONEDA_BASE) {
    throw new Error('El euro no lleva tipo de cambio: es la moneda en la que se expresan todos los totales.');
  }
  if (!Number.isFinite(euros_por_unidad) || euros_por_unidad <= 0) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }

  return {
    moneda: codigo,
    mes: validarMes(mes),
    euros_por_unidad,
    creado: creado ? validarFecha(creado) : hoy(),
  };
}

/**
 * Toma el tipo de cambio como suele conocerlo el usuario —"un euro son 630
 * colones"— y lo da vuelta a la forma en que se guarda.
 *
 * Existe como función propia y no como una división suelta en la pantalla porque
 * es exactamente el punto donde un número se puede guardar del revés. Un tipo de
 * cambio invertido no da un error: da totales absurdos que alguien tiene que
 * notar mirando.
 */
function desdeUnidadesPorEuro(unidadesPorEuro) {
  return invertirCambio(unidadesPorEuro);
}

/** El mismo valor visto al revés, para mostrarlo como el usuario lo conoce. */
function aUnidadesPorEuro(eurosPorUnidad) {
  return invertirCambio(eurosPorUnidad);
}

/**
 * Busca el tipo de cambio de una moneda para un mes. Devuelve `null` si no está:
 * "no hay dato" es una respuesta legítima y frecuente —es lo que dispara que la
 * app lo pida (CU-03)—, no un error.
 *
 * Para el euro devuelve siempre 1 sin buscar nada.
 */
function buscarCambio(cambios, moneda, mes) {
  const codigo = normalizarMoneda(moneda);
  if (codigo === MONEDA_BASE) return CAMBIO_EURO;

  validarMes(mes);
  if (!Array.isArray(cambios)) {
    throw new Error('La lista de tipos de cambio tiene que ser una lista.');
  }

  // Se recorre la lista entera, sin ningún tope escrito a mano (L-001).
  const encontrado = cambios.find((c) => c && mismoCodigo(c.moneda, codigo) && c.mes === mes);
  return encontrado ? encontrado.euros_por_unidad : null;
}

/**
 * Guarda un tipo de cambio, reemplazando el que hubiera para ese par
 * `(moneda, mes)`. La clave única es el par: no puede haber dos.
 *
 * Devuelve una lista nueva; no modifica la que recibe.
 */
function guardarCambio(cambios, cambio) {
  const lista = Array.isArray(cambios) ? cambios : [];
  const nuevo = cambio.creado ? cambio : crearCambio(cambio);

  const sinElViejo = lista.filter((c) => !(c && mismoCodigo(c.moneda, nuevo.moneda) && c.mes === nuevo.mes));
  return [...sinElViejo, nuevo];
}

/**
 * ¿Se puede convertir este movimiento a euros?
 *
 * Es la pregunta que la pantalla de carga hace **antes de guardar** (RN-04): si
 * falta el tipo de cambio para la moneda de ese movimiento en su mes, hay que
 * pedirlo. Devuelve `null` si está todo bien, o un objeto que dice qué falta.
 */
function faltaCambioPara(movimiento, cambios) {
  const moneda = normalizarMoneda(movimiento.moneda);
  if (moneda === MONEDA_BASE) return null;

  const mes = mesDe(movimiento.fecha);
  const cambio = buscarCambio(cambios, moneda, mes);
  return cambio === null ? { moneda, mes } : null;
}

/**
 * Convierte un movimiento a céntimos de euro.
 *
 * **Tira si falta el tipo de cambio**, en vez de devolver 0 o de saltear el
 * movimiento. Un movimiento que se cuenta como cero desaparece de un total sin
 * dejar rastro: el total baja, no hay error, y nadie se entera. Quien llame
 * tiene que haber preguntado antes con `faltaCambioPara()`.
 */
function movimientoEnEuros(movimiento, cambios, monedas) {
  const moneda = normalizarMoneda(movimiento.moneda);
  const mes = mesDe(movimiento.fecha);
  const decimales = decimalesDe(monedas, moneda);

  if (moneda === MONEDA_BASE) {
    // Ya está en euros: no se convierte ni se redondea. Redondear algo que no
    // hace falta convertir solo puede empeorarlo.
    return movimiento.monto;
  }

  const cambio = buscarCambio(cambios, moneda, mes);
  if (cambio === null) {
    throw new Error(
      `Falta el tipo de cambio de ${moneda} para ${mes}: sin él este movimiento no se puede expresar en euros.`
    );
  }
  return convertirAEuros(movimiento.monto, decimales, cambio);
}

/**
 * Suma en euros una lista de movimientos.
 *
 * Cada movimiento se convierte y se redondea al céntimo **antes** de sumarse, no
 * después: es la unidad en que la app muestra y exporta los importes, así que el
 * total tiene que ser la suma de lo que el usuario ve. Un total que no coincide
 * con la suma de las filas de la pantalla es un total que nadie va a creer,
 * aunque sea "más exacto".
 *
 * No recibe ningún rango ni límite: recorre la lista entera (L-001).
 */
function totalEnEuros(movimientos, cambios, monedas) {
  if (!Array.isArray(movimientos)) {
    throw new Error('totalEnEuros() espera una lista de movimientos.');
  }
  return sumar(movimientos.map((m) => movimientoEnEuros(m, cambios, monedas)));

/**
 * Los tipos de cambio que faltan para poder mostrar en euros una lista de
 * movimientos, sin repetir. Sirve para avisar de una vez —"faltan CRC de marzo y
 * USD de abril"— en vez de ir descubriéndolos de a uno.
 */
function cambiosQueFaltan(movimientos, cambios) {
  const vistos = new Map();
  for (const movimiento of movimientos) {
    const falta = faltaCambioPara(movimiento, cambios);
    if (falta) vistos.set(`${falta.moneda}|${falta.mes}`, falta);
  }
  return [...vistos.values()];
}

/**
 * Cuántos movimientos se verían afectados por cambiar el tipo de cambio de
 * `(moneda, mes)`.
 *
 * Existe por RN-05: corregir un tipo de cambio **cambia totales de meses ya
 * cerrados**, y la app tiene que decir cuántos movimientos toca *antes* de
 * aplicarlo. Un número que cambia solo, sin aviso, es la forma más rápida de que
 * alguien deje de confiar en la app.
 */
function movimientosAfectadosPor(movimientos, moneda, mes) {
  const codigo = normalizarMoneda(moneda);
  validarMes(mes);
  if (!Array.isArray(movimientos)) return 0;
  return movimientos.filter((m) => m && mismoCodigo(m.moneda, codigo) && mesDe(m.fecha) === mes).length;
}

// ── src/core/formato.js ─────────────────────────────────────────
// Cómo se muestran los montos y las fechas.
//
// Es el único módulo cuyo trabajo es puramente cosmético, y aun así puede mentir:
// un importe formateado con los decimales equivocados o una fecha corrida un día
// son errores que el usuario ve como datos, no como fallas de presentación. Y a
// diferencia de un cálculo mal, nadie los va a descubrir con un test de negocio:
// se descubren mirando la pantalla y desconfiando.
//
// Sin librerías: `Intl` viene en el navegador y en Node (ADR-003).
//
// Este archivo no toca el navegador. Es lógica pura y se testea con node --test.


// El español de España: coma decimal, punto de miles, y la fecha como
// día/mes/año. Es el idioma en el que el usuario piensa sus gastos.
const IDIOMA = 'es-ES';

/**
 * Un monto guardado, listo para mostrar: `1250` con 2 decimales sale `12,50 €`.
 *
 * **Los decimales los manda el catálogo del usuario, no `Intl`.** Es la parte
 * que importa de esta función. `Intl` trae su propia idea de cuántos decimales
 * usa cada moneda —para el yen, cero— y si la dejáramos decidir, una moneda que
 * el usuario configuró distinto se mostraría con otros decimales de los que se
 * guardó. El número seguiría siendo correcto por dentro y la pantalla estaría
 * mintiendo. Se fuerzan los nuestros, en los dos sentidos (mínimo y máximo).
 *
 * Para un código de moneda que no existe en el estándar —el usuario puede
 * inventar el que quiera (ADR-011)— `Intl` no falla: muestra el código tal cual,
 * `1.234,50 XYZ`. Comprobado, no supuesto.
 */
function formatearMonto(minimas, decimales, moneda = 'EUR') {
  const codigo = normalizarMoneda(moneda);
  const numero = aNumero(minimas, decimales);

  return new Intl.NumberFormat(IDIOMA, {
    style: 'currency',
    currency: codigo,
    minimumFractionDigits: decimales,
    maximumFractionDigits: decimales,
  }).format(numero);
}

/** Un importe en céntimos de euro, que es la unidad de todos los totales. */
function formatearEuros(centimos) {
  return formatearMonto(centimos, DECIMALES_EURO, 'EUR');
}

/**
 * Un monto sin el símbolo de la moneda, para las tablas donde la moneda ya está
 * en otra columna y repetirla en cada fila es ruido.
 */
function formatearNumero(minimas, decimales) {
  return new Intl.NumberFormat(IDIOMA, {
    minimumFractionDigits: decimales,
    maximumFractionDigits: decimales,
  }).format(aNumero(minimas, decimales));
}

// ── Fechas ───────────────────────────────────────────────────────────────────

const MESES = [
  'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
  'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
];

/**
 * Convierte `AAAA-MM-DD` en un `Date` fijado al mediodía UTC.
 *
 * **Por qué no `new Date('2026-03-14')` a secas:** eso da la medianoche UTC, y
 * al mostrarla el navegador la traduce a la zona horaria del dispositivo. En
 * Montevideo (UTC−3) la medianoche del 14 es **las 21:00 del 13**, así que la
 * app mostraría un día menos. Comprobado, no supuesto:
 *
 *     America/Montevideo  →  13/3/2026     ← el gasto se ve el día anterior
 *     Europe/Madrid       →  14/3/2026
 *
 * Y no es un caso de laboratorio: el usuario tiene ahorros y gastos en pesos
 * uruguayos. Un gasto que aparece un día antes en el celular es indistinguible
 * de un error de carga, y ensucia el gasto por día (CU-05).
 *
 * La fecha de un movimiento es un día del calendario, no un instante: no tiene
 * hora ni zona. Fijarla al mediodía UTC hace que ninguna zona horaria del mundo
 * —de UTC−12 a UTC+14— la corra de día.
 */
function comoFecha(iso) {
  const [anio, mes, dia] = validarFecha(iso).split('-').map(Number);
  return new Date(Date.UTC(anio, mes - 1, dia, 12));
}

/**
 * `2026-03-14` → `14/03/2026`. Para listas.
 *
 * Con día y mes de dos dígitos siempre, aunque `Intl` por omisión escriba
 * `14/3/2026`: en una lista de gastos las fechas se leen en columna, y el ancho
 * fijo hace que se puedan comparar de un vistazo.
 */
function formatearFecha(iso) {
  return new Intl.DateTimeFormat(IDIOMA, {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    timeZone: 'UTC',
  }).format(comoFecha(iso));
}

/** `2026-03-14` → `14 de marzo de 2026`. Para encabezados y confirmaciones. */
function formatearFechaLarga(iso) {
  const [anio, mes, dia] = validarFecha(iso).split('-').map(Number);
  return `${dia} de ${MESES[mes - 1]} de ${anio}`;
}

/** `2026-03-14` → `sábado`. Para el detalle del día. */
function formatearDiaSemana(iso) {
  return new Intl.DateTimeFormat(IDIOMA, { weekday: 'long', timeZone: 'UTC' }).format(comoFecha(iso));
}

/**
 * `2026-03` → `marzo de 2026`. Es el título de la pantalla del mes.
 *
 * Recibe el mes como `AAAA-MM` y no una fecha, porque el mes es lo que agrupa
 * (RN-04) y pedir una fecha obligaría a inventar un día.
 */
function formatearMes(mes) {
  if (typeof mes !== 'string' || !/^\d{4}-\d{2}$/.test(mes)) {
    throw new Error(`El mes se escribe como AAAA-MM (por ejemplo 2026-03), y llegó ${JSON.stringify(mes)}.`);
  }
  const numeroMes = Number(mes.slice(5));
  if (numeroMes < 1 || numeroMes > 12) {
    throw new Error(`No existe el mes ${mes}.`);
  }
  return `${MESES[numeroMes - 1]} de ${mes.slice(0, 4)}`;
}

/**
 * El tipo de cambio como el usuario lo conoce: "1 EUR = 630,25 CRC".
 *
 * Se muestra en el sentido de "cuántas unidades por euro" y no al revés, aunque
 * por dentro se guarde al revés (ADR: `core/cambio.js`). Un `0,001587` en
 * pantalla no le dice nada a nadie; `630,25` es el número que la persona vio en
 * la casa de cambio.
 */
function formatearTipoDeCambio(eurosPorUnidad, moneda) {
  const codigo = normalizarMoneda(moneda);
  if (!Number.isFinite(eurosPorUnidad) || eurosPorUnidad <= 0) {
    throw new Error('El tipo de cambio tiene que ser un número mayor que cero.');
  }

  const unidadesPorEuro = 1 / eurosPorUnidad;
  // Los decimales que se muestran dependen de la magnitud: con 630 colones por
  // euro sobran dos, pero con 1,08 dólares por euro dos decimales esconderían la
  // diferencia entre 1,085 y 1,089 — que en un mes de gastos son varios euros.
  const decimales = unidadesPorEuro >= 100 ? 2 : unidadesPorEuro >= 1 ? 4 : 6;

  const numero = new Intl.NumberFormat(IDIOMA, {
    minimumFractionDigits: decimales,
    maximumFractionDigits: decimales,
  }).format(unidadesPorEuro);

  return `1 EUR = ${numero} ${codigo}`;
}

// ── src/datos/almacenamiento.js ─────────────────────────────────
// La única puerta a los datos guardados. Todo lo que la app persiste pasa por
// acá, bajo una sola clave de localStorage (ARQUITECTURA §6).
//
// Este módulo carga con el riesgo más grave de toda la arquitectura: acá vive la
// única copia de los gastos del usuario. No hay servidor, no hay papelera, no hay
// historial. Un error de este archivo no da un número mal: borra meses de
// registro. Por eso hay una regla que gobierna todo lo de abajo:
//
//   ANTE LA DUDA, NO SE ESCRIBE.
//
// Si lo guardado no se entiende, este módulo devuelve un estado vacío para que la
// app abra igual, pero AVISA que lo hizo y GUARDA APARTE lo que no pudo leer. Lo
// que nunca hace es pisar en silencio un dato que no entendió: un dato ilegible
// todavía se puede rescatar a mano; uno sobrescrito, no.

const CLAVE_DATOS = 'viajecor:datos:v1';

// Sube solo si cambia la FORMA de los datos guardados (PRODUCTO §9). No sube
// porque se agregue una pantalla ni porque cambie un cálculo.
const ESQUEMA_ACTUAL = 1;

/** El prefijo bajo el que se preserva lo que no se pudo interpretar. */
const PREFIJO_RESCATE = 'viajecor:rescate:';

/**
 * El estado de un primer arranque: la app abierta por primera vez en un
 * dispositivo.
 *
 * `monedas` viene vacío a propósito. Las cuatro precargadas (RN-04b) las define
 * `core/monedas.js` (T-008), y tenerlas también acá serían dos listas que se
 * desincronizan: la trampa de L-005 aplicada al código. Quien arme el estado
 * inicial le pasa la lista.
 */
function estadoInicial({ monedas = [], versionApp } = {}) {
  return {
    esquema: ESQUEMA_ACTUAL,
    version_app: versionApp ?? globalThis.__VIAJECOR_VERSION__ ?? 'sin construir',
    movimientos: [],
    tipos_cambio: [],
    monedas: [...monedas],
    preferencias: { moneda_predeterminada: 'EUR' },
  };
}

function almacenPorDefecto() {
  if (typeof localStorage === 'undefined') {
    throw new Error(
      'No hay dónde guardar: este navegador no tiene localStorage disponible. ' +
      'Suele pasar en ventanas privadas de algunos navegadores.'
    );
  }
  return localStorage;
}

/**
 * Lee el estado guardado.
 *
 * **Nunca tira.** Que la app no abra porque un dato está raro es el peor
 * resultado posible: el usuario se queda sin ver ni siquiera lo que sí está
 * bien. Devuelve siempre algo usable, más un parte de qué pasó:
 *
 *   { estado, incidencias, primerArranque, rescate }
 *
 * `incidencias` es una lista de textos en castellano llano, pensados para
 * mostrarse. Si está vacía, lo guardado se leyó entero y sin pérdida.
 */
function leerEstado(almacen = almacenPorDefecto()) {
  const incidencias = [];
  let crudo = null;

  try {
    crudo = almacen.getItem(CLAVE_DATOS);
  } catch (error) {
    // Safari en modo privado puede tirar hasta al LEER. La app tiene que abrir.
    incidencias.push(`No se pudo acceder al almacenamiento del navegador: ${error.message}`);
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate: null, soloLectura: false };
  }

  if (crudo === null || crudo === '') {
    return { estado: estadoInicial(), incidencias, primerArranque: true, rescate: null, soloLectura: false };
  }

  let leido;
  try {
    leido = JSON.parse(crudo);
  } catch {
    // Lo guardado no es ni JSON. No se entiende nada, así que no se toca: se
    // aparta con su fecha y se sigue. Un dato ilegible todavía se puede rescatar
    // a mano; uno sobrescrito, no.
    const rescate = preservar(almacen, crudo, incidencias);
    incidencias.push(
      'Lo que había guardado no se pudo leer y se apartó sin tocarlo. La app arranca vacía, ' +
      'pero tus datos anteriores no se borraron: seguí desde un respaldo exportado si tenés uno.'
    );
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate, soloLectura: false };
  }

  if (leido === null || typeof leido !== 'object' || Array.isArray(leido)) {
    const rescate = preservar(almacen, crudo, incidencias);
    incidencias.push('Lo guardado no tiene la forma de un juego de datos de Viajecor y se apartó sin tocarlo.');
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate, soloLectura: false };
  }

  // Datos escritos por una versión MÁS NUEVA de la app. Este código no sabe qué
  // significan, y guardar encima los destruiría. Se abre en blanco y se avisa;
  // el usuario abrirá la versión nueva, donde sus datos siguen intactos.
  if (Number.isInteger(leido.esquema) && leido.esquema > ESQUEMA_ACTUAL) {
    incidencias.push(
      `Estos datos los escribió una versión más nueva de Viajecor (esquema ${leido.esquema}, ` +
      `esta app entiende hasta el ${ESQUEMA_ACTUAL}). No se tocaron. Abrilos con la versión nueva.`
    );
    return { estado: estadoInicial(), incidencias, primerArranque: false, rescate: null, soloLectura: true };
  }

  const estado = migrarEstado(leido, incidencias);
  return { estado, incidencias, primerArranque: false, rescate: null, soloLectura: false };
}

/**
 * Lleva un estado guardado a la forma actual, campo por campo.
 *
 * Cada campo se valida por separado y lo que no se entiende se descarta CON
 * AVISO. La alternativa —tirar todo el estado porque tres movimientos de
 * quinientos están rotos— pierde 497 movimientos buenos; la otra alternativa
 * —descartarlos en silencio— es peor todavía, porque el total del mes cambia y
 * nadie se entera. Es la misma regla que el importador (T-032): informar fila
 * por fila qué no se pudo leer.
 */
function migrarEstado(guardado, incidencias = []) {
  const estado = estadoInicial();

  if (!Number.isInteger(guardado.esquema)) {
    incidencias.push('Los datos no decían con qué versión del formato se guardaron; se leyeron como la actual.');
  }
  if (typeof guardado.version_app === 'string') {
    estado.version_app = guardado.version_app;
  }

  estado.movimientos = leerLista(guardado.movimientos, 'movimientos', incidencias, (mov) =>
    validarMovimiento(mov)
  );

  estado.tipos_cambio = leerLista(guardado.tipos_cambio, 'tipos de cambio', incidencias, (tc) => {
    if (tc === null || typeof tc !== 'object') throw new Error('no es un tipo de cambio');
    if (typeof tc.moneda !== 'string' || !/^[A-Za-z]{3}$/.test(tc.moneda.trim())) {
      throw new Error('la moneda no es un código de tres letras');
    }
    if (typeof tc.mes !== 'string' || !/^\d{4}-\d{2}$/.test(tc.mes)) {
      throw new Error('el mes no está escrito como AAAA-MM');
    }
    if (!Number.isFinite(tc.euros_por_unidad) || tc.euros_por_unidad <= 0) {
      throw new Error('el tipo de cambio no es un número mayor que cero');
    }
    return {
      moneda: tc.moneda.trim().toUpperCase(),
      mes: tc.mes,
      euros_por_unidad: tc.euros_por_unidad,
      creado: /^\d{4}-\d{2}-\d{2}$/.test(tc.creado) ? tc.creado : '1970-01-01',
    };
  });

  // Las monedas se guardan como vengan: quien manda sobre su forma es
  // core/monedas.js (T-008), y validarlas acá con una copia de sus reglas sería
  // tener dos jueces que tarde o temprano dicen cosas distintas.
  estado.monedas = Array.isArray(guardado.monedas) ? guardado.monedas : [];
  if (guardado.monedas !== undefined && !Array.isArray(guardado.monedas)) {
    incidencias.push('La lista de monedas guardada no era una lista y se ignoró.');
  }

  const preferencias = guardado.preferencias;
  if (preferencias !== null && typeof preferencias === 'object' && !Array.isArray(preferencias)) {
    const moneda = preferencias.moneda_predeterminada;
    if (typeof moneda === 'string' && /^[A-Za-z]{3}$/.test(moneda.trim())) {
      estado.preferencias.moneda_predeterminada = moneda.trim().toUpperCase();
    }
  }

  return estado;
}

function leerLista(valor, nombre, incidencias, validar) {
  if (valor === undefined || valor === null) return [];
  if (!Array.isArray(valor)) {
    incidencias.push(`La lista de ${nombre} guardada no era una lista y se ignoró.`);
    return [];
  }

  const buenos = [];
  const rotos = [];
  // Sin límite de cuántos elementos se recorren: un tope escrito a mano es
  // exactamente cómo el Excel original empezó a mentir (L-001).
  for (let i = 0; i < valor.length; i += 1) {
    try {
      buenos.push(validar(valor[i]));
    } catch (error) {
      rotos.push(`#${i + 1}: ${error.message}`);
    }
  }

  if (rotos.length > 0) {
    const cuantos = rotos.length === 1 ? 'Un registro' : `${rotos.length} registros`;
    incidencias.push(
      `${cuantos} de ${nombre} no se pudieron leer y quedaron afuera de los totales. ` +
      `Detalle — ${rotos.join(' · ')}`
    );
  }
  return buenos;
}

/**
 * Aparta un contenido ilegible bajo su propia clave, con la fecha, para que se
 * pueda rescatar a mano. Si ni siquiera esto se puede hacer, se avisa: es
 * preferible que el usuario sepa que hay algo en riesgo.
 */
function preservar(almacen, crudo, incidencias) {
  const clave = `${PREFIJO_RESCATE}${new Date().toISOString()}`;
  try {
    almacen.setItem(clave, crudo);
    return clave;
  } catch (error) {
    incidencias.push(
      `No se pudo apartar una copia de lo que no se entendió (${error.message}). ` +
      'No guardes nada nuevo hasta revisarlo, o se va a sobrescribir.'
    );
    return null;
  }
}

/**
 * Guarda el estado completo. Escribe una sola vez, con la cadena ya armada.
 *
 * **Tira si no pudo guardar**, a propósito. La tentación es atrapar el error y
 * seguir para que la app no se corte, pero eso deja al usuario cargando gastos
 * sobre un almacenamiento que no los está guardando: cada movimiento se ve en
 * pantalla y ninguno sobrevive a cerrar la app. Un error visible es mucho menos
 * grave que una tarde entera de datos perdidos.
 */
function guardarEstado(estado, almacen = almacenPorDefecto()) {
  if (estado === null || typeof estado !== 'object') {
    throw new Error('No hay estado que guardar.');
  }

  const aGuardar = { ...estado, esquema: ESQUEMA_ACTUAL };
  let texto;
  try {
    texto = JSON.stringify(aGuardar);
  } catch (error) {
    throw new Error(`No se pudo preparar los datos para guardarlos: ${error.message}`);
  }

  try {
    almacen.setItem(CLAVE_DATOS, texto);
  } catch (error) {
    if (esCupoLleno(error)) {
      throw new Error(
        'No entra: el almacenamiento del navegador está lleno, así que este cambio NO se guardó. ' +
        'Exportá tus datos y liberá espacio antes de seguir cargando.'
      );
    }
    throw new Error(`No se pudo guardar: ${error.message}`);
  }

  return texto.length;
}

function esCupoLleno(error) {
  // Cada navegador lo llama distinto, y Safari usa un código propio.
  return (
    error?.name === 'QuotaExceededError' ||
    error?.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
    error?.code === 22 ||
    error?.code === 1014
  );
}

/**
 * Borra los datos de Viajecor. Existe para el "importar reemplazando todo"
 * (T-017) y para que el usuario pueda empezar de cero a propósito.
 *
 * No toca las claves de rescate: son justamente lo que hay que conservar cuando
 * algo salió mal. Quien las quiera borrar tiene que hacerlo a mano.
 */
function borrarEstado(almacen = almacenPorDefecto()) {
  almacen.removeItem(CLAVE_DATOS);
}

/** Las claves de rescate que haya, de la más nueva a la más vieja. */
function listarRescates(almacen = almacenPorDefecto()) {
  const claves = [];
  for (let i = 0; i < almacen.length; i += 1) {
    const clave = almacen.key(i);
    if (typeof clave === 'string' && clave.startsWith(PREFIJO_RESCATE)) claves.push(clave);
  }
  return claves.sort().reverse();
}

// ── src/ui/app.js ───────────────────────────────────────────────
// Arranque de la aplicación. Por ahora solo dibuja la pantalla inicial: su
// trabajo real es demostrar que el archivo construido abre sin conexión.
// Las pantallas de verdad llegan con T-011 en adelante (docs/PLAN.md).

// La versión la inyecta tools/build.mjs al construir, leyéndola del archivo
// VERSION. Fuera del archivo construido (por ejemplo en los tests) no hay
// versión publicada, y decirlo es más honesto que inventar un número.
function versionApp() {
  return globalThis.__VIAJECOR_VERSION__ || 'sin construir';
}

function pantallaInicial() {
  return `
    <header class="encabezado">
      <h1>Viajecor</h1>
      <span class="version">v${versionApp()}</span>
    </header>

    <section class="tarjeta">
      <h2>Todavía no hay nada que registrar</h2>
      <p class="suave">El esqueleto de la aplicación funciona: este archivo se abrió
      desde tu dispositivo, sin conexión y sin pedirle nada a internet.</p>
    </section>

    <section class="tarjeta">
      <h2>Qué sigue</h2>
      <ul class="pasos suave">
        <li>Aritmética de dinero y modelo del movimiento</li>
        <li>Cargar un gasto o un ingreso</li>
        <li>Tipo de cambio por moneda y por mes</li>
        <li>Resumen del mes</li>
        <li>Exportar tus datos</li>
      </ul>
      <p class="suave">El orden y el estado de cada paso están en
      <code>docs/PLAN.md</code>.</p>
    </section>

    <p class="estado"><span class="punto"></span>Tus datos se guardan solo en este
    dispositivo.</p>
  `;
}

function iniciar(documento) {
  documento.getElementById('app').innerHTML = pantallaInicial();
}

if (typeof document !== 'undefined') {
  iniciar(document);
}
})();
</script>
